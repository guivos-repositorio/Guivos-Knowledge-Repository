{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <style>
    .gkr-page-actions {
      display: flex;
      justify-content: flex-end;
      margin: 0 0 1rem;
    }

    .gkr-page-print {
      cursor: pointer;
    }

    @media print {
      .gkr-page-actions,
      .md-header,
      .md-tabs,
      .md-sidebar,
      .md-footer,
      .md-top,
      .md-dialog,
      .md-content__button {
        display: none !important;
      }

      .md-main__inner,
      .md-content,
      .md-content__inner {
        margin: 0 !important;
        max-width: none !important;
      }
    }
  </style>
{% endblock %}

{% block content %}
  {% if page and page.url != "print_page/" and page.url != "print_page.html" %}
    <div class="gkr-page-actions">
      <button
        type="button"
        class="md-button gkr-page-print"
        onclick="window.print()"
        aria-label="Imprimir somente este assunto"
      >
        Imprimir este assunto
      </button>
    </div>
  {% endif %}
  {{ super() }}
{% endblock %}
