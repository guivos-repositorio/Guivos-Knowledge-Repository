<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">Gestão de Solicitações — Pedido Adicional</title><desc id="desc">Wireframe desktop de baixa fidelidade para formular pedido de informação adicional sem impor revelação.</desc><rect width="1440" height="1024" fill="#fff"/><g fill="none" stroke="#111" stroke-width="2"><rect x="24" y="24" width="1392" height="72" rx="8"/><rect x="24" y="112" width="248" height="888" rx="8"/><rect x="288" y="112" width="1128" height="120" rx="8"/><rect x="288" y="248" width="1128" height="476" rx="8"/><rect x="288" y="740" width="1128" height="144" rx="8"/><rect x="288" y="900" width="1128" height="100" rx="8"/></g><g font-family="Arial" fill="#111"><text x="48" y="58" font-size="22" font-weight="700">Coletivo Horizonte Aberto</text><text x="48" y="82" font-size="13">Responsável por participação · solicitação SOL-1842</text><text x="48" y="148" font-size="15" font-weight="700">SOLICITAÇÕES</text><text x="48" y="190" font-size="14">Fila</text><text x="48" y="226" font-size="14">Detalhe</text><text x="48" y="262" font-size="14" font-weight="700">Pedir informação</text><text x="48" y="310" font-size="13">← Voltar sem enviar</text><text x="316" y="150" font-size="22" font-weight="700">Solicitar informação adicional</text><text x="316" y="180" font-size="13">Uma pergunta adicional exige decisão da Pessoa, não obrigação de revelar.</text><text x="316" y="286" font-size="16" font-weight="700">Pergunta exata</text><text x="316" y="324" font-size="14">Confirme se precisa de recurso de acessibilidade para a atividade presencial.</text><text x="316" y="374" font-size="16" font-weight="700">Finalidade</text><text x="316" y="412" font-size="14">Planejar condição de acesso da atividade; não será usada para ranking ou seleção geral.</text><text x="316" y="462" font-size="16" font-weight="700">Autoridade solicitante</text><text x="316" y="500" font-size="14">Responsável por participação e acessibilidade · escopo válido para esta finalidade</text><text x="316" y="550" font-size="16" font-weight="700">Formato e prazo</text><text x="316" y="588" font-size="14">Resposta opcional em texto curto ou “prefiro não informar” · até 12 ago, 18h</text><text x="316" y="638" font-size="16" font-weight="700">Dados não solicitados</text><text x="316" y="676" font-size="14">Diagnóstico, Jornada, localização precisa, outros Coletivos e contatos privados.</text><text x="316" y="782" font-size="18" font-weight="700">Efeito sobre a solicitação</text><text x="316" y="820" font-size="14">A decisão ficará pausada até resposta, preferência, contestação, cancelamento ou expiração conforme regra apresentada.</text><text x="316" y="854" font-size="12">Enviar este pedido não cria vínculo e não garante decisão futura.</text><text x="316" y="938" font-size="14">Revisar e enviar pedido</text><text x="560" y="938" font-size="14">Cancelar este rascunho</text><text x="800" y="938" font-size="14">Voltar ao detalhe</text></g></svg>