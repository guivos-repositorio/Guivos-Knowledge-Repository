<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Reconciliação e ausência de dados do Opportunity Boost no aplicativo móvel</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade mostrando campanha encerrada, eventos válidos, invalidados e em revisão, saldo candidato e campos não disponíveis.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text>
  <text x="20" y="62" font-family="Arial" font-size="10">RELATÓRIO › RECONCILIAÇÃO</text>
  <text x="20" y="92" font-family="Arial" font-size="19" font-weight="700">Campanha encerrada</text>
  <rect x="238" y="70" width="132" height="34" rx="7" fill="#f3f3f3" stroke="#444444"/>
  <text x="304" y="91" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700">EM REVISÃO</text>
  <text x="20" y="118" font-family="Arial" font-size="9">Encerrada em 12/08/2026 · revista em 13/08 às 09:20</text>

  <rect x="20" y="136" width="350" height="66" rx="8" fill="#f3f3f3" stroke="#555555"/>
  <text x="34" y="160" font-family="Arial" font-size="11" font-weight="700">Reconciliação não é devolução automática</text>
  <text x="34" y="182" font-family="Arial" font-size="9">Eventos e saldo ainda dependem de regras futuras.</text>

  <rect x="20" y="220" width="350" height="146" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="245" font-family="Arial" font-size="13" font-weight="700">Eventos da campanha</text>
  <text x="34" y="272" font-family="Arial" font-size="10">Válidos: 5.968</text>
  <text x="34" y="296" font-family="Arial" font-size="10">Invalidados: 31</text>
  <text x="34" y="320" font-family="Arial" font-size="10">Ainda em revisão: 8</text>
  <text x="34" y="344" font-family="Arial" font-size="9">Eventos válidos anteriores permanecem preservados.</text>

  <rect x="20" y="382" width="350" height="144" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="407" font-family="Arial" font-size="13" font-weight="700">Orçamento e saldo</text>
  <text x="34" y="434" font-family="Arial" font-size="10">Orçamento total: R$ 300,00</text>
  <text x="34" y="458" font-family="Arial" font-size="10">Utilizado sujeito à revisão: R$ 146,20</text>
  <text x="34" y="482" font-family="Arial" font-size="10">Saldo candidato: R$ 153,80</text>
  <text x="34" y="506" font-family="Arial" font-size="9">Crédito, estorno ou devolução: não definidos.</text>

  <rect x="20" y="542" width="350" height="124" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="567" font-family="Arial" font-size="13" font-weight="700">Dados ausentes</text>
  <text x="34" y="594" font-family="Arial" font-size="10">Conclusões de inscrição: não disponível</text>
  <text x="34" y="618" font-family="Arial" font-size="10">Motivo: integração externa não conectada</text>
  <text x="34" y="642" font-family="Arial" font-size="9">Ausência de dado não é apresentada como zero.</text>

  <rect x="20" y="682" width="350" height="86" rx="8" fill="#f3f3f3" stroke="#444444"/>
  <text x="34" y="707" font-family="Arial" font-size="11" font-weight="700">Limites preservados</text>
  <text x="34" y="730" font-family="Arial" font-size="9">Sem lista de visualizadores, causalidade ou impacto inferido.</text>
  <text x="34" y="750" font-family="Arial" font-size="9">Histórico não é apagado por encerramento.</text>

  <rect x="20" y="784" width="350" height="40" rx="8" fill="#ffffff" stroke="#444444"/>
  <text x="195" y="809" text-anchor="middle" font-family="Arial" font-size="10">Ver histórico de revisão</text>
</svg>