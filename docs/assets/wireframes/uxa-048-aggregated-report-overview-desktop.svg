<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Visão geral validada do relatório agregado do Opportunity Boost para computador</title>
  <desc id="desc">Wireframe de baixa fidelidade com quatro camadas, proveniência, estados provisórios, supressão por agregação e limites de interpretação.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="1022" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="220" height="1024" fill="#f4f4f4" stroke="#999999"/>
  <text x="32" y="48" font-family="Arial" font-size="22" font-weight="700">GUIVOS</text>
  <text x="32" y="112" font-family="Arial" font-size="14">Oportunidades</text>
  <text x="32" y="154" font-family="Arial" font-size="14" font-weight="700">Opportunity Boost</text>
  <text x="32" y="196" font-family="Arial" font-size="14">Campanhas</text>
  <text x="32" y="238" font-family="Arial" font-size="14">Relatórios</text>

  <text x="260" y="48" font-family="Arial" font-size="11">OPPORTUNITY BOOST › CAMPANHA OB-2048 › RELATÓRIO</text>
  <text x="260" y="86" font-family="Arial" font-size="28" font-weight="700">Formação gratuita em gestão comunitária</text>
  <rect x="1110" y="46" width="290" height="48" rx="8" fill="#f3f3f3" stroke="#222222"/>
  <text x="1255" y="76" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">PROVISÓRIO · NÃO RECONCILIADO</text>
  <text x="260" y="122" font-family="Arial" font-size="12">Período consultado: 05/08/2026 a 10/08/2026 · atualizado em 10/08/2026 às 18:30</text>

  <rect x="260" y="150" width="1140" height="96" rx="10" fill="#f3f3f3" stroke="#444444"/>
  <text x="286" y="180" font-family="Arial" font-size="13" font-weight="700">Como interpretar este relatório</text>
  <text x="286" y="207" font-family="Arial" font-size="11">Entrega, interação, atribuição candidata e autorrelato são camadas distintas. Proveniência e estado acompanham cada camada.</text>
  <text x="286" y="230" font-family="Arial" font-size="10">Não disponível, não exibido por agregação e valor zero possuem significados diferentes.</text>

  <rect x="260" y="270" width="550" height="238" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="304" font-family="Arial" font-size="16" font-weight="700">1. Entrega</text>
  <text x="286" y="330" font-family="Arial" font-size="10">Instrumentado e calculado · provisório</text>
  <text x="286" y="364" font-family="Arial" font-size="12">Orçamento total: R$ 300,00</text>
  <text x="286" y="392" font-family="Arial" font-size="12">Utilizado: R$ 146,20</text>
  <text x="286" y="420" font-family="Arial" font-size="12">Saldo não utilizado: R$ 153,80</text>
  <text x="536" y="364" font-family="Arial" font-size="12">Impressões válidas: 5.840</text>
  <text x="536" y="392" font-family="Arial" font-size="12">Impressões visíveis: 4.960</text>
  <text x="536" y="420" font-family="Arial" font-size="12">Frequência média: 1,7</text>
  <text x="536" y="448" font-family="Arial" font-size="12">Tráfego inválido removido: 31</text>
  <text x="286" y="482" font-family="Arial" font-size="10">Impressão não equivale a atenção, interesse ou resultado.</text>

  <rect x="850" y="270" width="550" height="238" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="876" y="304" font-family="Arial" font-size="16" font-weight="700">2. Interação</text>
  <text x="876" y="330" font-family="Arial" font-size="10">Instrumentado quando disponível · provisório</text>
  <text x="876" y="364" font-family="Arial" font-size="12">Cliques válidos: 128</text>
  <text x="876" y="392" font-family="Arial" font-size="12">Visualizações do detalhe: 104</text>
  <text x="876" y="420" font-family="Arial" font-size="12">Salvamentos: 19</text>
  <text x="1126" y="364" font-family="Arial" font-size="12">Interesses agregados: 12</text>
  <text x="1126" y="392" font-family="Arial" font-size="12">Inícios de inscrição: 7</text>
  <text x="1126" y="420" font-family="Arial" font-size="12">Conclusões: não disponível</text>
  <text x="876" y="454" font-family="Arial" font-size="10">Motivo: integração externa não conectada. Não disponível não é zero.</text>
  <text x="876" y="482" font-family="Arial" font-size="10">Clique não equivale a conversão; início não equivale a conclusão.</text>

  <rect x="260" y="534" width="550" height="226" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="568" font-family="Arial" font-size="16" font-weight="700">3. Atribuição candidata</text>
  <text x="286" y="594" font-family="Arial" font-size="10">Calculado pela regra candidata v0.1 · revisável · não causal</text>
  <text x="286" y="628" font-family="Arial" font-size="12">Eventos compatíveis com a janela: 27</text>
  <text x="286" y="656" font-family="Arial" font-size="12">Janela candidata: até 7 dias após clique válido</text>
  <text x="286" y="684" font-family="Arial" font-size="12">Associação patrocinada: 14 · orgânica: 7 · indeterminada: 6</text>
  <text x="286" y="714" font-family="Arial" font-size="10">Detalhamento somente é exibido quando a regra de agregação permitir.</text>
  <text x="286" y="738" font-family="Arial" font-size="10">Nenhum evento é atribuído duas vezes silenciosamente.</text>

  <rect x="850" y="534" width="550" height="226" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="876" y="568" font-family="Arial" font-size="16" font-weight="700">4. Autorrelato</text>
  <text x="876" y="594" font-family="Arial" font-size="10">Declarado pelo anunciante · não verificado automaticamente</text>
  <text x="876" y="628" font-family="Arial" font-size="12">Declaração institucional registrada em 10/08/2026</text>
  <text x="876" y="656" font-family="Arial" font-size="12">Período declarado: 05/08/2026 a 10/08/2026</text>
  <text x="876" y="684" font-family="Arial" font-size="12">Quantidade: não exibida por agregação</text>
  <text x="876" y="714" font-family="Arial" font-size="10">Supressão não significa zero e não apaga o conteúdo institucional.</text>
  <text x="876" y="738" font-family="Arial" font-size="10">Autorrelato não é somado aos eventos instrumentados.</text>

  <rect x="260" y="788" width="1140" height="126" rx="10" fill="#f3f3f3" stroke="#444444"/>
  <text x="286" y="822" font-family="Arial" font-size="14" font-weight="700">Privacidade e limites</text>
  <text x="286" y="850" font-family="Arial" font-size="11">Contagens abaixo da regra aplicável aparecem como não exibidas. O limiar definitivo ainda será definido por política especializada.</text>
  <text x="286" y="878" font-family="Arial" font-size="11">Nenhuma lista de visualizadores, nomes, relatos protegidos, localização exata ou sequência individual é fornecida.</text>
  <rect x="1160" y="832" width="214" height="48" rx="8" fill="#ffffff" stroke="#444444"/>
  <text x="1267" y="862" text-anchor="middle" font-family="Arial" font-size="11">Ver metodologia e histórico</text>

  <text x="260" y="958" font-family="Arial" font-size="11">Baixa fidelidade · dados ilustrativos · sem exportação, política final, cobrança real ou implementação.</text>
</svg>