<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel da solicitação de participação aprovada</title>
  <desc id="desc">Resultado da aprovação da solicitação, com autoridade, fundamento, vínculo criado, permissões iniciais, ausência de função automática e continuidade para o ambiente interno.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao Perfil Público</text>
  <text x="195" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Solicitação aprovada</text>
  <text x="195" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Ciclistas da Serra · decisão em 08/08/2026 às 16:30</text>
  <circle cx="195" cy="181" r="28" fill="#f3f3f3" stroke="#111111"/>
  <path d="M182 181 L191 190 L209 171" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="20" y="226" width="350" height="118" rx="10" fill="#f7f7f7" stroke="#777777"/>
  <text x="32" y="247" font-family="Arial, sans-serif" font-size="10" font-weight="700">Decisão e autoridade</text>
  <text x="32" y="268" font-family="Arial, sans-serif" font-size="8">Decisão registrada por Carlos Menezes · autoridade identificada</text>
  <text x="32" y="288" font-family="Arial, sans-serif" font-size="8">Fundamento: critérios declarados e requisitos de segurança atendidos</text>
  <text x="32" y="308" font-family="Arial, sans-serif" font-size="8">Identificador da decisão: CSR-2026-0808-1630-A</text>
  <text x="32" y="328" font-family="Arial, sans-serif" font-size="7">A Organização apoiadora não participou automaticamente da decisão.</text>
  <rect x="20" y="358" width="350" height="126" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="379" font-family="Arial, sans-serif" font-size="10" font-weight="700">Vínculo criado</text>
  <text x="32" y="400" font-family="Arial, sans-serif" font-size="8">• participante confirmado com acesso interno conforme permissões</text>
  <text x="32" y="420" font-family="Arial, sans-serif" font-size="8">• lista nominal: não aparecer, conforme preferência inicial</text>
  <text x="32" y="440" font-family="Arial, sans-serif" font-size="8">• notificações: nenhuma categoria ativada automaticamente</text>
  <text x="32" y="460" font-family="Arial, sans-serif" font-size="7">A aprovação não atribui função, moderação, autoridade ou obrigação de presença.</text>
  <rect x="20" y="498" width="350" height="99" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="519" font-family="Arial, sans-serif" font-size="10" font-weight="700">Próximos passos</text>
  <text x="32" y="540" font-family="Arial, sans-serif" font-size="8">O ambiente interno abrirá sem alterar suas escolhas atuais.</text>
  <text x="32" y="560" font-family="Arial, sans-serif" font-size="8">Mudanças materiais de regras exigirão nova revisão consciente.</text>
  <text x="32" y="580" font-family="Arial, sans-serif" font-size="7">Pausa, saída e controles do vínculo permanecerão em superfícies próprias.</text>
  <rect x="20" y="625" width="350" height="46" rx="8" fill="#222222"/>
  <text x="195" y="653" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Abrir Coletivo</text>
  <rect x="20" y="685" width="350" height="43" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="195" y="712" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Salvar decisão</text>
  <text x="195" y="748" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">O registro permanece separado de função, reputação e presença.</text>
  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817" font-weight="700">Eu</text></g>
