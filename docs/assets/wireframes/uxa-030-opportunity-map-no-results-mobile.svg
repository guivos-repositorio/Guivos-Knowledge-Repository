  <text x="356" y="584" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Desfazer</text>

  <rect x="20" y="610" width="350" height="49" rx="9" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="628" font-family="Arial, sans-serif" font-size="8" font-weight="700">Seleção anterior fora da consulta atual</text>
  <text x="34" y="645" font-family="Arial, sans-serif" font-size="7" fill="#555555">Não altera o total zero nem volta ao conjunto automaticamente.</text>
  <text x="276" y="645" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Abrir detalhe</text>
  <text x="356" y="645" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Remover</text>

  <rect x="20" y="669" width="350" height="56" rx="9" fill="#f2f2f2" stroke="#777777"/>
  <text x="34" y="687" font-family="Arial, sans-serif" font-size="8" font-weight="700">Disponibilidade dos dados</text>
  <text x="34" y="703" font-family="Arial, sans-serif" font-size="7">Cobertura verificada para esta atualização.</text>
  <text x="356" y="717" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Entender disponibilidade</text>

  <rect x="1" y="740" width="388" height="103" fill="#ffffff" stroke="#cccccc"/>
  <text x="195" y="761" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555555">Mapa e Lista mantêm consulta, cobertura e total zero</text>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    <text x="39" y="817">Hoje</text>
    <text x="117" y="817">Jornada</text>
    <text x="195" y="817">Explorar</text>
    <text x="273" y="817" font-weight="700">Mapa</text>
    <text x="351" y="817">Eu</text>
  </g>
  <g fill="none" stroke="#555555">
    <circle cx="39" cy="796" r="8"/>
