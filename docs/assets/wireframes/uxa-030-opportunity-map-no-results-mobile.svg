  <text x="356" y="189" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Alterar</text>

  <rect x="20" y="211" width="350" height="34" rx="8" fill="#ffffff" stroke="#777777"/>
  <circle cx="39" cy="228" r="6" fill="none" stroke="#555555"/>
  <line x1="43" y1="232" x2="49" y2="238" stroke="#555555"/>
