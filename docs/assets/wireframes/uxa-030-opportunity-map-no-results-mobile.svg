  <text x="195" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555555">Sua consulta permanece intacta.</text>
  <rect x="60" y="466" width="128" height="25" rx="7" fill="#222222"/>
  <text x="124" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">Ampliar região</text>
  <rect x="202" y="466" width="128" height="25" rx="7" fill="#ffffff" stroke="#777777"/>
