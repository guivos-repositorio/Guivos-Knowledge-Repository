  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>

  <text x="24" y="29" font-family="Arial, sans-serif" font-size="12" fill="#555555">09:41</text>
  <text x="20" y="59" font-family="Arial, sans-serif" font-size="22" font-weight="700">Mapa de Oportunidades</text>
  <rect x="20" y="70" width="350" height="28" rx="14" fill="#f2f2f2" stroke="#777777"/>
