  <text x="95" y="506" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Revisar filtros</text>
  <text x="195" y="506" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Editar busca</text>
  <text x="298" y="506" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Explorar sem alterar</text>
  <text x="195" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#555555">Você revisará cada mudança antes de aplicar.</text>

