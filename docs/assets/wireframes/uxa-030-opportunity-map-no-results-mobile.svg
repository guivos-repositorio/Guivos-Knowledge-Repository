<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe reformulado do Mapa de Oportunidades sem resultados</title>
  <desc id="desc">Estado móvel com Mapa selecionado, localização desativada, região manual, busca e filtros preservados, zero resultados limitado à consulta, cobertura verificável, revisão antes de ajustes, última alteração reversível e seleção anterior tratada.</desc>
