<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Primeira Tela Hoje após compreensão inicial revisada</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade para a primeira entrada em Hoje após escolhas explícitas de persistência e personalização, sem presumir avanço, mudança anterior ou obrigação de agir.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>

  <text x="24" y="30" font-family="Arial, sans-serif" font-size="12" fill="#555555">09:41</text>
  <text x="20" y="68" font-family="Arial, sans-serif" font-size="24" font-weight="700">Hoje</text>
  <rect x="166" y="44" width="198" height="34" rx="17" fill="#f2f2f2" stroke="#555555"/>
  <text x="265" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Agindo como: Minha jornada ▾</text>

  <text x="20" y="101" font-family="Arial, sans-serif" font-size="9" fill="#555555">PRIMEIRA ENTRADA · APÓS COMPREENSÃO REVISADA</text>
  <rect x="20" y="116" width="350" height="92" rx="10" fill="#f5f5f5" stroke="#777777"/>
  <text x="34" y="142" font-family="Arial, sans-serif" font-size="13" font-weight="700">Sua primeira Tela Hoje começa sem presumir avanço</text>
  <text x="34" y="164" font-family="Arial, sans-serif" font-size="9">Concluir a compreensão não significa que algo já mudou na sua vida.</text>
  <text x="34" y="182" font-family="Arial, sans-serif" font-size="9">A tela usa somente o que estiver confirmado, permitido e vigente.</text>
  <text x="34" y="199" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Entender esta primeira entrada</text>

  <text x="20" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="700">Condição usada agora</text>
  <rect x="20" y="254" width="350" height="116" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="278" font-family="Arial, sans-serif" font-size="10" font-weight="700">Compreensão revisada</text>
  <text x="34" y="297" font-family="Arial, sans-serif" font-size="9">1 afirmação confirmada · 1 em aberto · 1 desconhecida</text>
  <text x="34" y="318" font-family="Arial, sans-serif" font-size="9">Personalização: autorizada para esta finalidade neste exemplo</text>
  <text x="34" y="338" font-family="Arial, sans-serif" font-size="8">Itens em aberto ou desconhecidos não são tratados como fatos.</text>
  <text x="34" y="358" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Revisar compreensão e escolhas</text>

  <text x="20" y="404" font-family="Arial, sans-serif" font-size="14" font-weight="700">O que merece sua atenção</text>
  <rect x="20" y="418" width="350" height="62" rx="10" fill="#f7f7f7" stroke="#999999"/>
  <text x="34" y="444" font-family="Arial, sans-serif" font-size="11" font-weight="700">Nada precisa da sua atenção agora</text>
  <text x="34" y="465" font-family="Arial, sans-serif" font-size="9">Não criamos urgência apenas para preencher a tela.</text>

  <text x="20" y="516" font-family="Arial, sans-serif" font-size="14" font-weight="700">Uma possibilidade para começar</text>
  <rect x="20" y="530" width="350" height="126" rx="10" fill="#ffffff" stroke="#111111"/>
  <text x="34" y="553" font-family="Arial, sans-serif" font-size="9" fill="#555555">POSSIBILIDADE · NÃO É OBRIGAÇÃO</text>
  <text x="34" y="577" font-family="Arial, sans-serif" font-size="13" font-weight="700">Organizar suas competências</text>
  <text x="34" y="598" font-family="Arial, sans-serif" font-size="9">Pode fazer sentido porque você confirmou interesse em transição</text>
  <text x="34" y="614" font-family="Arial, sans-serif" font-size="9">profissional. Isso não garante resultado nem é o único caminho.</text>
  <text x="34" y="638" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Por que pode fazer sentido?</text>
  <text x="196" y="638" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Ver alternativas</text>
  <text x="300" y="638" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Agora não</text>

  <rect x="20" y="680" width="350" height="68" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="34" y="702" font-family="Arial, sans-serif" font-size="9" font-weight="700">Se personalização não estiver autorizada ou for retirada</text>
  <text x="34" y="720" font-family="Arial, sans-serif" font-size="8">indicações pessoais são omitidas. Hoje, Jornada e Explorar continuam</text>
  <text x="34" y="736" font-family="Arial, sans-serif" font-size="8">disponíveis sem usar esta compreensão para personalizar.</text>

  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    <text x="39" y="813" font-weight="700">Hoje</text>
    <text x="117" y="813">Jornada</text>
    <text x="195" y="813">Explorar</text>
    <text x="273" y="813">Mapa</text>
    <text x="351" y="813">Eu</text>
  </g>
  <g fill="none" stroke="#555555">
    <circle cx="39" cy="792" r="8"/>
    <rect x="109" y="784" width="16" height="16"/>
    <circle cx="195" cy="792" r="8"/>
    <path d="M265 800 L273 784 L281 800 Z"/>
    <circle cx="351" cy="790" r="6"/>
    <path d="M342 803 Q351 795 360 803"/>
  </g>
</svg>