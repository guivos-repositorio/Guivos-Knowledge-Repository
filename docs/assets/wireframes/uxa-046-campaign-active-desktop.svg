<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Campanha ativa do Opportunity Boost reformulada</title>
  <desc id="desc">Wireframe de baixa fidelidade mostrando campanha ativa, orçamento, período, resumo operacional com recorte temporal, proteções e consequências de gestão.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="1022" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="220" height="1024" fill="#f4f4f4" stroke="#999999"/>
  <text x="32" y="48" font-family="Arial" font-size="22" font-weight="700">GUIVOS</text>
  <text x="32" y="112" font-family="Arial" font-size="14">Oportunidades</text>
  <text x="32" y="154" font-family="Arial" font-size="14" font-weight="700">Opportunity Boost</text>
  <text x="32" y="196" font-family="Arial" font-size="14">Campanhas</text>
  <text x="260" y="48" font-family="Arial" font-size="11">OPPORTUNITY BOOST › CAMPANHA OB-2048</text>
  <text x="260" y="86" font-family="Arial" font-size="28" font-weight="700">Formação gratuita em gestão comunitária</text>
  <rect x="1190" y="46" width="210" height="48" rx="8" fill="#e8e8e8" stroke="#222222"/>
  <text x="1295" y="76" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">ATIVA</text>
  <text x="260" y="122" font-family="Arial" font-size="12">Entrega em andamento dentro das condições vigentes · verificação operacional: 06/08/2026 às 14:05</text>

  <rect x="260" y="154" width="1140" height="90" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="184" font-family="Arial" font-size="13" font-weight="700">Condição atual</text>
  <text x="286" y="212" font-family="Arial" font-size="11">A campanha pode gerar novos eventos de entrega enquanto orçamento, período, frequência, capacidade, informação material e política permanecerem válidos.</text>
  <text x="286" y="234" font-family="Arial" font-size="10">Estado ativo não garante uso integral do orçamento, conversão, atribuição ou impacto.</text>

  <rect x="260" y="270" width="260" height="194" rx="10" fill="#f8f8f8" stroke="#999999"/>
  <text x="284" y="304" font-family="Arial" font-size="14" font-weight="700">Orçamento</text>
  <text x="284" y="340" font-family="Arial" font-size="12">Total aprovado: R$ 300,00</text>
  <text x="284" y="370" font-family="Arial" font-size="12">Utilizado validado: R$ 86,40</text>
  <text x="284" y="400" font-family="Arial" font-size="12">Saldo não utilizado: R$ 213,60</text>
  <text x="284" y="430" font-family="Arial" font-size="11">Limite diário: R$ 50,00</text>
  <text x="284" y="452" font-family="Arial" font-size="10">Sem renovação automática.</text>

  <rect x="544" y="270" width="260" height="194" rx="10" fill="#f8f8f8" stroke="#999999"/>
  <text x="568" y="304" font-family="Arial" font-size="14" font-weight="700">Período</text>
  <text x="568" y="340" font-family="Arial" font-size="12">Início: 05/08/2026 às 08:00</text>
  <text x="568" y="370" font-family="Arial" font-size="12">Fim previsto: 12/08/2026 às 20:00</text>
  <text x="568" y="400" font-family="Arial" font-size="12">Tempo restante: 5 dias</text>
  <text x="568" y="430" font-family="Arial" font-size="10">Pausa ou limitação não prorroga o período automaticamente.</text>

  <rect x="828" y="270" width="260" height="194" rx="10" fill="#f8f8f8" stroke="#999999"/>
  <text x="852" y="304" font-family="Arial" font-size="14" font-weight="700">Resumo operacional</text>
  <text x="852" y="334" font-family="Arial" font-size="10">05/08 08:00 até 06/08 14:00</text>
  <text x="852" y="364" font-family="Arial" font-size="12">Impressões válidas: 3.240</text>
  <text x="852" y="394" font-family="Arial" font-size="12">Cliques válidos: 72</text>
  <text x="852" y="424" font-family="Arial" font-size="12">Tráfego inválido removido: 18</text>
  <text x="852" y="450" font-family="Arial" font-size="9">Parcial e operacional; não é conversão, impacto ou relatório final.</text>

  <rect x="1112" y="270" width="288" height="194" rx="10" fill="#f8f8f8" stroke="#999999"/>
  <text x="1136" y="304" font-family="Arial" font-size="14" font-weight="700">Proteções de entrega</text>
  <text x="1136" y="340" font-family="Arial" font-size="12">Frequência: dentro do limite</text>
  <text x="1136" y="370" font-family="Arial" font-size="12">Capacidade: 18 vagas disponíveis</text>
  <text x="1136" y="400" font-family="Arial" font-size="12">Informação material: atual</text>
  <text x="1136" y="430" font-family="Arial" font-size="12">Política: sem bloqueio</text>
  <text x="1136" y="452" font-family="Arial" font-size="10">Qualquer mudança poderá limitar ou pausar.</text>

  <rect x="260" y="496" width="730" height="252" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="530" font-family="Arial" font-size="15" font-weight="700">Linha do tempo e decisões</text>
  <text x="286" y="568" font-family="Arial" font-size="11">05/08 08:00 · campanha iniciada após gates atendidos</text>
  <text x="286" y="598" font-family="Arial" font-size="11">05/08 12:00 · entrega dentro do limite diário</text>
  <text x="286" y="628" font-family="Arial" font-size="11">06/08 09:30 · tráfego inválido removido da apuração</text>
  <text x="286" y="658" font-family="Arial" font-size="11">06/08 14:00 · capacidade confirmada pelo responsável</text>
  <text x="286" y="700" font-family="Arial" font-size="10">Eventos válidos permanecem preservados mesmo após pausa, limitação ou encerramento.</text>

  <rect x="1014" y="496" width="386" height="252" rx="10" fill="#f3f3f3" stroke="#444444"/>
  <text x="1040" y="530" font-family="Arial" font-size="15" font-weight="700">Ações de gestão</text>
  <rect x="1040" y="558" width="334" height="44" rx="8" fill="#ffffff" stroke="#444444"/>
  <text x="1207" y="585" text-anchor="middle" font-family="Arial" font-size="11">Pausar campanha</text>
  <rect x="1040" y="620" width="334" height="44" rx="8" fill="#ffffff" stroke="#444444"/>
  <text x="1207" y="647" text-anchor="middle" font-family="Arial" font-size="11">Atualizar capacidade declarada</text>
  <rect x="1040" y="682" width="334" height="44" rx="8" fill="#ffffff" stroke="#444444"/>
  <text x="1207" y="709" text-anchor="middle" font-family="Arial" font-size="11">Solicitar alteração material</text>

  <rect x="260" y="778" width="1140" height="120" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="812" font-family="Arial" font-size="14" font-weight="700">Consequência antes da ação</text>
  <text x="286" y="842" font-family="Arial" font-size="11">Pausar interrompe novos eventos de entrega; eventos válidos anteriores e orçamento utilizado permanecem para apuração.</text>
  <text x="286" y="870" font-family="Arial" font-size="11">Cancelar encerra a entrega futura, impede retomada da mesma campanha e exige confirmação separada.</text>
  <text x="260" y="954" font-family="Arial" font-size="11">Baixa fidelidade · dados ilustrativos · sem cobrança real, relatório agregado ou implementação.</text>
</svg>