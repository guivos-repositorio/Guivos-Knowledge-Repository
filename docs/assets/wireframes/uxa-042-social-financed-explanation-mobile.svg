<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Explicação móvel do Boost Social Financiado</title>
  <desc id="desc">Wireframe móvel que explica financiador, Coletivo beneficiário, finalidade, critérios utilizados, dados não compartilhados e controles separados.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="38" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Voltar</text>
  <text x="20" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="700">Por que estou vendo isto?</text>
  <text x="20" y="104" font-family="Arial, sans-serif" font-size="11">Explicação do impulsionamento social financiado.</text>

  <rect x="20" y="132" width="350" height="184" rx="10" fill="#f4f4f4" stroke="#777777"/>
  <text x="38" y="160" font-family="Arial, sans-serif" font-size="10" font-weight="700">IMPULSIONAMENTO SOCIAL FINANCIADO</text>
  <text x="38" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="700">Mutirão gratuito de capacitação comunitária</text>
  <text x="38" y="218" font-family="Arial, sans-serif" font-size="10">Coletivo beneficiário: Rede Comunitária Livre</text>
  <text x="38" y="242" font-family="Arial, sans-serif" font-size="10">Financiador: Fundação Exemplo</text>
  <text x="38" y="266" font-family="Arial, sans-serif" font-size="10">Finalidade: ampliar acesso gratuito na região.</text>
  <text x="38" y="290" font-family="Arial, sans-serif" font-size="10">A oportunidade permanece gratuita.</text>
  <text x="38" y="308" font-family="Arial, sans-serif" font-size="9">Financiamento amplia distribuição; não é recomendação.</text>

  <text x="20" y="354" font-family="Arial, sans-serif" font-size="14" font-weight="700">Critérios gerais utilizados</text>
  <rect x="20" y="370" width="350" height="88" rx="8" fill="#ffffff" stroke="#888888"/>
  <text x="38" y="398" font-family="Arial, sans-serif" font-size="10">Região geral · idioma · categoria · modalidade · data</text>
  <text x="38" y="424" font-family="Arial, sans-serif" font-size="10">Nenhum critério é ampliado silenciosamente.</text>
  <text x="38" y="446" font-family="Arial, sans-serif" font-size="9">A distribuição paga não altera correspondência orgânica.</text>

  <text x="20" y="494" font-family="Arial, sans-serif" font-size="14" font-weight="700">Não foi utilizado ou compartilhado</text>
  <rect x="20" y="510" width="350" height="124" rx="8" fill="#f7f7f7" stroke="#999999"/>
  <text x="38" y="538" font-family="Arial, sans-serif" font-size="10">Relatos · conteúdos privados · compreensão inicial</text>
  <text x="38" y="562" font-family="Arial, sans-serif" font-size="10">Momento Atual · Próximo Passo · mensagens ou inferências</text>
  <text x="38" y="586" font-family="Arial, sans-serif" font-size="10">Lista de pessoas expostas, interessadas ou inscritas</text>
  <text x="38" y="610" font-family="Arial, sans-serif" font-size="10">Autoridade para selecionar, ordenar ou recomendar</text>
  <text x="38" y="628" font-family="Arial, sans-serif" font-size="9">Métricas futuras serão somente agregadas e governadas.</text>

  <text x="20" y="672" font-family="Arial, sans-serif" font-size="14" font-weight="700">Seus controles</text>
  <text x="20" y="704" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Ocultar esta campanha</text>
  <text x="210" y="704" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Mostrar menos deste tipo</text>
  <text x="20" y="738" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Não mostrar patrocinadas</text>
  <text x="210" y="738" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Revisar e desfazer preferências</text>
  <text x="20" y="772" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Denunciar conteúdo</text>
  <text x="210" y="772" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Contestar uso indevido de dados</text>
  <text x="20" y="816" font-family="Arial, sans-serif" font-size="10">Ocultar publicidade não reduz acesso às oportunidades orgânicas.</text>
</svg>