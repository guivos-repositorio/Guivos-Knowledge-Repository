<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Explicação móvel Por que estou vendo isto</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade que separa campanha paga, critérios utilizados, critérios não utilizados, controles reversíveis, denúncia e contestação.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="38" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Voltar</text>
  <text x="20" y="76" font-family="Arial, sans-serif" font-size="23" font-weight="700">Por que estou vendo isto?</text>
  <text x="20" y="104" font-family="Arial, sans-serif" font-size="11">Explicação da distribuição patrocinada desta oportunidade.</text>

  <rect x="20" y="132" width="350" height="116" rx="10" fill="#f4f4f4" stroke="#777777"/>
  <text x="38" y="160" font-family="Arial, sans-serif" font-size="11" font-weight="700">CAMPANHA PAGA IDENTIFICADA</text>
  <text x="38" y="190" font-family="Arial, sans-serif" font-size="15" font-weight="700">Formação gratuita em gestão comunitária</text>
  <text x="38" y="216" font-family="Arial, sans-serif" font-size="10">Anunciante: Coletivo Horizonte · oportunidade gratuita</text>
  <text x="38" y="236" font-family="Arial, sans-serif" font-size="10">Pagamento amplia distribuição; não compra recomendação.</text>

  <text x="20" y="282" font-family="Arial, sans-serif" font-size="14" font-weight="700">Critérios utilizados</text>
  <rect x="20" y="298" width="350" height="96" rx="8" fill="#ffffff" stroke="#888888"/>
  <text x="38" y="324" font-family="Arial, sans-serif" font-size="10">Região geral: Sudeste · idioma: Português</text>
  <text x="38" y="348" font-family="Arial, sans-serif" font-size="10">Categoria: Formação · modalidade: Online</text>
  <text x="38" y="376" font-family="Arial, sans-serif" font-size="10">Critérios objetivos e gerais aplicados à superfície Explorar.</text>

  <text x="20" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="700">Não foi utilizado</text>
  <rect x="20" y="446" width="350" height="98" rx="8" fill="#f7f7f7" stroke="#999999"/>
  <text x="38" y="472" font-family="Arial, sans-serif" font-size="10">Relato protegido · compreensão inicial · Momento Atual</text>
  <text x="38" y="496" font-family="Arial, sans-serif" font-size="10">Próximo Passo · mensagens privadas · inferências sensíveis</text>
  <text x="38" y="526" font-family="Arial, sans-serif" font-size="10">Sem lista de visualizadores e sem influência orgânica.</text>

  <text x="20" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="700">Seus controles</text>
  <rect x="20" y="596" width="170" height="46" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="624" font-family="Arial, sans-serif" font-size="10">Ocultar esta campanha</text>
  <rect x="200" y="596" width="170" height="46" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="212" y="624" font-family="Arial, sans-serif" font-size="10">Mostrar menos deste tipo</text>
  <rect x="20" y="654" width="350" height="46" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="38" y="682" font-family="Arial, sans-serif" font-size="10">Não mostrar oportunidades patrocinadas</text>
  <rect x="20" y="712" width="350" height="46" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="38" y="740" font-family="Arial, sans-serif" font-size="10">Revisar e desfazer preferências</text>
  <text x="20" y="786" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Denunciar conteúdo ou informação</text>
  <text x="370" y="786" text-anchor="end" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Contestar uso indevido de dados</text>
  <text x="20" y="824" font-family="Arial, sans-serif" font-size="10">Nenhuma opção começa selecionada. O catálogo orgânico permanece disponível.</text>
</svg>