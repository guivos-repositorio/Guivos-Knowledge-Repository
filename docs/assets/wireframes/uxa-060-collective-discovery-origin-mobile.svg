<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe reformulado de explicação da origem patrocinada de um Coletivo</title>
  <desc id="desc">Explicação móvel para conteúdo patrocinado com origem, anunciante, critérios, posição após resultado orgânico, dados não utilizados, distinção de recomendação, retorno aos resultados com consulta preservada e controles reversíveis.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="58" font-family="Arial, sans-serif" font-size="22" font-weight="700">Por que este anúncio?</text>
  <text x="370" y="57" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Voltar aos resultados</text>
  <rect x="20" y="77" width="350" height="111" rx="11" fill="#f7f7f7" stroke="#111111" stroke-dasharray="5 3"/>
  <rect x="32" y="89" width="125" height="20" rx="10" fill="#222222"/>
  <text x="94" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff" font-weight="700">PATROCINADO · PUBLICIDADE</text>
  <text x="32" y="133" font-family="Arial, sans-serif" font-size="15" font-weight="700">Pedal Urbano Aberto</text>
  <text x="32" y="152" font-family="Arial, sans-serif" font-size="8">Anunciante: Associação Movimento Livre</text>
  <text x="32" y="170" font-family="Arial, sans-serif" font-size="7">Distribuição paga · não representa recomendação da Guivos.</text>
  <text x="20" y="219" font-family="Arial, sans-serif" font-size="12" font-weight="700">Origem deste item</text>
  <rect x="20" y="231" width="350" height="88" rx="9" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="251" font-family="Arial, sans-serif" font-size="8" font-weight="700">Conteúdo patrocinado</text>
  <text x="32" y="269" font-family="Arial, sans-serif" font-size="7">Apareceu após o primeiro resultado orgânico da consulta.</text>
  <text x="32" y="286" font-family="Arial, sans-serif" font-size="7">Pagamento não alterou a ordenação dos resultados orgânicos.</text>
  <text x="32" y="303" font-family="Arial, sans-serif" font-size="7">Ao voltar, busca, área, filtros e posição serão preservados.</text>
  <text x="20" y="348" font-family="Arial, sans-serif" font-size="12" font-weight="700">Critérios utilizados</text>
  <rect x="20" y="360" width="350" height="88" rx="9" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="380" font-family="Arial, sans-serif" font-size="8">• busca explícita: “ciclismo”</text>
  <text x="32" y="398" font-family="Arial, sans-serif" font-size="8">• região selecionada: Belo Horizonte</text>
  <text x="32" y="416" font-family="Arial, sans-serif" font-size="8">• entrada disponível</text>
  <text x="32" y="434" font-family="Arial, sans-serif" font-size="7">Critérios não serão ampliados silenciosamente.</text>
  <text x="20" y="477" font-family="Arial, sans-serif" font-size="12" font-weight="700">Informações que não foram utilizadas</text>
  <rect x="20" y="489" width="350" height="106" rx="9" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="510" font-family="Arial, sans-serif" font-size="8">• conteúdo protegido da sua jornada</text>
  <text x="32" y="528" font-family="Arial, sans-serif" font-size="8">• mensagens privadas</text>
  <text x="32" y="546" font-family="Arial, sans-serif" font-size="8">• participação em Coletivos sensíveis</text>
  <text x="32" y="564" font-family="Arial, sans-serif" font-size="8">• localização precisa ou histórico de deslocamento</text>
  <text x="32" y="582" font-family="Arial, sans-serif" font-size="7">O anunciante não recebe a identidade de quem apenas visualizou.</text>
  <text x="20" y="626" font-family="Arial, sans-serif" font-size="12" font-weight="700">Seus controles</text>
  <rect x="20" y="638" width="169" height="40" rx="8" fill="#222222"/><text x="104" y="663" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff">Ocultar este anúncio</text>
  <rect x="201" y="638" width="169" height="40" rx="8" fill="#ffffff" stroke="#777777"/><text x="285" y="663" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Reduzir semelhantes</text>
  <rect x="20" y="688" width="169" height="40" rx="8" fill="#ffffff" stroke="#777777"/><text x="104" y="713" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Desativar publicidade</text>
  <rect x="201" y="688" width="169" height="40" rx="8" fill="#ffffff" stroke="#777777"/><text x="285" y="713" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Denunciar anúncio</text>
  <text x="20" y="748" font-family="Arial, sans-serif" font-size="7">Ocultar, reduzir, desativar e denunciar possuem efeitos diferentes.</text>
  <text x="370" y="762" text-anchor="end" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver política de descoberta</text>
  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817" font-weight="700">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817">Eu</text></g>
  <g fill="none" stroke="#555555"><circle cx="39" cy="796" r="8"/><rect x="109" y="788" width="16" height="16"/><circle cx="195" cy="796" r="8" fill="#222222"/><path d="M265 804 L273 788 L281 804 Z"/><circle cx="351" cy="794" r="6"/><path d="M342 807 Q351 799 360 807"/></g>
</svg>
