<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Gravação validada do Momento Atual</title>
  <desc id="desc">Tela móvel de gravação com estados e consequências explícitas para pausa, interrupção, transcrição, descarte e troca para texto.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="28" font-family="Arial, sans-serif" font-size="11">09:41</text>
  <text x="20" y="58" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Interromper e decidir sobre esta parte</text>
  <text x="370" y="58" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Ajuda</text>
  <text x="20" y="98" font-family="Arial, sans-serif" font-size="21" font-weight="700">Gravação em andamento</text>
  <text x="20" y="122" font-family="Arial, sans-serif" font-size="9">00:42 · microfone ativo · áudio mantido até sua decisão</text>
  <rect x="20" y="143" width="350" height="106" rx="10" fill="#f5f5f5" stroke="#777777"/>
  <text x="32" y="166" font-family="Arial, sans-serif" font-size="10" font-weight="700">Referências opcionais</text>
  <text x="32" y="188" font-family="Arial, sans-serif" font-size="8">O que está acontecendo?</text>
  <text x="32" y="207" font-family="Arial, sans-serif" font-size="8">Como isso afeta você?</text>
  <text x="32" y="226" font-family="Arial, sans-serif" font-size="8">O que gostaria de mudar, decidir ou compreender?</text>
  <text x="32" y="242" font-family="Arial, sans-serif" font-size="7">A gravação não será avaliada enquanto você fala.</text>
  <rect x="20" y="268" width="350" height="163" rx="10" fill="#ffffff" stroke="#111111"/>
  <text x="32" y="292" font-family="Arial, sans-serif" font-size="9" fill="#555555">Estado textual: gravando</text>
  <path d="M34 352 L48 337 L62 368 L76 326 L90 359 L104 341 L118 372 L132 332 L146 362 L160 345 L174 370 L188 330 L202 361 L216 343 L230 373 L244 334 L258 364 L272 347 L286 369 L300 338 L314 358 L328 345 L344 356" fill="none" stroke="#555555" stroke-width="2"/>
  <text x="195" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">O sinal visual não é necessário para controlar a gravação.</text>
  <rect x="20" y="450" width="169" height="47" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="104" y="479" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Pausar sem concluir</text>
  <rect x="201" y="450" width="169" height="47" rx="8" fill="#222222"/>
  <text x="285" y="479" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Concluir e gerar transcrição</text>
  <rect x="20" y="516" width="350" height="118" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="539" font-family="Arial, sans-serif" font-size="10" font-weight="700">Efeito das ações</text>
  <text x="32" y="561" font-family="Arial, sans-serif" font-size="8">Pausar mantém esta parte sem gerar transcrição.</text>
  <text x="32" y="581" font-family="Arial, sans-serif" font-size="8">Concluir encerra o microfone e gera rascunho de transcrição.</text>
  <text x="32" y="601" font-family="Arial, sans-serif" font-size="8">Interromper abre opções para manter, concluir ou descartar.</text>
  <text x="32" y="623" font-family="Arial, sans-serif" font-size="7">Nenhuma transcrição será confirmada sem sua revisão.</text>
  <rect x="20" y="655" width="350" height="42" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="195" y="681" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Descartar esta gravação...</text>
  <text x="195" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Exigirá confirmação antes da exclusão desta parte.</text>
  <rect x="20" y="744" width="350" height="42" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="195" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Interromper e decidir antes de continuar por texto</text>
  <text x="195" y="812" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Gravar e transcrever não autoriza compreensão ou personalização.</text>
</svg>
