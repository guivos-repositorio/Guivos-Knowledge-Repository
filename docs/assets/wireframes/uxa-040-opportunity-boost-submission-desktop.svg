<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Envio reformulado do Opportunity Boost para avaliação</title>
  <desc id="desc">Wireframe para computador que confirma recebimento, estado em avaliação, itens verificados, ausência de entrega antes da aprovação e consequência explícita do cancelamento.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="1022" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="220" height="1024" fill="#f4f4f4" stroke="#999999"/>
  <text x="32" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700">GUIVOS</text>
  <text x="32" y="92" font-family="Arial, sans-serif" font-size="12">OPPORTUNITY BOOST</text>
  <text x="32" y="150" font-family="Arial, sans-serif" font-size="13">1 · Elegibilidade</text>
  <text x="32" y="192" font-family="Arial, sans-serif" font-size="13">2 · Objetivo e critérios</text>
  <text x="32" y="234" font-family="Arial, sans-serif" font-size="13">3 · Orçamento e duração</text>
  <text x="32" y="276" font-family="Arial, sans-serif" font-size="13">4 · Prévia e confirmação</text>
  <text x="32" y="318" font-family="Arial, sans-serif" font-size="13" font-weight="700">5 · Envio</text>
  <text x="32" y="950" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Ajuda e políticas</text>

  <text x="260" y="48" font-family="Arial, sans-serif" font-size="12" fill="#555555">ETAPA 5 DE 5</text>
  <text x="260" y="88" font-family="Arial, sans-serif" font-size="28" font-weight="700">Campanha enviada para avaliação</text>
  <text x="260" y="118" font-family="Arial, sans-serif" font-size="13">Nenhuma entrega publicitária começa antes da aprovação. O envio não representa garantia de aprovação.</text>

  <rect x="260" y="154" width="1140" height="126" rx="10" fill="#f3f3f3" stroke="#777777"/>
  <text x="286" y="188" font-family="Arial, sans-serif" font-size="12">ESTADO ATUAL</text>
  <text x="286" y="224" font-family="Arial, sans-serif" font-size="24" font-weight="700">Em avaliação</text>
  <text x="286" y="252" font-family="Arial, sans-serif" font-size="12">Recebida em 28/07/2026 às 18:42 · referência OB-000124</text>
  <text x="1368" y="224" text-anchor="end" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Abrir resumo enviado</text>

  <rect x="260" y="310" width="700" height="440" rx="10" fill="#ffffff" stroke="#888888"/>
  <text x="286" y="346" font-family="Arial, sans-serif" font-size="16" font-weight="700">O que será verificado</text>
  <text x="306" y="390" font-family="Arial, sans-serif" font-size="12">1 · elegibilidade do plano e da oportunidade</text>
  <text x="306" y="426" font-family="Arial, sans-serif" font-size="12">2 · atualização de preço, data, modalidade e capacidade</text>
  <text x="306" y="462" font-family="Arial, sans-serif" font-size="12">3 · responsável institucional e canais de suporte</text>
  <text x="306" y="498" font-family="Arial, sans-serif" font-size="12">4 · objetivo, critérios escolhidos e exclusões obrigatórias</text>
  <text x="306" y="534" font-family="Arial, sans-serif" font-size="12">5 · superfícies, base principal, orçamento, duração e limite diário</text>
  <text x="306" y="570" font-family="Arial, sans-serif" font-size="12">6 · apresentação patrocinada, segurança e política aplicável</text>
  <line x1="286" y1="608" x2="934" y2="608" stroke="#cccccc"/>
  <text x="286" y="642" font-family="Arial, sans-serif" font-size="13" font-weight="700">Durante a avaliação</text>
  <text x="306" y="674" font-family="Arial, sans-serif" font-size="11">• a campanha não será exibida;</text>
  <text x="306" y="698" font-family="Arial, sans-serif" font-size="11">• nenhuma cobrança real é iniciada por este artefato;</text>
  <text x="306" y="722" font-family="Arial, sans-serif" font-size="11">• decisões e alterações ficam registradas no histórico.</text>

  <rect x="984" y="310" width="416" height="440" rx="10" fill="#f8f8f8" stroke="#888888"/>
  <text x="1010" y="346" font-family="Arial, sans-serif" font-size="16" font-weight="700">Próximos estados possíveis</text>
  <rect x="1010" y="374" width="362" height="54" rx="8" fill="#ffffff" stroke="#888888"/>
  <text x="1032" y="407" font-family="Arial, sans-serif" font-size="12" font-weight="700">Ajustes solicitados</text>
  <rect x="1010" y="446" width="362" height="54" rx="8" fill="#ffffff" stroke="#888888"/>
  <text x="1032" y="479" font-family="Arial, sans-serif" font-size="12" font-weight="700">Rejeitada</text>
  <rect x="1010" y="518" width="362" height="54" rx="8" fill="#ffffff" stroke="#888888"/>
  <text x="1032" y="551" font-family="Arial, sans-serif" font-size="12" font-weight="700">Aprovada e programada</text>
  <rect x="1010" y="590" width="362" height="90" rx="8" fill="#f3f3f3" stroke="#999999"/>
  <text x="1032" y="620" font-family="Arial, sans-serif" font-size="11" font-weight="700">Cada decisão deverá explicar</text>
  <text x="1032" y="646" font-family="Arial, sans-serif" font-size="10">motivo · consequência · ação possível · condição de retomada</text>
  <text x="1010" y="716" font-family="Arial, sans-serif" font-size="11">Nenhum prazo de decisão é prometido nesta referência.</text>

  <rect x="260" y="782" width="1140" height="154" rx="10" fill="#ffffff" stroke="#888888"/>
  <text x="286" y="816" font-family="Arial, sans-serif" font-size="14" font-weight="700">Ações disponíveis</text>
  <rect x="286" y="842" width="254" height="48" rx="8" fill="#222222"/>
  <text x="413" y="872" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="700">Ir para campanhas</text>
  <rect x="560" y="842" width="254" height="48" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="687" y="872" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700">Abrir resumo enviado</text>
  <rect x="834" y="842" width="254" height="48" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="961" y="872" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700">Cancelar envio</text>
  <text x="1368" y="872" text-anchor="end" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Consultar histórico</text>
  <text x="286" y="914" font-family="Arial, sans-serif" font-size="10">Cancelar encerra a avaliação e devolve a campanha ao rascunho; nenhuma entrega ou cobrança real é iniciada.</text>

  <text x="260" y="974" font-family="Arial, sans-serif" font-size="11">Pagamento não altera relevância orgânica, recomendação, confiança, qualidade ou impacto.</text>
</svg>