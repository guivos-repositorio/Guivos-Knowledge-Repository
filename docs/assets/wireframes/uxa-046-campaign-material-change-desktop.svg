<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Alteração material da campanha do Opportunity Boost</title>
  <desc id="desc">Wireframe de baixa fidelidade mostrando comparação entre informação aprovada e alterada, pausa, nova avaliação e efeitos sobre estimativas futuras.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="1022" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="220" height="1024" fill="#f4f4f4" stroke="#999999"/>
  <text x="32" y="48" font-family="Arial" font-size="22" font-weight="700">GUIVOS</text>
  <text x="32" y="112" font-family="Arial" font-size="14">Oportunidades</text>
  <text x="32" y="154" font-family="Arial" font-size="14" font-weight="700">Opportunity Boost</text>
  <text x="32" y="196" font-family="Arial" font-size="14">Campanhas</text>
  <text x="260" y="48" font-family="Arial" font-size="11">OPPORTUNITY BOOST › CAMPANHA OB-2048</text>
  <text x="260" y="86" font-family="Arial" font-size="28" font-weight="700">Revisar alteração material</text>
  <rect x="1110" y="46" width="290" height="48" rx="8" fill="#f3f3f3" stroke="#222222" stroke-width="2"/>
  <text x="1255" y="76" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">NOVA AVALIAÇÃO EXIGIDA</text>
  <text x="260" y="122" font-family="Arial" font-size="12">Campanha pausada · nenhuma entrega com informação desatualizada</text>

  <rect x="260" y="154" width="1140" height="108" rx="10" fill="#f3f3f3" stroke="#444444" stroke-width="2"/>
  <text x="286" y="188" font-family="Arial" font-size="14" font-weight="700">Por que a campanha foi interrompida</text>
  <text x="286" y="220" font-family="Arial" font-size="11">Data, local, modalidade, preço, gratuidade, responsável, elegibilidade, risco, capacidade ou condição comercial podem alterar a decisão da pessoa.</text>
  <text x="286" y="246" font-family="Arial" font-size="11">Somente estimativas futuras serão recalculadas; eventos válidos anteriores permanecem preservados.</text>

  <rect x="260" y="292" width="550" height="324" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="326" font-family="Arial" font-size="15" font-weight="700">Informação aprovada</text>
  <text x="286" y="366" font-family="Arial" font-size="12">Data: 12/08/2026</text>
  <text x="286" y="398" font-family="Arial" font-size="12">Modalidade: presencial</text>
  <text x="286" y="430" font-family="Arial" font-size="12">Local: Centro de Belo Horizonte</text>
  <text x="286" y="462" font-family="Arial" font-size="12">Preço: gratuita</text>
  <text x="286" y="494" font-family="Arial" font-size="12">Capacidade: 18 vagas</text>
  <text x="286" y="526" font-family="Arial" font-size="12">Responsável: Coletivo Horizonte</text>
  <text x="286" y="574" font-family="Arial" font-size="10">Esta versão sustenta os eventos entregues antes da pausa.</text>

  <rect x="850" y="292" width="550" height="324" rx="10" fill="#f8f8f8" stroke="#444444" stroke-width="2"/>
  <text x="876" y="326" font-family="Arial" font-size="15" font-weight="700">Informação alterada</text>
  <text x="876" y="366" font-family="Arial" font-size="12">Data: 19/08/2026 · alterada</text>
  <text x="876" y="398" font-family="Arial" font-size="12">Modalidade: online · alterada</text>
  <text x="876" y="430" font-family="Arial" font-size="12">Local: não aplicável · alterado</text>
  <text x="876" y="462" font-family="Arial" font-size="12">Preço: gratuita · sem alteração</text>
  <text x="876" y="494" font-family="Arial" font-size="12">Capacidade: 30 vagas · alterada</text>
  <text x="876" y="526" font-family="Arial" font-size="12">Responsável: Coletivo Horizonte</text>
  <text x="876" y="574" font-family="Arial" font-size="10">Mudanças destacadas por texto, não somente por cor.</text>

  <rect x="260" y="648" width="740" height="206" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="682" font-family="Arial" font-size="15" font-weight="700">Consequências</text>
  <text x="286" y="720" font-family="Arial" font-size="12">• entrega futura permanece interrompida;</text>
  <text x="286" y="750" font-family="Arial" font-size="12">• orçamento utilizado não é recalculado;</text>
  <text x="286" y="780" font-family="Arial" font-size="12">• saldo permanece separado até decisão;</text>
  <text x="286" y="810" font-family="Arial" font-size="12">• alcance futuro poderá mudar após nova avaliação.</text>

  <rect x="1026" y="648" width="374" height="206" rx="10" fill="#f3f3f3" stroke="#444444"/>
  <text x="1052" y="682" font-family="Arial" font-size="15" font-weight="700">Decisão necessária</text>
  <rect x="1052" y="712" width="322" height="44" rx="8" fill="#111111" stroke="#111111"/>
  <text x="1213" y="739" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffffff">Enviar para nova avaliação</text>
  <rect x="1052" y="774" width="322" height="44" rx="8" fill="#ffffff" stroke="#444444"/>
  <text x="1213" y="801" text-anchor="middle" font-family="Arial" font-size="11">Cancelar alteração</text>
  <text x="1052" y="842" font-family="Arial" font-size="10">Nenhuma opção inicia entrega imediatamente.</text>

  <text x="260" y="900" font-family="Arial" font-size="11">Histórico: versão aprovada → alteração material → pausa automática → nova avaliação pendente.</text>
  <text x="260" y="954" font-family="Arial" font-size="11">Baixa fidelidade · sem aprovação automática, algoritmo, cobrança real ou implementação.</text>
</svg>