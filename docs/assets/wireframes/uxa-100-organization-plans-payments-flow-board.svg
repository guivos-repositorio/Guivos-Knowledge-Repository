  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <text x="76" y="184" font-size="18" font-weight="700">1 · Plano e cobrança · Business Start</text>
    <text x="98" y="232" font-size="16" font-weight="700">Instituto Horizonte · Business Start</text>
    <text x="98" y="258" font-size="12">Preço candidato: R$ 299/mês · R$ 2.990/ano</text>
    <text x="98" y="330" font-size="13">Novas oportunidades/programas</text>
    <text x="98" y="362" font-size="24" font-weight="700">8 / 10</text>
    <text x="98" y="394" font-size="12">consumo do ciclo atual</text>
    <text x="398" y="330" font-size="13">Publicações ativas</text>
    <text x="398" y="362" font-size="24" font-weight="700">12 / 15</text>
    <text x="398" y="394" font-size="12">3 admins · 1 unidade · até 2 Coletivos</text>
    <text x="112" y="465" font-size="12">Ver uso e limites</text>
    <text x="312" y="465" font-size="12">Comparar planos</text>

    <text x="780" y="184" font-size="18" font-weight="700">2 · Capacidade alcançada</text>
    <text x="802" y="232" font-size="15" font-weight="700">O limite do plano deve ser explicado antes de oferecer upgrade.</text>
    <text x="802" y="262" font-size="13">Exibir unidade do limite, consumo atual e período de renovação.</text>
    <text x="802" y="290" font-size="13">Alternativas: arquivar, agendar, manter rascunho ou aguardar.</text>
    <text x="802" y="318" font-size="13">Upgrade amplia capacidade; não altera ranking ou prioridade orgânica.</text>
    <text x="814" y="406" font-size="12">Manter rascunho</text>
    <text x="1008" y="406" font-size="12">Agendar depois</text>
    <text x="1214" y="406" font-size="12">Ver Growth</text>
    <text x="780" y="472" font-size="11">Nenhuma publicação existente perde visibilidade para pressionar conversão.</text>

    <text x="76" y="602" font-size="18" font-weight="700">3 · Comparação voluntária</text>
    <text x="144" y="654" font-size="14" font-weight="700">BUSINESS START</text>
    <text x="144" y="684" font-size="13">R$ 299/mês · R$ 2.990/ano</text>
    <text x="144" y="712" font-size="12">10 novas/mês · 15 ativas</text>
    <text x="144" y="738" font-size="12">3 admins · 1 unidade</text>
    <text x="144" y="764" font-size="12">até 2 Coletivos · dashboard básico</text>
    <text x="564" y="654" font-size="14" font-weight="700">BUSINESS GROWTH</text>
    <text x="564" y="684" font-size="13">R$ 799/mês · R$ 7.990/ano</text>
    <text x="564" y="712" font-size="12">50 novas/mês · 75 ativas</text>
    <text x="564" y="738" font-size="12">10 admins · até 5 unidades</text>
    <text x="564" y="764" font-size="12">até 10 Coletivos · analytics ampliado</text>
    <text x="984" y="654" font-size="14" font-weight="700">BUSINESS SCALE</text>
    <text x="984" y="684" font-size="13">a partir de R$ 1.990/mês</text>
    <text x="984" y="712" font-size="12">contrato anual · capacidade contratada</text>
    <text x="984" y="738" font-size="12">múltiplas unidades · API · SSO</text>
    <text x="984" y="764" font-size="12">Power BI dedicado · SLA</text>
    <text x="632" y="877" font-size="12">Escolher Growth</text>
    <text x="1052" y="877" font-size="12">Solicitar proposta</text>

    <text x="76" y="1004" font-size="18" font-weight="700">4 · Revisar contratação · Growth</text>
    <text x="98" y="1060" font-size="14" font-weight="700">Business Growth · mensal · preço candidato R$ 799,00</text>
    <text x="98" y="1088" font-size="13">Pagador: Organização / autoridade financeira identificada</text>
    <text x="98" y="1116" font-size="13">Beneficiário: Instituto Horizonte e escopo institucional contratado</text>
    <text x="98" y="1144" font-size="13">Recorrência: mensal · método autorizado em simulação</text>
    <text x="98" y="1172" font-size="11">Pagamento não concede acesso à jornada pessoal das Pessoas.</text>
    <text x="264" y="1232" font-size="13">Confirmar contratação</text>

    <text x="780" y="1004" font-size="18" font-weight="700">5 · Resultado do pagamento</text>
    <text x="802" y="1058" font-size="14" font-weight="700">CONFIRMADO</text>
    <text x="802" y="1088" font-size="12">Ativação rastreável do Growth.</text>
    <text x="802" y="1116" font-size="12">Registro/recibo disponível.</text>
    <text x="802" y="1144" font-size="12">Capacidade contratada é atualizada.</text>
    <text x="1102" y="1058" font-size="14" font-weight="700">NÃO CONFIRMADO</text>
    <text x="1102" y="1088" font-size="12">Sem ativação presumida.</text>
    <text x="1102" y="1116" font-size="12">Plano anterior permanece identificável.</text>
    <text x="1102" y="1144" font-size="12">Direitos e dados preservados.</text>
    <text x="818" y="1232" font-size="12">Ver plano ativo</text>
    <text x="1206" y="1232" font-size="12">Tentar novamente</text>

    <text x="76" y="1362" font-size="18" font-weight="700">6 · Downgrade ou cancelamento</text>
    <text x="98" y="1414" font-size="13">Mostrar Start/Growth atual → estado futuro e capacidades afetadas antes da confirmação.</text>
    <text x="98" y="1442" font-size="13">Resolver excesso de admins, unidades, Coletivos ou publicações de forma explícita.</text>
    <text x="98" y="1470" font-size="12">Sem exclusão silenciosa, sem pró-rata presumido e com registro da decisão.</text>

    <text x="752" y="1362" font-size="18" font-weight="700">7 · Business Scale</text>
    <text x="802" y="1414" font-size="14" font-weight="700">Solicitar proposta comercial</text>
    <text x="802" y="1442" font-size="13">Dimensionar capacidade, unidades, integrações, Power BI, API, SSO e SLA.</text>
    <text x="802" y="1470" font-size="12">Sem checkout autônomo fictício; escopo e valor dependem de proposta/contrato.</text>

    <text x="48" y="1580" font-size="12">Fluxo candidato. Plano pago amplia capacidade institucional; não compra prioridade orgânica, evidência de impacto ou confiança.</text>
  </g>
</svg>