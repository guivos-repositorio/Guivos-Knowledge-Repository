<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1620" viewBox="0 0 1440 1620" role="img" aria-labelledby="title desc">
  <title id="title">Organização — planos, capacidade, cobrança e pagamentos</title>
  <desc id="desc">Placa estrutural de baixa fidelidade para computador com Business Start, capacidade e alternativas, comparação Start Growth Scale, revisão de contratação Growth, sucesso, falha, downgrade cancelamento e Scale por proposta comercial.</desc>
  <rect width="1440" height="1620" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <text x="48" y="58" font-size="26" font-weight="700">UXA-100 · Organização · Plano, cobrança e pagamento</text>
    <text x="48" y="86" font-size="14">Placa candidata de fluxo · baixa fidelidade · preços de referência candidatos · sem operação comercial real</text>
    <text x="48" y="112" font-size="13">Regra: capacidade contratada é separada de relevância, confiança, evidência de impacto e prioridade das oportunidades.</text>
  </g>

  <g fill="none" stroke="#111111" stroke-width="2">
