<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1180" viewBox="0 0 390 1180" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe reformulado de baixa fidelidade do Detalhe de Oportunidade</title>
  <desc id="desc">Estrutura móvel alinhada à Fundação da Guivos, com identidade, contribuição para a jornada, investimento, condições, elegibilidade, organização responsável, relação comercial e ações contextuais.</desc>
  <rect width="390" height="1180" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="1178" rx="24" fill="none" stroke="#111111" stroke-width="2"/>

  <text x="24" y="36" font-family="Arial, sans-serif" font-size="12" fill="#555555">09:41</text>
  <text x="24" y="72" font-family="Arial, sans-serif" font-size="16">←</text>
  <text x="54" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="700">Detalhe da oportunidade</text>
  <text x="348" y="72" font-family="Arial, sans-serif" font-size="18">⋯</text>

  <text x="20" y="104" font-family="Arial, sans-serif" font-size="10" fill="#555555">POSSIBILIDADE PARA SUA JORNADA</text>
  <rect x="20" y="116" width="350" height="102" rx="12" fill="#f2f2f2" stroke="#999999"/>
  <text x="34" y="140" font-family="Arial, sans-serif" font-size="10" fill="#555555">CURSO · ONLINE · INSCRIÇÕES ABERTAS</text>
  <text x="34" y="168" font-family="Arial, sans-serif" font-size="19" font-weight="700">Inglês profissional</text>
  <text x="34" y="190" font-family="Arial, sans-serif" font-size="12">Instituto Horizonte</text>
  <text x="34" y="208" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Ver origem e responsável</text>

  <rect x="20" y="234" width="350" height="126" rx="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="34" y="258" font-family="Arial, sans-serif" font-size="13" font-weight="700">Como pode apoiar sua jornada</text>
  <text x="34" y="280" font-family="Arial, sans-serif" font-size="10">Pode apoiar seu próximo passo de desenvolver comunicação</text>
  <text x="34" y="297" font-family="Arial, sans-serif" font-size="10">profissional em inglês.</text>
  <text x="34" y="318" font-family="Arial, sans-serif" font-size="10">Apareceu agora: inscrições até 31/07 e preferência por aulas à noite.</text>
  <text x="34" y="339" font-family="Arial, sans-serif" font-size="9">Uma possibilidade para considerar. A decisão continua sendo sua.</text>
  <text x="34" y="354" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Por que apareceu agora?</text>
  <text x="185" y="354" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Corrigir relação</text>
  <text x="282" y="354" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Não faz sentido</text>

  <text x="20" y="390" font-family="Arial, sans-serif" font-size="15" font-weight="700">Investimento e condições</text>
  <rect x="20" y="404" width="350" height="118" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="432" font-family="Arial, sans-serif" font-size="18" font-weight="700">R$ 79,90 por mês</text>
  <text x="34" y="453" font-family="Arial, sans-serif" font-size="10">6 parcelas · custo total estimado: R$ 479,40</text>
  <text x="34" y="474" font-family="Arial, sans-serif" font-size="10">Preço válido para novas inscrições até 31/07/2026</text>
  <text x="34" y="495" font-family="Arial, sans-serif" font-size="10">Cancelamento mensal · sem taxa obrigatória informada</text>
  <text x="34" y="514" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Entender preço, validade e cancelamento</text>

  <text x="20" y="552" font-family="Arial, sans-serif" font-size="15" font-weight="700">O que saber antes de decidir</text>
  <rect x="20" y="566" width="350" height="142" rx="10" fill="#ffffff" stroke="#aaaaaa"/>
  <text x="34" y="590" font-family="Arial, sans-serif" font-size="11" font-weight="700">Disponibilidade</text>
  <text x="184" y="590" font-family="Arial, sans-serif" font-size="11">Inscrições até 31/07</text>
  <text x="34" y="616" font-family="Arial, sans-serif" font-size="11" font-weight="700">Modalidade</text>
  <text x="184" y="616" font-family="Arial, sans-serif" font-size="11">Online · aulas ao vivo</text>
  <text x="34" y="642" font-family="Arial, sans-serif" font-size="11" font-weight="700">Horário</text>
  <text x="184" y="642" font-family="Arial, sans-serif" font-size="11">Terças e quintas, 19h</text>
  <text x="34" y="668" font-family="Arial, sans-serif" font-size="11" font-weight="700">Duração</text>
  <text x="184" y="668" font-family="Arial, sans-serif" font-size="11">6 meses</text>
  <text x="34" y="694" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Ver acessibilidade, requisitos e todas as condições</text>

  <text x="20" y="738" font-family="Arial, sans-serif" font-size="15" font-weight="700">Condições para participar</text>
  <rect x="20" y="752" width="350" height="98" rx="10" fill="#f7f7f7" stroke="#aaaaaa"/>
  <text x="34" y="776" font-family="Arial, sans-serif" font-size="11" font-weight="700">Sua situação: possivelmente elegível</text>
