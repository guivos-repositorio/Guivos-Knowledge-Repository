  <text x="90" y="964" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Conhecer a organização</text>

  <text x="20" y="1010" font-family="Arial, sans-serif" font-size="15" font-weight="700">Relação comercial com a Guivos</text>
  <rect x="20" y="1024" width="350" height="62" rx="10" fill="#f7f7f7" stroke="#aaaaaa"/>
  <text x="34" y="1048" font-family="Arial, sans-serif" font-size="10">A Guivos poderá receber comissão se houver contratação.</text>
  <text x="34" y="1066" font-family="Arial, sans-serif" font-size="10">Isso não aumentou a relevância funcional desta oportunidade.</text>
  <text x="34" y="1082" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Entender esta relação</text>

  <rect x="1" y="1102" width="388" height="77" fill="#ffffff" stroke="#cccccc"/>
