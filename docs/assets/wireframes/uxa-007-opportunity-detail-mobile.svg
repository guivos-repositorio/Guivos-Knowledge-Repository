<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1860" viewBox="0 0 390 1860" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe reformulado do Detalhe de Oportunidade e revisão consciente de saída externa</title>
  <desc id="desc">Estrutura móvel do Detalhe de Oportunidade com contexto, condições, responsável e relação comercial, seguida do estado de revisão antes de continuar para um destino externo.</desc>
  <rect width="390" height="1860" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="1858" rx="24" fill="none" stroke="#111111" stroke-width="2"/>

  <text x="24" y="36" font-family="Arial, sans-serif" font-size="12" fill="#555555">09:41</text>
  <text x="24" y="72" font-family="Arial, sans-serif" font-size="16">←</text>
  <text x="54" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="700">Detalhe da oportunidade</text>
  <text x="348" y="72" font-family="Arial, sans-serif" font-size="18">⋯</text>

  <text x="20" y="104" font-family="Arial, sans-serif" font-size="10" fill="#555555">POSSIBILIDADE PARA SUA JORNADA</text>
  <rect x="20" y="116" width="350" height="102" rx="12" fill="#f2f2f2" stroke="#999999"/>
  <text x="34" y="140" font-family="Arial, sans-serif" font-size="10" fill="#555555">CURSO · ONLINE · INSCRIÇÕES ABERTAS</text>
  <text x="34" y="168" font-family="Arial, sans-serif" font-size="19" font-weight="700">Inglês profissional</text>
  <text x="34" y="190" font-family="Arial, sans-serif" font-size="12">Instituto Horizonte</text>
  <text x="34" y="208" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Ver origem e responsável</text>

  <rect x="20" y="234" width="350" height="112" rx="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="34" y="258" font-family="Arial, sans-serif" font-size="13" font-weight="700">Como a Guivos compreende seu momento</text>
  <text x="34" y="280" font-family="Arial, sans-serif" font-size="10">Objetivo confirmado: usar inglês em situações profissionais.</text>
  <text x="34" y="298" font-family="Arial, sans-serif" font-size="10">Preferência informada: atividades online no período noturno.</text>
  <text x="34" y="316" font-family="Arial, sans-serif" font-size="10">Ainda não sabemos: disponibilidade para duas aulas por semana.</text>
  <text x="34" y="337" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Ver informações utilizadas</text>
  <text x="191" y="337" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Corrigir meu momento</text>

  <rect x="20" y="362" width="350" height="88" rx="10" fill="#f7f7f7" stroke="#999999"/>
  <text x="34" y="386" font-family="Arial, sans-serif" font-size="13" font-weight="700">Avanço reconhecido</text>
  <text x="34" y="407" font-family="Arial, sans-serif" font-size="10">Você concluiu o nível básico e registrou compreensão de textos simples.</text>
  <text x="34" y="426" font-family="Arial, sans-serif" font-size="10">Desafio atual informado: comunicação aplicada ao trabalho.</text>
  <text x="34" y="443" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Ver evidência e data</text>
  <text x="177" y="443" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Corrigir avanço</text>

  <rect x="20" y="466" width="350" height="122" rx="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="34" y="490" font-family="Arial, sans-serif" font-size="13" font-weight="700">Por que este próximo passo faz sentido</text>
  <text x="34" y="512" font-family="Arial, sans-serif" font-size="10">Você já construiu uma base, deseja usar o idioma no trabalho</text>
  <text x="34" y="529" font-family="Arial, sans-serif" font-size="10">e informou que a prática profissional ainda é uma dificuldade.</text>
  <text x="34" y="550" font-family="Arial, sans-serif" font-size="10">O curso pode apoiar essa prática, mas não é o único caminho.</text>
  <text x="34" y="572" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Faz sentido</text>
  <text x="109" y="572" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Parcialmente</text>
  <text x="196" y="572" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Não faz sentido</text>
  <text x="294" y="572" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Outro caminho</text>

  <text x="20" y="620" font-family="Arial, sans-serif" font-size="15" font-weight="700">Investimento e condições</text>
  <rect x="20" y="634" width="350" height="118" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="662" font-family="Arial, sans-serif" font-size="18" font-weight="700">R$ 79,90 por mês</text>
  <text x="34" y="683" font-family="Arial, sans-serif" font-size="10">6 parcelas · custo total estimado: R$ 479,40</text>
  <text x="34" y="704" font-family="Arial, sans-serif" font-size="10">Preço válido para novas inscrições até 31/07/2026</text>
  <text x="34" y="725" font-family="Arial, sans-serif" font-size="10">Cancelamento mensal · sem taxa obrigatória informada</text>
  <text x="34" y="744" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Entender preço, validade e cancelamento</text>

  <text x="20" y="782" font-family="Arial, sans-serif" font-size="15" font-weight="700">O que saber antes de decidir</text>
  <rect x="20" y="796" width="350" height="142" rx="10" fill="#ffffff" stroke="#aaaaaa"/>
  <text x="34" y="820" font-family="Arial, sans-serif" font-size="11" font-weight="700">Disponibilidade</text>
  <text x="184" y="820" font-family="Arial, sans-serif" font-size="11">Inscrições até 31/07</text>
  <text x="34" y="846" font-family="Arial, sans-serif" font-size="11" font-weight="700">Modalidade</text>
  <text x="184" y="846" font-family="Arial, sans-serif" font-size="11">Online · aulas ao vivo</text>
  <text x="34" y="872" font-family="Arial, sans-serif" font-size="11" font-weight="700">Horário</text>
  <text x="184" y="872" font-family="Arial, sans-serif" font-size="11">Terças e quintas, 19h</text>
  <text x="34" y="898" font-family="Arial, sans-serif" font-size="11" font-weight="700">Duração</text>
  <text x="184" y="898" font-family="Arial, sans-serif" font-size="11">6 meses</text>
  <text x="34" y="924" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Ver acessibilidade, requisitos e todas as condições</text>

  <text x="20" y="968" font-family="Arial, sans-serif" font-size="15" font-weight="700">Condições para participar</text>
  <rect x="20" y="982" width="350" height="98" rx="10" fill="#f7f7f7" stroke="#aaaaaa"/>
  <text x="34" y="1006" font-family="Arial, sans-serif" font-size="11" font-weight="700">Sua situação: possivelmente elegível</text>
  <text x="34" y="1027" font-family="Arial, sans-serif" font-size="10">Requisito: nível básico concluído ou teste de nivelamento.</text>
  <text x="34" y="1048" font-family="Arial, sans-serif" font-size="10">Decisão final: Instituto Horizonte.</text>
  <text x="34" y="1069" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Verificar ou corrigir informações</text>

  <text x="20" y="1112" font-family="Arial, sans-serif" font-size="15" font-weight="700">Quem oferece</text>
  <rect x="20" y="1126" width="350" height="82" rx="10" fill="#ffffff" stroke="#aaaaaa"/>
  <rect x="34" y="1140" width="42" height="42" rx="8" fill="#eeeeee" stroke="#999999"/>
  <text x="90" y="1156" font-family="Arial, sans-serif" font-size="12" font-weight="700">Instituto Horizonte</text>
  <text x="90" y="1175" font-family="Arial, sans-serif" font-size="10">Organização verificada · suporte em até 2 dias</text>
  <text x="90" y="1194" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Conhecer a organização</text>

  <text x="20" y="1240" font-family="Arial, sans-serif" font-size="15" font-weight="700">Relação comercial com a Guivos</text>
  <rect x="20" y="1254" width="350" height="62" rx="10" fill="#f7f7f7" stroke="#aaaaaa"/>
  <text x="34" y="1278" font-family="Arial, sans-serif" font-size="10">A Guivos poderá receber comissão se houver contratação.</text>
  <text x="34" y="1296" font-family="Arial, sans-serif" font-size="10">Isso não aumentou a relevância funcional desta oportunidade.</text>
  <text x="34" y="1312" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Entender esta relação</text>

  <rect x="1" y="1340" width="388" height="79" fill="#ffffff" stroke="#cccccc"/>
  <rect x="20" y="1358" width="200" height="40" rx="8" fill="#222222"/>
  <text x="120" y="1383" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="700">Ver como participar</text>
  <rect x="232" y="1358" width="64" height="40" rx="8" fill="#ffffff" stroke="#555555"/>
  <text x="264" y="1383" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Salvar</text>
  <rect x="306" y="1358" width="64" height="40" rx="8" fill="#ffffff" stroke="#555555"/>
  <text x="338" y="1383" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Comparar</text>

  <line x1="20" y1="1450" x2="370" y2="1450" stroke="#999999" stroke-dasharray="5 5"/>
  <text x="20" y="1480" font-family="Arial, sans-serif" font-size="10" fill="#555555">ESTADO APÓS “VER COMO PARTICIPAR” · MESMA PER-203</text>
  <rect x="20" y="1496" width="350" height="292" rx="12" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="36" y="1526" font-family="Arial, sans-serif" font-size="16" font-weight="700">Você vai continuar fora da Guivos</text>
  <text x="36" y="1550" font-family="Arial, sans-serif" font-size="10">A próxima etapa será no site oficial do Instituto Horizonte.</text>
  <text x="36" y="1572" font-family="Arial, sans-serif" font-size="10" font-weight="700">Destino</text>
  <text x="102" y="1572" font-family="Arial, sans-serif" font-size="10">institutohorizonte.example · ambiente externo</text>
  <text x="36" y="1594" font-family="Arial, sans-serif" font-size="10" font-weight="700">Responsável</text>
  <text x="112" y="1594" font-family="Arial, sans-serif" font-size="10">Instituto Horizonte</text>
  <text x="36" y="1622" font-family="Arial, sans-serif" font-size="11" font-weight="700">Dados e contexto</text>
  <text x="36" y="1643" font-family="Arial, sans-serif" font-size="10">Sua jornada, inferências e histórico não serão enviados.</text>
  <text x="36" y="1661" font-family="Arial, sans-serif" font-size="10">Somente dados explicitamente informados aqui podem acompanhar a saída.</text>
  <text x="36" y="1689" font-family="Arial, sans-serif" font-size="11" font-weight="700">Antes de continuar</text>
  <text x="36" y="1710" font-family="Arial, sans-serif" font-size="10">Preço, disponibilidade e elegibilidade podem ser revalidados pelo responsável.</text>
  <text x="36" y="1728" font-family="Arial, sans-serif" font-size="10">Continuar não confirma inscrição, reserva, compra ou contratação.</text>
  <rect x="36" y="1745" width="194" height="30" rx="7" fill="#222222"/>
  <text x="133" y="1765" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="700">Continuar no site oficial</text>
  <rect x="240" y="1745" width="114" height="30" rx="7" fill="#ffffff" stroke="#555555"/>
  <text x="297" y="1765" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Voltar ao detalhe</text>

  <rect x="20" y="1804" width="350" height="34" rx="8" fill="#f7f7f7" stroke="#aaaaaa"/>
  <text x="34" y="1825" font-family="Arial, sans-serif" font-size="9">Se o destino não puder ser confirmado, a saída é bloqueada e o detalhe permanece acessível.</text>
</svg>