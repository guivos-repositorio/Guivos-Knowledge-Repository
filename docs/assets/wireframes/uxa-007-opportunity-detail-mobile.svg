  <text x="34" y="818" font-family="Arial, sans-serif" font-size="10">Decisão final: Instituto Horizonte.</text>
  <text x="34" y="839" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Verificar ou corrigir informações</text>

  <text x="20" y="882" font-family="Arial, sans-serif" font-size="15" font-weight="700">Quem oferece</text>
  <rect x="20" y="896" width="350" height="82" rx="10" fill="#ffffff" stroke="#aaaaaa"/>
  <rect x="34" y="910" width="42" height="42" rx="8" fill="#eeeeee" stroke="#999999"/>
  <text x="90" y="926" font-family="Arial, sans-serif" font-size="12" font-weight="700">Instituto Horizonte</text>
