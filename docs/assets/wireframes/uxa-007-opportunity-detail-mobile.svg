  <text x="20" y="672" font-family="Arial, sans-serif" font-size="15" font-weight="700">Organização responsável</text>
  <rect x="20" y="686" width="350" height="82" rx="10" fill="#ffffff" stroke="#aaaaaa"/>
  <rect x="34" y="700" width="42" height="42" rx="8" fill="#eeeeee" stroke="#999999"/>
  <text x="90" y="716" font-family="Arial, sans-serif" font-size="12" font-weight="700">Instituto Horizonte</text>
  <text x="90" y="735" font-family="Arial, sans-serif" font-size="10">Organização verificada · resposta em até 2 dias</text>
  <text x="90" y="754" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Ver perfil da organização</text>

  <text x="20" y="804" font-family="Arial, sans-serif" font-size="15" font-weight="700">Transparência comercial</text>
  <rect x="20" y="818" width="350" height="64" rx="10" fill="#f7f7f7" stroke="#aaaaaa"/>
  <text x="34" y="842" font-family="Arial, sans-serif" font-size="10">A Guivos pode receber comissão se houver contratação.</text>
  <text x="34" y="860" font-family="Arial, sans-serif" font-size="10">Isso não aumenta a relevância funcional desta oportunidade.</text>
  <text x="34" y="877" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Entender a relação comercial</text>

  <rect x="1" y="902" width="388" height="77" fill="#ffffff" stroke="#cccccc"/>
  <rect x="20" y="920" width="225" height="40" rx="8" fill="#222222"/>
  <text x="132" y="945" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="700">Iniciar inscrição</text>
