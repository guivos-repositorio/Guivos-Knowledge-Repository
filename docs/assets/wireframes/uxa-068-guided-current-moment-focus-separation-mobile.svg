<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Separação de focos validada do Momento Atual</title>
  <desc id="desc">Tela móvel de ajuda temporária que sugere assuntos possíveis, mantém relação não confirmada e exige escolha explícita antes de aplicar organização.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="28" font-family="Arial, sans-serif" font-size="11">09:41</text>
  <text x="20" y="58" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao rascunho</text>
  <text x="370" y="58" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Manter relação em aberto</text>
  <text x="20" y="97" font-family="Arial, sans-serif" font-size="21" font-weight="700">O rascunho pode ter mais de um assunto</text>
  <text x="20" y="121" font-family="Arial, sans-serif" font-size="9">Sugestão temporária · nada foi separado ou removido.</text>
  <rect x="20" y="143" width="350" height="103" rx="10" fill="#f5f5f5" stroke="#777777"/>
  <text x="32" y="166" font-family="Arial, sans-serif" font-size="10" font-weight="700">Por que esta ajuda apareceu</text>
  <text x="32" y="188" font-family="Arial, sans-serif" font-size="8">O texto menciona transição profissional e preservação de renda.</text>
  <text x="32" y="207" font-family="Arial, sans-serif" font-size="8">A relação entre os trechos ainda não está confirmada.</text>
  <text x="32" y="226" font-family="Arial, sans-serif" font-size="7">A Guivos não definirá foco nem excluirá conteúdo sem sua escolha.</text>
  <rect x="20" y="262" width="350" height="91" rx="10" fill="#ffffff" stroke="#111111"/>
  <text x="32" y="286" font-family="Arial, sans-serif" font-size="10" font-weight="700">Trecho A · possível transição profissional</text>
  <text x="32" y="308" font-family="Arial, sans-serif" font-size="8">“Não vejo crescimento e tenho dificuldade para demonstrar experiência.”</text>
  <text x="32" y="338" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Editar conteúdo de origem</text>
  <rect x="20" y="367" width="350" height="91" rx="10" fill="#ffffff" stroke="#111111"/>
  <text x="32" y="391" font-family="Arial, sans-serif" font-size="10" font-weight="700">Trecho B · possível condição financeira</text>
  <text x="32" y="413" font-family="Arial, sans-serif" font-size="8">“Não posso interromper minha renda durante uma mudança.”</text>
  <text x="32" y="443" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Editar conteúdo de origem</text>
  <text x="20" y="492" font-family="Arial, sans-serif" font-size="11" font-weight="700">Como deseja organizar?</text>
  <rect x="20" y="510" width="350" height="42" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="536" font-family="Arial, sans-serif" font-size="9">Manter os trechos juntos</text>
  <rect x="20" y="564" width="350" height="42" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="590" font-family="Arial, sans-serif" font-size="9">Usar A como foco e B como condição</text>
  <rect x="20" y="618" width="350" height="42" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="644" font-family="Arial, sans-serif" font-size="9">Separar em dois assuntos revisáveis</text>
  <rect x="20" y="672" width="350" height="42" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="698" font-family="Arial, sans-serif" font-size="9">Deixar um trecho fora da síntese, sem excluir o rascunho</text>
  <rect x="20" y="731" width="350" height="44" rx="8" fill="#eeeeee" stroke="#999999"/>
  <text x="195" y="758" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#555555" font-weight="700">Aplicar organização escolhida</text>
  <text x="195" y="796" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Disponível após uma escolha; nenhuma opção vem marcada.</text>
  <text x="195" y="822" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Excluir conteúdo de origem é uma ação separada e exige confirmação.</text>
</svg>
