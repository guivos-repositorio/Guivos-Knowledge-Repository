<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel da Central de Atualizações</title>
  <desc id="desc">Superfície pessoal consolidada para identificar o que mudou nos Coletivos, de onde veio, sua natureza, autoridade, necessidade de ação e prazo legítimo, sem feed de engajamento ou publicidade silenciosa.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Meus Coletivos</text>
  <text x="20" y="94" font-family="Arial, sans-serif" font-size="23" font-weight="700">Central de Atualizações</text>
  <text x="20" y="116" font-family="Arial, sans-serif" font-size="8">O que mudou · de onde veio · se exige ação</text>

  <g font-family="Arial, sans-serif" font-size="7" text-anchor="middle">
    <rect x="20" y="137" width="83" height="30" rx="15" fill="#222222"/>
    <text x="61" y="156" fill="#ffffff" font-weight="700">Importantes</text>
    <rect x="109" y="137" width="92" height="30" rx="15" fill="#ffffff" stroke="#888888"/>
    <text x="155" y="156">Precisa de ação</text>
    <rect x="207" y="137" width="70" height="30" rx="15" fill="#ffffff" stroke="#888888"/>
    <text x="242" y="156">Atividades</text>
    <rect x="283" y="137" width="87" height="30" rx="15" fill="#ffffff" stroke="#888888"/>
    <text x="326" y="156">Tudo</text>
  </g>

  <rect x="20" y="183" width="350" height="146" rx="10" fill="#f5f5f5" stroke="#555555" stroke-width="1.5"/>
  <text x="32" y="206" font-family="Arial, sans-serif" font-size="8" font-weight="700">PRECISA DE AÇÃO · solicitação</text>
  <text x="32" y="226" font-family="Arial, sans-serif" font-size="11" font-weight="700">Corrida para Todos</text>
  <text x="32" y="245" font-family="Arial, sans-serif" font-size="8">Pedido de informação adicional · hoje, 09:12</text>
  <text x="32" y="264" font-family="Arial, sans-serif" font-size="8">Autoridade: responsável pela análise da solicitação</text>
  <text x="32" y="283" font-family="Arial, sans-serif" font-size="8">Prazo legítimo: responder até 11 ago, 18h</text>
  <rect x="32" y="296" width="156" height="24" rx="6" fill="#222222"/>
  <text x="110" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff" font-weight="700">Responder solicitação</text>
  <text x="350" y="206" text-anchor="end" font-family="Arial, sans-serif" font-size="7">não lida</text>

  <rect x="20" y="343" width="350" height="142" rx="10" fill="#ffffff" stroke="#555555"/>
  <text x="32" y="366" font-family="Arial, sans-serif" font-size="8" font-weight="700">SEGURANÇA · alerta oficial</text>
  <text x="32" y="386" font-family="Arial, sans-serif" font-size="11" font-weight="700">Ciclistas da Serra</text>
  <text x="32" y="405" font-family="Arial, sans-serif" font-size="8">Pedal da Serra · mudança de ponto de encontro</text>
  <text x="32" y="424" font-family="Arial, sans-serif" font-size="8">Autoridade: coordenação da atividade · hoje, 08:40</text>
  <text x="32" y="443" font-family="Arial, sans-serif" font-size="8">Motivo: interdição confirmada · revisar antes da atividade</text>
  <rect x="32" y="455" width="128" height="22" rx="6" fill="#ffffff" stroke="#555555"/>
  <text x="96" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Confirmar leitura</text>
  <text x="350" y="366" text-anchor="end" font-family="Arial, sans-serif" font-size="7">importante</text>

  <rect x="20" y="499" width="350" height="119" rx="10" fill="#ffffff" stroke="#999999"/>
  <text x="32" y="522" font-family="Arial, sans-serif" font-size="8" font-weight="700">INFORMATIVA · vínculo</text>
  <text x="32" y="542" font-family="Arial, sans-serif" font-size="11" font-weight="700">Ciclistas da Serra</text>
  <text x="32" y="561" font-family="Arial, sans-serif" font-size="8">Sua participação foi confirmada · hoje, 08:15</text>
  <text x="32" y="580" font-family="Arial, sans-serif" font-size="8">Ação necessária: nenhuma · vínculo já registrado</text>
  <text x="32" y="600" font-family="Arial, sans-serif" font-size="7">Ver o vínculo em Meus Coletivos</text>
  <text x="350" y="522" text-anchor="end" font-family="Arial, sans-serif" font-size="7">lida</text>

  <rect x="20" y="632" width="350" height="106" rx="10" fill="#f7f7f7" stroke="#888888"/>
  <text x="32" y="655" font-family="Arial, sans-serif" font-size="10" font-weight="700">Leitura não é decisão</text>
  <text x="32" y="675" font-family="Arial, sans-serif" font-size="8">Marcar como lido não confirma presença, concordância ou nova regra.</text>
  <text x="32" y="695" font-family="Arial, sans-serif" font-size="8">A ordem considera segurança, ação, prazo e preferência — não engajamento.</text>
  <text x="32" y="715" font-family="Arial, sans-serif" font-size="7">Sem publicidade silenciosa, ranking, popularidade ou pressão de participação.</text>
  <text x="32" y="731" font-family="Arial, sans-serif" font-size="7">Início do Participante permanece uma superfície própria ainda não materializada.</text>

  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817" font-weight="700">Eu</text></g>
  <g fill="none" stroke="#555555"><circle cx="39" cy="796" r="8"/><rect x="109" y="788" width="16" height="16"/><circle cx="195" cy="796" r="8"/><path d="M265 804 L273 788 L281 804 Z"/><circle cx="351" cy="794" r="6" fill="#222222"/><path d="M342 807 Q351 799 360 807"/></g>
</svg>
