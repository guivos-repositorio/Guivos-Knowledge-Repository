<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Ocultar campanha específica</title><desc id="desc">A pessoa revisa o efeito de ocultar somente uma campanha na Lista e no Mapa.</desc><rect width="390" height="844" fill="#fff"/><rect x="1" y="1" width="388" height="842" fill="none" stroke="#111" stroke-width="2"/><text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text><text x="20" y="60" font-family="Arial" font-size="10">CONTROLES DO ANÚNCIO</text><text x="20" y="94" font-family="Arial" font-size="19" font-weight="700">Ocultar esta campanha</text><rect x="20" y="116" width="350" height="128" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="144" font-family="Arial" font-size="10" font-weight="700">PATROCINADO · BST-2026-081</text><text x="34" y="172" font-family="Arial" font-size="14" font-weight="700">Formação de jovens em tecnologia</text><text x="34" y="198" font-family="Arial" font-size="9">Anunciante: Instituto Horizonte</text><text x="34" y="222" font-family="Arial" font-size="9">Campanha específica, não categoria orgânica.</text><rect x="20" y="266" width="350" height="190" rx="8" fill="#fff" stroke="#555"/><text x="34" y="294" font-family="Arial" font-size="11" font-weight="700">Efeito da ocultação</text><text x="34" y="322" font-family="Arial" font-size="9">• remove esta campanha da Lista e do Mapa</text><text x="34" y="348" font-family="Arial" font-size="9">• preserva região, busca e filtros atuais</text><text x="34" y="374" font-family="Arial" font-size="9">• preserva oportunidades orgânicas equivalentes</text><text x="34" y="400" font-family="Arial" font-size="9">• não informa identidade ou motivo ao anunciante</text><text x="34" y="432" font-family="Arial" font-size="8">A ação poderá ser revista conforme a política aplicável.</text><rect x="20" y="480" width="350" height="110" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="508" font-family="Arial" font-size="10" font-weight="700">Confirmação</text><rect x="34" y="532" width="14" height="14" fill="#fff" stroke="#111"/><text x="60" y="544" font-family="Arial" font-size="9">Entendo que somente esta campanha será ocultada.</text><text x="34" y="572" font-family="Arial" font-size="8">A confirmação começa desmarcada.</text><rect x="20" y="614" width="350" height="48" rx="8" fill="#ddd" stroke="#777"/><text x="195" y="644" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700">OCULTAR · INDISPONÍVEL</text><text x="20" y="694" font-family="Arial" font-size="9" text-decoration="underline">Voltar sem alterar</text><rect x="20" y="724" width="350" height="66" rx="8" fill="#fff" stroke="#777"/><text x="34" y="750" font-family="Arial" font-size="9">Mostrar menos e desativar patrocinados têm outros escopos.</text><text x="34" y="772" font-family="Arial" font-size="8">Denunciar conteúdo abre fluxo de integridade separado.</text><text x="20" y="820" font-family="Arial" font-size="8">Estado residual materializado; validação funcional pendente.</text></svg>