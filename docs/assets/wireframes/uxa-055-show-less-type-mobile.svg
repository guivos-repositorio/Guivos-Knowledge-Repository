<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Mostrar menos deste tipo</title><desc id="desc">A pessoa revisa uma preferência geral antes de reduzir anúncios de um tipo identificado.</desc><rect width="390" height="844" fill="#fff"/><rect x="1" y="1" width="388" height="842" fill="none" stroke="#111" stroke-width="2"/><text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text><text x="20" y="60" font-family="Arial" font-size="10">CONTROLES DO ANÚNCIO</text><text x="20" y="94" font-family="Arial" font-size="19" font-weight="700">Mostrar menos deste tipo</text><rect x="20" y="116" width="350" height="102" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="144" font-family="Arial" font-size="10" font-weight="700">Tipo identificado</text><text x="34" y="170" font-family="Arial" font-size="14" font-weight="700">Cursos presenciais de tecnologia</text><text x="34" y="196" font-family="Arial" font-size="9">Preferência publicitária, não filtro de oportunidades.</text><rect x="20" y="240" width="350" height="170" rx="8" fill="#fff" stroke="#555"/><text x="34" y="268" font-family="Arial" font-size="11" font-weight="700">Efeito da escolha</text><text x="34" y="296" font-family="Arial" font-size="9">• reduzir anúncios deste tipo quando aplicável</text><text x="34" y="322" font-family="Arial" font-size="9">• preservar oportunidades orgânicas da categoria</text><text x="34" y="348" font-family="Arial" font-size="9">• preservar busca, região, filtros e ordenação</text><text x="34" y="378" font-family="Arial" font-size="8">Não bloqueia toda publicidade e não informa o anunciante.</text><rect x="20" y="434" width="350" height="108" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="462" font-family="Arial" font-size="10" font-weight="700">Escolha ainda não aplicada</text><rect x="34" y="486" width="14" height="14" fill="#fff" stroke="#111"/><text x="60" y="498" font-family="Arial" font-size="9">Entendo o escopo desta preferência.</text><text x="34" y="526" font-family="Arial" font-size="8">A confirmação começa desmarcada.</text><rect x="20" y="566" width="350" height="48" rx="8" fill="#ddd" stroke="#777"/><text x="195" y="596" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700">CONFIRMAR · INDISPONÍVEL</text><text x="20" y="646" font-family="Arial" font-size="9" text-decoration="underline">Voltar ao anúncio sem alterar</text><rect x="20" y="682" width="350" height="94" rx="8" fill="#fff" stroke="#777"/><text x="34" y="710" font-family="Arial" font-size="9">A preferência poderá ser revisada e desfeita depois.</text><text x="34" y="734" font-family="Arial" font-size="9">Denúncia e contestação de dados usam fluxos separados.</text><text x="34" y="758" font-family="Arial" font-size="8">Nenhuma categoria orgânica é removida.</text><text x="20" y="814" font-family="Arial" font-size="8">Estado residual materializado; validação funcional pendente.</text></svg>