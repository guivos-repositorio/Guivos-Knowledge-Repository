<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Orientação validada para expressar o Momento Atual</title>
  <desc id="desc">Tela móvel que explica o relato de origem, a ajuda temporária opcional e as modalidades equivalentes de texto e voz.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="28" font-family="Arial, sans-serif" font-size="11">09:41</text>
  <text x="20" y="58" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar à escolha de modalidade</text>
  <text x="370" y="58" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Sair sem iniciar relato</text>
  <text x="20" y="98" font-family="Arial, sans-serif" font-size="21" font-weight="700">Expresse seu momento no seu ritmo</text>
  <text x="20" y="122" font-family="Arial, sans-serif" font-size="9">Você pode começar com pouco e não precisa responder a tudo.</text>
  <rect x="20" y="143" width="350" height="102" rx="10" fill="#f5f5f5" stroke="#777777"/>
  <text x="32" y="166" font-family="Arial, sans-serif" font-size="10" font-weight="700">Pode ajudar contar</text>
  <text x="32" y="188" font-family="Arial, sans-serif" font-size="8">• o que está acontecendo e qual assunto importa agora</text>
  <text x="32" y="207" font-family="Arial, sans-serif" font-size="8">• como isso afeta você e o que gostaria que mudasse</text>
  <text x="32" y="226" font-family="Arial, sans-serif" font-size="8">• prazos, limites, recursos ou tentativas relevantes</text>
  <rect x="20" y="260" width="350" height="116" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="283" font-family="Arial, sans-serif" font-size="10" font-weight="700">Relato e ajuda são coisas diferentes</text>
  <text x="32" y="305" font-family="Arial, sans-serif" font-size="8">Seu texto ou voz formará o conteúdo de origem.</text>
  <text x="32" y="324" font-family="Arial, sans-serif" font-size="8">Perguntas, separação ou síntese só aparecem se você</text>
  <text x="32" y="343" font-family="Arial, sans-serif" font-size="8">solicitar ajuda temporária para organizar o rascunho.</text>
  <text x="32" y="364" font-family="Arial, sans-serif" font-size="7">Essa ajuda não prepara compreensão inicial nem personaliza.</text>
  <text x="20" y="411" font-family="Arial, sans-serif" font-size="12" font-weight="700">Como prefere começar?</text>
  <rect x="20" y="432" width="350" height="78" rx="10" fill="#ffffff" stroke="#111111"/>
  <text x="36" y="459" font-family="Arial, sans-serif" font-size="12" font-weight="700">Escrever com orientação</text>
  <text x="36" y="480" font-family="Arial, sans-serif" font-size="8">Texto livre, edição e pausa antes de qualquer ajuda.</text>
  <text x="350" y="497" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Começar por texto</text>
  <rect x="20" y="526" width="350" height="78" rx="10" fill="#ffffff" stroke="#111111"/>
  <text x="36" y="553" font-family="Arial, sans-serif" font-size="12" font-weight="700">Falar com orientação</text>
  <text x="36" y="574" font-family="Arial, sans-serif" font-size="8">Instruções e escolha sobre o áudio antes do microfone.</text>
  <text x="350" y="591" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Preparar gravação</text>
  <rect x="20" y="624" width="350" height="92" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="647" font-family="Arial, sans-serif" font-size="10" font-weight="700">Antes da compreensão inicial</text>
  <text x="32" y="669" font-family="Arial, sans-serif" font-size="8">O relato não será usado para preparar compreensão ou</text>
  <text x="32" y="688" font-family="Arial, sans-serif" font-size="8">personalização sem inventário, revisão e autorização específica.</text>
  <text x="32" y="708" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Entender finalidade, privacidade e controles</text>
  <rect x="20" y="744" width="350" height="44" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="195" y="771" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Continuar sem compartilhar e sem iniciar compreensão</text>
  <text x="195" y="814" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Texto e voz têm a mesma finalidade e nenhum vem selecionado.</text>
</svg>
