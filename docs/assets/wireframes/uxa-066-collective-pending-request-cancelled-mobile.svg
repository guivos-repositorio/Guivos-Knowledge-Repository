<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel da solicitação cancelada pela pessoa</title>
  <desc id="desc">Resultado do cancelamento consciente da solicitação, com ausência de vínculo, data, consequência, limites de uso posterior, tratamento conforme regra aplicável e retorno ao perfil.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao Perfil Público</text>
  <text x="195" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Solicitação cancelada</text>
  <text x="195" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Ciclistas da Serra · cancelada em 07/08/2026 às 10:15</text>
  <circle cx="195" cy="181" r="28" fill="#f3f3f3" stroke="#111111"/>
  <path d="M182 181 L208 181" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="20" y="226" width="350" height="108" rx="10" fill="#f7f7f7" stroke="#777777"/>
  <text x="32" y="247" font-family="Arial, sans-serif" font-size="10" font-weight="700">O que mudou</text>
  <text x="32" y="268" font-family="Arial, sans-serif" font-size="8">• a análise foi encerrada por decisão da própria pessoa</text>
  <text x="32" y="288" font-family="Arial, sans-serif" font-size="8">• nenhum vínculo, acesso interno, papel ou autoridade foi criado</text>
  <text x="32" y="308" font-family="Arial, sans-serif" font-size="8">• o cancelamento não será apresentado como recusa do Coletivo</text>
  <text x="32" y="326" font-family="Arial, sans-serif" font-size="7">Identificador preservado: CSR-2026-0804-0941.</text>
  <rect x="20" y="348" width="350" height="129" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="369" font-family="Arial, sans-serif" font-size="10" font-weight="700">Dados e registro</text>
  <text x="32" y="390" font-family="Arial, sans-serif" font-size="8">Nenhum novo uso incompatível deverá ocorrer após o cancelamento.</text>
  <text x="32" y="410" font-family="Arial, sans-serif" font-size="8">Retenção, exclusão ou preservação seguirão a regra apresentada.</text>
  <text x="32" y="430" font-family="Arial, sans-serif" font-size="8">O registro mínimo poderá ser mantido quando houver finalidade legítima.</text>
  <text x="32" y="450" font-family="Arial, sans-serif" font-size="8">A Organização apoiadora permanece sem acesso automático.</text>
  <text x="32" y="469" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver registro, finalidade e tratamento aplicável</text>
  <rect x="20" y="491" width="350" height="102" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="512" font-family="Arial, sans-serif" font-size="10" font-weight="700">Participar no futuro</text>
  <text x="32" y="533" font-family="Arial, sans-serif" font-size="8">Uma nova solicitação exigirá nova revisão de regras, dados e condições.</text>
  <text x="32" y="553" font-family="Arial, sans-serif" font-size="8">O histórico cancelado não será reutilizado como confirmação.</text>
  <text x="32" y="573" font-family="Arial, sans-serif" font-size="7">A disponibilidade dependerá do estado atual do Coletivo.</text>
  <rect x="20" y="611" width="350" height="46" rx="8" fill="#222222"/>
  <text x="195" y="639" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Voltar ao Perfil Público</text>
  <rect x="20" y="671" width="350" height="43" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="195" y="698" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Salvar registro do cancelamento</text>
  <text x="195" y="744" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Nenhuma nova solicitação é iniciada automaticamente.</text>
  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817" font-weight="700">Eu</text></g>
  <g fill="none" stroke="#555555"><circle cx="39" cy="796" r="8"/><rect x="109" y="788" width="16" height="16"/><circle cx="195" cy="796" r="8"/><path d="M265 804 L273 788 L281 804 Z"/><circle cx="351" cy="794" r="6" fill="#222222"/><path d="M342 807 Q351 799 360 807"/></g>
</svg>
