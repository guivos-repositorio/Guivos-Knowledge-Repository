<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel do comprovante de solicitação enviada</title>
  <desc id="desc">Comprovante transitório da solicitação enviada ao Ciclistas da Serra, com ausência de vínculo, dados enviados, responsável, prazo estimado, cancelamento futuro e continuidade reservada para Solicitação Pendente.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao perfil</text>
  <text x="195" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Solicitação enviada</text>
  <text x="195" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Ciclistas da Serra · recebida em 04/08/2026 às 09:41</text>
  <circle cx="195" cy="181" r="28" fill="#f3f3f3" stroke="#111111"/>
  <path d="M182 181 L191 190 L209 171" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="20" y="226" width="350" height="85" rx="10" fill="#f7f7f7" stroke="#777777"/>
  <text x="32" y="247" font-family="Arial, sans-serif" font-size="10" font-weight="700">Nenhum vínculo foi criado</text>
  <text x="32" y="267" font-family="Arial, sans-serif" font-size="8">Você ainda não possui acesso interno, papel, autoridade ou participação.</text>
  <text x="32" y="286" font-family="Arial, sans-serif" font-size="8">A decisão dependerá da análise legítima do Coletivo.</text>
  <text x="32" y="303" font-family="Arial, sans-serif" font-size="7">A espera não autoriza contato privado nem comunicação comercial.</text>
  <rect x="20" y="325" width="350" height="119" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="346" font-family="Arial, sans-serif" font-size="10" font-weight="700">Resumo do envio</text>
  <text x="32" y="366" font-family="Arial, sans-serif" font-size="8">Dados: nome de exibição, experiência, disponibilidade e confirmações</text>
  <text x="32" y="385" font-family="Arial, sans-serif" font-size="8">Responsável: Carlos Menezes · autoridade identificada</text>
  <text x="32" y="404" font-family="Arial, sans-serif" font-size="8">Estimativa informada: até 5 dias úteis · sem garantia</text>
  <text x="32" y="423" font-family="Arial, sans-serif" font-size="8">Identificador do comprovante: CSR-2026-0804-0941</text>
  <text x="32" y="438" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver exatamente o que foi enviado</text>
  <rect x="20" y="458" width="350" height="110" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="479" font-family="Arial, sans-serif" font-size="10" font-weight="700">O que poderá acontecer</text>
  <text x="32" y="499" font-family="Arial, sans-serif" font-size="8">• aprovação, recusa ou pedido legítimo de informação adicional</text>
  <text x="32" y="518" font-family="Arial, sans-serif" font-size="8">• cancelamento pela pessoa antes da decisão</text>
  <text x="32" y="537" font-family="Arial, sans-serif" font-size="8">• nova revisão se regras ou dados materiais mudarem</text>
  <text x="32" y="557" font-family="Arial, sans-serif" font-size="7">Cada evento terá fundamento, autoridade e consequência identificados.</text>
  <rect x="20" y="593" width="350" height="46" rx="8" fill="#222222"/>
  <text x="195" y="621" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Acompanhar em Solicitações</text>
  <text x="195" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">A continuidade detalhada pertence à próxima superfície Solicitação Pendente.</text>
  <rect x="20" y="681" width="350" height="43" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="195" y="708" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Voltar ao Perfil Público</text>
  <text x="195" y="746" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Salvar comprovante</text>
  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817" font-weight="700">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817">Eu</text></g>
  <g fill="none" stroke="#555555"><circle cx="39" cy="796" r="8"/><rect x="109" y="788" width="16" height="16"/><circle cx="195" cy="796" r="8" fill="#222222"/><path d="M265 804 L273 788 L281 804 Z"/><circle cx="351" cy="794" r="6"/><path d="M342 807 Q351 799 360 807"/></g>
</svg>
