<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Denunciar conteúdo ou informação</title><desc id="desc">A pessoa abre um fluxo de integridade da oportunidade, separado de preferências e contestação de dados.</desc><rect width="390" height="844" fill="#fff"/><rect x="1" y="1" width="388" height="842" fill="none" stroke="#111" stroke-width="2"/><text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text><text x="20" y="60" font-family="Arial" font-size="10">INTEGRIDADE DA OPORTUNIDADE</text><text x="20" y="94" font-family="Arial" font-size="19" font-weight="700">Denunciar conteúdo</text><rect x="20" y="116" width="350" height="118" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="144" font-family="Arial" font-size="10" font-weight="700">PATROCINADO · BST-2026-081</text><text x="34" y="172" font-family="Arial" font-size="14" font-weight="700">Formação de jovens em tecnologia</text><text x="34" y="198" font-family="Arial" font-size="9">Instituto Horizonte</text><text x="34" y="220" font-family="Arial" font-size="8">A denúncia não é preferência publicitária.</text><rect x="20" y="256" width="350" height="218" rx="8" fill="#fff" stroke="#555"/><text x="34" y="284" font-family="Arial" font-size="11" font-weight="700">Qual problema você identificou?</text><circle cx="41" cy="316" r="7" fill="#fff" stroke="#111"/><text x="60" y="320" font-family="Arial" font-size="9">Informação incorreta ou desatualizada</text><circle cx="41" cy="350" r="7" fill="#fff" stroke="#111"/><text x="60" y="354" font-family="Arial" font-size="9">Conteúdo enganoso ou prática abusiva</text><circle cx="41" cy="384" r="7" fill="#fff" stroke="#111"/><text x="60" y="388" font-family="Arial" font-size="9">Risco, segurança ou discriminação</text><circle cx="41" cy="418" r="7" fill="#fff" stroke="#111"/><text x="60" y="422" font-family="Arial" font-size="9">Outro problema de conteúdo</text><text x="34" y="454" font-family="Arial" font-size="8">Nenhuma opção começa selecionada.</text><rect x="20" y="496" width="350" height="116" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="524" font-family="Arial" font-size="10" font-weight="700">Consequência</text><text x="34" y="550" font-family="Arial" font-size="9">A equipe poderá revisar conteúdo, elegibilidade ou segurança.</text><text x="34" y="574" font-family="Arial" font-size="9">A identidade da pessoa não será enviada ao anunciante.</text><text x="34" y="598" font-family="Arial" font-size="8">Denunciar não altera automaticamente preferências.</text><rect x="20" y="636" width="350" height="48" rx="8" fill="#ddd" stroke="#777"/><text x="195" y="666" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700">CONTINUAR · INDISPONÍVEL</text><text x="20" y="716" font-family="Arial" font-size="9" text-decoration="underline">Voltar ao anúncio</text><rect x="20" y="746" width="350" height="48" rx="8" fill="#fff" stroke="#777"/><text x="34" y="775" font-family="Arial" font-size="9">Problema com dados usa o fluxo de contestação.</text><text x="20" y="820" font-family="Arial" font-size="8">Estado residual materializado; validação funcional pendente.</text></svg>