<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Início protegido antes da autenticação</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade que explica o ambiente protegido antes de autenticação ou coleta, com alternativas para continuar, entender, voltar ou explorar sem personalização.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>

  <text x="20" y="34" font-family="Arial, sans-serif" font-size="16" font-weight="700">GUIVOS</text>
  <text x="370" y="34" text-anchor="end" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Sair</text>
  <line x1="16" y1="50" x2="374" y2="50" stroke="#cccccc"/>

  <text x="20" y="82" font-family="Arial, sans-serif" font-size="10" fill="#555555">INÍCIO PROTEGIDO · 1 DE 4</text>
  <rect x="20" y="98" width="350" height="104" rx="12" fill="#f3f3f3" stroke="#777777"/>
  <text x="36" y="126" font-family="Arial, sans-serif" font-size="18" font-weight="700">Você está entrando em um</text>
  <text x="36" y="149" font-family="Arial, sans-serif" font-size="18" font-weight="700">ambiente protegido</text>
  <text x="36" y="176" font-family="Arial, sans-serif" font-size="11">Nenhuma informação pessoal foi coletada até aqui.</text>
  <text x="36" y="192" font-family="Arial, sans-serif" font-size="9" fill="#555555">Gravação, upload e análise não começam automaticamente.</text>

  <text x="20" y="236" font-family="Arial, sans-serif" font-size="13" font-weight="700">O que acontecerá</text>

  <g font-family="Arial, sans-serif">
    <circle cx="36" cy="274" r="15" fill="#222222"/>
    <text x="36" y="279" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="700">1</text>
    <text x="62" y="271" font-size="11" font-weight="700">Entender o processo</text>
    <text x="62" y="288" font-size="9" fill="#555555">Você conhece etapas, finalidades e controles.</text>

    <circle cx="36" cy="326" r="15" fill="#ffffff" stroke="#777777"/>
    <text x="36" y="331" text-anchor="middle" font-size="11">2</text>
    <text x="62" y="323" font-size="11" font-weight="700">Entrar ou criar conta</text>
    <text x="62" y="340" font-size="9" fill="#555555">A conta protege o rascunho, mas não autoriza uso.</text>

    <circle cx="36" cy="378" r="15" fill="#ffffff" stroke="#777777"/>
    <text x="36" y="383" text-anchor="middle" font-size="11">3</text>
    <text x="62" y="375" font-size="11" font-weight="700">Escolher como compartilhar</text>
    <text x="62" y="392" font-size="9" fill="#555555">Texto, voz, arquivo ou perguntas opcionais.</text>

    <circle cx="36" cy="430" r="15" fill="#ffffff" stroke="#777777"/>
    <text x="36" y="435" text-anchor="middle" font-size="11">4</text>
    <text x="62" y="427" font-size="11" font-weight="700">Revisar e autorizar</text>
    <text x="62" y="444" font-size="9" fill="#555555">Você decide o que será processado e para quê.</text>
  </g>

  <rect x="20" y="478" width="350" height="92" rx="10" fill="#ffffff" stroke="#999999"/>
  <text x="36" y="504" font-family="Arial, sans-serif" font-size="11" font-weight="700">Você mantém o controle</text>
  <text x="36" y="527" font-family="Arial, sans-serif" font-size="9">Pode pausar, corrigir, limitar, remover ou excluir.</text>
  <text x="36" y="547" font-family="Arial, sans-serif" font-size="9">Pode continuar sem personalização ou voltar a explorar.</text>

  <rect x="20" y="600" width="350" height="48" rx="9" fill="#222222"/>
  <text x="195" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="700">Continuar com segurança</text>

  <rect x="20" y="660" width="350" height="44" rx="9" fill="#ffffff" stroke="#777777"/>
  <text x="195" y="687" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Entender como funciona</text>

  <text x="195" y="742" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Voltar à Página Inicial</text>
  <text x="195" y="774" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Explorar sem personalização</text>

  <rect x="20" y="804" width="350" height="22" rx="11" fill="#f3f3f3"/>
  <rect x="20" y="804" width="88" height="22" rx="11" fill="#222222"/>
  <text x="195" y="819" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Explicação · acesso · compartilhamento · revisão</text>
</svg>
