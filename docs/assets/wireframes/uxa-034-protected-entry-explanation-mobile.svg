<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Explicação do ambiente protegido antes do relato</title>
  <desc id="desc">Wireframe móvel reformulado que distingue relato pessoal, dados de acesso e processamento, com destino explícito e alternativas para voltar ou explorar sem personalização.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial, sans-serif" font-size="16" font-weight="700">GUIVOS</text>
  <text x="370" y="34" text-anchor="end" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Voltar à Home</text>
  <line x1="16" y1="50" x2="374" y2="50" stroke="#cccccc"/>

  <text x="20" y="82" font-family="Arial, sans-serif" font-size="10" fill="#555555">INÍCIO PROTEGIDO · ESTADO DE EXPLICAÇÃO</text>
  <rect x="20" y="98" width="350" height="132" rx="12" fill="#f3f3f3" stroke="#777777"/>
  <text x="36" y="126" font-family="Arial, sans-serif" font-size="18" font-weight="700">Você saiu da Página Inicial</text>
  <text x="36" y="149" font-family="Arial, sans-serif" font-size="18" font-weight="700">e entrou na explicação protegida</text>
  <text x="36" y="178" font-family="Arial, sans-serif" font-size="10">Nenhum relato pessoal da jornada foi solicitado</text>
  <text x="36" y="196" font-family="Arial, sans-serif" font-size="10">ou recebido nesta etapa.</text>
  <text x="36" y="216" font-family="Arial, sans-serif" font-size="9" fill="#555555">Gravação, upload, transcrição e análise não começaram.</text>

  <text x="20" y="266" font-family="Arial, sans-serif" font-size="13" font-weight="700">Como poderá funcionar</text>
  <text x="20" y="286" font-family="Arial, sans-serif" font-size="9" fill="#555555">Estados possíveis e retomáveis; não é formulário obrigatório.</text>

  <g font-family="Arial, sans-serif">
    <circle cx="36" cy="326" r="14" fill="#222222"/><text x="36" y="331" text-anchor="middle" font-size="10" fill="#ffffff">1</text>
    <text x="62" y="323" font-size="11" font-weight="700">Entender finalidades e controles</text>
    <text x="62" y="340" font-size="9" fill="#555555">Antes de solicitar qualquer relato.</text>
    <circle cx="36" cy="378" r="14" fill="#ffffff" stroke="#777777"/><text x="36" y="383" text-anchor="middle" font-size="10">2</text>
    <text x="62" y="375" font-size="11" font-weight="700">Acessar somente quando necessário</text>
    <text x="62" y="392" font-size="9" fill="#555555">Conta e conteúdo da jornada permanecem separados.</text>
    <circle cx="36" cy="430" r="14" fill="#ffffff" stroke="#777777"/><text x="36" y="435" text-anchor="middle" font-size="10">3</text>
    <text x="62" y="427" font-size="11" font-weight="700">Escolher e compartilhar pouco</text>
    <text x="62" y="444" font-size="9" fill="#555555">Texto, voz, arquivo ou perguntas opcionais.</text>
    <circle cx="36" cy="482" r="14" fill="#ffffff" stroke="#777777"/><text x="36" y="487" text-anchor="middle" font-size="10">4</text>
    <text x="62" y="479" font-size="11" font-weight="700">Revisar antes do processamento</text>
    <text x="62" y="496" font-size="9" fill="#555555">Somente itens e finalidade autorizados.</text>
  </g>

  <rect x="20" y="526" width="350" height="84" rx="10" fill="#ffffff" stroke="#999999"/>
  <text x="36" y="552" font-family="Arial, sans-serif" font-size="11" font-weight="700">Categorias separadas</text>
  <text x="36" y="575" font-family="Arial, sans-serif" font-size="9">Dados técnicos ou de acesso possuem finalidade própria.</text>
  <text x="36" y="595" font-family="Arial, sans-serif" font-size="9">Não autorizam relato, compreensão persistente ou personalização.</text>

  <rect x="20" y="636" width="350" height="48" rx="9" fill="#222222"/>
  <text x="195" y="666" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="700">Ir para o acesso protegido</text>
  <text x="195" y="714" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Já tenho sessão válida: escolher como compartilhar</text>
  <text x="195" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Entender finalidades e controles</text>
  <text x="195" y="782" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Explorar sem personalização</text>
  <text x="195" y="816" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Sair sem iniciar relato</text>
</svg>
