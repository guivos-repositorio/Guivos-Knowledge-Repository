<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Elegibilidade móvel validada do anunciante para o Opportunity Boost</title>
  <desc id="desc">Wireframe móvel reformulado com identidade persistente da campanha, etapa um de cinco, gates atendidos, condição limitada ativa, regra de bloqueio não ativa e continuidade condicionada.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text>
  <text x="20" y="59" font-family="Arial" font-size="10">OPPORTUNITY BOOST · CONFIGURAÇÃO MÓVEL</text>
  <text x="20" y="88" font-family="Arial" font-size="19" font-weight="700">Pode impulsionar?</text>
  <text x="350" y="87" text-anchor="end" font-family="Arial" font-size="10">ETAPA 1 DE 5</text>
  <line x1="20" y1="102" x2="90" y2="102" stroke="#111111" stroke-width="4"/>
  <line x1="94" y1="102" x2="370" y2="102" stroke="#cccccc" stroke-width="4"/>

  <rect x="20" y="118" width="350" height="86" rx="8" fill="#f3f3f3" stroke="#555555"/>
  <text x="34" y="142" font-family="Arial" font-size="11" font-weight="700">Campanha BST-2026-081 · rascunho v1</text>
  <text x="34" y="163" font-family="Arial" font-size="10">Formação de jovens em tecnologia</text>
  <text x="34" y="183" font-family="Arial" font-size="9">Instituto Horizonte · plano Gestão</text>
  <text x="350" y="196" text-anchor="end" font-family="Arial" font-size="8">Rascunho salvo · mesma campanha nas 5 etapas</text>

  <text x="20" y="230" font-family="Arial" font-size="13" font-weight="700">Condições para continuar</text>

  <rect x="20" y="244" width="350" height="56" rx="7" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="266" font-family="Arial" font-size="10" font-weight="700">Plano e responsável institucional</text>
  <text x="350" y="266" text-anchor="end" font-family="Arial" font-size="9" font-weight="700">ATENDIDO</text>
  <text x="34" y="286" font-family="Arial" font-size="9">Plano elegível e responsável identificado.</text>

  <rect x="20" y="310" width="350" height="56" rx="7" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="332" font-family="Arial" font-size="10" font-weight="700">Aprovação e informações materiais</text>
  <text x="350" y="332" text-anchor="end" font-family="Arial" font-size="9" font-weight="700">ATENDIDO</text>
  <text x="34" y="352" font-family="Arial" font-size="9">Oportunidade ativa, aprovada e atualizada.</text>

  <rect x="20" y="376" width="350" height="78" rx="7" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="34" y="398" font-family="Arial" font-size="10" font-weight="700">Capacidade disponível</text>
  <text x="350" y="398" text-anchor="end" font-family="Arial" font-size="8" font-weight="700">ATENDIDO COM LIMITE</text>
  <text x="34" y="419" font-family="Arial" font-size="9">Condição ativa: há capacidade, com entrega potencialmente reduzida.</text>
  <text x="34" y="440" font-family="Arial" font-size="9" text-decoration="underline">Revisar capacidade declarada</text>

  <rect x="20" y="464" width="350" height="56" rx="7" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="486" font-family="Arial" font-size="10" font-weight="700">Segurança e moderação</text>
  <text x="350" y="486" text-anchor="end" font-family="Arial" font-size="9" font-weight="700">ATENDIDO</text>
  <text x="34" y="506" font-family="Arial" font-size="9">Nenhuma pendência crítica registrada.</text>

  <rect x="20" y="536" width="350" height="88" rx="8" fill="#f3f3f3" stroke="#555555" stroke-dasharray="5 4"/>
  <text x="34" y="558" font-family="Arial" font-size="8" font-weight="700">REGRA DE EXCEÇÃO · NÃO ATIVA NESTE EXEMPLO</text>
  <text x="34" y="579" font-family="Arial" font-size="10" font-weight="700">Bloqueio crítico</text>
  <text x="34" y="599" font-family="Arial" font-size="9">Impede continuidade e apresenta ação corretiva específica.</text>
  <text x="34" y="616" font-family="Arial" font-size="9" text-decoration="underline">Ver exemplo de bloqueio</text>

  <rect x="20" y="640" width="350" height="70" rx="8" fill="#ffffff" stroke="#444444"/>
  <text x="34" y="663" font-family="Arial" font-size="11" font-weight="700">Resumo do gate</text>
  <text x="34" y="684" font-family="Arial" font-size="10">0 bloqueios críticos · 1 condição limitada ativa</text>
  <text x="34" y="702" font-family="Arial" font-size="8">A condição limitada acompanhará orçamento, prévia e avaliação.</text>

  <rect x="20" y="728" width="350" height="48" rx="8" fill="#111111"/>
  <text x="195" y="757" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#ffffff">CONTINUAR COM LIMITE</text>
  <text x="20" y="802" font-family="Arial" font-size="9" text-decoration="underline">Voltar à oportunidade</text>
  <text x="370" y="802" text-anchor="end" font-family="Arial" font-size="9">Rascunho preservado</text>
  <text x="20" y="830" font-family="Arial" font-size="8">Plano pago não substitui aprovação, capacidade ou segurança.</text>
</svg>