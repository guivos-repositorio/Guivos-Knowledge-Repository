<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Mapa patrocinado para computador reformulado do Opportunity Boost</title>
  <desc id="desc">Wireframe reformulado em visão dividida, com contagens orgânicas e pagas separadas, gate para pesquisar nova área, marcador patrocinado selecionado e preferência publicitária reversível.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="1022" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="220" height="1024" fill="#f4f4f4" stroke="#999999"/>
  <text x="32" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700">GUIVOS</text>
  <text x="32" y="108" font-family="Arial, sans-serif" font-size="14">Hoje</text>
  <text x="32" y="150" font-family="Arial, sans-serif" font-size="14">Jornada</text>
  <text x="32" y="192" font-family="Arial, sans-serif" font-size="14">Explorar</text>
  <text x="32" y="234" font-family="Arial, sans-serif" font-size="14" font-weight="700">Mapa</text>
  <text x="32" y="276" font-family="Arial, sans-serif" font-size="14">Eu</text>

  <text x="260" y="46" font-family="Arial, sans-serif" font-size="11">MAPA DE OPORTUNIDADES · VISÃO DIVIDIDA · MESMA CONSULTA</text>
  <text x="260" y="84" font-family="Arial, sans-serif" font-size="28" font-weight="700">Consulta territorial ativa</text>
  <text x="260" y="112" font-family="Arial, sans-serif" font-size="12">Agindo como: Pessoa · região manual · localização desativada · posição não acessada</text>
  <rect x="260" y="136" width="700" height="50" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="284" y="167" font-family="Arial, sans-serif" font-size="12">Buscar oportunidades, organizações, coletivos ou regiões</text>
  <rect x="980" y="136" width="200" height="50" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="1080" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700">PREFERÊNCIA PUBLICITÁRIA</text>
  <text x="1080" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Patrocinados: exibidos</text>
  <rect x="1200" y="136" width="200" height="50" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="1300" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Privacidade territorial</text>

  <rect x="260" y="210" width="240" height="680" rx="10" fill="#f8f8f8" stroke="#999999"/>
  <text x="286" y="244" font-family="Arial, sans-serif" font-size="15" font-weight="700">Consulta e filtros</text>
  <text x="286" y="280" font-family="Arial, sans-serif" font-size="11">Belo Horizonte · região manual</text>
  <text x="286" y="308" font-family="Arial, sans-serif" font-size="11">8 orgânicas · 1 patrocinada exibida</text>
  <text x="286" y="344" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Alterar região</text>
  <text x="286" y="372" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Privacidade territorial</text>
  <line x1="286" y1="402" x2="474" y2="402" stroke="#cccccc"/>
  <text x="286" y="438" font-family="Arial, sans-serif" font-size="13" font-weight="700">Filtros de oportunidades</text>
  <text x="286" y="472" font-family="Arial, sans-serif" font-size="11">Período: 7 dias</text>
  <text x="286" y="500" font-family="Arial, sans-serif" font-size="11">Preço: gratuito ou informado</text>
  <text x="286" y="528" font-family="Arial, sans-serif" font-size="11">Modalidade: todas</text>
  <text x="286" y="556" font-family="Arial, sans-serif" font-size="11">Acessibilidade conhecida</text>
  <text x="286" y="592" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Revisar filtros de negócio</text>
  <line x1="286" y1="622" x2="474" y2="622" stroke="#cccccc"/>
  <text x="286" y="658" font-family="Arial, sans-serif" font-size="13" font-weight="700">Preferência publicitária</text>
  <text x="286" y="692" font-family="Arial, sans-serif" font-size="11">Patrocinados exibidos</text>
  <text x="286" y="720" font-family="Arial, sans-serif" font-size="11">Limitados e nunca consecutivos</text>
  <text x="286" y="748" font-family="Arial, sans-serif" font-size="11">Baixa oferta reduz anúncios</text>
  <text x="286" y="784" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Revisar preferências</text>
  <text x="286" y="812" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Não mostrar patrocinados</text>
  <text x="286" y="846" font-family="Arial, sans-serif" font-size="9">Preserva os 8 resultados orgânicos.</text>

  <rect x="520" y="210" width="540" height="680" rx="10" fill="#f7f7f7" stroke="#777777"/>
  <text x="546" y="244" font-family="Arial, sans-serif" font-size="13" font-weight="700">MAPA · MESMA CONSULTA DA LISTA</text>
  <text x="546" y="270" font-family="Arial, sans-serif" font-size="10">Nenhum símbolo representa a posição da pessoa</text>
  <path d="M550 320 L1030 320 M550 408 L1030 408 M550 496 L1030 496 M550 584 L1030 584 M550 672 L1030 672" stroke="#cccccc"/>
  <path d="M630 292 L630 846 M730 292 L730 846 M830 292 L830 846 M930 292 L930 846" stroke="#dddddd"/>
  <circle cx="636" cy="370" r="18" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="636" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700">O1</text>
  <circle cx="886" cy="474" r="18" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="886" y="479" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700">O2</text>
  <circle cx="704" cy="706" r="18" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="704" y="711" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700">O3</text>
  <rect x="774" y="584" width="50" height="50" rx="5" fill="#e8e8e8" stroke="#111111" stroke-width="3"/>
  <text x="799" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700">P1</text>
  <text x="799" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">selecionado</text>
  <rect x="930" y="350" width="86" height="46" rx="8" fill="#ffffff" stroke="#444444" stroke-dasharray="4 3"/>
  <text x="973" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">4 orgânicos</text>
  <text x="973" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">1 patrocinado</text>
  <text x="546" y="788" font-family="Arial, sans-serif" font-size="10">○ O = orgânico · □ P = patrocinado · agrupamentos mantêm contagens separadas</text>
  <text x="546" y="814" font-family="Arial, sans-serif" font-size="10">Mover o Mapa não altera busca, região ou filtros automaticamente.</text>
  <rect x="820" y="826" width="210" height="36" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="925" y="849" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Pesquisar nesta área</text>

  <rect x="1080" y="210" width="320" height="680" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="1106" y="244" font-family="Arial, sans-serif" font-size="13" font-weight="700">LISTA · MESMA CONSULTA</text>
  <text x="1106" y="270" font-family="Arial, sans-serif" font-size="10">Seleção no Mapa não muda a ordem da Lista</text>
  <rect x="1106" y="294" width="268" height="132" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="1124" y="320" font-family="Arial, sans-serif" font-size="9" font-weight="700">O1 · 1º RESULTADO ORGÂNICO</text>
  <text x="1124" y="350" font-family="Arial, sans-serif" font-size="13" font-weight="700">Oficina aberta local</text>
  <text x="1124" y="376" font-family="Arial, sans-serif" font-size="10">Sem patrocínio · busca e filtros</text>
  <text x="1124" y="404" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Por que aparece aqui?</text>

  <rect x="1106" y="452" width="268" height="248" rx="8" fill="#f3f3f3" stroke="#444444" stroke-width="2"/>
  <text x="1124" y="478" font-family="Arial, sans-serif" font-size="9" font-weight="700">P1 SELECIONADO · IMPULSIONADO · PAGO</text>
  <text x="1124" y="506" font-family="Arial, sans-serif" font-size="10">Anunciante: Coletivo Horizonte</text>
  <text x="1124" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="700">Formação gratuita em gestão</text>
  <text x="1124" y="566" font-family="Arial, sans-serif" font-size="10">Região geral · posição exata não utilizada</text>
  <text x="1124" y="592" font-family="Arial, sans-serif" font-size="9">Seleção não altera ordem, afinidade ou recomendação.</text>
  <text x="1124" y="622" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Por que estou vendo isto?</text>
  <text x="1124" y="650" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Ocultar P1 na Lista e no Mapa</text>
  <text x="1354" y="650" text-anchor="end" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Mais controles</text>
  <text x="1354" y="680" text-anchor="end" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Abrir oportunidade</text>

  <rect x="1106" y="730" width="268" height="118" rx="8" fill="#ffffff" stroke="#999999"/>
  <text x="1124" y="758" font-family="Arial, sans-serif" font-size="11" font-weight="700">Consequências conhecidas</text>
  <text x="1124" y="784" font-family="Arial, sans-serif" font-size="9">Ocultar remove somente P1 nos dois modos.</text>
  <text x="1124" y="806" font-family="Arial, sans-serif" font-size="9">Desativar patrocinados preserva 8 orgânicos.</text>
  <text x="1124" y="828" font-family="Arial, sans-serif" font-size="9">Denúncia e contestação são fluxos distintos.</text>

  <text x="260" y="952" font-family="Arial, sans-serif" font-size="11">Baixa fidelidade · marcador pago não cobre orgânico; proximidade não equivale a afinidade.</text>
</svg>