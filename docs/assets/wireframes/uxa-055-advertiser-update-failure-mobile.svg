<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Falha ao atualizar gestão do anunciante</title><desc id="desc">O painel preserva o último estado confirmado e não presume que a alteração foi aplicada.</desc><rect width="390" height="844" fill="#fff"/><rect x="1" y="1" width="388" height="842" fill="none" stroke="#111" stroke-width="2"/><text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text><text x="20" y="60" font-family="Arial" font-size="10">OPPORTUNITY BOOST · GESTÃO MÓVEL</text><text x="20" y="94" font-family="Arial" font-size="19" font-weight="700">Atualização não concluída</text><rect x="20" y="116" width="350" height="92" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="142" font-family="Arial" font-size="10" font-weight="700">BST-2026-081 · versão aprovada v1</text><text x="34" y="166" font-family="Arial" font-size="9">Estado confirmado: ATIVA</text><text x="34" y="190" font-family="Arial" font-size="9">Última atualização confirmada: 18:30</text><rect x="20" y="230" width="350" height="180" rx="8" fill="#fff" stroke="#555" stroke-dasharray="5 4"/><text x="34" y="260" font-family="Arial" font-size="11" font-weight="700">Falha ao enviar a alteração</text><text x="34" y="288" font-family="Arial" font-size="9">A capacidade informada não foi confirmada.</text><text x="34" y="312" font-family="Arial" font-size="9">A campanha permanece no último estado conhecido.</text><text x="34" y="336" font-family="Arial" font-size="9">Nenhuma retomada, pausa ou gasto é presumido.</text><text x="34" y="370" font-family="Arial" font-size="8">Código de referência: UPD-2408 · tentativa às 18:44</text><text x="34" y="394" font-family="Arial" font-size="8">O rascunho local pode ser revisado antes de reenviar.</text><rect x="20" y="434" width="350" height="148" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="462" font-family="Arial" font-size="10" font-weight="700">Alteração não confirmada</text><text x="34" y="488" font-family="Arial" font-size="9">Capacidade candidata: 25 vagas</text><text x="34" y="512" font-family="Arial" font-size="9">Estado oficial preservado: 40 vagas</text><text x="34" y="536" font-family="Arial" font-size="9">Reenviar exige nova ação consciente.</text><text x="34" y="562" font-family="Arial" font-size="9" text-decoration="underline">Descartar rascunho local</text><rect x="20" y="606" width="350" height="48" rx="8" fill="#111"/><text x="195" y="636" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#fff">REVISAR E TENTAR NOVAMENTE</text><rect x="20" y="674" width="350" height="96" rx="8" fill="#fff" stroke="#777"/><text x="34" y="702" font-family="Arial" font-size="9">Histórico registra tentativa e resultado técnico.</text><text x="34" y="726" font-family="Arial" font-size="9">Erro não altera orçamento, período ou eventos válidos.</text><text x="34" y="750" font-family="Arial" font-size="8">Suporte recebe referência técnica, não dados de pessoas.</text><text x="20" y="814" font-family="Arial" font-size="8">Estado residual materializado; validação funcional pendente.</text></svg>