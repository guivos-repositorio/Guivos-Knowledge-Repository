<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Falha ao confirmar alteração material do anunciante</title><desc id="desc">O painel preserva a última versão confirmada, bloqueia nova entrega após falha em alteração material e exige revisão consciente antes de reenviar.</desc><rect width="390" height="844" fill="#fff"/><rect x="1" y="1" width="388" height="842" fill="none" stroke="#111" stroke-width="2"/><text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text><text x="20" y="60" font-family="Arial" font-size="10">OPPORTUNITY BOOST · GESTÃO MÓVEL</text><text x="20" y="94" font-family="Arial" font-size="19" font-weight="700">Atualização não concluída</text><rect x="20" y="116" width="350" height="112" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="142" font-family="Arial" font-size="10" font-weight="700">BST-2026-081 · versão aprovada v1</text><text x="34" y="166" font-family="Arial" font-size="9">Último estado confirmado: ATIVA · 18:30</text><text x="34" y="190" font-family="Arial" font-size="9">Entrega futura: PAUSADA AUTOMATICAMENTE · 18:44</text><text x="34" y="214" font-family="Arial" font-size="8">Motivo: alteração material declarada sem confirmação.</text><rect x="20" y="250" width="350" height="194" rx="8" fill="#fff" stroke="#555" stroke-dasharray="5 4"/><text x="34" y="280" font-family="Arial" font-size="11" font-weight="700">Falha ao confirmar alteração material</text><text x="34" y="308" font-family="Arial" font-size="9">Capacidade candidata: 25 vagas</text><text x="34" y="332" font-family="Arial" font-size="9">Capacidade oficial preservada: 40 vagas</text><text x="34" y="356" font-family="Arial" font-size="9">A candidata não foi aplicada como estado canônico.</text><text x="34" y="380" font-family="Arial" font-size="9">Novos eventos válidos ficam bloqueados até revisão.</text><text x="34" y="412" font-family="Arial" font-size="8">Código: UPD-2408 · tentativa às 18:44</text><text x="34" y="432" font-family="Arial" font-size="8">Eventos válidos anteriores permanecem preservados.</text><rect x="20" y="466" width="350" height="150" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="494" font-family="Arial" font-size="10" font-weight="700">Rascunho local preservado</text><text x="34" y="520" font-family="Arial" font-size="9">Revisar a capacidade antes de reenviar.</text><text x="34" y="544" font-family="Arial" font-size="9">Nenhuma entrega futura ou gasto é presumido.</text><text x="34" y="568" font-family="Arial" font-size="8">Reenvio igual não duplica versão, evento ou gasto.</text><text x="34" y="596" font-family="Arial" font-size="9" text-decoration="underline">Descartar rascunho local</text><rect x="20" y="640" width="350" height="48" rx="8" fill="#111"/><text x="195" y="670" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#fff">REVISAR E TENTAR NOVAMENTE</text><rect x="20" y="710" width="350" height="76" rx="8" fill="#fff" stroke="#777"/><text x="34" y="738" font-family="Arial" font-size="9">Retomada depende de confirmação válida e nova verificação.</text><text x="34" y="762" font-family="Arial" font-size="8">Suporte recebe referência técnica, não dados de pessoas.</text><text x="20" y="820" font-family="Arial" font-size="8">Reformulado e validado funcionalmente pela UXA-099.</text></svg>