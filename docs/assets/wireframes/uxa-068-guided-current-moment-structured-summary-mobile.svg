  <text x="32" y="161" font-family="Arial, sans-serif" font-size="10" font-weight="700">Situação atual</text>
  <text x="32" y="180" font-family="Arial, sans-serif" font-size="7">Organização sugerida · origem: texto da Pessoa · não confirmada</text>
  <text x="32" y="201" font-family="Arial, sans-serif" font-size="8">Possível transição profissional por falta de crescimento.</text>
  <text x="32" y="220" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Editar · manter em aberto · remover da síntese</text>
  <rect x="20" y="242" width="350" height="91" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="264" font-family="Arial, sans-serif" font-size="10" font-weight="700">Impacto mencionado</text>
  <text x="32" y="283" font-family="Arial, sans-serif" font-size="7">Conteúdo informado · origem: texto da Pessoa · revisável</text>
  <text x="32" y="304" font-family="Arial, sans-serif" font-size="8">Dificuldade para demonstrar experiência em seleções.</text>
  <text x="32" y="323" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Editar · manter em aberto · remover da síntese</text>
  <rect x="20" y="345" width="350" height="91" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="367" font-family="Arial, sans-serif" font-size="10" font-weight="700">Prioridade atual</text>
  <text x="32" y="386" font-family="Arial, sans-serif" font-size="7">Organização sugerida · origem: resposta opcional · não confirmada</text>
  <text x="32" y="407" font-family="Arial, sans-serif" font-size="8">Compreender opções antes de decidir por uma mudança.</text>
  <text x="32" y="426" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Editar · manter em aberto · remover da síntese</text>
  <rect x="20" y="448" width="350" height="91" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="470" font-family="Arial, sans-serif" font-size="10" font-weight="700">Direção e condição</text>
  <text x="32" y="489" font-family="Arial, sans-serif" font-size="7">Organização sugerida · origens revisadas · não confirmada</text>
  <text x="32" y="510" font-family="Arial, sans-serif" font-size="8">Buscar crescimento preservando a renda atual.</text>
  <text x="32" y="529" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Editar · manter em aberto · remover da síntese</text>
  <rect x="20" y="551" width="350" height="91" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="573" font-family="Arial, sans-serif" font-size="10" font-weight="700">Pontos em aberto</text>
  <text x="32" y="592" font-family="Arial, sans-serif" font-size="7">Desconhecido declarado · não será tratado como fato</text>
  <text x="32" y="613" font-family="Arial, sans-serif" font-size="8">Função ou setor a priorizar ainda não foi informado.</text>
  <text x="32" y="632" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Responder agora · manter em aberto</text>
  <rect x="20" y="660" width="350" height="44" rx="8" fill="#222222"/>
  <text x="195" y="687" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Ir ao inventário usando somente conteúdos de origem</text>
  <rect x="20" y="719" width="350" height="42" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="195" y="745" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Revisar e adicionar síntese como item derivado</text>
  <text x="195" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">A síntese não será usada automaticamente e não substitui as fontes.</text>
  <text x="195" y="811" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">O inventário da UXA-034 antecede qualquer autorização material.</text>
</svg>
