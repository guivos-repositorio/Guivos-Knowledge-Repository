<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Síntese estruturada validada do Momento Atual</title>
  <desc id="desc">Tela móvel que apresenta organização derivada com natureza, origem e estado, preserva conteúdos de origem e evita uso implícito da síntese.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="28" font-family="Arial, sans-serif" font-size="11">09:41</text>
  <text x="20" y="58" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao rascunho</text>
  <text x="370" y="58" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Descartar somente a síntese</text>
  <text x="20" y="96" font-family="Arial, sans-serif" font-size="21" font-weight="700">Como seu rascunho foi organizado</text>
  <text x="20" y="120" font-family="Arial, sans-serif" font-size="9">Ajuda temporária · não é compreensão inicial nem diagnóstico.</text>
