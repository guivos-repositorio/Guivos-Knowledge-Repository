<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Síntese estruturada do Momento Atual com área da jornada candidata</title>
  <desc id="desc">Tela móvel que organiza o relato preservando origem e estado e apresenta uma área da jornada apenas como hipótese revisável, sem diagnóstico, score ou uso automático.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="28" font-family="Arial, sans-serif" font-size="11">09:41</text>
  <text x="20" y="58" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao rascunho</text>
  <text x="370" y="58" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Descartar somente a síntese</text>
  <text x="20" y="92" font-family="Arial, sans-serif" font-size="20" font-weight="700">Como seu rascunho foi organizado</text>
  <text x="20" y="113" font-family="Arial, sans-serif" font-size="8">Ajuda temporária · não é compreensão inicial, diagnóstico ou classificação.</text>

  <rect x="20" y="128" width="350" height="84" rx="10" fill="#f3f3f3" stroke="#777777"/>
  <text x="32" y="149" font-family="Arial, sans-serif" font-size="9" font-weight="700">Área da jornada possivelmente relacionada</text>
  <text x="32" y="169" font-family="Arial, sans-serif" font-size="11" font-weight="700">Trabalho, carreira e estudos</text>
  <text x="32" y="185" font-family="Arial, sans-serif" font-size="7">Sugestão da Guivos com base no relato · candidata · não confirmada</text>
  <text x="32" y="201" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Confirmar</text>
  <text x="86" y="201" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Adicionar outra área</text>
  <text x="181" y="201" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Não representa</text>
  <text x="260" y="201" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Manter em aberto</text>

  <rect x="20" y="224" width="350" height="74" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="244" font-family="Arial, sans-serif" font-size="9" font-weight="700">Situação atual</text>
  <text x="32" y="260" font-family="Arial, sans-serif" font-size="7">Organização sugerida · origem: texto da Pessoa · não confirmada</text>
  <text x="32" y="278" font-family="Arial, sans-serif" font-size="8">Possível transição profissional por falta de crescimento.</text>
  <text x="32" y="291" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Editar · manter em aberto · remover da síntese</text>

  <rect x="20" y="308" width="350" height="74" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="328" font-family="Arial, sans-serif" font-size="9" font-weight="700">Impacto mencionado</text>
  <text x="32" y="344" font-family="Arial, sans-serif" font-size="7">Conteúdo informado · origem: texto da Pessoa · revisável</text>
  <text x="32" y="362" font-family="Arial, sans-serif" font-size="8">Dificuldade para demonstrar experiência em seleções.</text>
  <text x="32" y="375" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Editar · manter em aberto · remover da síntese</text>

  <rect x="20" y="392" width="350" height="74" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="412" font-family="Arial, sans-serif" font-size="9" font-weight="700">Prioridade atual</text>
  <text x="32" y="428" font-family="Arial, sans-serif" font-size="7">Organização sugerida · origem: resposta opcional · não confirmada</text>
  <text x="32" y="446" font-family="Arial, sans-serif" font-size="8">Compreender opções antes de decidir por uma mudança.</text>
  <text x="32" y="459" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Editar · manter em aberto · remover da síntese</text>

  <rect x="20" y="476" width="350" height="74" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="496" font-family="Arial, sans-serif" font-size="9" font-weight="700">Direção e condição</text>
  <text x="32" y="512" font-family="Arial, sans-serif" font-size="7">Organização sugerida · origens revisadas · não confirmada</text>
  <text x="32" y="530" font-family="Arial, sans-serif" font-size="8">Buscar crescimento preservando a renda atual.</text>
  <text x="32" y="543" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Editar · manter em aberto · remover da síntese</text>

  <rect x="20" y="560" width="350" height="74" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="580" font-family="Arial, sans-serif" font-size="9" font-weight="700">Pontos em aberto</text>
  <text x="32" y="596" font-family="Arial, sans-serif" font-size="7">Desconhecido declarado · não será tratado como fato</text>
  <text x="32" y="614" font-family="Arial, sans-serif" font-size="8">Função ou setor a priorizar ainda não foi informado.</text>
  <text x="32" y="627" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Responder agora · manter em aberto</text>

  <text x="20" y="651" font-family="Arial, sans-serif" font-size="7">Situação, impacto, prioridade e direção organizam o relato; não são Domínios de Evolução.</text>

  <rect x="20" y="666" width="350" height="42" rx="8" fill="#222222"/>
  <text x="195" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Ir ao inventário usando somente conteúdos de origem</text>
  <rect x="20" y="720" width="350" height="42" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="195" y="746" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Revisar e adicionar síntese como item derivado</text>
  <text x="195" y="784" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Área candidata e síntese não serão usadas automaticamente nem substituem as fontes.</text>
  <text x="195" y="809" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">“Ainda estou descobrindo” e “Outra área” permanecem caminhos legítimos.</text>
</svg>