<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Síntese estruturada do Momento Atual</title>
  <desc id="desc">Tela móvel que organiza situação, impacto, prioridade, direção e contexto, identifica lacunas e permite correção antes da revisão e autorização de processamento.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="28" font-family="Arial, sans-serif" font-size="11">09:41</text>
  <text x="20" y="58" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao rascunho</text>
  <text x="370" y="58" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Salvar e sair</text>
  <text x="20" y="96" font-family="Arial, sans-serif" font-size="21" font-weight="700">O que entendemos do seu relato</text>
  <text x="20" y="120" font-family="Arial, sans-serif" font-size="9">Esta é uma organização provisória, não uma conclusão da Guivos.</text>
  <rect x="20" y="139" width="350" height="95" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="162" font-family="Arial, sans-serif" font-size="10" font-weight="700">Situação atual</text>
  <text x="32" y="184" font-family="Arial, sans-serif" font-size="8">Você considera uma transição profissional por falta de crescimento.</text>
  <text x="32" y="207" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Editar situação</text>
  <text x="350" y="207" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Não representa meu momento</text>
  <rect x="20" y="247" width="350" height="81" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="270" font-family="Arial, sans-serif" font-size="10" font-weight="700">Impacto principal</text>
  <text x="32" y="292" font-family="Arial, sans-serif" font-size="8">Dificuldade para demonstrar experiência em processos seletivos.</text>
  <text x="32" y="315" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Editar impacto</text>
  <rect x="20" y="341" width="350" height="81" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="364" font-family="Arial, sans-serif" font-size="10" font-weight="700">Prioridade atual</text>
  <text x="32" y="386" font-family="Arial, sans-serif" font-size="8">Compreender opções antes de decidir por uma mudança.</text>
  <text x="32" y="409" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Editar prioridade</text>
  <rect x="20" y="435" width="350" height="81" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="458" font-family="Arial, sans-serif" font-size="10" font-weight="700">Direção desejada</text>
  <text x="32" y="480" font-family="Arial, sans-serif" font-size="8">Buscar crescimento sem interromper a renda atual.</text>
  <text x="32" y="503" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Editar direção</text>
  <rect x="20" y="529" width="350" height="101" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="552" font-family="Arial, sans-serif" font-size="10" font-weight="700">Contexto e pontos em aberto</text>
  <text x="32" y="574" font-family="Arial, sans-serif" font-size="8">Condição informada: preservar renda durante a transição.</text>
  <text x="32" y="594" font-family="Arial, sans-serif" font-size="8">Ainda desconhecido: função ou setor que deseja priorizar.</text>
  <text x="32" y="617" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Responder agora ou manter em aberto</text>
  <rect x="20" y="650" width="350" height="44" rx="8" fill="#222222"/>
  <text x="195" y="677" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="700">Continuar para revisar conteúdos</text>
  <rect x="20" y="709" width="350" height="42" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="195" y="735" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Voltar e contar mais</text>
  <text x="195" y="779" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Continuar abre a revisão da UXA-034; não inicia processamento.</text>
  <text x="195" y="808" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Pontos em aberto não serão tratados como fatos confirmados.</text>
</svg>
