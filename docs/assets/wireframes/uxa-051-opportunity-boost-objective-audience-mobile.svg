<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Objetivo e critérios móveis validados do Opportunity Boost</title>
  <desc id="desc">Wireframe móvel reformulado com identidade persistente, etapa dois de cinco, objetivo escolhido após ação explícita, critérios revisáveis e regra de público insuficiente não ativa.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text>
  <text x="20" y="59" font-family="Arial" font-size="10">OPPORTUNITY BOOST · CONFIGURAÇÃO MÓVEL</text>
  <text x="20" y="88" font-family="Arial" font-size="19" font-weight="700">Objetivo e critérios</text>
  <text x="350" y="87" text-anchor="end" font-family="Arial" font-size="10">ETAPA 2 DE 5</text>
  <line x1="20" y1="102" x2="160" y2="102" stroke="#111111" stroke-width="4"/>
  <line x1="164" y1="102" x2="370" y2="102" stroke="#cccccc" stroke-width="4"/>

  <rect x="20" y="118" width="350" height="70" rx="8" fill="#f3f3f3" stroke="#555555"/>
  <text x="34" y="141" font-family="Arial" font-size="10" font-weight="700">BST-2026-081 · rascunho v1</text>
  <text x="34" y="161" font-family="Arial" font-size="9">Formação de jovens · condição limitada ativa</text>
  <text x="34" y="179" font-family="Arial" font-size="8">Estado após escolha explícita; nenhuma opção começa selecionada.</text>

  <text x="20" y="216" font-family="Arial" font-size="13" font-weight="700">Objetivo escolhido neste exemplo</text>

  <rect x="20" y="230" width="350" height="48" rx="7" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <circle cx="40" cy="254" r="7" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <circle cx="40" cy="254" r="3" fill="#111111"/>
  <text x="58" y="250" font-family="Arial" font-size="10" font-weight="700">Levar pessoas ao detalhe</text>
  <text x="58" y="267" font-family="Arial" font-size="8">Escolhido conscientemente · métrica: clique válido</text>

  <rect x="20" y="286" width="350" height="38" rx="7" fill="#ffffff" stroke="#aaaaaa"/>
  <circle cx="40" cy="305" r="7" fill="#ffffff" stroke="#777777"/>
  <text x="58" y="309" font-family="Arial" font-size="10">Ampliar visualizações válidas</text>

  <rect x="20" y="332" width="350" height="38" rx="7" fill="#ffffff" stroke="#aaaaaa"/>
  <circle cx="40" cy="351" r="7" fill="#ffffff" stroke="#777777"/>
  <text x="58" y="355" font-family="Arial" font-size="10">Estimular interesse ou inscrição</text>

  <text x="20" y="402" font-family="Arial" font-size="13" font-weight="700">Critérios escolhidos</text>
  <text x="370" y="402" text-anchor="end" font-family="Arial" font-size="9" text-decoration="underline">Revisar ou remover</text>

  <rect x="20" y="416" width="350" height="94" rx="8" fill="#ffffff" stroke="#777777"/>
  <rect x="34" y="434" width="12" height="12" fill="#111111"/>
  <text x="56" y="444" font-family="Arial" font-size="10">Região: Belo Horizonte e entorno</text>
  <rect x="34" y="458" width="12" height="12" fill="#111111"/>
  <text x="56" y="468" font-family="Arial" font-size="10">Categoria: formação e tecnologia</text>
  <rect x="34" y="482" width="12" height="12" fill="#111111"/>
  <text x="56" y="492" font-family="Arial" font-size="10">Modalidade: presencial e gratuita</text>
  <text x="34" y="506" font-family="Arial" font-size="8">Origem objetiva; nenhum critério será ampliado silenciosamente.</text>

  <rect x="20" y="526" width="350" height="94" rx="8" fill="#f3f3f3" stroke="#555555"/>
  <text x="34" y="550" font-family="Arial" font-size="10" font-weight="700">Critérios nunca utilizados</text>
  <text x="34" y="571" font-family="Arial" font-size="9">Relato protegido · compreensão inicial</text>
  <text x="34" y="590" font-family="Arial" font-size="9">Momento Atual · Próximo Passo · inferências sensíveis</text>
  <text x="34" y="608" font-family="Arial" font-size="8">Não aparecem como opções e não alimentam estimativas.</text>

  <rect x="20" y="636" width="350" height="76" rx="8" fill="#ffffff" stroke="#777777" stroke-dasharray="5 4"/>
  <text x="34" y="658" font-family="Arial" font-size="8" font-weight="700">REGRA DE EXCEÇÃO · NÃO ATIVA NESTE EXEMPLO</text>
  <text x="34" y="679" font-family="Arial" font-size="10" font-weight="700">Público insuficiente</text>
  <text x="34" y="699" font-family="Arial" font-size="9">Limita ou bloqueia; critérios não são ampliados automaticamente.</text>

  <rect x="20" y="728" width="350" height="48" rx="8" fill="#111111"/>
  <text x="195" y="757" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#ffffff">CONTINUAR PARA ORÇAMENTO</text>
  <text x="20" y="802" font-family="Arial" font-size="9" text-decoration="underline">Voltar aos gates</text>
  <text x="370" y="802" text-anchor="end" font-family="Arial" font-size="9">Rascunho salvo</text>
  <text x="20" y="830" font-family="Arial" font-size="8">Voltar não confirma alterações incompletas nem cria critério novo.</text>
</svg>