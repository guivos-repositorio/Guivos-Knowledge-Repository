<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Revisão do conteúdo antes do processamento específico</title>
  <desc id="desc">Wireframe móvel reformulado com inventário do conteúdo, autorização inicialmente desmarcada para preparar compreensão temporária e recusa explícita sem processamento, persistência ou personalização.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial, sans-serif" font-size="16" font-weight="700">GUIVOS</text>
  <text x="370" y="34" text-anchor="end" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Pausar e manter rascunho</text>
  <line x1="16" y1="50" x2="374" y2="50" stroke="#cccccc"/>

  <text x="20" y="82" font-family="Arial, sans-serif" font-size="10" fill="#555555">INÍCIO PROTEGIDO · REVISÃO ANTES DO PROCESSAMENTO</text>
  <text x="20" y="116" font-family="Arial, sans-serif" font-size="19" font-weight="700">Revise o que foi recebido</text>
  <text x="20" y="140" font-family="Arial, sans-serif" font-size="10">Nenhum item será usado para gerar compreensão sem autorização.</text>

  <rect x="20" y="164" width="350" height="200" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="190" font-family="Arial, sans-serif" font-size="11" font-weight="700">Inventário do rascunho</text>
  <text x="36" y="218" font-family="Arial, sans-serif" font-size="10" font-weight="700">Texto original</text>
  <text x="36" y="239" font-family="Arial, sans-serif" font-size="9">“Quero reorganizar minha vida profissional...”</text>
  <text x="336" y="239" text-anchor="end" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Editar</text>
  <line x1="36" y1="255" x2="354" y2="255" stroke="#dddddd"/>
  <text x="36" y="280" font-family="Arial, sans-serif" font-size="10" font-weight="700">Resposta opcional</text>
  <text x="36" y="301" font-family="Arial, sans-serif" font-size="9">Prioridade principal: trabalho</text>
  <text x="336" y="301" text-anchor="end" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Revisar</text>
  <line x1="36" y1="317" x2="354" y2="317" stroke="#dddddd"/>
  <text x="36" y="340" font-family="Arial, sans-serif" font-size="9" fill="#555555">Sem gravação · sem transcrição · sem arquivo · sem extração</text>
  <text x="36" y="356" font-family="Arial, sans-serif" font-size="8" fill="#555555">Ausências não são tratadas como insuficiência da pessoa.</text>

  <rect x="20" y="382" width="350" height="92" rx="10" fill="#f3f3f3" stroke="#999999"/>
  <text x="36" y="408" font-family="Arial, sans-serif" font-size="11" font-weight="700">Controles antes do uso</text>
  <text x="36" y="432" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Corrigir, remover ou substituir item</text>
  <text x="36" y="454" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Limitar finalidade · excluir rascunho · voltar</text>

  <text x="20" y="514" font-family="Arial, sans-serif" font-size="12" font-weight="700">Autorização específica · desmarcada</text>
  <rect x="20" y="532" width="350" height="92" rx="9" fill="#ffffff" stroke="#777777"/>
  <rect x="36" y="552" width="18" height="18" fill="#ffffff" stroke="#222222"/>
  <text x="68" y="558" font-family="Arial, sans-serif" font-size="10" font-weight="700">Usar somente os itens marcados</text>
  <text x="68" y="578" font-family="Arial, sans-serif" font-size="8">Finalidade: preparar compreensão inicial temporária e revisável.</text>
  <text x="68" y="596" font-family="Arial, sans-serif" font-size="8">Itens não marcados não serão processados para esta finalidade.</text>
  <text x="68" y="614" font-family="Arial, sans-serif" font-size="8">Sem marcação, nenhuma compreensão será preparada.</text>

  <rect x="20" y="644" width="350" height="84" rx="9" fill="#f3f3f3" stroke="#999999"/>
  <text x="36" y="668" font-family="Arial, sans-serif" font-size="10" font-weight="700">Persistência e personalização</text>
  <text x="36" y="689" font-family="Arial, sans-serif" font-size="9">Serão decididas somente depois de você revisar a compreensão.</text>
  <text x="36" y="710" font-family="Arial, sans-serif" font-size="9">PERSISTÊNCIA BLOQUEADA · PERSONALIZAÇÃO BLOQUEADA</text>

  <rect x="20" y="748" width="350" height="44" rx="9" fill="#222222"/>
  <text x="195" y="775" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="700">Autorizar marcados para preparar compreensão</text>
  <text x="195" y="818" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Não autorizar processamento e voltar a explorar</text>
</svg>
