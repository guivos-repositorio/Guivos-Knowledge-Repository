  <text x="82" y="194" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Filtros</text>
  <text x="150" y="194" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Privacidade</text>
  <rect x="248" y="172" width="122" height="30" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="309" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Patrocinados: mostrar</text>

  <rect x="20" y="220" width="350" height="316" rx="10" fill="#f7f7f7" stroke="#777777"/>
  <text x="36" y="246" font-family="Arial, sans-serif" font-size="10">ÁREA TERRITORIAL · nenhum símbolo é sua posição</text>
  <path d="M50 286 L330 286 M50 340 L330 340 M50 394 L330 394 M50 448 L330 448" stroke="#cccccc"/>
  <path d="M92 262 L92 512 M160 262 L160 512 M228 262 L228 512 M296 262 L296 512" stroke="#dddddd"/>
  <circle cx="92" cy="318" r="16" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="92" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700">O1</text>
  <circle cx="244" cy="368" r="16" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="244" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700">O2</text>
  <rect x="168" y="432" width="34" height="34" rx="5" fill="#e8e8e8" stroke="#111111" stroke-width="2"/>
  <text x="185" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700">P1</text>
  <rect x="278" y="300" width="66" height="38" rx="8" fill="#ffffff" stroke="#444444" stroke-dasharray="4 3"/>
  <text x="311" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">3 org.</text>
  <text x="311" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">1 pat.</text>
  <text x="36" y="502" font-family="Arial, sans-serif" font-size="9">○ O = orgânico · □ P = patrocinado · agrupamentos mostram contagens separadas</text>
  <text x="36" y="522" font-family="Arial, sans-serif" font-size="9">Marcador patrocinado não cobre marcador orgânico.</text>

  <rect x="20" y="560" width="350" height="206" rx="10" fill="#f3f3f3" stroke="#444444" stroke-width="2"/>
  <text x="36" y="586" font-family="Arial, sans-serif" font-size="10" font-weight="700">P1 · IMPULSIONADO · POSIÇÃO PAGA</text>
  <text x="36" y="610" font-family="Arial, sans-serif" font-size="10">Anunciante: Coletivo Horizonte</text>
  <text x="36" y="640" font-family="Arial, sans-serif" font-size="15" font-weight="700">Formação gratuita em gestão comunitária</text>
  <text x="36" y="664" font-family="Arial, sans-serif" font-size="10">Online · Gratuita · região geral · não usa posição exata</text>
  <text x="36" y="688" font-family="Arial, sans-serif" font-size="9">Distância ou proximidade não equivale a afinidade ou recomendação.</text>
  <text x="36" y="716" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Por que estou vendo isto?</text>
  <text x="354" y="716" text-anchor="end" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Abrir oportunidade</text>
  <text x="36" y="744" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Ocultar só esta campanha</text>
  <text x="354" y="744" text-anchor="end" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Controles do anúncio</text>

  <text x="20" y="794" font-family="Arial, sans-serif" font-size="9">Pouco inventário orgânico reduz anúncios. Filtro patrocinado é reversível.</text>
  <text x="20" y="822" font-family="Arial, sans-serif" font-size="10">Hoje · Jornada · Explorar · Mapa · Eu</text>
