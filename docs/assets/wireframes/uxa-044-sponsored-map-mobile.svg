<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Mapa patrocinado móvel do Opportunity Boost</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade com marcadores orgânicos e patrocinado distintos, agrupamento separado, localização opcional, filtro reversível e cartão patrocinado selecionado.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial, sans-serif" font-size="11">MAPA DE OPORTUNIDADES</text>
  <text x="20" y="64" font-family="Arial, sans-serif" font-size="22" font-weight="700">Belo Horizonte</text>
  <text x="20" y="88" font-family="Arial, sans-serif" font-size="10">Região manual · localização desativada · posição não acessada</text>
  <rect x="20" y="104" width="350" height="44" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="131" font-family="Arial, sans-serif" font-size="11">Buscar nesta região</text>
  <text x="20" y="172" font-family="Arial, sans-serif" font-size="10">8 resultados · 4 filtros · mesma consulta da Lista</text>
