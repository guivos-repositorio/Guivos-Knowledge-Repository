<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Encerramento e cancelamento da campanha do Opportunity Boost reformulados</title>
  <desc id="desc">Wireframe de baixa fidelidade mostrando confirmação bloqueada de cancelamento, consequências, orçamento, saldo candidato, estados finais separados e histórico preservado.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="1022" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="220" height="1024" fill="#f4f4f4" stroke="#999999"/>
  <text x="32" y="48" font-family="Arial" font-size="22" font-weight="700">GUIVOS</text>
  <text x="32" y="112" font-family="Arial" font-size="14">Oportunidades</text>
  <text x="32" y="154" font-family="Arial" font-size="14" font-weight="700">Opportunity Boost</text>
  <text x="32" y="196" font-family="Arial" font-size="14">Campanhas</text>
  <text x="260" y="48" font-family="Arial" font-size="11">OPPORTUNITY BOOST › CAMPANHA OB-2048</text>
  <text x="260" y="86" font-family="Arial" font-size="28" font-weight="700">Cancelar campanha ativa</text>
  <rect x="1070" y="46" width="330" height="48" rx="8" fill="#f3f3f3" stroke="#222222"/>
  <text x="1235" y="76" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">CONFIRMAÇÃO DE CANCELAMENTO</text>
  <text x="260" y="122" font-family="Arial" font-size="12">A campanha permanece ativa até a confirmação completa · nenhuma confirmação foi concedida</text>

  <rect x="260" y="154" width="1140" height="126" rx="10" fill="#f3f3f3" stroke="#444444" stroke-width="2"/>
  <text x="286" y="188" font-family="Arial" font-size="14" font-weight="700">Consequência irreversível para esta campanha</text>
  <text x="286" y="220" font-family="Arial" font-size="11">O cancelamento encerra novos eventos de entrega e impede retomada da mesma campanha. Eventos válidos anteriores e histórico permanecem preservados.</text>
  <text x="286" y="248" font-family="Arial" font-size="11">O saldo não utilizado permanece candidato a tratamento posterior. Nenhum crédito, estorno ou devolução é confirmado neste pacote.</text>

  <rect x="260" y="310" width="350" height="236" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="344" font-family="Arial" font-size="15" font-weight="700">Entrega e histórico</text>
  <text x="286" y="382" font-family="Arial" font-size="12">Novos eventos: serão encerrados</text>
  <text x="286" y="412" font-family="Arial" font-size="12">Eventos válidos anteriores: preservados</text>
  <text x="286" y="442" font-family="Arial" font-size="12">Retomada da mesma campanha: indisponível</text>
  <text x="286" y="472" font-family="Arial" font-size="12">Registro operacional: permanece acessível</text>
  <text x="286" y="510" font-family="Arial" font-size="10">O relatório agregado ainda não existe e será tratado em pacote separado.</text>

  <rect x="636" y="310" width="350" height="236" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="662" y="344" font-family="Arial" font-size="15" font-weight="700">Orçamento</text>
  <text x="662" y="382" font-family="Arial" font-size="12">Total aprovado: R$ 300,00</text>
  <text x="662" y="412" font-family="Arial" font-size="12">Utilizado validado: R$ 146,20</text>
  <text x="662" y="442" font-family="Arial" font-size="12">Saldo não utilizado: R$ 153,80</text>
  <text x="662" y="472" font-family="Arial" font-size="12">Tratamento do saldo: em definição</text>
  <text x="662" y="510" font-family="Arial" font-size="10">Cancelamento não recalcula eventos válidos anteriores.</text>

  <rect x="1012" y="310" width="388" height="236" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="1038" y="344" font-family="Arial" font-size="15" font-weight="700">Motivo obrigatório</text>
  <rect x="1038" y="374" width="336" height="44" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="1054" y="401" font-family="Arial" font-size="11">Selecionar motivo</text>
  <text x="1038" y="450" font-family="Arial" font-size="11">O motivo será registrado no histórico.</text>
  <text x="1038" y="480" font-family="Arial" font-size="11">Não altera relevância ou ordenação orgânica.</text>
  <text x="1038" y="510" font-family="Arial" font-size="10">Sem motivo selecionado, a confirmação permanece bloqueada.</text>

  <rect x="260" y="578" width="740" height="238" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="612" font-family="Arial" font-size="15" font-weight="700">Estados finais possuem causas próprias</text>
  <text x="286" y="648" font-family="Arial" font-size="12">Orçamento esgotado — encerramento por limite financeiro.</text>
  <text x="286" y="678" font-family="Arial" font-size="12">Capacidade esgotada — encerramento para evitar excesso de demanda.</text>
  <text x="286" y="708" font-family="Arial" font-size="12">Oportunidade expirada — data ou validade encerrada.</text>
  <text x="286" y="738" font-family="Arial" font-size="12">Suspensa por política — bloqueio especializado, sem equivalência a cancelamento voluntário.</text>
  <text x="286" y="768" font-family="Arial" font-size="12">Concluída ou cancelada — encerramentos natural ou voluntário.</text>
  <text x="286" y="798" font-family="Arial" font-size="10">Reconciliada será registrada somente após tratamento posterior de eventos e saldo.</text>

  <rect x="1026" y="578" width="374" height="238" rx="10" fill="#f3f3f3" stroke="#444444"/>
  <text x="1052" y="612" font-family="Arial" font-size="15" font-weight="700">Confirmações inicialmente vazias</text>
  <text x="1052" y="648" font-family="Arial" font-size="11">□ Entendo que novos eventos serão encerrados.</text>
  <text x="1052" y="680" font-family="Arial" font-size="11">□ Entendo que eventos válidos serão preservados.</text>
  <text x="1052" y="712" font-family="Arial" font-size="11">□ Entendo que não haverá retomada desta campanha.</text>
  <rect x="1052" y="742" width="322" height="44" rx="8" fill="#e8e8e8" stroke="#999999"/>
  <text x="1213" y="769" text-anchor="middle" font-family="Arial" font-size="11">Confirmar cancelamento — indisponível</text>
  <text x="1052" y="804" font-family="Arial" font-size="9">Habilita após motivo e três confirmações.</text>

  <text x="260" y="858" font-family="Arial" font-size="11">Alternativa: pausar a campanha somente quando a causa permitir retomada futura.</text>
  <text x="260" y="890" font-family="Arial" font-size="11">Histórico, eventos válidos e orçamento utilizado não serão apagados pelo cancelamento.</text>
  <text x="260" y="954" font-family="Arial" font-size="11">Baixa fidelidade · saldo e reconciliação são candidatos · sem cobrança real ou implementação.</text>
</svg>