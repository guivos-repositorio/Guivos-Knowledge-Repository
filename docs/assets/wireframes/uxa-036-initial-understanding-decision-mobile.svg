<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Decisões separadas sobre persistência e personalização</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade com compreensão revisada, decisão independente sobre manutenção, decisão independente sobre personalização e continuidade para a Tela Hoje ou exploração geral.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial, sans-serif" font-size="16" font-weight="700">GUIVOS</text>
  <text x="370" y="34" text-anchor="end" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Voltar à revisão</text>
  <line x1="16" y1="50" x2="374" y2="50" stroke="#cccccc"/>

  <text x="20" y="80" font-family="Arial, sans-serif" font-size="10" fill="#555555">COMPREENSÃO INICIAL · DECISÕES</text>
  <text x="20" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700">Escolha o que acontece agora</text>
  <text x="20" y="136" font-family="Arial, sans-serif" font-size="10">Persistência e personalização são decisões separadas.</text>

  <rect x="20" y="160" width="350" height="84" rx="10" fill="#f3f3f3" stroke="#777777"/>
  <text x="36" y="184" font-family="Arial, sans-serif" font-size="11" font-weight="700">Compreensão revisada</text>
  <text x="36" y="208" font-family="Arial, sans-serif" font-size="9">2 afirmações confirmadas · 1 removida · 1 desconhecida</text>
  <text x="36" y="230" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Abrir resumo completo e informações utilizadas</text>

  <text x="20" y="280" font-family="Arial, sans-serif" font-size="12" font-weight="700">1. Manter para retomar depois?</text>
  <rect x="20" y="296" width="350" height="152" rx="10" fill="#ffffff" stroke="#777777"/>
  <rect x="36" y="314" width="14" height="14" fill="#ffffff" stroke="#111111"/>
  <text x="62" y="326" font-family="Arial, sans-serif" font-size="10" font-weight="700">Manter compreensão revisada</text>
  <text x="62" y="346" font-family="Arial, sans-serif" font-size="8">Permite retomada. Você poderá revisar ou excluir depois.</text>
  <rect x="36" y="362" width="14" height="14" fill="#ffffff" stroke="#111111"/>
  <text x="62" y="374" font-family="Arial, sans-serif" font-size="10">Usar somente nesta sessão</text>
  <rect x="36" y="398" width="14" height="14" fill="#ffffff" stroke="#111111"/>
  <text x="62" y="410" font-family="Arial, sans-serif" font-size="10">Excluir esta compreensão</text>
  <text x="36" y="436" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Entender duração, finalidade e exclusão</text>

  <text x="20" y="484" font-family="Arial, sans-serif" font-size="12" font-weight="700">2. Autorizar personalização?</text>
  <rect x="20" y="500" width="350" height="160" rx="10" fill="#ffffff" stroke="#777777"/>
  <rect x="36" y="518" width="14" height="14" fill="#ffffff" stroke="#111111"/>
  <text x="62" y="530" font-family="Arial, sans-serif" font-size="10" font-weight="700">Autorizar para esta finalidade</text>
  <text x="62" y="550" font-family="Arial, sans-serif" font-size="8">Usar a compreensão revisada na experiência pessoal.</text>
  <rect x="36" y="568" width="14" height="14" fill="#ffffff" stroke="#111111"/>
  <text x="62" y="580" font-family="Arial, sans-serif" font-size="10">Continuar sem personalização</text>
  <rect x="36" y="604" width="14" height="14" fill="#ffffff" stroke="#111111"/>
  <text x="62" y="616" font-family="Arial, sans-serif" font-size="10">Decidir depois</text>
  <text x="36" y="646" font-family="Arial, sans-serif" font-size="8">Nenhuma opção está marcada por padrão.</text>

  <rect x="20" y="686" width="350" height="48" rx="9" fill="#222222"/>
  <text x="195" y="716" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="700">Confirmar escolhas e ir para a Tela Hoje</text>
  <text x="195" y="758" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Continuar explorando sem personalização</text>
  <text x="195" y="786" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Revisar conteúdos e autorizações</text>
  <text x="195" y="814" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Excluir compreensão e continuar</text>
  <text x="195" y="836" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Persistir não autoriza personalizar. Personalizar não cria outras finalidades.</text>
</svg>
