<title id="title">Gestão de Solicitações — Fila</title><desc id="desc">Wireframe desktop de baixa fidelidade da fila operacional de solicitações do responsável do Coletivo.</desc><rect width="1440" height="1024" fill="#fff"/><g fill="none" stroke="#111" stroke-width="2"><rect x="24" y="24" width="1392" height="72" rx="8"/><rect x="24" y="112" width="248" height="888" rx="8"/><rect x="288" y="112" width="1128" height="92" rx="8"/><rect x="288" y="220" width="1128" height="88" rx="8"/><rect x="288" y="324" width="1128" height="560" rx="8"/><rect x="288" y="900" width="1128" height="100" rx="8"/></g><g font-family="Arial" fill="#111"><text x="48" y="58" font-size="22" font-weight="700">Coletivo Horizonte Aberto</text><text x="48" y="82" font-size="13">Representação válida · escopo de participação</text><text x="48" y="148" font-size="15" font-weight="700">GESTÃO DO COLETIVO</text><text x="48" y="190" font-size="14">Visão Geral</text><text x="48" y="226" font-size="14" font-weight="700">Solicitações</text><text x="48" y="262" font-size="14">Participantes e vínculos</text><text x="48" y="298" font-size="14">Comunicação</text><text x="48" y="334" font-size="14">Proteção</text><text x="48" y="382" font-size="13">← Voltar à Visão Geral</text><text x="316" y="152" font-size="22" font-weight="700">Solicitações de participação</text><text x="316" y="180" font-size="13">Consultar, filtrar ou ordenar não altera prioridade, decisão ou direito da Pessoa.</text><text x="316" y="254" font-size="14">Aguardando decisão  8   ·   Aguardando informação  2   ·   Resposta recebida  1   ·   Protegidas  1</text><text x="316" y="286" font-size="12">Filtro: estado · prazo · tipo de entrada · autoridade aplicável</text><text x="316" y="362" font-size="14" font-weight="700">Pessoa / referência</text><text x="650" y="362" font-size="14" font-weight="700">Estado</text><text x="875" y="362" font-size="14" font-weight="700">Prazo informado</text><text x="1120" y="362" font-size="14" font-weight="700">Próximo ato</text><text x="316" y="414" font-size="14">Marina A. · SOL-1842</text><text x="650" y="414" font-size="14">Aguardando decisão</text><text x="875" y="414" font-size="14">11 ago · 18h</text><text x="1120" y="414" font-size="14">Abrir solicitação</text><text x="316" y="466" font-size="14">Paulo R. · SOL-1841</text><text x="650" y="466" font-size="14">Informação solicitada</text><text x="875" y="466" font-size="14">12 ago · 18h</text><text x="1120" y="466" font-size="14">Aguardar Pessoa</text><text x="316" y="518" font-size="14">Referência protegida · SOL-P17</text><text x="650" y="518" font-size="14">Análise protegida</text><text x="875" y="518" font-size="14">13 ago · 12h</text><text x="1120" y="518" font-size="14">Abrir com autoridade</text><text x="316" y="570" font-size="14">Lucas S. · SOL-1838</text><text x="650" y="570" font-size="14">Resposta recebida</text><text x="875" y="570" font-size="14">14 ago · 18h</text><text x="1120" y="570" font-size="14">Revisar resposta</text><text x="316" y="644" font-size="12">Encerradas: aprovação, recusa, cancelamento pela Pessoa e expiração permanecem estados distintos.</text><text x="316" y="680" font-size="12">Atraso não é recusa. Silêncio não é aprovação. Volume de pedidos não mede desempenho do Coletivo.</text><text x="316" y="936" font-size="13">Dados exibidos somente no limite da finalidade e da autoridade concedida.</text><text x="316" y="964" font-size="13">Nenhuma solicitação é decidida automaticamente por ordenação, filtro ou sugestão.</text></g></svg>