<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">Gestão de Solicitações — Detalhe</title><desc id="desc">Wireframe desktop de baixa fidelidade do detalhe comum de uma solicitação de participação.</desc><rect width="1440" height="1024" fill="#fff"/><g fill="none" stroke="#111" stroke-width="2"><rect x="24" y="24" width="1392" height="72" rx="8"/><rect x="24" y="112" width="248" height="888" rx="8"/><rect x="288" y="112" width="1128" height="122" rx="8"/><rect x="288" y="250" width="548" height="430" rx="8"/><rect x="852" y="250" width="564" height="430" rx="8"/><rect x="288" y="696" width="1128" height="184" rx="8"/><rect x="288" y="896" width="1128" height="104" rx="8"/></g><g font-family="Arial" fill="#111"><text x="48" y="58" font-size="22" font-weight="700">Coletivo Horizonte Aberto</text><text x="48" y="82" font-size="13">Responsável por participação · autoridade válida</text><text x="48" y="148" font-size="15" font-weight="700">SOLICITAÇÕES</text><text x="48" y="190" font-size="14">Fila</text><text x="48" y="226" font-size="14" font-weight="700">Detalhe</text><text x="48" y="274" font-size="13">← Voltar à fila</text><text x="316" y="150" font-size="22" font-weight="700">Solicitação SOL-1842 · aguardando decisão</text><text x="316" y="180" font-size="13">Recebida em 07 ago · estimativa informada até 11 ago, 18h · estimativa não é promessa</text><text x="316" y="210" font-size="12">Critério aplicável: entrada mediante aprovação · nenhuma decisão automática</text><text x="316" y="286" font-size="18" font-weight="700">Dados autorizados para esta análise</text><text x="316" y="326" font-size="14">Nome apresentado: Marina A.</text><text x="316" y="358" font-size="14">Motivo declarado: participar das atividades comunitárias abertas</text><text x="316" y="390" font-size="14">Disponibilidade declarada: sábados pela manhã</text><text x="316" y="422" font-size="14">Regra essencial revisada: sim, em 07 ago</text><text x="316" y="466" font-size="12">Não incluídos: Jornada pessoal, outros Coletivos, contatos privados, avaliações externas.</text><text x="880" y="286" font-size="18" font-weight="700">Critérios e autoridade</text><text x="880" y="326" font-size="14">Autoridade: responsável por participação</text><text x="880" y="358" font-size="14">Finalidade: decidir vínculo neste Coletivo</text><text x="880" y="390" font-size="14">Critérios: condições previamente apresentadas à Pessoa e ainda vigentes</text><text x="880" y="422" font-size="14">Sem critério oculto ou inferência sensível</text><text x="880" y="466" font-size="12">Apoio institucional não concede voto, acesso adicional ou poder de decisão.</text><text x="316" y="736" font-size="18" font-weight="700">Próximo ato</text><text x="316" y="776" font-size="14">Você pode aguardar até a estimativa, pedir informação pertinente, aprovar ou recusar com fundamento proporcional.</text><text x="316" y="818" font-size="13">Ações com consequência exigem autoridade válida no momento da confirmação.</text><text x="316" y="850" font-size="14">Pedir informação adicional</text><text x="586" y="850" font-size="14">Revisar aprovação</text><text x="806" y="850" font-size="14">Revisar recusa</text><text x="1030" y="850" font-size="14">Voltar sem decidir</text><text x="316" y="936" font-size="13">Toda ação com consequência exige revisão antes da confirmação.</text><text x="316" y="966" font-size="13">A decisão produz um estado para a Pessoa; não cria reputação, ranking ou função automática.</text></g></svg>