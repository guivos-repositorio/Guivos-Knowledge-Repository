<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Inventário patrocinado indisponível</title><desc id="desc">Nenhuma unidade patrocinada elegível está disponível para a consulta, sem alteração do catálogo orgânico.</desc><rect width="390" height="844" fill="#fff"/><rect x="1" y="1" width="388" height="842" fill="none" stroke="#111" stroke-width="2"/><text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text><text x="20" y="60" font-family="Arial" font-size="10">LISTA · REGIÃO CENTRO</text><text x="20" y="94" font-family="Arial" font-size="19" font-weight="700">Oportunidades próximas</text><rect x="20" y="116" width="350" height="72" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="142" font-family="Arial" font-size="11" font-weight="700">6 oportunidades orgânicas</text><text x="34" y="164" font-family="Arial" font-size="9">0 unidades patrocinadas elegíveis para esta consulta</text><rect x="20" y="208" width="350" height="132" rx="8" fill="#fff" stroke="#555"/><text x="34" y="236" font-family="Arial" font-size="10" font-weight="700">RESULTADO ORGÂNICO 1</text><text x="34" y="264" font-family="Arial" font-size="14" font-weight="700">Curso de introdução à tecnologia</text><text x="34" y="290" font-family="Arial" font-size="9">Coletivo Aprender · gratuito</text><text x="34" y="314" font-family="Arial" font-size="9" text-decoration="underline">Ver detalhes</text><rect x="20" y="360" width="350" height="188" rx="8" fill="#f3f3f3" stroke="#555" stroke-dasharray="5 4"/><text x="34" y="390" font-family="Arial" font-size="11" font-weight="700">Nenhum anúncio elegível nesta consulta</text><text x="34" y="418" font-family="Arial" font-size="9">Não há campanha compatível com região, data e filtros.</text><text x="34" y="442" font-family="Arial" font-size="9">Os critérios não serão ampliados automaticamente.</text><text x="34" y="466" font-family="Arial" font-size="9">A ausência de inventário não altera a ordem orgânica.</text><text x="34" y="498" font-family="Arial" font-size="8">Estado de inventário: disponível para consulta, sem unidade elegível.</text><text x="34" y="522" font-family="Arial" font-size="8">Zero exibido significa contagem apurada, não falha técnica.</text><rect x="20" y="570" width="350" height="132" rx="8" fill="#fff" stroke="#555"/><text x="34" y="598" font-family="Arial" font-size="10" font-weight="700">RESULTADO ORGÂNICO 2</text><text x="34" y="626" font-family="Arial" font-size="14" font-weight="700">Oficina de currículo e entrevistas</text><text x="34" y="652" font-family="Arial" font-size="9">Instituto Horizonte · 12/08/2026</text><text x="34" y="678" font-family="Arial" font-size="9" text-decoration="underline">Ver detalhes</text><rect x="20" y="724" width="350" height="58" rx="8" fill="#fff" stroke="#777"/><text x="34" y="750" font-family="Arial" font-size="9">Atualizar a consulta exige ação explícita da pessoa.</text><text x="34" y="770" font-family="Arial" font-size="8">Nenhuma pessoa ou consulta é revelada ao anunciante.</text><text x="20" y="814" font-family="Arial" font-size="8">Estado residual materializado; validação funcional pendente.</text></svg>