<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1620" viewBox="0 0 1440 1620" role="img" aria-labelledby="title desc">
  <title id="title">Pessoa — planos, pagamentos e limite do Guivos Free</title>
  <desc id="desc">Placa estrutural de baixa fidelidade com estados de plano atual Free, correspondência personalizada limitada após cota, comparação Free Plus Pro, revisão da contratação, confirmação, falha e continuidade por cancelamento ou downgrade.</desc>
  <rect width="1440" height="1620" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <text x="48" y="58" font-size="26" font-weight="700">UXA-100 · Pessoa · Plano, cobrança e pagamento</text>
    <text x="48" y="86" font-size="14">Placa candidata de fluxo · baixa fidelidade · valores comerciais candidatos · sem checkout real</text>
    <text x="48" y="112" font-size="13">Regra: oportunidade pública continua no Explorar e no Mapa; o limite recai somente sobre correspondência personalizada adicional.</text>
  </g>

