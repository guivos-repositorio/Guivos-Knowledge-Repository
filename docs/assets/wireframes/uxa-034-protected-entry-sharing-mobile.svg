<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Escolha equivalente de modalidade e rascunho mínimo</title>
  <desc id="desc">Wireframe móvel reformulado com modalidades equivalentes, nenhuma escolha automática, explicação anterior para voz e arquivo e efeitos distintos de pausa, salvamento, saída e exclusão.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial, sans-serif" font-size="16" font-weight="700">GUIVOS</text>
  <text x="370" y="34" text-anchor="end" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Voltar</text>
  <line x1="16" y1="50" x2="374" y2="50" stroke="#cccccc"/>

  <text x="20" y="82" font-family="Arial, sans-serif" font-size="10" fill="#555555">INÍCIO PROTEGIDO · ESCOLHA E RASCUNHO</text>
  <text x="20" y="116" font-family="Arial, sans-serif" font-size="19" font-weight="700">Como você prefere começar?</text>
  <text x="20" y="141" font-family="Arial, sans-serif" font-size="10">Nenhuma forma está selecionada por padrão.</text>
  <text x="20" y="158" font-family="Arial, sans-serif" font-size="10" font-weight="700">Comece somente com o que fizer sentido agora.</text>

  <rect x="20" y="180" width="350" height="64" rx="10" fill="#f3f3f3" stroke="#777777"/>
  <text x="36" y="204" font-family="Arial, sans-serif" font-size="10" font-weight="700">Finalidade atual</text>
  <text x="36" y="225" font-family="Arial, sans-serif" font-size="9">Preparar, após revisão e autorização, uma compreensão inicial temporária.</text>

  <g font-family="Arial, sans-serif">
    <rect x="20" y="264" width="168" height="104" rx="10" fill="#ffffff" stroke="#777777"/>
    <text x="36" y="290" font-size="12" font-weight="700">Escrever</text>
    <text x="36" y="311" font-size="9">Texto livre ou uma frase.</text>
    <text x="36" y="334" font-size="9">Digitar não autoriza uso.</text>
    <text x="36" y="354" font-size="9" text-decoration="underline">Escolher esta forma</text>

    <rect x="202" y="264" width="168" height="104" rx="10" fill="#ffffff" stroke="#777777"/>
    <text x="218" y="290" font-size="12" font-weight="700">Falar</text>
    <text x="218" y="311" font-size="9">Explicação antes de gravar.</text>
    <text x="218" y="334" font-size="9">Áudio e transcrição separados.</text>
    <text x="218" y="354" font-size="9" text-decoration="underline">Entender e escolher</text>

    <rect x="20" y="382" width="168" height="104" rx="10" fill="#ffffff" stroke="#777777"/>
    <text x="36" y="408" font-size="12" font-weight="700">Enviar arquivo</text>
    <text x="36" y="429" font-size="9">Explicação antes do envio.</text>
    <text x="36" y="452" font-size="9">Extrações propostas e revisáveis.</text>
    <text x="36" y="472" font-size="9" text-decoration="underline">Entender e escolher</text>

    <rect x="202" y="382" width="168" height="104" rx="10" fill="#ffffff" stroke="#777777"/>
    <text x="218" y="408" font-size="12" font-weight="700">Perguntas opcionais</text>
    <text x="218" y="429" font-size="9">Adie ou prefira não informar.</text>
    <text x="218" y="452" font-size="9">Sem obrigação de completar.</text>
    <text x="218" y="472" font-size="9" text-decoration="underline">Escolher esta forma</text>
  </g>

  <rect x="20" y="506" width="350" height="92" rx="10" fill="#ffffff" stroke="#999999"/>
  <text x="36" y="532" font-family="Arial, sans-serif" font-size="11" font-weight="700">Antes de compartilhar</text>
  <text x="36" y="554" font-family="Arial, sans-serif" font-size="9">Evite dados de terceiros que não sejam necessários.</text>
  <text x="36" y="574" font-family="Arial, sans-serif" font-size="9">Tudo será inventariado e revisado antes do processamento.</text>

  <rect x="20" y="618" width="350" height="104" rx="10" fill="#f3f3f3" stroke="#999999"/>
  <text x="36" y="644" font-family="Arial, sans-serif" font-size="10" font-weight="700">Estado do rascunho</text>
  <text x="36" y="666" font-family="Arial, sans-serif" font-size="9">Nenhuma modalidade selecionada · nenhum relato recebido.</text>
  <text x="36" y="688" font-family="Arial, sans-serif" font-size="9">Ao existir conteúdo, a tela informará onde ele está salvo.</text>
  <text x="36" y="710" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Pausar e manter rascunho</text>
  <text x="350" y="710" text-anchor="end" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Excluir rascunho</text>

  <rect x="20" y="744" width="350" height="44" rx="9" fill="#222222"/>
  <text x="195" y="771" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="700">Escolher uma forma para começar com pouco</text>
  <text x="195" y="814" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Continuar sem compartilhar e sem processamento</text>
</svg>
