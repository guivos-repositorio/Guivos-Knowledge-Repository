<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel da solicitação em análise protegida</title>
  <desc id="desc">Acompanhamento protegido do processo da Rede de Apoio Reservada, com exposição mínima, autoridade especializada, alegação não verificada, prazo, cancelamento e denúncia separados.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao convite</text>
  <text x="20" y="94" font-family="Arial, sans-serif" font-size="21" font-weight="700">Análise protegida</text>
  <text x="20" y="116" font-family="Arial, sans-serif" font-size="9">Rede de Apoio Reservada · acesso individual</text>
  <rect x="20" y="136" width="350" height="101" rx="10" fill="#f7f7f7" stroke="#111111" stroke-dasharray="5 3"/>
  <text x="32" y="157" font-family="Arial, sans-serif" font-size="10" font-weight="700">Estado e proteção</text>
  <text x="32" y="178" font-family="Arial, sans-serif" font-size="14" font-weight="700">Aguardando análise especializada</text>
  <text x="32" y="199" font-family="Arial, sans-serif" font-size="8">Identificador protegido: RAR-2026-0804-0941</text>
  <text x="32" y="219" font-family="Arial, sans-serif" font-size="7">Nenhum vínculo, acesso, lista pública ou contato privado foi criado.</text>
  <rect x="20" y="251" width="350" height="116" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="272" font-family="Arial, sans-serif" font-size="10" font-weight="700">Origem e autoridade</text>
  <text x="32" y="293" font-family="Arial, sans-serif" font-size="8">Remetente: Ana Ribeiro · responsável autorizada</text>
  <text x="32" y="313" font-family="Arial, sans-serif" font-size="8">Análise: equipe especializada identificada no processo protegido</text>
  <text x="32" y="333" font-family="Arial, sans-serif" font-size="8">Estimativa: até 7 dias úteis · sem garantia de decisão</text>
  <text x="32" y="353" font-family="Arial, sans-serif" font-size="7">O remetente não recebe acesso adicional durante a análise.</text>
  <rect x="20" y="381" width="350" height="115" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="402" font-family="Arial, sans-serif" font-size="10" font-weight="700">Dados mínimos enviados</text>
  <text x="32" y="423" font-family="Arial, sans-serif" font-size="8">Nome de exibição, identificador e confirmações de finalidade</text>
  <text x="32" y="443" font-family="Arial, sans-serif" font-size="8">Alegação do remetente: vínculo comunitário prévio · não verificada</text>
  <text x="32" y="463" font-family="Arial, sans-serif" font-size="8">Localização exata, Jornada, contatos e outros vínculos permanecem ocultos.</text>
  <text x="32" y="483" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver ou contestar os dados enviados</text>
  <rect x="20" y="510" width="350" height="98" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="531" font-family="Arial, sans-serif" font-size="10" font-weight="700">Próximos eventos possíveis</text>
  <text x="32" y="552" font-family="Arial, sans-serif" font-size="8">• pedido protegido de informação adicional</text>
  <text x="32" y="572" font-family="Arial, sans-serif" font-size="8">• aprovação, recusa, expiração ou cancelamento</text>
  <text x="32" y="592" font-family="Arial, sans-serif" font-size="7">Toda atualização deverá preservar exposição mínima e finalidade identificada.</text>
  <rect x="20" y="626" width="350" height="44" rx="8" fill="#222222"/>
  <text x="195" y="653" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Atualizar estado protegido</text>
  <rect x="20" y="684" width="169" height="42" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="104" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Cancelar análise</text>
  <rect x="201" y="684" width="169" height="42" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="285" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Denunciar processo</text>
  <text x="195" y="748" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Cancelar ou denunciar não cria exposição pública automática.</text>
  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817" font-weight="700">Eu</text></g>
