<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel do Perfil Público de Coletivo com entrada aberta</title>
  <desc id="desc">Perfil público móvel do Pedal Horizonte, com origem orgânica preservada, propósito, território, entrada aberta, regras, contagem governada, responsáveis, relação institucional, reputação contextual com denominadores e ações separadas de acompanhar e participar.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar aos resultados</text>
  <text x="370" y="57" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Compartilhar perfil</text>
  <rect x="20" y="73" width="350" height="45" rx="9" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="89" font-family="Arial, sans-serif" font-size="7" font-weight="700">ORIGEM DA NAVEGAÇÃO</text>
  <text x="32" y="105" font-family="Arial, sans-serif" font-size="8">Resultado orgânico · busca “ciclismo” · Belo Horizonte · posição 1</text>
  <text x="356" y="105" text-anchor="end" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver origem</text>
  <text x="20" y="151" font-family="Arial, sans-serif" font-size="23" font-weight="700">Pedal Horizonte</text>
  <text x="20" y="171" font-family="Arial, sans-serif" font-size="8">COLETIVO · ATIVO · PÚBLICO</text>
  <rect x="274" y="137" width="96" height="28" rx="14" fill="#f2f2f2" stroke="#777777"/>
  <text x="322" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700">Entrada aberta</text>
  <text x="20" y="202" font-family="Arial, sans-serif" font-size="12" font-weight="700">Pedalar junto, com segurança e pertencimento</text>
  <text x="20" y="220" font-family="Arial, sans-serif" font-size="8">Encontros comunitários para diferentes níveis, sem ranking de desempenho.</text>
  <rect x="20" y="236" width="350" height="58" rx="9" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="254" font-family="Arial, sans-serif" font-size="7" font-weight="700">FUNCIONAMENTO</text>
  <text x="32" y="271" font-family="Arial, sans-serif" font-size="8">Belo Horizonte · presencial · sábados, 7h</text>
  <text x="32" y="286" font-family="Arial, sans-serif" font-size="8">Acessibilidade informada · nível e rota publicados por atividade</text>
  <rect x="20" y="306" width="169" height="42" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="104" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Acompanhar</text>
  <rect x="201" y="306" width="169" height="42" rx="8" fill="#222222"/>
  <text x="285" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Participar</text>
  <text x="20" y="367" font-family="Arial, sans-serif" font-size="7">Acompanhar não concede acesso interno. Participar exige confirmação consciente.</text>
  <rect x="20" y="382" width="350" height="86" rx="10" fill="#f7f7f7" stroke="#777777"/>
  <text x="32" y="402" font-family="Arial, sans-serif" font-size="10" font-weight="700">Antes de participar</text>
  <text x="32" y="421" font-family="Arial, sans-serif" font-size="8">• respeito, segurança e liberdade para pausar ou sair</text>
  <text x="32" y="439" font-family="Arial, sans-serif" font-size="8">• equipamento básico e revisão da rota antes de cada pedal</text>
  <text x="32" y="456" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver regras, dados e significado do vínculo</text>
  <rect x="20" y="480" width="350" height="69" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="500" font-family="Arial, sans-serif" font-size="9" font-weight="700">Pessoas e funcionamento público</text>
  <text x="32" y="518" font-family="Arial, sans-serif" font-size="8">Cerca de 80 participantes confirmados · lista nominal protegida</text>
  <text x="32" y="536" font-family="Arial, sans-serif" font-size="8">Responsável: Marina Alves · moderação identificada</text>
  <rect x="20" y="561" width="350" height="64" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="581" font-family="Arial, sans-serif" font-size="9" font-weight="700">Relação institucional</text>
  <text x="32" y="599" font-family="Arial, sans-serif" font-size="8">Apoio logístico: Instituto Movimento BH</text>
  <text x="32" y="615" font-family="Arial, sans-serif" font-size="7">Apoio não concede autoridade nem acesso automático a dados de participantes.</text>
  <rect x="20" y="637" width="350" height="91" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="657" font-family="Arial, sans-serif" font-size="10" font-weight="700">Experiência dos participantes</text>
  <text x="32" y="675" font-family="Arial, sans-serif" font-size="8">87 avaliações verificadas · últimos 12 meses</text>
  <text x="32" y="692" font-family="Arial, sans-serif" font-size="8">Descrição correspondeu: 91% · 82 respostas</text>
  <text x="32" y="708" font-family="Arial, sans-serif" font-size="8">Respeito e segurança: 94% · 84 respostas</text>
  <text x="32" y="722" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver distribuição, método e limitações</text>
  <text x="20" y="750" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Atividades públicas</text>
  <text x="195" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Proteção e canais públicos</text>
  <text x="370" y="750" text-anchor="end" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Denunciar perfil</text>
  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817" font-weight="700">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817">Eu</text></g>
