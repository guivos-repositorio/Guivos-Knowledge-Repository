<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel da solicitação de participação recusada</title>
  <desc id="desc">Resultado da recusa da solicitação, com autoridade, fundamento proporcional, ausência de vínculo, diferença entre recusa e sanção, revisão aplicável e retorno seguro.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao Perfil Público</text>
  <text x="195" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Solicitação recusada</text>
  <text x="195" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Ciclistas da Serra · decisão em 08/08/2026 às 16:30</text>
  <circle cx="195" cy="181" r="28" fill="#f3f3f3" stroke="#111111"/>
  <path d="M184 170 L206 192 M206 170 L184 192" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="20" y="226" width="350" height="128" rx="10" fill="#f7f7f7" stroke="#777777"/>
  <text x="32" y="247" font-family="Arial, sans-serif" font-size="10" font-weight="700">Decisão e fundamento</text>
  <text x="32" y="268" font-family="Arial, sans-serif" font-size="8">Decisão registrada por Carlos Menezes · autoridade identificada</text>
  <text x="32" y="288" font-family="Arial, sans-serif" font-size="8">Fundamento: nível declarado não corresponde ao requisito desta turma.</text>
  <text x="32" y="308" font-family="Arial, sans-serif" font-size="8">Consequência: esta solicitação foi encerrada sem criar vínculo.</text>
  <text x="32" y="328" font-family="Arial, sans-serif" font-size="7">A recusa não é suspensão, punição, avaliação pública ou nota sobre a pessoa.</text>
  <text x="32" y="346" font-family="Arial, sans-serif" font-size="7">Identificador da decisão: CSR-2026-0808-1630-R.</text>
  <rect x="20" y="368" width="350" height="119" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="389" font-family="Arial, sans-serif" font-size="10" font-weight="700">Revisão e proteção</text>
  <text x="32" y="410" font-family="Arial, sans-serif" font-size="8">A regra aplicável deverá informar se há revisão, prazo e autoridade.</text>
  <text x="32" y="430" font-family="Arial, sans-serif" font-size="8">Uma revisão não poderá exigir dados sem finalidade proporcional.</text>
  <text x="32" y="450" font-family="Arial, sans-serif" font-size="8">Denúncia de abuso permanece separada da revisão da decisão.</text>
  <text x="32" y="471" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver fundamento, dados considerados e regra aplicável</text>
  <rect x="20" y="501" width="350" height="101" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="522" font-family="Arial, sans-serif" font-size="10" font-weight="700">Participar no futuro</text>
  <text x="32" y="543" font-family="Arial, sans-serif" font-size="8">Nova solicitação dependerá das condições atuais e de nova revisão.</text>
  <text x="32" y="563" font-family="Arial, sans-serif" font-size="8">Dados anteriores não serão reutilizados como confirmação automática.</text>
  <text x="32" y="583" font-family="Arial, sans-serif" font-size="7">A recusa não concede contato privado com o responsável.</text>
  <rect x="20" y="625" width="350" height="46" rx="8" fill="#222222"/>
  <text x="195" y="653" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Voltar ao Perfil Público</text>
  <rect x="20" y="685" width="169" height="43" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="104" y="712" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Salvar decisão</text>
  <rect x="201" y="685" width="169" height="43" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="285" y="712" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Denunciar abuso</text>
  <text x="195" y="748" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">A revisão formal será materializada somente quando autorizada.</text>
  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817" font-weight="700">Eu</text></g>
  <g fill="none" stroke="#555555"><circle cx="39" cy="796" r="8"/><rect x="109" y="788" width="16" height="16"/><circle cx="195" cy="796" r="8"/><path d="M265 804 L273 788 L281 804 Z"/><circle cx="351" cy="794" r="6" fill="#222222"/><path d="M342 807 Q351 799 360 807"/></g>
</svg>
