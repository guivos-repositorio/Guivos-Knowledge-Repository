<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Atribuição candidata e autorrelato do Opportunity Boost para computador</title>
  <desc id="desc">Wireframe de baixa fidelidade mostrando proveniência, janela candidata, origens separadas, autorrelato e limitações de interpretação.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="1022" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="220" height="1024" fill="#f4f4f4" stroke="#999999"/>
  <text x="32" y="48" font-family="Arial" font-size="22" font-weight="700">GUIVOS</text>
  <text x="32" y="112" font-family="Arial" font-size="14">Opportunity Boost</text>
  <text x="32" y="154" font-family="Arial" font-size="14">Relatório geral</text>
  <text x="32" y="196" font-family="Arial" font-size="14" font-weight="700">Atribuição e origem</text>
  <text x="32" y="238" font-family="Arial" font-size="14">Histórico</text>

  <text x="260" y="48" font-family="Arial" font-size="11">RELATÓRIO › ATRIBUIÇÃO CANDIDATA E AUTORRELATO</text>
  <text x="260" y="86" font-family="Arial" font-size="28" font-weight="700">Como os dados foram relacionados</text>
  <rect x="1160" y="46" width="240" height="48" rx="8" fill="#f3f3f3" stroke="#222222"/>
  <text x="1280" y="76" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">ASSOCIAÇÃO CANDIDATA</text>
  <text x="260" y="122" font-family="Arial" font-size="12">Período consultado: 05/08/2026 a 10/08/2026 · regra candidata sujeita a validação especializada</text>

  <rect x="260" y="150" width="1140" height="92" rx="10" fill="#f3f3f3" stroke="#444444"/>
  <text x="286" y="180" font-family="Arial" font-size="14" font-weight="700">Atribuição candidata não é prova de causa</text>
  <text x="286" y="208" font-family="Arial" font-size="11">O relatório indica compatibilidade temporal e técnica. Ele não afirma que a campanha causou inscrição, participação, contratação ou impacto.</text>

  <rect x="260" y="270" width="720" height="294" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="304" font-family="Arial" font-size="16" font-weight="700">Eventos compatíveis com a janela</text>
  <text x="286" y="336" font-family="Arial" font-size="11">Janela candidata: até 7 dias após clique válido · visualização isolada não atribui evento</text>
  <line x1="286" y1="358" x2="950" y2="358" stroke="#999999"/>
  <text x="286" y="390" font-family="Arial" font-size="11" font-weight="700">Evento</text>
  <text x="530" y="390" font-family="Arial" font-size="11" font-weight="700">Origem preservada</text>
  <text x="750" y="390" font-family="Arial" font-size="11" font-weight="700">Estado</text>
  <text x="286" y="426" font-family="Arial" font-size="11">Início de inscrição</text>
  <text x="530" y="426" font-family="Arial" font-size="11">patrocinada</text>
  <text x="750" y="426" font-family="Arial" font-size="11">compatível</text>
  <text x="286" y="460" font-family="Arial" font-size="11">Salvamento</text>
  <text x="530" y="460" font-family="Arial" font-size="11">orgânica</text>
  <text x="750" y="460" font-family="Arial" font-size="11">preservada como orgânica</text>
  <text x="286" y="494" font-family="Arial" font-size="11">Declaração de interesse</text>
  <text x="530" y="494" font-family="Arial" font-size="11">indeterminada</text>
  <text x="750" y="494" font-family="Arial" font-size="11">base insuficiente</text>
  <text x="286" y="536" font-family="Arial" font-size="10">Um mesmo evento não recebe origem orgânica e patrocinada simultaneamente sem regra explícita.</text>

  <rect x="1010" y="270" width="390" height="294" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="1036" y="304" font-family="Arial" font-size="16" font-weight="700">Proveniência</text>
  <text x="1036" y="342" font-family="Arial" font-size="12">Instrumentado</text>
  <text x="1036" y="366" font-family="Arial" font-size="10">evento técnico registrado</text>
  <text x="1036" y="404" font-family="Arial" font-size="12">Calculado</text>
  <text x="1036" y="428" font-family="Arial" font-size="10">valor derivado de regra declarada</text>
  <text x="1036" y="466" font-family="Arial" font-size="12">Declarado pelo anunciante</text>
  <text x="1036" y="490" font-family="Arial" font-size="10">informação não instrumentada</text>
  <text x="1036" y="528" font-family="Arial" font-size="12">Não disponível</text>
  <text x="1036" y="552" font-family="Arial" font-size="10">sem cobertura ou base suficiente</text>

  <rect x="260" y="594" width="720" height="248" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="628" font-family="Arial" font-size="16" font-weight="700">Autorrelato do anunciante</text>
  <text x="286" y="660" font-family="Arial" font-size="10">Conteúdo declarado · não validado automaticamente pela Guivos</text>
  <rect x="286" y="684" width="668" height="76" rx="8" fill="#f8f8f8" stroke="#999999"/>
  <text x="308" y="714" font-family="Arial" font-size="11">“Quatro participantes informaram ter conhecido a atividade pela campanha.”</text>
  <text x="308" y="742" font-family="Arial" font-size="10">Responsável: Coletivo Horizonte · declarado em 10/08/2026</text>
  <text x="286" y="798" font-family="Arial" font-size="11">Este autorrelato não é somado aos cinco eventos tecnicamente compatíveis.</text>

  <rect x="1010" y="594" width="390" height="248" rx="10" fill="#f3f3f3" stroke="#444444"/>
  <text x="1036" y="628" font-family="Arial" font-size="16" font-weight="700">Limitações conhecidas</text>
  <text x="1036" y="666" font-family="Arial" font-size="11">• cobertura de conclusão indisponível;</text>
  <text x="1036" y="696" font-family="Arial" font-size="11">• integração externa não conectada;</text>
  <text x="1036" y="726" font-family="Arial" font-size="11">• origem indeterminada preservada;</text>
  <text x="1036" y="756" font-family="Arial" font-size="11">• impacto humano não inferido;</text>
  <text x="1036" y="786" font-family="Arial" font-size="11">• nenhuma lista individual disponível.</text>

  <rect x="260" y="872" width="1140" height="64" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="900" font-family="Arial" font-size="11">Histórico de regras e atualizações permanece acessível. Alterar a regra futura não reescreve silenciosamente relatórios anteriores.</text>
  <text x="286" y="922" font-family="Arial" font-size="10">Baixa fidelidade · política final de atribuição ainda não definida.</text>
</svg>