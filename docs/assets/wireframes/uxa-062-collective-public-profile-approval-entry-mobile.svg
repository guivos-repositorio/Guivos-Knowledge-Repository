<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel do Perfil Público de Coletivo com entrada mediante aprovação</title>
  <desc id="desc">Perfil público móvel do Ciclistas da Serra com origem orgânica, participação mediante aprovação, critérios e prazo explicados, reputação com amostra insuficiente e ações separadas de acompanhar e solicitar participação.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar aos resultados</text>
  <text x="370" y="57" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Compartilhar perfil</text>
  <rect x="20" y="73" width="350" height="45" rx="9" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="89" font-family="Arial, sans-serif" font-size="7" font-weight="700">ORIGEM DA NAVEGAÇÃO</text>
  <text x="32" y="105" font-family="Arial, sans-serif" font-size="8">Resultado orgânico · busca “ciclismo” · Região Metropolitana · posição 2</text>
  <text x="356" y="105" text-anchor="end" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver origem</text>
  <text x="20" y="151" font-family="Arial, sans-serif" font-size="23" font-weight="700">Ciclistas da Serra</text>
  <text x="20" y="171" font-family="Arial, sans-serif" font-size="8">COLETIVO · ATIVO · PÚBLICO COM APROVAÇÃO</text>
  <rect x="252" y="137" width="118" height="28" rx="14" fill="#f2f2f2" stroke="#777777"/>
  <text x="311" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700">Aprovação necessária</text>
  <text x="20" y="202" font-family="Arial, sans-serif" font-size="12" font-weight="700">Ciclismo de estrada com preparação e segurança</text>
  <text x="20" y="220" font-family="Arial, sans-serif" font-size="8">Treinos híbridos, orientação de nível e participação responsável.</text>
  <rect x="20" y="236" width="350" height="58" rx="9" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="254" font-family="Arial, sans-serif" font-size="7" font-weight="700">FUNCIONAMENTO</text>
  <text x="32" y="271" font-family="Arial, sans-serif" font-size="8">Região Metropolitana · híbrido · encontros quinzenais</text>
  <text x="32" y="286" font-family="Arial, sans-serif" font-size="8">Acessibilidade parcial · requisitos variam por atividade</text>
  <rect x="20" y="306" width="169" height="42" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="104" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Acompanhar</text>
  <rect x="201" y="306" width="169" height="42" rx="8" fill="#222222"/>
  <text x="285" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Solicitar participação</text>
  <text x="20" y="367" font-family="Arial, sans-serif" font-size="7">Só serão enviados dados revisados; a solicitação ainda não cria vínculo.</text>
  <rect x="20" y="382" width="350" height="122" rx="10" fill="#f7f7f7" stroke="#777777"/>
  <text x="32" y="402" font-family="Arial, sans-serif" font-size="10" font-weight="700">Como funciona a aprovação</text>
  <text x="32" y="421" font-family="Arial, sans-serif" font-size="8">• critérios: nível informado, segurança e concordância com regras</text>
  <text x="32" y="439" font-family="Arial, sans-serif" font-size="8">• dados necessários: experiência declarada e disponibilidade</text>
  <text x="32" y="457" font-family="Arial, sans-serif" font-size="8">• análise: responsáveis autorizados · estimativa de até 5 dias úteis</text>
  <text x="32" y="475" font-family="Arial, sans-serif" font-size="7">Prazo estimado, sem garantia. A solicitação poderá ser cancelada.</text>
  <text x="32" y="493" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver critérios, regras e dados antes de solicitar</text>
  <rect x="20" y="516" width="350" height="69" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="536" font-family="Arial, sans-serif" font-size="9" font-weight="700">Pessoas e responsabilidade</text>
  <text x="32" y="554" font-family="Arial, sans-serif" font-size="8">Faixa aproximada: 30 a 50 participantes · lista protegida</text>
  <text x="32" y="572" font-family="Arial, sans-serif" font-size="8">Responsável pela análise: Carlos Menezes · papel identificado</text>
  <rect x="20" y="597" width="350" height="64" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="617" font-family="Arial, sans-serif" font-size="9" font-weight="700">Relação institucional</text>
  <text x="32" y="635" font-family="Arial, sans-serif" font-size="8">Apoio de espaço: Serra Ciclismo</text>
  <text x="32" y="651" font-family="Arial, sans-serif" font-size="7">A Organização não recebe solicitações nem dados pessoais automaticamente.</text>
  <rect x="20" y="673" width="350" height="62" rx="10" fill="#ffffff" stroke="#777777" stroke-dasharray="4 3"/>
  <text x="32" y="693" font-family="Arial, sans-serif" font-size="9" font-weight="700">Experiência dos participantes</text>
  <text x="32" y="711" font-family="Arial, sans-serif" font-size="8">Ainda não há avaliações verificadas suficientes para resumo público.</text>
  <text x="32" y="727" font-family="Arial, sans-serif" font-size="7">Isso não indica experiência positiva, negativa ou inexistente.</text>
  <text x="20" y="750" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Atividades públicas</text>
  <text x="195" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Proteção e canais públicos</text>
  <text x="370" y="750" text-anchor="end" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Denunciar perfil</text>
  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817" font-weight="700">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817">Eu</text></g>
  <g fill="none" stroke="#555555"><circle cx="39" cy="796" r="8"/><rect x="109" y="788" width="16" height="16"/><circle cx="195" cy="796" r="8" fill="#222222"/><path d="M265 804 L273 788 L281 804 Z"/><circle cx="351" cy="794" r="6"/><path d="M342 807 Q351 799 360 807"/></g>
</svg>
