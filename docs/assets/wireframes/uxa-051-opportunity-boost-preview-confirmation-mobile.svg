<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Prévia e confirmação móveis do Opportunity Boost</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade com etapa quatro de cinco, primeiro resultado orgânico, espaço patrocinado, resumo e confirmações inicialmente desmarcadas.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text>
  <text x="20" y="59" font-family="Arial" font-size="10">OPPORTUNITY BOOST · CONFIGURAÇÃO MÓVEL</text>
  <text x="20" y="88" font-family="Arial" font-size="19" font-weight="700">Prévia e confirmação</text>
  <text x="350" y="87" text-anchor="end" font-family="Arial" font-size="10">ETAPA 4 DE 5</text>
  <line x1="20" y1="102" x2="300" y2="102" stroke="#111111" stroke-width="4"/>
  <line x1="304" y1="102" x2="370" y2="102" stroke="#cccccc" stroke-width="4"/>

  <rect x="20" y="120" width="350" height="52" rx="8" fill="#f3f3f3" stroke="#555555"/>
  <text x="34" y="143" font-family="Arial" font-size="10" font-weight="700">Prévia da Lista · BST-2026-081</text>
  <text x="34" y="161" font-family="Arial" font-size="8">Posição ilustrativa. Não representa ranking orgânico comprado.</text>

  <text x="20" y="202" font-family="Arial" font-size="11" font-weight="700">1º resultado orgânico</text>
  <rect x="20" y="214" width="350" height="86" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="238" font-family="Arial" font-size="10" font-weight="700">Oficina gratuita de programação</text>
  <text x="34" y="258" font-family="Arial" font-size="9">Coletivo Código Aberto · Belo Horizonte</text>
  <text x="34" y="278" font-family="Arial" font-size="9">Resultado orgânico · critérios da consulta</text>
  <text x="34" y="294" font-family="Arial" font-size="8">Pagamento não altera esta posição.</text>

  <text x="20" y="330" font-family="Arial" font-size="11" font-weight="700">Espaço patrocinado identificado</text>
  <rect x="20" y="342" width="350" height="132" rx="8" fill="#f3f3f3" stroke="#444444" stroke-width="2"/>
  <text x="34" y="365" font-family="Arial" font-size="9" font-weight="700">PATROCINADO</text>
  <text x="34" y="389" font-family="Arial" font-size="11" font-weight="700">Formação de jovens em tecnologia</text>
  <text x="34" y="410" font-family="Arial" font-size="9">Instituto Horizonte · gratuita · presencial</text>
  <text x="34" y="431" font-family="Arial" font-size="9">05/08 a 14/08 · capacidade declarada limitada</text>
  <text x="34" y="452" font-family="Arial" font-size="9" text-decoration="underline">Por que estou vendo isto?</text>
  <text x="222" y="452" font-family="Arial" font-size="9" text-decoration="underline">Ocultar</text>
  <text x="310" y="452" font-family="Arial" font-size="9" text-decoration="underline">Denunciar</text>

  <rect x="20" y="490" width="350" height="82" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="514" font-family="Arial" font-size="10" font-weight="700">Resumo da campanha</text>
  <text x="34" y="535" font-family="Arial" font-size="9">Clique válido · CPC · R$ 300,00 · 05/08 a 14/08</text>
  <text x="34" y="555" font-family="Arial" font-size="9">Região, categoria e modalidade escolhidas</text>
  <text x="338" y="555" text-anchor="end" font-family="Arial" font-size="9" text-decoration="underline">Abrir</text>

  <rect x="20" y="588" width="350" height="108" rx="8" fill="#ffffff" stroke="#555555"/>
  <text x="34" y="612" font-family="Arial" font-size="10" font-weight="700">Confirmações obrigatórias</text>
  <rect x="34" y="628" width="12" height="12" fill="#ffffff" stroke="#111111"/>
  <text x="56" y="638" font-family="Arial" font-size="9">Orçamento e estimativa não garantem resultado.</text>
  <rect x="34" y="652" width="12" height="12" fill="#ffffff" stroke="#111111"/>
  <text x="56" y="662" font-family="Arial" font-size="9">Pagamento não altera ranking ou relevância orgânica.</text>
  <rect x="34" y="676" width="12" height="12" fill="#ffffff" stroke="#111111"/>
  <text x="56" y="686" font-family="Arial" font-size="9">Informações, capacidade e responsabilidades foram revisadas.</text>

  <rect x="20" y="714" width="350" height="48" rx="8" fill="#dddddd" stroke="#777777"/>
  <text x="195" y="743" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700">ENVIAR PARA AVALIAÇÃO · INDISPONÍVEL</text>
  <text x="20" y="786" font-family="Arial" font-size="9" text-decoration="underline">Voltar ao orçamento</text>
  <text x="370" y="786" text-anchor="end" font-family="Arial" font-size="9">3 confirmações pendentes</text>
  <text x="20" y="815" font-family="Arial" font-size="8">Confirmações começam desmarcadas. Envio não inicia entrega.</text>
  <text x="20" y="832" font-family="Arial" font-size="8">Critérios protegidos permanecem excluídos da campanha.</text>
</svg>