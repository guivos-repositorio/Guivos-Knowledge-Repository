<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Processamento temporário visível e interrompível</title>
  <desc id="desc">Wireframe móvel reformulado que mostra finalidade, itens autorizados, estados textuais das operações e ações que interrompem e descartam o resultado parcial sem tarefa oculta.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial, sans-serif" font-size="16" font-weight="700">GUIVOS</text>
  <text x="370" y="34" text-anchor="end" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Ajuda e controles</text>
  <line x1="16" y1="50" x2="374" y2="50" stroke="#cccccc"/>

  <text x="20" y="80" font-family="Arial, sans-serif" font-size="10" fill="#555555">COMPREENSÃO INICIAL · PROCESSAMENTO TEMPORÁRIO</text>
  <text x="20" y="112" font-family="Arial, sans-serif" font-size="19" font-weight="700">Preparando uma hipótese revisável</text>
  <text x="20" y="136" font-family="Arial, sans-serif" font-size="9">Nada foi persistido ou usado para personalizar.</text>

  <rect x="20" y="158" width="350" height="92" rx="10" fill="#f3f3f3" stroke="#777777"/>
  <text x="36" y="182" font-family="Arial, sans-serif" font-size="11" font-weight="700">Finalidade e efeito da interrupção</text>
  <text x="36" y="204" font-family="Arial, sans-serif" font-size="9">Usar somente itens revisados e autorizados para preparar</text>
  <text x="36" y="222" font-family="Arial, sans-serif" font-size="9">uma hipótese temporária. Interromper descarta o resultado parcial.</text>
  <text x="36" y="240" font-family="Arial, sans-serif" font-size="8">Os conteúdos de origem seguem conforme seus controles anteriores.</text>

  <text x="20" y="280" font-family="Arial, sans-serif" font-size="12" font-weight="700">Escopo atual · 1 item autorizado</text>
  <rect x="20" y="294" width="350" height="98" rx="9" fill="#ffffff" stroke="#999999"/>
  <text x="36" y="318" font-family="Arial, sans-serif" font-size="10" font-weight="700">T1 · Texto autorizado</text>
  <text x="36" y="338" font-family="Arial, sans-serif" font-size="9">“Quero organizar minha transição profissional...”</text>
  <text x="36" y="360" font-family="Arial, sans-serif" font-size="8">Origem: relato revisado · Finalidade: compreensão inicial</text>
  <text x="36" y="382" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Abrir inventário completo</text>

  <rect x="20" y="406" width="350" height="70" rx="9" fill="#ffffff" stroke="#999999"/>
  <text x="36" y="430" font-family="Arial, sans-serif" font-size="10" font-weight="700">Fora do processamento</text>
  <text x="36" y="452" font-family="Arial, sans-serif" font-size="9">Arquivo não autorizado · resposta removida</text>
  <text x="36" y="468" font-family="Arial, sans-serif" font-size="8">Não serão usados nem analisados nesta hipótese.</text>

  <text x="20" y="510" font-family="Arial, sans-serif" font-size="12" font-weight="700">Estado das operações</text>
  <rect x="20" y="524" width="350" height="126" rx="9" fill="#f7f7f7" stroke="#999999"/>
  <text x="36" y="548" font-family="Arial, sans-serif" font-size="9">Concluído · organizar informações relacionadas</text>
  <text x="36" y="572" font-family="Arial, sans-serif" font-size="9">Em andamento · distinguir relato e interpretação</text>
  <text x="36" y="596" font-family="Arial, sans-serif" font-size="9">Aguardando · registrar lacunas e incertezas</text>
  <text x="36" y="620" font-family="Arial, sans-serif" font-size="9">Aguardando · preparar hipótese para revisão</text>
  <text x="36" y="640" font-family="Arial, sans-serif" font-size="8">Sem percentual de evolução, diagnóstico ou pontuação secreta.</text>

  <rect x="20" y="674" width="350" height="48" rx="9" fill="#222222"/>
  <text x="195" y="704" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="700">Interromper e descartar resultado parcial</text>
  <text x="195" y="748" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Interromper e revisar conteúdos e autorizações</text>
  <text x="195" y="780" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Interromper e explorar sem personalização</text>
  <text x="195" y="816" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Nenhuma tarefa continuará silenciosamente em segundo plano.</text>
</svg>
