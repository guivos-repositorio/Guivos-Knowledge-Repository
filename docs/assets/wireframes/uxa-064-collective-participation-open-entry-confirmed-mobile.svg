<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel da participação confirmada por entrada aberta</title>
  <desc id="desc">Confirmação imediata da participação no Pedal Horizonte, com efeitos do vínculo, visibilidade inicial oculta, notificações, ausência de função automática, registro da confirmação e caminhos para abrir o Coletivo ou voltar ao perfil.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao perfil</text>
  <text x="195" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Participação confirmada</text>
  <text x="195" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Pedal Horizonte · entrada aberta</text>
  <circle cx="195" cy="181" r="28" fill="#f3f3f3" stroke="#111111"/>
  <path d="M182 181 L191 190 L209 171" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="20" y="226" width="350" height="103" rx="10" fill="#f7f7f7" stroke="#777777"/>
  <text x="32" y="247" font-family="Arial, sans-serif" font-size="10" font-weight="700">O que mudou agora</text>
  <text x="32" y="267" font-family="Arial, sans-serif" font-size="8">• vínculo ativo como participante confirmado</text>
  <text x="32" y="286" font-family="Arial, sans-serif" font-size="8">• acesso ao ambiente interno conforme permissões do Coletivo</text>
  <text x="32" y="305" font-family="Arial, sans-serif" font-size="8">• entrada registrada em 04/08/2026 às 09:41</text>
  <text x="32" y="321" font-family="Arial, sans-serif" font-size="7">A confirmação não cria função, autoridade ou obrigação de presença.</text>
  <rect x="20" y="343" width="350" height="111" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="364" font-family="Arial, sans-serif" font-size="10" font-weight="700">Privacidade e comunicação</text>
  <text x="32" y="384" font-family="Arial, sans-serif" font-size="8">Lista nominal: não aparecer · estado inicial confirmado</text>
  <text x="32" y="403" font-family="Arial, sans-serif" font-size="8">Notificações: nenhuma categoria ativada automaticamente</text>
  <text x="32" y="422" font-family="Arial, sans-serif" font-size="8">Contato privado: não autorizado</text>
  <text x="32" y="441" font-family="Arial, sans-serif" font-size="7">Comunicação comercial continua sem confirmação separada.</text>
  <rect x="20" y="468" width="350" height="91" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="489" font-family="Arial, sans-serif" font-size="10" font-weight="700">Controles do vínculo</text>
  <text x="32" y="509" font-family="Arial, sans-serif" font-size="8">Visibilidade e notificações poderão ser revisadas em controle próprio.</text>
  <text x="32" y="528" font-family="Arial, sans-serif" font-size="8">Pausa e saída exigirão revisão das consequências antes da confirmação.</text>
  <text x="32" y="547" font-family="Arial, sans-serif" font-size="7">Mudanças materiais de regras exigirão nova revisão consciente.</text>
  <rect x="20" y="584" width="350" height="46" rx="8" fill="#222222"/>
  <text x="195" y="612" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Abrir Coletivo</text>
  <rect x="20" y="644" width="350" height="43" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="195" y="671" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Voltar ao Perfil Público</text>
  <text x="195" y="711" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Abrir o ambiente interno não altera suas escolhas atuais.</text>
  <text x="195" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Identificador: PH-2026-0804-0941</text>
  <text x="195" y="749" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Salvar confirmação</text>
  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817">Eu</text></g>
  <g fill="none" stroke="#555555"><circle cx="39" cy="796" r="8"/><rect x="109" y="788" width="16" height="16"/><circle cx="195" cy="796" r="8"/><path d="M265 804 L273 788 L281 804 Z"/><circle cx="351" cy="794" r="6"/><path d="M342 807 Q351 799 360 807"/></g>
</svg>
