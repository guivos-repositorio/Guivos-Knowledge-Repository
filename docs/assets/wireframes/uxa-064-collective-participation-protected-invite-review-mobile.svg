<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel da revisão protegida de convite para participação</title>
  <desc id="desc">Revisão protegida do convite da Rede de Apoio Reservada, com remetente e autoridade, motivo, validade, alegação não verificada, dados mínimos, condições de confidencialidade, recusa e confirmações inicialmente vazias antes do envio para análise.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao convite</text>
  <text x="370" y="57" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Fechar revisão</text>
  <text x="20" y="94" font-family="Arial, sans-serif" font-size="20" font-weight="700">Revisar convite protegido</text>
  <text x="20" y="116" font-family="Arial, sans-serif" font-size="9">Rede de Apoio Reservada · acesso individual</text>
  <rect x="20" y="136" width="350" height="102" rx="10" fill="#f7f7f7" stroke="#111111" stroke-dasharray="5 3"/>
  <text x="32" y="156" font-family="Arial, sans-serif" font-size="10" font-weight="700">Origem e autoridade</text>
  <text x="32" y="176" font-family="Arial, sans-serif" font-size="8">Remetente: Ana Ribeiro · responsável autorizada</text>
  <text x="32" y="195" font-family="Arial, sans-serif" font-size="8">Motivo: convite para processo protegido de apoio comunitário</text>
  <text x="32" y="214" font-family="Arial, sans-serif" font-size="8">Validade: até 10/08/2026 · não encaminhável</text>
  <text x="32" y="230" font-family="Arial, sans-serif" font-size="7">O convite não comprova elegibilidade nem cria participação automática.</text>
  <rect x="20" y="251" width="350" height="121" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="271" font-family="Arial, sans-serif" font-size="10" font-weight="700">Dados mínimos para revisão</text>
  <text x="32" y="290" font-family="Arial, sans-serif" font-size="8">• nome de exibição e identificador do convite</text>
  <text x="32" y="309" font-family="Arial, sans-serif" font-size="8">• alegação do remetente, não verificada: vínculo comunitário prévio</text>
  <text x="32" y="328" font-family="Arial, sans-serif" font-size="8">• confirmações de confidencialidade, proteção e finalidade</text>
  <text x="32" y="347" font-family="Arial, sans-serif" font-size="7">Localização exata, Jornada, contatos e outros vínculos permanecem ocultos.</text>
  <text x="32" y="363" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Revisar ou contestar a alegação antes do envio</text>
  <rect x="20" y="385" width="350" height="103" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="405" font-family="Arial, sans-serif" font-size="10" font-weight="700">Proteção e consequências</text>
  <text x="32" y="424" font-family="Arial, sans-serif" font-size="8">A análise será especializada e poderá solicitar informação adicional.</text>
  <text x="32" y="443" font-family="Arial, sans-serif" font-size="8">Recusar ou denunciar não cria penalidade automática nem exposição pública.</text>
  <text x="32" y="462" font-family="Arial, sans-serif" font-size="8">Compartilhamento externo e contato privado permanecem bloqueados.</text>
  <text x="32" y="480" font-family="Arial, sans-serif" font-size="7">Confidencialidade depende das condições apresentadas; não é garantia absoluta.</text>
  <rect x="20" y="500" width="350" height="139" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="520" font-family="Arial, sans-serif" font-size="10" font-weight="700">Confirmações necessárias</text>
  <rect x="32" y="537" width="14" height="14" fill="#ffffff" stroke="#111111"/>
  <text x="55" y="548" font-family="Arial, sans-serif" font-size="8">Revisei remetente, autoridade, motivo e validade.</text>
  <rect x="32" y="568" width="14" height="14" fill="#ffffff" stroke="#111111"/>
  <text x="55" y="579" font-family="Arial, sans-serif" font-size="8">Compreendi as condições, a recusa e a ausência de vínculo.</text>
  <rect x="32" y="599" width="14" height="14" fill="#ffffff" stroke="#111111"/>
  <text x="55" y="610" font-family="Arial, sans-serif" font-size="8">Confirmo que desejo enviar somente os dados mínimos descritos.</text>
  <text x="32" y="631" font-family="Arial, sans-serif" font-size="7">Nenhuma confirmação começa selecionada.</text>
  <rect x="20" y="652" width="350" height="44" rx="8" fill="#eeeeee" stroke="#999999"/>
  <text x="195" y="679" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#555555" font-weight="700">Enviar dados mínimos para análise</text>
  <rect x="20" y="708" width="169" height="40" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="104" y="733" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Recusar convite</text>
  <rect x="201" y="708" width="169" height="40" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="285" y="733" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Denunciar convite</text>
  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817">Eu</text></g>
  <g fill="none" stroke="#555555"><circle cx="39" cy="796" r="8"/><rect x="109" y="788" width="16" height="16"/><circle cx="195" cy="796" r="8"/><path d="M265 804 L273 788 L281 804 Z"/><circle cx="351" cy="794" r="6"/><path d="M342 807 Q351 799 360 807"/></g>
</svg>
