  <text x="286" y="846" font-family="Arial, sans-serif" font-size="10">A ação preserva resultados orgânicos.</text>

  <text x="560" y="238" font-family="Arial, sans-serif" font-size="12">8 oportunidades orgânicas · 1 patrocinada exibida · 4 filtros</text>
  <text x="1190" y="238" font-family="Arial, sans-serif" font-size="11">Ordenação orgânica: busca e filtros</text>

  <rect x="560" y="262" width="840" height="174" rx="10" fill="#ffffff" stroke="#777777"/>
