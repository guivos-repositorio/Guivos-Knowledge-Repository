  <text x="586" y="590" font-family="Arial, sans-serif" font-size="21" font-weight="700">Formação gratuita em gestão comunitária</text>
  <text x="586" y="624" font-family="Arial, sans-serif" font-size="12">Online · Gratuita · 18 vagas · região geral</text>
  <text x="586" y="656" font-family="Arial, sans-serif" font-size="11">Pagamento amplia distribuição; não altera correspondência, ordem ou recomendação.</text>
  <text x="586" y="690" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Por que estou vendo isto?</text>
  <text x="850" y="690" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Ocultar na Lista e no Mapa</text>
  <text x="1100" y="690" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Mais controles</text>
  <text x="1360" y="690" text-anchor="end" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Abrir oportunidade</text>

  <rect x="560" y="750" width="840" height="128" rx="10" fill="#ffffff" stroke="#999999"/>
  <text x="586" y="782" font-family="Arial, sans-serif" font-size="14" font-weight="700">Próximos resultados orgânicos</text>
  <text x="586" y="816" font-family="Arial, sans-serif" font-size="11">A unidade paga não reinicia a consulta nem ocupa posição orgânica.</text>
  <text x="586" y="844" font-family="Arial, sans-serif" font-size="11">Ocultar ou desativar patrocinados preserva as 8 oportunidades orgânicas e os filtros.</text>
  <text x="260" y="954" font-family="Arial, sans-serif" font-size="11">Baixa fidelidade · ocultar, preferências, denunciar e contestar permanecem ações distintas.</text>
