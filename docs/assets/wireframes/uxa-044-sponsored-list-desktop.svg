  <text x="586" y="364" font-family="Arial, sans-serif" font-size="12">Organização Exemplo · Presencial · Gratuita · acessibilidade confirmada</text>
  <text x="586" y="398" font-family="Arial, sans-serif" font-size="11">Busca, região e filtros · relação comercial: sem patrocínio</text>
  <text x="1334" y="408" text-anchor="end" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Por que aparece aqui?</text>

  <text x="560" y="470" font-family="Arial, sans-serif" font-size="11" font-weight="700">INVENTÁRIO PUBLICITÁRIO SEPARADO DA LISTA ORGÂNICA</text>
