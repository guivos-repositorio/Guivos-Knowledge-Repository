<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Revisar e desfazer preferências publicitárias</title><desc id="desc">A pessoa visualiza escolhas anteriores, seus escopos e ações de reversão independentes.</desc><rect width="390" height="844" fill="#fff"/><rect x="1" y="1" width="388" height="842" fill="none" stroke="#111" stroke-width="2"/><text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text><text x="20" y="60" font-family="Arial" font-size="10">PREFERÊNCIAS PUBLICITÁRIAS</text><text x="20" y="94" font-family="Arial" font-size="19" font-weight="700">Revisar escolhas</text><rect x="20" y="116" width="350" height="82" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="144" font-family="Arial" font-size="10" font-weight="700">Catálogo orgânico: sempre preservado</text><text x="34" y="168" font-family="Arial" font-size="9">As escolhas abaixo afetam somente publicidade.</text><text x="34" y="188" font-family="Arial" font-size="8">Nenhuma preferência é compartilhada com anunciantes.</text><rect x="20" y="220" width="350" height="126" rx="8" fill="#fff" stroke="#555"/><text x="34" y="248" font-family="Arial" font-size="10" font-weight="700">Campanha oculta</text><text x="34" y="274" font-family="Arial" font-size="9">BST-2026-081 · oculta na Lista e no Mapa</text><text x="34" y="300" font-family="Arial" font-size="8">Aplicada em 03/08/2026 · reversível</text><text x="338" y="326" text-anchor="end" font-family="Arial" font-size="9" text-decoration="underline">Revisar reversão</text><rect x="20" y="366" width="350" height="126" rx="8" fill="#fff" stroke="#555"/><text x="34" y="394" font-family="Arial" font-size="10" font-weight="700">Mostrar menos deste tipo</text><text x="34" y="420" font-family="Arial" font-size="9">Cursos presenciais de tecnologia</text><text x="34" y="446" font-family="Arial" font-size="8">Preferência geral, sem remoção orgânica</text><text x="338" y="472" text-anchor="end" font-family="Arial" font-size="9" text-decoration="underline">Revisar reversão</text><rect x="20" y="512" width="350" height="126" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="540" font-family="Arial" font-size="10" font-weight="700">Patrocinados desativados</text><text x="34" y="566" font-family="Arial" font-size="9">Explorar, Lista e Mapa</text><text x="34" y="592" font-family="Arial" font-size="8">Estado atual: desativado · reversível</text><text x="338" y="618" text-anchor="end" font-family="Arial" font-size="9" text-decoration="underline">Revisar reativação</text><rect x="20" y="662" width="350" height="92" rx="8" fill="#fff" stroke="#777"/><text x="34" y="690" font-family="Arial" font-size="9">Cada reversão exige revisão e confirmação próprias.</text><text x="34" y="714" font-family="Arial" font-size="9">Reativar não restaura campanhas expiradas ou inelegíveis.</text><text x="34" y="738" font-family="Arial" font-size="8">Denúncias e contestações não aparecem como preferências.</text><text x="20" y="814" font-family="Arial" font-size="8">Estado residual materializado; validação funcional pendente.</text></svg>