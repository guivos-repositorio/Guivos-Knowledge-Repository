<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel da solicitação de participação expirada</title>
  <desc id="desc">Resultado da expiração da solicitação, com regra temporal, ausência de decisão e vínculo, tratamento dos dados, diferença entre expiração e recusa e possibilidade de reiniciar conscientemente.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao Perfil Público</text>
  <text x="195" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Solicitação expirada</text>
  <text x="195" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Ciclistas da Serra · encerrada em 12/08/2026 às 23:59</text>
  <circle cx="195" cy="181" r="28" fill="#f3f3f3" stroke="#111111"/>
  <circle cx="195" cy="181" r="15" fill="none" stroke="#111111"/>
  <path d="M195 181 L195 171 M195 181 L203 186" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="20" y="226" width="350" height="128" rx="10" fill="#f7f7f7" stroke="#777777"/>
  <text x="32" y="247" font-family="Arial, sans-serif" font-size="10" font-weight="700">Por que expirou</text>
  <text x="32" y="268" font-family="Arial, sans-serif" font-size="8">A regra informada previa resposta adicional até 12/08/2026.</text>
  <text x="32" y="288" font-family="Arial, sans-serif" font-size="8">Nenhuma decisão de aprovação ou recusa foi registrada.</text>
  <text x="32" y="308" font-family="Arial, sans-serif" font-size="8">Consequência: a solicitação foi encerrada sem criar vínculo.</text>
  <text x="32" y="328" font-family="Arial, sans-serif" font-size="7">Expiração não é recusa, punição, avaliação pública ou falta moral.</text>
  <text x="32" y="346" font-family="Arial, sans-serif" font-size="7">Identificador preservado: CSR-2026-0804-0941.</text>
  <rect x="20" y="368" width="350" height="119" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="389" font-family="Arial, sans-serif" font-size="10" font-weight="700">Dados e histórico</text>
  <text x="32" y="410" font-family="Arial, sans-serif" font-size="8">Novos usos dos dados ficam bloqueados após a expiração.</text>
  <text x="32" y="430" font-family="Arial, sans-serif" font-size="8">Retenção, exclusão ou preservação seguirão regra previamente informada.</text>
  <text x="32" y="450" font-family="Arial, sans-serif" font-size="8">A ausência de resposta não será convertida em consentimento ou recusa.</text>
  <text x="32" y="471" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver regra temporal, dados e tratamento aplicável</text>
  <rect x="20" y="501" width="350" height="101" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="522" font-family="Arial, sans-serif" font-size="10" font-weight="700">Nova solicitação</text>
  <text x="32" y="543" font-family="Arial, sans-serif" font-size="8">Será possível recomeçar se as entradas ainda estiverem disponíveis.</text>
  <text x="32" y="563" font-family="Arial, sans-serif" font-size="8">A nova tentativa exigirá nova revisão de regras, dados e confirmações.</text>
  <text x="32" y="583" font-family="Arial, sans-serif" font-size="7">Nenhum dado anterior será preenchido silenciosamente.</text>
  <rect x="20" y="625" width="350" height="46" rx="8" fill="#222222"/>
  <text x="195" y="653" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Voltar ao Perfil Público</text>
  <rect x="20" y="685" width="350" height="43" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="195" y="712" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Salvar registro da expiração</text>
  <text x="195" y="748" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Reiniciar não ocorre automaticamente.</text>
  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817" font-weight="700">Eu</text></g>
  <g fill="none" stroke="#555555"><circle cx="39" cy="796" r="8"/><rect x="109" y="788" width="16" height="16"/><circle cx="195" cy="796" r="8"/><path d="M265 804 L273 788 L281 804 Z"/><circle cx="351" cy="794" r="6" fill="#222222"/><path d="M342 807 Q351 799 360 807"/></g>
</svg>
