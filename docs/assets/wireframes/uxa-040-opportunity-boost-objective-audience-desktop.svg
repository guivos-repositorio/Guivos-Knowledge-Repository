<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Objetivo e critérios escolhidos do Opportunity Boost</title>
  <desc id="desc">Wireframe para computador com objetivo único desmarcado, critérios escolhidos e revisáveis, critérios excluídos e regra de público insuficiente separada do estado atual.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="1022" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="220" height="1024" fill="#f4f4f4" stroke="#999999"/>
  <text x="32" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700">GUIVOS</text>
  <text x="32" y="92" font-family="Arial, sans-serif" font-size="12">OPPORTUNITY BOOST</text>
  <text x="32" y="150" font-family="Arial, sans-serif" font-size="13">1 · Elegibilidade</text>
  <text x="32" y="192" font-family="Arial, sans-serif" font-size="13" font-weight="700">2 · Objetivo e critérios</text>
  <text x="32" y="234" font-family="Arial, sans-serif" font-size="13">3 · Orçamento e duração</text>
  <text x="32" y="276" font-family="Arial, sans-serif" font-size="13">4 · Prévia e confirmação</text>
  <text x="32" y="318" font-family="Arial, sans-serif" font-size="13">5 · Envio</text>
  <text x="32" y="950" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Salvar rascunho e sair</text>

  <text x="260" y="48" font-family="Arial, sans-serif" font-size="12" fill="#555555">ETAPA 2 DE 5</text>
  <text x="260" y="88" font-family="Arial, sans-serif" font-size="28" font-weight="700">Escolher objetivo e critérios de distribuição</text>
  <text x="260" y="118" font-family="Arial, sans-serif" font-size="13">Nenhum objetivo começa selecionado. Critérios só entram após escolha ou confirmação explícita do anunciante.</text>

  <rect x="260" y="152" width="740" height="410" rx="10" fill="#ffffff" stroke="#888888"/>
  <text x="286" y="188" font-family="Arial, sans-serif" font-size="16" font-weight="700">Objetivo da campanha · escolha única</text>
  <circle cx="304" cy="234" r="10" fill="#ffffff" stroke="#555555"/>
  <text x="330" y="230" font-family="Arial, sans-serif" font-size="13" font-weight="700">Ampliar visualizações válidas</text>
  <text x="330" y="250" font-family="Arial, sans-serif" font-size="11">Métrica principal: impressões válidas e visíveis.</text>
  <circle cx="304" cy="298" r="10" fill="#ffffff" stroke="#555555"/>
  <text x="330" y="294" font-family="Arial, sans-serif" font-size="13" font-weight="700">Levar pessoas ao detalhe</text>
  <text x="330" y="314" font-family="Arial, sans-serif" font-size="11">Métrica principal: cliques válidos para o detalhe.</text>
  <circle cx="304" cy="362" r="10" fill="#ffffff" stroke="#555555"/>
  <text x="330" y="358" font-family="Arial, sans-serif" font-size="13" font-weight="700">Estimular interesse legítimo</text>
  <text x="330" y="378" font-family="Arial, sans-serif" font-size="11">Métrica principal: interesse agregado declarado na oportunidade.</text>
  <circle cx="304" cy="426" r="10" fill="#ffffff" stroke="#555555"/>
  <text x="330" y="422" font-family="Arial, sans-serif" font-size="13" font-weight="700">Iniciar inscrição ou contratação</text>
  <text x="330" y="442" font-family="Arial, sans-serif" font-size="11">Métrica principal: início de processo atribuível, quando instrumentado.</text>
  <rect x="286" y="476" width="688" height="58" rx="8" fill="#f5f5f5" stroke="#aaaaaa"/>
  <text x="306" y="502" font-family="Arial, sans-serif" font-size="11">O objetivo define a métrica principal e a base candidata aplicável.</text>
  <text x="306" y="520" font-family="Arial, sans-serif" font-size="11">Não autoriza relevância pessoal, confiança, impacto ou recomendação.</text>

  <rect x="1024" y="152" width="376" height="410" rx="10" fill="#f8f8f8" stroke="#888888"/>
  <text x="1050" y="188" font-family="Arial, sans-serif" font-size="16" font-weight="700">Resumo da oportunidade</text>
  <text x="1050" y="226" font-family="Arial, sans-serif" font-size="12" font-weight="700">Formação gratuita em gestão comunitária</text>
  <text x="1050" y="250" font-family="Arial, sans-serif" font-size="11">Coletivo Horizonte</text>
  <text x="1050" y="274" font-family="Arial, sans-serif" font-size="11">Online · 18 vagas · gratuita</text>
  <line x1="1050" y1="300" x2="1372" y2="300" stroke="#cccccc"/>
  <text x="1050" y="334" font-family="Arial, sans-serif" font-size="12" font-weight="700">Critérios proibidos</text>
  <text x="1050" y="364" font-family="Arial, sans-serif" font-size="11">• compreensão inicial</text>
  <text x="1050" y="388" font-family="Arial, sans-serif" font-size="11">• Momento Atual</text>
  <text x="1050" y="412" font-family="Arial, sans-serif" font-size="11">• Próximo Passo pessoal</text>
  <text x="1050" y="436" font-family="Arial, sans-serif" font-size="11">• relato protegido</text>
  <text x="1050" y="460" font-family="Arial, sans-serif" font-size="11">• inferências sensíveis</text>
  <text x="1050" y="500" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Ver política de critérios</text>

  <rect x="260" y="590" width="1140" height="282" rx="10" fill="#ffffff" stroke="#888888"/>
  <text x="286" y="626" font-family="Arial, sans-serif" font-size="16" font-weight="700">Critérios escolhidos pelo anunciante</text>
  <text x="286" y="652" font-family="Arial, sans-serif" font-size="11">Seleções explícitas e revisáveis. Nenhum critério será adicionado silenciosamente.</text>

  <rect x="286" y="678" width="244" height="54" rx="8" fill="#ffffff" stroke="#888888"/>
  <rect x="304" y="694" width="18" height="18" fill="#222222" stroke="#555555"/>
  <text x="336" y="700" font-family="Arial, sans-serif" font-size="11" font-weight="700">Região</text>
  <text x="336" y="720" font-family="Arial, sans-serif" font-size="10">Sudeste · escolhido</text>
  <rect x="548" y="678" width="244" height="54" rx="8" fill="#ffffff" stroke="#888888"/>
  <rect x="566" y="694" width="18" height="18" fill="#222222" stroke="#555555"/>
  <text x="598" y="700" font-family="Arial, sans-serif" font-size="11" font-weight="700">Idioma</text>
  <text x="598" y="720" font-family="Arial, sans-serif" font-size="10">Português · escolhido</text>
  <rect x="810" y="678" width="244" height="54" rx="8" fill="#ffffff" stroke="#888888"/>
  <rect x="828" y="694" width="18" height="18" fill="#222222" stroke="#555555"/>
  <text x="860" y="700" font-family="Arial, sans-serif" font-size="11" font-weight="700">Categoria</text>
  <text x="860" y="720" font-family="Arial, sans-serif" font-size="10">Formação · escolhida</text>
  <rect x="1072" y="678" width="300" height="54" rx="8" fill="#ffffff" stroke="#888888"/>
  <rect x="1090" y="694" width="18" height="18" fill="#222222" stroke="#555555"/>
  <text x="1122" y="700" font-family="Arial, sans-serif" font-size="11" font-weight="700">Modalidade</text>
  <text x="1122" y="720" font-family="Arial, sans-serif" font-size="10">Online · escolhida</text>

  <rect x="286" y="754" width="508" height="82" rx="8" fill="#f7f7f7" stroke="#999999"/>
  <text x="306" y="780" font-family="Arial, sans-serif" font-size="12" font-weight="700">Alcance estimado · ainda indisponível</text>
  <text x="306" y="804" font-family="Arial, sans-serif" font-size="11">Selecione um objetivo para calcular uma estimativa agregada.</text>
  <text x="306" y="824" font-family="Arial, sans-serif" font-size="10">Estimativa não representa garantia de entrega ou conversão.</text>
  <rect x="814" y="754" width="558" height="82" rx="8" fill="#ffffff" stroke="#999999" stroke-dasharray="6 4"/>
  <text x="834" y="780" font-family="Arial, sans-serif" font-size="12" font-weight="700">Regra de exceção · não ativa neste exemplo</text>
  <text x="834" y="804" font-family="Arial, sans-serif" font-size="11">Público insuficiente limita ou bloqueia a campanha; critérios nunca são ampliados automaticamente.</text>
  <text x="834" y="824" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Revisar critérios escolhidos</text>

  <text x="260" y="920" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Voltar para elegibilidade</text>
  <rect x="1120" y="890" width="280" height="52" rx="8" fill="#e5e5e5" stroke="#999999" stroke-dasharray="6 4"/>
  <text x="1260" y="922" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700">Continuar · escolha um objetivo</text>
</svg>