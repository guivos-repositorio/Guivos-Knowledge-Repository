<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Acesso protegido quando necessário</title>
  <desc id="desc">Wireframe móvel reformulado que apresenta acesso somente quando necessário e separa dados de conta do conteúdo e das autorizações da jornada.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial, sans-serif" font-size="16" font-weight="700">GUIVOS</text>
  <text x="370" y="34" text-anchor="end" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Voltar à explicação</text>
  <line x1="16" y1="50" x2="374" y2="50" stroke="#cccccc"/>

  <text x="20" y="82" font-family="Arial, sans-serif" font-size="10" fill="#555555">INÍCIO PROTEGIDO · ACESSO, QUANDO NECESSÁRIO</text>
  <text x="20" y="118" font-family="Arial, sans-serif" font-size="20" font-weight="700">Acesse para proteger e retomar</text>
  <text x="20" y="143" font-family="Arial, sans-serif" font-size="10">Esta tela aparece somente quando o acesso for necessário.</text>

  <rect x="20" y="168" width="350" height="122" rx="10" fill="#f3f3f3" stroke="#777777"/>
  <text x="36" y="194" font-family="Arial, sans-serif" font-size="11" font-weight="700">Conta e jornada permanecem separadas</text>
  <text x="36" y="218" font-family="Arial, sans-serif" font-size="9">Dados de acesso servem para autenticação e proteção da conta.</text>
  <text x="36" y="238" font-family="Arial, sans-serif" font-size="9">Entrar ou criar conta não autoriza relato, gravação, upload,</text>
  <text x="36" y="256" font-family="Arial, sans-serif" font-size="9">análise, compreensão persistente ou personalização.</text>
  <text x="36" y="278" font-family="Arial, sans-serif" font-size="9" font-weight="700">Nenhum relato pessoal foi recebido nesta etapa.</text>

  <rect x="20" y="316" width="350" height="54" rx="9" fill="#222222"/>
  <text x="195" y="349" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="700">Entrar na minha conta</text>
  <rect x="20" y="384" width="350" height="54" rx="9" fill="#ffffff" stroke="#777777"/>
  <text x="195" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700">Criar uma conta</text>
  <text x="195" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Recuperar acesso</text>

  <rect x="20" y="510" width="350" height="120" rx="10" fill="#ffffff" stroke="#999999"/>
  <text x="36" y="536" font-family="Arial, sans-serif" font-size="11" font-weight="700">Depois do acesso</text>
  <text x="36" y="560" font-family="Arial, sans-serif" font-size="9">• escolha uma modalidade sem preferência automática;</text>
  <text x="36" y="582" font-family="Arial, sans-serif" font-size="9">• compartilhe pouco e forme um rascunho revisável;</text>
  <text x="36" y="604" font-family="Arial, sans-serif" font-size="9">• autorize uma finalidade somente depois da revisão.</text>

  <rect x="20" y="652" width="350" height="72" rx="9" fill="#f3f3f3" stroke="#999999"/>
  <text x="36" y="678" font-family="Arial, sans-serif" font-size="10" font-weight="700">Sessão válida</text>
  <text x="36" y="700" font-family="Arial, sans-serif" font-size="9">Quando já autenticada, a pessoa segue sem repetir esta etapa.</text>
  <text x="350" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Continuar</text>

  <text x="195" y="766" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Explorar sem personalização</text>
  <text x="195" y="804" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Sair sem iniciar relato</text>
</svg>
