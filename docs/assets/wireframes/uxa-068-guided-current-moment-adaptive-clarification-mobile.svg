<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Pergunta adaptativa validada sobre o Momento Atual</title>
  <desc id="desc">Tela móvel de ajuda temporária solicitada que explica a lacuna, evita recomendação e permite resposta, incerteza, recusa ou manutenção em aberto.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="28" font-family="Arial, sans-serif" font-size="11">09:41</text>
  <text x="20" y="58" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao rascunho</text>
  <text x="370" y="58" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Manter esta dimensão em aberto</text>
  <text x="20" y="97" font-family="Arial, sans-serif" font-size="21" font-weight="700">Uma pergunta pode ajudar</text>
  <text x="20" y="121" font-family="Arial, sans-serif" font-size="9">Ajuda temporária solicitada · resposta opcional</text>
  <rect x="20" y="143" width="350" height="122" rx="10" fill="#f5f5f5" stroke="#777777"/>
  <text x="32" y="166" font-family="Arial, sans-serif" font-size="10" font-weight="700">Por que esta pergunta apareceu</text>
  <text x="32" y="188" font-family="Arial, sans-serif" font-size="8">Seu rascunho descreve a situação e uma dificuldade.</text>
  <text x="32" y="207" font-family="Arial, sans-serif" font-size="8">A direção desejada ainda não foi informada ou confirmada.</text>
  <text x="32" y="226" font-family="Arial, sans-serif" font-size="8">Responder poderá reduzir essa incerteza, se você já souber.</text>
  <text x="32" y="251" font-family="Arial, sans-serif" font-size="7">A análise temporária não prepara compreensão nem personalização.</text>
  <rect x="20" y="282" width="350" height="79" rx="10" fill="#ffffff" stroke="#111111"/>
  <text x="32" y="306" font-family="Arial, sans-serif" font-size="10" font-weight="700">Qual resultado deseja priorizar, se já souber?</text>
  <text x="32" y="330" font-family="Arial, sans-serif" font-size="8">As opções abaixo são exemplos, não recomendações.</text>
  <text x="32" y="351" font-family="Arial, sans-serif" font-size="7">Você pode escrever outra resposta ou manter em aberto.</text>
  <rect x="20" y="378" width="350" height="42" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="404" font-family="Arial, sans-serif" font-size="9">Tentar melhorar a situação no trabalho atual</text>
  <rect x="20" y="432" width="350" height="42" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="458" font-family="Arial, sans-serif" font-size="9">Considerar mudança de função ou empresa</text>
  <rect x="20" y="486" width="350" height="42" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="512" font-family="Arial, sans-serif" font-size="9">Compreender opções antes de escolher uma direção</text>
  <rect x="20" y="540" width="169" height="42" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="104" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Não sei ainda</text>
  <rect x="201" y="540" width="169" height="42" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="285" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Prefiro não informar</text>
  <rect x="20" y="599" width="350" height="72" rx="10" fill="#ffffff" stroke="#999999"/>
  <text x="32" y="622" font-family="Arial, sans-serif" font-size="9" fill="#555555">Outra resposta, com suas palavras</text>
  <text x="32" y="651" font-family="Arial, sans-serif" font-size="8">Nenhuma opção vem marcada.</text>
  <rect x="20" y="691" width="350" height="44" rx="8" fill="#eeeeee" stroke="#999999"/>
  <text x="195" y="718" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#555555" font-weight="700">Adicionar resposta ao rascunho</text>
  <text x="195" y="759" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Disponível após uma escolha ou texto; poderá ser corrigido.</text>
  <rect x="20" y="779" width="350" height="37" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="195" y="802" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Remover esta ajuda temporária e voltar</text>
  <text x="195" y="829" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Responder não autoriza compreensão inicial ou recomendação.</text>
</svg>
