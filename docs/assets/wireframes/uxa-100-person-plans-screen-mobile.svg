    <text x="38" y="310" font-size="16" font-weight="700">Free</text>
    <text x="294" y="310" font-size="14" font-weight="700">R$ 0</text>
    <text x="38" y="333" font-size="11">Catálogo público · Mapa · histórico essencial</text>
    <text x="38" y="371" font-size="12">Plano atual</text>

