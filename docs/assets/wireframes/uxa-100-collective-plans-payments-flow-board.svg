  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <text x="76" y="184" font-size="18" font-weight="700">1 · Plano e cobrança · Coletivo Livre</text>
    <text x="98" y="232" font-size="16" font-weight="700">Coletivo Horizonte Aberto · Livre · R$ 0,00</text>
    <text x="98" y="258" font-size="12">Plano atual · publicações existentes preservadas</text>
    <text x="98" y="330" font-size="13">Atividades neste mês</text>
    <text x="98" y="362" font-size="24" font-weight="700">1 / 1</text>
    <text x="98" y="394" font-size="12">cota gratuita utilizada</text>
    <text x="398" y="330" font-size="13">Oportunidades neste mês</text>
    <text x="398" y="362" font-size="24" font-weight="700">1 / 1</text>
    <text x="398" y="394" font-size="12">2 / 2 publicações ativas</text>
    <text x="112" y="465" font-size="12">Aguardar ciclo</text>
    <text x="312" y="465" font-size="12">Comparar planos</text>

    <text x="780" y="184" font-size="18" font-weight="700">2 · Nova publicação paga no Livre</text>
    <text x="802" y="232" font-size="15" font-weight="700">Publicação paga não está incluída no Coletivo Livre.</text>
    <text x="802" y="262" font-size="13">A publicação pode permanecer gratuita sem upgrade, quando aplicável.</text>
    <text x="802" y="290" font-size="13">Assinatura não substitui comissão, taxa do pagamento ou tributo.</text>
    <text x="802" y="318" font-size="13">Nenhuma publicação existente perde alcance ou visibilidade por este limite.</text>
    <text x="814" y="406" font-size="12">Manter gratuita</text>
    <text x="1008" y="406" font-size="12">Salvar rascunho</text>
    <text x="1200" y="406" font-size="12">Ver Gestão</text>
    <text x="780" y="472" font-size="11">Também é legítimo aguardar o próximo ciclo ou encerrar/agendar publicação quando aplicável.</text>

    <text x="76" y="602" font-size="18" font-weight="700">3 · Comparação voluntária</text>
    <text x="96" y="654" font-size="14" font-weight="700">LIVRE</text>
    <text x="96" y="684" font-size="13">R$ 0</text>
    <text x="96" y="712" font-size="12">1 atividade + 1 oportunidade/mês</text>
    <text x="96" y="738" font-size="12">2 ativas · 2 admins · 1 unidade</text>
    <text x="96" y="764" font-size="12">sem publicações pagas</text>
    <text x="416" y="654" font-size="14" font-weight="700">GESTÃO</text>
    <text x="416" y="684" font-size="13">R$ 89,90/mês · R$ 899/ano</text>
    <text x="416" y="712" font-size="12">4 atividades + 4 oportunidades/mês</text>
    <text x="416" y="738" font-size="12">6 ativas · 5 admins · 1 unidade</text>
    <text x="416" y="764" font-size="12">publicações e inscrições pagas</text>
    <text x="736" y="654" font-size="14" font-weight="700">IMPACTO</text>
    <text x="736" y="684" font-size="13">R$ 249,90/mês · R$ 2.499/ano</text>
    <text x="736" y="712" font-size="12">15 + 15/mês · 20 ativas</text>
    <text x="736" y="738" font-size="12">15 admins · até 5 unidades</text>
    <text x="736" y="764" font-size="12">indicadores e integrações ampliadas</text>
    <text x="1056" y="654" font-size="14" font-weight="700">ENTERPRISE</text>
    <text x="1056" y="684" font-size="13">Sob consulta · contrato anual</text>
    <text x="1056" y="712" font-size="12">capacidade contratada</text>
    <text x="1056" y="738" font-size="12">API · SSO · Power BI</text>
    <text x="1056" y="764" font-size="12">múltiplos núcleos · SLA</text>
    <text x="454" y="877" font-size="12">Escolher Gestão</text>
    <text x="1110" y="877" font-size="12">Solicitar proposta</text>

    <text x="76" y="1004" font-size="18" font-weight="700">4 · Revisar contratação · Gestão</text>
    <text x="98" y="1060" font-size="14" font-weight="700">Coletivo Gestão · mensal · preço candidato R$ 89,90</text>
    <text x="98" y="1088" font-size="13">Pagador: Coletivo / responsável autorizado pela cobrança</text>
    <text x="98" y="1116" font-size="13">Beneficiário: Coletivo Horizonte Aberto</text>
    <text x="98" y="1144" font-size="13">Recorrência: mensal · método autorizado em simulação</text>
    <text x="98" y="1172" font-size="11">Pró-rata, crédito e regra fiscal permanecem indefinidos.</text>
    <text x="264" y="1232" font-size="13">Confirmar contratação</text>

    <text x="780" y="1004" font-size="18" font-weight="700">5 · Resultado do pagamento</text>
    <text x="802" y="1058" font-size="14" font-weight="700">CONFIRMADO</text>
    <text x="802" y="1088" font-size="12">Ativação rastreável do Gestão.</text>
    <text x="802" y="1116" font-size="12">Registro/recibo disponível.</text>
    <text x="802" y="1144" font-size="12">Capacidade muda; relevância não.</text>
    <text x="1102" y="1058" font-size="14" font-weight="700">NÃO CONFIRMADO</text>
    <text x="1102" y="1088" font-size="12">Sem ativação presumida.</text>
    <text x="1102" y="1116" font-size="12">Estado anterior preservado.</text>
    <text x="1102" y="1144" font-size="12">Publicações existentes continuam.</text>
    <text x="818" y="1232" font-size="12">Ver plano ativo</text>
    <text x="1206" y="1232" font-size="12">Tentar novamente</text>

    <text x="76" y="1362" font-size="18" font-weight="700">6 · Downgrade ou cancelamento</text>
    <text x="98" y="1414" font-size="13">Mostrar plano atual → estado futuro, data aplicável e capacidades afetadas.</text>
    <text x="98" y="1442" font-size="13">Resolver excesso de administradores, unidades ou publicações sem apagar dados silenciosamente.</text>
    <text x="98" y="1470" font-size="12">Acesso essencial e direitos permanecem; pró-rata/estorno não são presumidos.</text>
    <text x="752" y="1362" font-size="18" font-weight="700">7 · Enterprise</text>
    <text x="802" y="1414" font-size="14" font-weight="700">Solicitar proposta comercial</text>
    <text x="802" y="1442" font-size="13">Dimensionar núcleos, capacidade, integrações e suporte.</text>
    <text x="802" y="1470" font-size="12">Sem checkout autônomo fictício e sem promessa de capacidade infinita.</text>

    <text x="48" y="1580" font-size="12">Fluxo candidato. A assinatura amplia capacidades operacionais autorizadas; não compra prioridade orgânica, confiança ou impacto.</text>
  </g>
</svg>