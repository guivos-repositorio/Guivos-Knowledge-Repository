<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1620" viewBox="0 0 1440 1620" role="img" aria-labelledby="title desc">
  <title id="title">Coletivo — planos, limites, cobrança e pagamentos</title>
  <desc id="desc">Placa estrutural de baixa fidelidade para computador com plano Coletivo Livre, limite mensal e publicação paga, comparação Livre Gestão Impacto Enterprise, revisão de contratação, sucesso, falha, downgrade cancelamento e caminho Enterprise por proposta comercial.</desc>
  <rect width="1440" height="1620" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <text x="48" y="58" font-size="26" font-weight="700">UXA-100 · Coletivo · Plano, cobrança e pagamento</text>
    <text x="48" y="86" font-size="14">Placa candidata de fluxo · baixa fidelidade · valores candidatos · operação comercial não implementada</text>
    <text x="48" y="112" font-size="13">Regra: atingir limite nunca reduz a visibilidade das publicações existentes e não transforma assinatura em relevância.</text>
  </g>

  <g fill="none" stroke="#111111" stroke-width="2">
