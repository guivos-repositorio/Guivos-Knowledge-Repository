<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Baixa oferta orgânica restringe publicidade</title><desc id="desc">A pouca oferta orgânica reduz a quantidade de anúncios e não amplia critérios ou densidade.</desc><rect width="390" height="844" fill="#fff"/><rect x="1" y="1" width="388" height="842" fill="none" stroke="#111" stroke-width="2"/><text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text><text x="20" y="60" font-family="Arial" font-size="10">EXPLORAR · RESULTADOS</text><text x="20" y="94" font-family="Arial" font-size="19" font-weight="700">Poucas oportunidades disponíveis</text><rect x="20" y="116" width="350" height="82" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="142" font-family="Arial" font-size="11" font-weight="700">2 oportunidades orgânicas</text><text x="34" y="166" font-family="Arial" font-size="9">Publicidade exibida: nenhuma nesta página</text><text x="34" y="186" font-family="Arial" font-size="8">A baixa oferta orgânica reduz publicidade.</text><rect x="20" y="220" width="350" height="132" rx="8" fill="#fff" stroke="#555"/><text x="34" y="248" font-family="Arial" font-size="10" font-weight="700">RESULTADO ORGÂNICO 1</text><text x="34" y="276" font-family="Arial" font-size="14" font-weight="700">Apoio para retorno aos estudos</text><text x="34" y="302" font-family="Arial" font-size="9">Centro Comunitário Norte · gratuito</text><text x="34" y="330" font-family="Arial" font-size="9" text-decoration="underline">Ver detalhes</text><rect x="20" y="374" width="350" height="196" rx="8" fill="#f3f3f3" stroke="#555" stroke-dasharray="5 4"/><text x="34" y="404" font-family="Arial" font-size="11" font-weight="700">Proteção da densidade aplicada</text><text x="34" y="432" font-family="Arial" font-size="9">Não há itens orgânicos suficientes entre anúncios.</text><text x="34" y="456" font-family="Arial" font-size="9">A publicidade foi reduzida, não compensada.</text><text x="34" y="480" font-family="Arial" font-size="9">Critérios, região e filtros permanecem iguais.</text><text x="34" y="504" font-family="Arial" font-size="9">Nenhuma campanha ganha posição orgânica.</text><text x="34" y="536" font-family="Arial" font-size="8">A proteção vale mesmo com inventário pago disponível.</text><rect x="20" y="592" width="350" height="132" rx="8" fill="#fff" stroke="#555"/><text x="34" y="620" font-family="Arial" font-size="10" font-weight="700">RESULTADO ORGÂNICO 2</text><text x="34" y="648" font-family="Arial" font-size="14" font-weight="700">Encontro de orientação profissional</text><text x="34" y="674" font-family="Arial" font-size="9">Coletivo Caminhos · presencial</text><text x="34" y="702" font-family="Arial" font-size="9" text-decoration="underline">Ver detalhes</text><rect x="20" y="748" width="350" height="48" rx="8" fill="#fff" stroke="#777"/><text x="34" y="777" font-family="Arial" font-size="9">Alterar filtros exige decisão explícita da pessoa.</text><text x="20" y="820" font-family="Arial" font-size="8">Estado residual materializado; validação funcional pendente.</text></svg>