<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Tela Hoje com área da jornada confirmada como contexto discreto</title>
  <desc id="desc">Estrutura móvel em que uma área da jornada confirmada pela Pessoa pode aparecer de forma discreta para contextualizar a continuidade, sem criar painel de domínios, score ou dependência de personalização.</desc>
