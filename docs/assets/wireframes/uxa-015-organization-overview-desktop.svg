<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe de baixa fidelidade da Visão Geral da Organização</title>
  <desc id="desc">Estrutura para computador com contexto institucional, momento atual, atenção principal, jornadas apoiadas, oportunidades, avanço institucional, capacidade, relações e próximos passos.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="0" y="0" width="250" height="1024" fill="#f3f3f3" stroke="#999999"/>
  <text x="28" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700">Guivos Business</text>
  <text x="28" y="78" font-family="Arial, sans-serif" font-size="12">Instituto Horizonte · Unidade Central</text>
  <text x="28" y="99" font-family="Arial, sans-serif" font-size="10">Agindo como Administrador institucional</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="16" y="126" width="218" height="42" rx="6" fill="#222222"/>
    <text x="28" y="152" fill="#ffffff" font-weight="700">Visão Geral</text>
    <text x="28" y="202">Oportunidades</text>
    <text x="28" y="242">Programas e Públicos</text>
    <text x="28" y="282">Coletivos e Parcerias</text>
    <text x="28" y="322">Resultados e Evidências</text>
    <text x="28" y="362">Equipe e Papéis</text>
    <text x="28" y="402">Organização</text>
    <text x="28" y="442">Privacidade e Conformidade</text>
  </g>
  <text x="28" y="946" font-family="Arial, sans-serif" font-size="11">Ajuda e contestação</text>
  <text x="28" y="972" font-family="Arial, sans-serif" font-size="11">Alternar contexto de atuação</text>

  <rect x="250" y="0" width="1190" height="76" fill="#ffffff" stroke="#cccccc"/>
  <text x="286" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700">Visão Geral da Organização</text>
  <text x="286" y="62" font-family="Arial, sans-serif" font-size="11" fill="#555555">Organização verificada · informações atualizadas hoje</text>
  <rect x="1250" y="20" width="156" height="36" rx="6" fill="#ffffff" stroke="#555555"/>
  <text x="1328" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Ver informações utilizadas</text>

  <rect x="286" y="100" width="748" height="112" rx="10" fill="#f7f7f7" stroke="#aaaaaa"/>
  <text x="310" y="128" font-family="Arial, sans-serif" font-size="14" font-weight="700">Momento institucional em poucas palavras</text>
  <text x="310" y="153" font-family="Arial, sans-serif" font-size="11">Três oportunidades estão ativas, duas seguem em avaliação e uma está próxima do limite de capacidade.</text>
  <text x="310" y="176" font-family="Arial, sans-serif" font-size="11">A informação de acessibilidade de uma atividade ainda precisa ser confirmada.</text>
  <text x="310" y="198" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Corrigir contexto institucional</text>
  <text x="470" y="198" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Informar uma mudança</text>
  <text x="612" y="198" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Contestar esta leitura</text>

  <rect x="1054" y="100" width="352" height="112" rx="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="1078" y="128" font-family="Arial, sans-serif" font-size="14" font-weight="700">Atenção principal</text>
  <text x="1078" y="153" font-family="Arial, sans-serif" font-size="11">Confirmar condição de acessibilidade</text>
  <text x="1078" y="174" font-family="Arial, sans-serif" font-size="10">A informação afeta a decisão dos participantes.</text>
  <text x="1078" y="197" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Revisar agora</text>
  <text x="1170" y="197" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Atribuir responsável</text>

  <text x="286" y="252" font-family="Arial, sans-serif" font-size="17" font-weight="700">Jornadas e públicos apoiados</text>
  <rect x="286" y="266" width="556" height="130" rx="10" fill="#ffffff" stroke="#aaaaaa"/>
  <text x="310" y="294" font-family="Arial, sans-serif" font-size="12" font-weight="700">Transição profissional</text>
  <text x="310" y="318" font-family="Arial, sans-serif" font-size="11">Formação, mentoria e acesso a oportunidades para pessoas em mudança de carreira.</text>
  <text x="310" y="342" font-family="Arial, sans-serif" font-size="10">Público autorizado: adultos que declararam interesse profissional.</text>
  <text x="310" y="366" font-family="Arial, sans-serif" font-size="10">Limite: adequação individual permanece com a Guivos e o participante.</text>
  <text x="310" y="386" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Ver jornadas e públicos</text>

  <rect x="862" y="266" width="544" height="130" rx="10" fill="#f7f7f7" stroke="#aaaaaa"/>
  <text x="886" y="294" font-family="Arial, sans-serif" font-size="12" font-weight="700">Avanço institucional reconhecido</text>
  <text x="886" y="318" font-family="Arial, sans-serif" font-size="11">Todas as oportunidades ativas passaram a informar custo total e cancelamento.</text>
  <text x="886" y="342" font-family="Arial, sans-serif" font-size="10">Evidência: revisão documental e redução de dúvidas recorrentes.</text>
  <text x="886" y="366" font-family="Arial, sans-serif" font-size="10">Período observado: últimos 30 dias · confirmação institucional registrada.</text>
  <text x="886" y="386" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Entender evidências e limitações</text>

  <text x="286" y="440" font-family="Arial, sans-serif" font-size="17" font-weight="700">Oportunidades e programas em movimento</text>
  <rect x="286" y="454" width="1120" height="190" rx="10" fill="#ffffff" stroke="#aaaaaa"/>
  <g font-family="Arial, sans-serif">
    <text x="310" y="484" font-size="11" font-weight="700">Oportunidade</text>
    <text x="675" y="484" font-size="11" font-weight="700">Estado e capacidade</text>
    <text x="955" y="484" font-size="11" font-weight="700">Responsabilidade e próximo passo</text>
    <line x1="310" y1="496" x2="1380" y2="496" stroke="#cccccc"/>
    <text x="310" y="524" font-size="11">Inglês profissional · Formação</text>
    <text x="675" y="524" font-size="11">Ativa · 42 de 50 vagas</text>
    <text x="955" y="524" font-size="11">Revisar capacidade antes de novas inscrições</text>
    <line x1="310" y1="542" x2="1380" y2="542" stroke="#eeeeee"/>
    <text x="310" y="570" font-size="11">Mentoria de carreira · Programa</text>
    <text x="675" y="570" font-size="11">Em avaliação</text>
    <text x="955" y="570" font-size="11">Responder aos ajustes de proteção de dados</text>
    <line x1="310" y1="588" x2="1380" y2="588" stroke="#eeeeee"/>
    <text x="310" y="616" font-size="11">Encontro de preparação · Atividade</text>
    <text x="675" y="616" font-size="11">Ajuste necessário</text>
    <text x="955" y="616" font-size="11">Confirmar acessibilidade e responsável</text>
  </g>

  <text x="286" y="688" font-family="Arial, sans-serif" font-size="17" font-weight="700">Capacidade, riscos e responsabilidades</text>
  <rect x="286" y="702" width="544" height="140" rx="10" fill="#ffffff" stroke="#aaaaaa"/>
  <text x="310" y="732" font-family="Arial, sans-serif" font-size="11">Capacidade declarada: 84% utilizada</text>
  <text x="310" y="756" font-family="Arial, sans-serif" font-size="11">Informações válidas: 9 de 10 itens materiais</text>
  <text x="310" y="780" font-family="Arial, sans-serif" font-size="11">Responsabilidade sem titular: acessibilidade de uma atividade</text>
  <text x="310" y="804" font-family="Arial, sans-serif" font-size="11">Risco atual: inscrições acima da capacidade informada</text>
  <text x="310" y="828" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Abrir responsabilidades e riscos</text>

  <rect x="850" y="702" width="556" height="140" rx="10" fill="#ffffff" stroke="#aaaaaa"/>
  <text x="874" y="732" font-family="Arial, sans-serif" font-size="12" font-weight="700">Relações com Coletivos e Organizações</text>
  <text x="874" y="758" font-family="Arial, sans-serif" font-size="11">Rede de Mentores · apoio à execução de encontros mensais</text>
  <text x="874" y="782" font-family="Arial, sans-serif" font-size="11">Empresa Parceira · bolsas para formação profissional</text>
  <text x="874" y="806" font-family="Arial, sans-serif" font-size="10">Finalidade, recursos, dados e responsabilidades permanecem visíveis.</text>
  <text x="874" y="828" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Ver relações e responsabilidades</text>

  <text x="286" y="886" font-family="Arial, sans-serif" font-size="17" font-weight="700">Próximos Passos justificados</text>
  <rect x="286" y="900" width="1120" height="86" rx="10" fill="#f7f7f7" stroke="#aaaaaa"/>
  <text x="310" y="930" font-family="Arial, sans-serif" font-size="11" font-weight="700">Revisar a capacidade da turma de Inglês profissional</text>
  <text x="310" y="952" font-family="Arial, sans-serif" font-size="10">Faz sentido porque as inscrições se aproximam do limite. Alternativas: ampliar capacidade, criar lista de espera, encerrar inscrições ou ajustar a data.</text>
  <text x="310" y="974" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Ver justificativa e escolher caminho</text>
</svg>