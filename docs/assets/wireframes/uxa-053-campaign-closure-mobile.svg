<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Encerramento e cancelamento do Opportunity Boost em aplicativo móvel reformulado</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade com campanha ainda ativa, motivo e confirmações obrigatórios, revisão de pausa separada e cancelamento indisponível até o gate completo.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text>
  <text x="20" y="58" font-family="Arial" font-size="10">OPPORTUNITY BOOST · GESTÃO MÓVEL</text>
  <text x="20" y="88" font-family="Arial" font-size="18" font-weight="700">Revisar cancelamento</text>
  <text x="370" y="87" text-anchor="end" font-family="Arial" font-size="8" font-weight="700">CONFIRMAÇÃO PENDENTE</text>

  <rect x="20" y="108" width="350" height="108" rx="8" fill="#f3f3f3" stroke="#555555"/>
  <text x="34" y="133" font-family="Arial" font-size="10" font-weight="700">BST-2026-081 · versão aprovada v1</text>
  <text x="34" y="154" font-family="Arial" font-size="9">Formação de jovens em tecnologia</text>
  <text x="34" y="175" font-family="Arial" font-size="9">Estado atual: ATIVA · novos eventos ainda permitidos</text>
  <text x="34" y="196" font-family="Arial" font-size="8">Revisão iniciada em 09/08/2026 às 16:30</text>
  <text x="34" y="210" font-family="Arial" font-size="8">Cancelar será irreversível para esta mesma campanha.</text>

  <text x="20" y="248" font-family="Arial" font-size="12" font-weight="700">Orçamento no momento da revisão</text>
  <rect x="20" y="262" width="168" height="66" rx="7" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="285" font-family="Arial" font-size="8">Utilizado validado</text>
  <text x="34" y="311" font-family="Arial" font-size="14" font-weight="700">R$ 168</text>
  <rect x="202" y="262" width="168" height="66" rx="7" fill="#ffffff" stroke="#777777"/>
  <text x="216" y="285" font-family="Arial" font-size="8">Saldo não utilizado</text>
  <text x="216" y="311" font-family="Arial" font-size="14" font-weight="700">R$ 132</text>

  <rect x="20" y="346" width="350" height="72" rx="8" fill="#ffffff" stroke="#555555"/>
  <text x="34" y="370" font-family="Arial" font-size="10" font-weight="700">Motivo obrigatório</text>
  <text x="34" y="394" font-family="Arial" font-size="9">Nenhum motivo selecionado</text>
  <text x="338" y="394" text-anchor="end" font-family="Arial" font-size="9" text-decoration="underline">Selecionar</text>
  <text x="34" y="411" font-family="Arial" font-size="8">O motivo será preservado no registro operacional.</text>

  <rect x="20" y="434" width="350" height="152" rx="8" fill="#ffffff" stroke="#555555"/>
  <text x="34" y="458" font-family="Arial" font-size="10" font-weight="700">Confirmações obrigatórias</text>
  <rect x="34" y="476" width="12" height="12" fill="#ffffff" stroke="#111111"/>
  <text x="56" y="486" font-family="Arial" font-size="9">Novos eventos de entrega serão encerrados.</text>
  <rect x="34" y="508" width="12" height="12" fill="#ffffff" stroke="#111111"/>
  <text x="56" y="518" font-family="Arial" font-size="9">Eventos válidos anteriores e histórico serão preservados.</text>
  <rect x="34" y="540" width="12" height="12" fill="#ffffff" stroke="#111111"/>
  <text x="56" y="550" font-family="Arial" font-size="9">A mesma campanha não poderá ser retomada.</text>
  <text x="34" y="574" font-family="Arial" font-size="8">Saldo e devolução dependem de política e reconciliação posteriores.</text>

  <rect x="20" y="604" width="350" height="48" rx="8" fill="#dddddd" stroke="#777777"/>
  <text x="195" y="633" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700">CONFIRMAR CANCELAMENTO · INDISPONÍVEL</text>
  <text x="20" y="672" font-family="Arial" font-size="8">Pendente: motivo e três confirmações independentes.</text>

  <rect x="20" y="692" width="168" height="44" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="104" y="719" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700">REVISAR PAUSA</text>
  <rect x="202" y="692" width="168" height="44" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="286" y="719" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700">ABRIR HISTÓRICO</text>

  <rect x="20" y="754" width="350" height="60" rx="8" fill="#f3f3f3" stroke="#777777" stroke-dasharray="5 4"/>
  <text x="34" y="776" font-family="Arial" font-size="10" font-weight="700">Estados finais possuem causas próprias</text>
  <text x="34" y="797" font-family="Arial" font-size="8">esgotada · expirada · suspensa · concluída · cancelada · reconciliada</text>
  <text x="34" y="810" font-family="Arial" font-size="7">Pausa é apenas uma alternativa revisável quando a retomada for compatível.</text>

  <text x="20" y="832" font-family="Arial" font-size="8">Cancelamento não apaga eventos válidos nem confirma devolução.</text>
  <text x="20" y="842" font-family="Arial" font-size="7">Gestão móvel reformulada pela UXA-054.</text>
</svg>