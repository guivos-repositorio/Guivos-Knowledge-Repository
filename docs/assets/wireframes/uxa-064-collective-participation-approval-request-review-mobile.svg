<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel da revisão de solicitação de participação mediante aprovação</title>
  <desc id="desc">Revisão consciente da solicitação para o Ciclistas da Serra, com dados editáveis, autoridade de análise, prazo estimado sem promessa, acessibilidade separada e confirmações inicialmente vazias.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao perfil</text>
  <text x="370" y="57" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Cancelar</text>
  <text x="20" y="94" font-family="Arial, sans-serif" font-size="21" font-weight="700">Revisar solicitação</text>
  <text x="20" y="116" font-family="Arial, sans-serif" font-size="9">Ciclistas da Serra · aprovação necessária</text>
  <rect x="20" y="136" width="350" height="76" rx="10" fill="#f7f7f7" stroke="#777777"/>
  <text x="32" y="156" font-family="Arial, sans-serif" font-size="10" font-weight="700">Antes do envio</text>
  <text x="32" y="175" font-family="Arial, sans-serif" font-size="8">A solicitação será analisada e não cria acesso interno ou vínculo.</text>
  <text x="32" y="193" font-family="Arial, sans-serif" font-size="8">Cancelar agora não envia dados; o cancelamento posterior terá fluxo próprio.</text>
  <text x="32" y="207" font-family="Arial, sans-serif" font-size="7">Prazo estimado não é promessa; silêncio ou espera não são aprovação.</text>
  <rect x="20" y="224" width="350" height="124" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="244" font-family="Arial, sans-serif" font-size="10" font-weight="700">Dados que serão enviados</text>
  <text x="32" y="263" font-family="Arial, sans-serif" font-size="8">• nome de exibição e identificador da solicitação</text>
  <text x="32" y="282" font-family="Arial, sans-serif" font-size="8">• experiência declarada: ciclismo de estrada intermediário</text>
  <text x="32" y="301" font-family="Arial, sans-serif" font-size="8">• disponibilidade informada: encontros quinzenais</text>
  <text x="32" y="320" font-family="Arial, sans-serif" font-size="8">• confirmações de regras, segurança e envio destes dados</text>
  <text x="32" y="338" font-family="Arial, sans-serif" font-size="7">Telefone, e-mail e Jornada não serão enviados.</text>
  <text x="358" y="338" text-anchor="end" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Editar dados declarados</text>
  <rect x="20" y="360" width="350" height="94" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="380" font-family="Arial, sans-serif" font-size="10" font-weight="700">Análise e autoridade</text>
  <text x="32" y="399" font-family="Arial, sans-serif" font-size="8">Responsável: Carlos Menezes · papel autorizado para análise</text>
  <text x="32" y="418" font-family="Arial, sans-serif" font-size="8">Estimativa: até 5 dias úteis · sem garantia de decisão nesse prazo</text>
  <text x="32" y="437" font-family="Arial, sans-serif" font-size="7">A Organização apoiadora não receberá a solicitação automaticamente.</text>
  <rect x="20" y="466" width="350" height="165" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="486" font-family="Arial, sans-serif" font-size="10" font-weight="700">Confirmações necessárias</text>
  <rect x="32" y="503" width="14" height="14" fill="#ffffff" stroke="#111111"/>
  <text x="55" y="514" font-family="Arial, sans-serif" font-size="8">Revisei os dados e as condições de análise.</text>
  <rect x="32" y="534" width="14" height="14" fill="#ffffff" stroke="#111111"/>
  <text x="55" y="545" font-family="Arial, sans-serif" font-size="8">Li as regras essenciais e os requisitos de segurança.</text>
  <rect x="32" y="565" width="14" height="14" fill="#ffffff" stroke="#111111"/>
  <text x="55" y="576" font-family="Arial, sans-serif" font-size="8">Confirmo que desejo enviar somente os dados descritos acima.</text>
  <text x="32" y="600" font-family="Arial, sans-serif" font-size="7">Nenhuma confirmação começa selecionada; marketing permanece separado.</text>
  <text x="32" y="618" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Rever regras e solicitar recurso de acessibilidade</text>
  <rect x="20" y="636" width="350" height="44" rx="8" fill="#eeeeee" stroke="#999999"/>
  <text x="195" y="663" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#555555" font-weight="700">Enviar solicitação</text>
  <text x="195" y="698" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Disponível somente após revisão e confirmações.</text>
  <rect x="20" y="716" width="350" height="39" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="195" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Cancelar sem enviar</text>
  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817" font-weight="700">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817">Eu</text></g>
  <g fill="none" stroke="#555555"><circle cx="39" cy="796" r="8"/><rect x="109" y="788" width="16" height="16"/><circle cx="195" cy="796" r="8" fill="#222222"/><path d="M265 804 L273 788 L281 804 Z"/><circle cx="351" cy="794" r="6"/><path d="M342 807 Q351 799 360 807"/></g>
</svg>
