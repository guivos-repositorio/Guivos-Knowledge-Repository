name: Temporary PR350 Final State Sync

on:
  push:
    branches:
      - agent/gkr-global-audit-lote-d-close-e-next-v1

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gkr-global-audit-lote-d-close-e-next-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PyYAML
      - name: Apply audited state synchronization
        run: python .github/tmp/pr350_final_sync.py
      - name: Validate repository
        run: |
          python scripts/validate_semantic_state.py
          python scripts/validate_gkr.py
          python scripts/validate_legacy_nomenclature.py
          git diff --check
          mkdocs build --strict --site-dir /tmp/gkr-site
      - name: Commit governed result and remove temporary tooling
        run: |
          rm -f .github/tmp/pr350_final_sync.py
          rm -f .github/workflows/temp-pr350-finish-state-sync.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          expected=$'.github/tmp/pr350_final_sync.py\n.github/workflows/temp-pr350-finish-state-sync.yml\nREADME.md\ndocs/index.md\ndocs/project/current-state-register.md\ndocs/roadmap.md'
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git commit -m "GKR: concluir sincronização do fechamento do Lote D"
          git push origin HEAD:agent/gkr-global-audit-lote-d-close-e-next-v1
