name: Temporary Restore Roadmap 13.1.0

on:
  push:
    branches:
      - agent/gkr-global-audit-lote-d-close-e-next-v1

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gkr-global-audit-lote-d-close-e-next-v1
          fetch-depth: 0
      - name: Restore authoritative Roadmap references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for name in ["README.md", "docs/index.md"]:
              p = Path(name)
              s = p.read_text(encoding="utf-8")
              count = s.count("13.2.0")
              if count != 2:
                  raise SystemExit(f"{name}: expected exactly 2 accidental 13.2.0 references, found {count}")
              s = s.replace("13.2.0", "13.1.0")
              p.write_text(s, encoding="utf-8")
          PY
          rm -f .github/workflows/temp-restore-roadmap-13-1.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          expected=$'.github/workflows/temp-restore-roadmap-13-1.yml\nREADME.md\ndocs/index.md'
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git commit -m "fix: restaurar referências do Roadmap 13.1.0"
          git push origin HEAD:agent/gkr-global-audit-lote-d-close-e-next-v1
