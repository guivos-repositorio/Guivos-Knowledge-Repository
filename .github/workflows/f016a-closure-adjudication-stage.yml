name: F-016 UXA-081-085 Post-Delete Read-Only Proof

on:
  push:
    branches:
      - agent/gkr-f016a-closure-adjudication-stage-v1

permissions:
  contents: read

jobs:
  post-delete-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact final canonical head read-only
        uses: actions/checkout@v4
        with:
          ref: 72a20d43f12d7efb9c646368ec009828c607924f
          fetch-depth: 1

      - name: Prove exact immutable input and cleanup closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          HEAD='72a20d43f12d7efb9c646368ec009828c607924f'
          TREE='872185d998a77e3610446a01b4f7f8f376e8b9fb'
          targets={f'UXA-{n:03d}' for n in range(81,86)}
          deleted={
            'UXA-081':'docs/experience-architecture/uxa-081-integrated-screen-gallery-and-coverage-audit.md',
            'UXA-082':'docs/experience-architecture/uxa-082-integrated-gallery-functional-visual-validation-and-gap-prioritization.md',
            'UXA-083':'docs/experience-architecture/uxa-083-controlled-integrated-gallery-and-inspection-sequence-reformulation.md',
            'UXA-084':'docs/experience-architecture/uxa-084-reformulated-integrated-gallery-functional-visual-revalidation.md',
            'UXA-085':'docs/experience-architecture/uxa-085-controlled-integrated-gallery-promotion-and-post-revalidation-synchronization.md',
          }

          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==HEAD
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip()==TREE
          assert not subprocess.check_output(['git','status','--porcelain']).decode().strip()

          absent=sum(not Path(p).exists() for p in deleted.values())
          assert absent==5
          print('UXA081_085_FILES_ABSENT=5/5')

          # No live Markdown links to deleted files anywhere in the current corpus.
          basenames={Path(p).name for p in deleted.values()}
          link_re=re.compile(r'\[[^\]]*\]\(([^)]+)\)')
          live_links=[]
          for p in Path('docs').rglob('*.md'):
              text=p.read_text(encoding='utf-8')
              for m in link_re.finditer(text):
                  target=m.group(1).split('#',1)[0].strip()
                  if Path(target).name in basenames:
                      live_links.append((str(p),m.group(1)))
          assert not live_links, live_links
          print('LIVE_MARKDOWN_LINKS_TO_DELETED_UXA081_085=0')

          mk=Path('mkdocs.yml').read_text(encoding='utf-8')
          nav_hits=[b for b in basenames if b in mk]
          assert not nav_hits, nav_hits
          print('MKDOCS_NAV_TO_DELETED_UXA081_085=0')

          # No structural depends_on/related references remain.
          dep=[]; rel=[]
          for p in Path('docs').rglob('*.md'):
              text=p.read_text(encoding='utf-8')
              if not text.startswith('---\n'): continue
              fm=text.split('---\n',2)[1].splitlines(); field=None
              for line in fm:
                  mkf=re.match(r'^([A-Za-z_][A-Za-z0-9_-]*):\s*$',line)
                  if mkf: field=mkf.group(1); continue
                  if re.match(r'^[A-Za-z_][A-Za-z0-9_-]*:',line): field=None; continue
                  mi=re.match(r'^\s*-\s*([^#\s]+)',line)
                  if mi and field in {'depends_on','related'}:
                      tok=mi.group(1).strip('"\'')
                      if tok in targets: (dep if field=='depends_on' else rel).append((str(p),tok))
          assert not dep and not rel, (dep,rel)
          print('STRUCTURAL_DEPENDS_ON_UXA081_085=0')
          print('STRUCTURAL_RELATED_UXA081_085=0')

          # Validator must explicitly govern the five absences.
          validator=Path('scripts/validate_semantic_state.py').read_text(encoding='utf-8')
          for n,b in deleted.items():
              num=int(n.split('-')[1])
              assert f'{num}: "{Path(b).name}"' in validator
          print('SEMANTIC_VALIDATOR_GOVERNED_ABSENCE=5/5')

          audit=Path('docs/project/gkr-full-corpus-audit.md').read_text(encoding='utf-8')
          assert 'version: 1.13.0' in audit
          assert '`UXA-081..085` removidos 5/5 após absorção' in audit
          print('F016_AUDIT_CLOSURE_RECORDED=PASS')

          # Prior physical/gallery cleanup remains closed.
          assert not list(Path('docs/journeys').glob('screen-gallery*.md'))
          svg_root=Path('docs/assets/wireframes')
          svg_count=sum(1 for _ in svg_root.rglob('*.svg')) if svg_root.exists() else 0
          assert svg_count==0
          print('SCREEN_GALLERY_FILES_CURRENT=0')
          print('PHYSICAL_SVG_COUNT=0')

          state=Path('docs/project/current-state-register.md').read_text(encoding='utf-8')
          for phrase in [
              'F-016\n→ OPEN / REPO-WIDE DOCUMENTATION DEMATERIALIZATION',
              'J / K / L / M / N\n→ NOT RELEASED AUTOMATICALLY',
              'UXA-102 / V5\n→ NOT_STARTED',
              'PRODUCT ENGINEERING\n→ PAUSED BEFORE W0-01',
              'MATERIALIZAÇÃO VISUAL DAS HOMES\n→ NOT AUTHORIZED DURING FULL-CORPUS AUDIT',
          ]:
              assert phrase in state
          print('DOWNSTREAM_GUARDRAILS_PRESERVED=PASS')
          print('F016_UXA081_085_POSTDELETE_STRUCTURAL_PROOF=SUCCESS')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PyYAML

      - name: Validate semantic state
        run: python scripts/validate_semantic_state.py

      - name: Validate repository structure links and navigation
        run: python scripts/validate_gkr.py

      - name: Validate legacy nomenclature
        run: python scripts/validate_legacy_nomenclature.py

      - name: Build MkDocs strict
        run: mkdocs build --strict --site-dir /tmp/gkr-site

      - name: Confirm exact final head tree and clean tracked checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "72a20d43f12d7efb9c646368ec009828c607924f"
          test "$(git rev-parse HEAD^{tree})" = "872185d998a77e3610446a01b4f7f8f376e8b9fb"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo F016_UXA081_085_POSTDELETE_READ_ONLY=SUCCESS
