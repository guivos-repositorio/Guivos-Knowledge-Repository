name: F-016 UXA-081-085 Semantic Receiver Read-Only Proof

on:
  push:
    branches:
      - agent/gkr-f016a-closure-adjudication-stage-v1

permissions:
  contents: read

jobs:
  receiver-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact canonical head read-only
        uses: actions/checkout@v4
        with:
          ref: 78534bf86acdc5da5f76e558b0df2347e6b5a111
          fetch-depth: 1

      - name: Verify exact immutable input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "78534bf86acdc5da5f76e558b0df2347e6b5a111"
          test "$(git rev-parse HEAD^{tree})" = "6ca8bc3f3691a4ba7ac322d96cf43119e293c3d4"
          test -z "$(git status --porcelain)"

      - name: Prove external dependencies and semantic receivers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          targets={f'UXA-{n:03d}' for n in range(81,86)}
          target_paths={}
          for p in Path('docs').rglob('*.md'):
              t=p.read_text(encoding='utf-8')
              m=re.search(r'(?m)^id:\s*(UXA-08[1-5])\s*$',t)
              if m: target_paths[m.group(1)]=p
          assert set(target_paths)==targets

          def fm_relations(text):
              if not text.startswith('---\n'): return {'depends_on':[],'related':[]}
              fm=text.split('---\n',2)[1].splitlines()
              out={'depends_on':[],'related':[]}; key=None
              for line in fm:
                  if re.match(r'^[A-Za-z_][A-Za-z0-9_-]*:\s*$',line):
                      key=line.split(':',1)[0]
                      continue
                  if re.match(r'^[A-Za-z_][A-Za-z0-9_-]*:',line):
                      key=None
                      continue
                  m=re.match(r'^\s*-\s*([^#\s]+)',line)
                  if m and key in out: out[key].append(m.group(1).strip('"\''))
              return out

          external_dep=[]; external_rel=[]
          for p in Path('docs').rglob('*.md'):
              text=p.read_text(encoding='utf-8')
              mm=re.search(r'(?m)^id:\s*([^\s#]+)\s*$',text)
              source=mm.group(1) if mm else str(p)
              if source in targets: continue
              rel=fm_relations(text)
              for field,bucket in [('depends_on',external_dep),('related',external_rel)]:
                  for x in rel[field]:
                      if x in targets: bucket.append((x,source,str(p)))
          print('EXTERNAL_DEPENDS_ON_COUNT',len(external_dep),sep='\t')
          for row in external_dep: print('EXTERNAL_DEPENDS_ON',*row,sep='\t')
          print('EXTERNAL_RELATED_COUNT',len(external_rel),sep='\t')
          for row in external_rel: print('EXTERNAL_RELATED',*row,sep='\t')

          # Physical/gallery layer no longer exists as a current receiver.
          galleries=list(Path('docs/journeys').glob('screen-gallery*.md'))
          svg_root=Path('docs/assets/wireframes')
          svg_count=sum(1 for _ in svg_root.rglob('*.svg')) if svg_root.exists() else 0
          assert not galleries, [str(x) for x in galleries]
          assert svg_count==0
          print('SCREEN_GALLERY_FILES_CURRENT=0')
          print('PHYSICAL_SVG_COUNT=0')

          surf=Path('docs/journeys/surface-registry.md').read_text(encoding='utf-8')
          trn=Path('docs/journeys/transition-registry.md').read_text(encoding='utf-8')
          gaps=Path('docs/journeys/gaps.md').read_text(encoding='utf-8')
          oc=Path('docs/experience-architecture/organizations-collectives-ux-state.md').read_text(encoding='utf-8')
          state=Path('docs/project/current-state-register.md').read_text(encoding='utf-8')

          # UXA-081/082 person sequence and former continuity gaps are governed by current registries.
          for token in ['GKR-SURF-PER-001','GKR-SURF-PER-002','GKR-SURF-PER-003','GKR-SURF-PER-004','GKR-SURF-PER-005','GKR-SURF-PER-006','GKR-SURF-PER-007','GKR-SURF-PER-008']:
              assert token in surf
          for token in ['GKR-TRN-001','GKR-TRN-002','GKR-TRN-003','GKR-TRN-004','GKR-TRN-005','GKR-TRN-006','GKR-TRN-007']:
              assert token in trn
          assert '| GKR-TRN-007 | PER-007 | PER-008 | **integralmente validada** | UXA-097 |' in trn
          print('RECEIVER_PERSON_SEQUENCE_CURRENT_REGISTRIES=PASS')

          # UXA-082/083 Collective dependency/order survives functionally, without preserving old visual priority as authority.
          for token in ['GKR-SURF-COL-002','GKR-SURF-COL-003','GKR-SURF-PER-106','GKR-SURF-PER-107','GKR-SURF-PER-108']:
              assert token in surf
          for token in ['GKR-TRN-108','GKR-TRN-110','GKR-TRN-111','GKR-TRN-112']:
              assert token in trn
          assert 'Os wireframes da experiência autenticada de Organizações e Coletivos ainda não foram definidos.' in oc
          assert 'mapa final de superfícies' in oc and 'wireframe' in oc
          print('RECEIVER_COLLECTIVE_FUNCTIONAL_DEPENDENCY=PASS')
          print('OLD_COLLECTIVE_VISUAL_PRIORITY_NOT_CURRENT_AUTHORITY=PASS')

          # UXA-081/084/085 Opportunity Boost residual-state caveat superseded by UXA-099 while transition nuance remains.
          assert '| dez estados residuais UXA-055 | COM-005 | 10 SVGs | **validado por UXA-099** | nenhuma pendência específica dos SVGs |' in gaps
          assert '| GKR-TRN-305 | COM-004 | COM-005 | **parcial** | COM-005 validado pela UXA-099; ligação origem→estado residual ainda não examinada ponta a ponta |' in trn
          print('RECEIVER_OPPORTUNITY_RESIDUAL_STATES=PASS')

          # Former continuity caveats are now represented with current per-transition maturity.
          for token in ['GKR-TRN-203','GKR-TRN-204','GKR-TRN-205','GKR-TRN-210','GKR-TRN-211','GKR-TRN-304','GKR-TRN-305','GKR-TRN-306']:
              assert token in trn
          print('RECEIVER_CURRENT_CONTINUITY_MATURITY=PASS')

          # Old quantitative gallery state is structurally obsolete; current structural count is explicit and independent.
          assert '| **Total** | **57** |' in surf
          assert 'A contagem de IDs permanece estrutural. Ela não implica que todos estejam materializados ou validados.' in surf
          print('OLD_97SVG_40ID_GALLERY_COUNTS_NOT_CURRENT_STATE=PASS')

          # Current O/C sequencing and design boundary supersede old materialization queue.
          assert 'Arquitetura da Informação — definida em `GKR-UX-ORGCOL-AUTH-IA-001`, em estado pré-mapa de superfícies' in oc
          assert 'construir wireframes de baixa fidelidade **somente quando essa materialização estiver autorizada**' in oc
          assert 'Design é a autoridade exclusiva para wireframes, mockups, protótipos, layout e materialização visual.' in oc
          print('RECEIVER_ORGCOL_CURRENT_SEQUENCE_AND_DESIGN_BOUNDARY=PASS')

          # Global guardrails remain independently current.
          for phrase in [
              'F-016\n→ OPEN / REPO-WIDE DOCUMENTATION DEMATERIALIZATION',
              'UXA-102 / V5\n→ NOT_STARTED',
              'PRODUCT ENGINEERING\n→ PAUSED BEFORE W0-01',
              'MATERIALIZAÇÃO VISUAL DAS HOMES\n→ NOT AUTHORIZED DURING FULL-CORPUS AUDIT',
          ]:
              assert phrase in state
          print('RECEIVER_GLOBAL_GUARDRAILS=PASS')

          # UXA-086 is the sole expected live sequential depends_on outside family; its substantive authorities are independent.
          u86=Path('docs/experience-architecture/uxa-086-collective-responsible-overview-low-fidelity-wireframe.md').read_text(encoding='utf-8')
          assert ('UXA-085','UXA-086','docs/experience-architecture/uxa-086-collective-responsible-overview-low-fidelity-wireframe.md') in external_dep
          for token in ['UXA-014','UXA-056','UXA-058','UXA-059','UXA-080','GKR-JOURNEY-SURFACE-REGISTRY-001','GKR-JOURNEY-TRANSITION-REGISTRY-001']:
              assert token in u86
          assert 'F-016-A — desmaterialização física' in u86
          print('UXA086_EXTERNAL_UXA085_DEPENDENCY_IDENTIFIED=PASS')
          print('UXA086_SUBSTANTIVE_RECEIVERS_INDEPENDENT=PASS')

          # Current indexes only need coordinated reference reconciliation if target family is ever deleted.
          idx=Path('docs/experience-architecture/uxa-047-101-index.md').read_text(encoding='utf-8')
          assert 'Índice Vigente das Frentes UXA-047 a UXA-101' in idx
          for ident,p in sorted(target_paths.items()):
              assert p.name in idx
          print('CURRENT_INDEX_LINK_RECONCILIATION_REQUIRED=5')

          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()=='78534bf86acdc5da5f76e558b0df2347e6b5a111'
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip()=='6ca8bc3f3691a4ba7ac322d96cf43119e293c3d4'
          assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=no']).decode().strip()
          print('F016_UXA081_085_SEMANTIC_RECEIVER_READ_ONLY=SUCCESS')
          PY

      - name: Confirm exact head tree and clean tracked checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "78534bf86acdc5da5f76e558b0df2347e6b5a111"
          test "$(git rev-parse HEAD^{tree})" = "6ca8bc3f3691a4ba7ac322d96cf43119e293c3d4"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo F016_UXA081_085_RECEIVER_INPUT_PRESERVED=SUCCESS
