name: F-016 UXA-081-085 Cleanup Candidate Proof v2

on:
  push:
    branches:
      - agent/gkr-f016a-closure-adjudication-stage-v1

permissions:
  contents: read

jobs:
  cleanup-candidate-proof-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact canonical head read-only
        uses: actions/checkout@v4
        with:
          ref: 78534bf86acdc5da5f76e558b0df2347e6b5a111
          fetch-depth: 1

      - name: Verify exact immutable input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "78534bf86acdc5da5f76e558b0df2347e6b5a111"
          test "$(git rev-parse HEAD^{tree})" = "6ca8bc3f3691a4ba7ac322d96cf43119e293c3d4"
          test -z "$(git status --porcelain)"

      - name: Apply exact bounded candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          HEAD='78534bf86acdc5da5f76e558b0df2347e6b5a111'
          TREE='6ca8bc3f3691a4ba7ac322d96cf43119e293c3d4'
          targets={f'UXA-{n:03d}' for n in range(81,86)}
          deleted={
            'UXA-081':'docs/experience-architecture/uxa-081-integrated-screen-gallery-and-coverage-audit.md',
            'UXA-082':'docs/experience-architecture/uxa-082-integrated-gallery-functional-visual-validation-and-gap-prioritization.md',
            'UXA-083':'docs/experience-architecture/uxa-083-controlled-integrated-gallery-and-inspection-sequence-reformulation.md',
            'UXA-084':'docs/experience-architecture/uxa-084-reformulated-integrated-gallery-functional-visual-revalidation.md',
            'UXA-085':'docs/experience-architecture/uxa-085-controlled-integrated-gallery-promotion-and-post-revalidation-synchronization.md',
          }

          relations={
            'docs/experience-architecture/uxa-086-collective-responsible-overview-low-fidelity-wireframe.md': {'UXA-085'},
            'docs/journeys/screen-catalog.md': {'UXA-085'},
            'docs/journeys/index.md': {'UXA-085'},
            'docs/project/uxa-085-pr-checkpoint.md': {'UXA-085'},
            'docs/project/canonical-consolidation-addenda-index.md': {'UXA-084'},
            'docs/project/p1-post-uxa084-rebaseline-2026-08-06.md': {'UXA-084'},
            'docs/project/changelog-uxa-085-2026-08-07.md': {'UXA-085'},
            'docs/experience-architecture/uxa-047-098-index.md': {'UXA-085'},
            'docs/experience-architecture/uxa-047-084-index.md': {'UXA-084','UXA-085'},
            'docs/experience-architecture/uxa-047-085-index.md': {'UXA-085'},
            'docs/experience-architecture/index.md': {'UXA-085'},
          }

          expected_modified=set(relations) | {
            'docs/experience-architecture/uxa-047-101-index.md',
            'docs/index.md',
            'docs/project/gkr-full-corpus-audit.md',
            'mkdocs.yml',
          }
          expected_deleted=set(deleted.values())

          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==HEAD
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip()==TREE

          def remove_frontmatter_tokens(path, tokens):
              p=Path(path); text=p.read_text(encoding='utf-8')
              assert text.startswith('---\n')
              first, fm, body=text.split('---\n',2)
              lines=fm.splitlines(keepends=True)
              field=None; removed=[]; out=[]
              for line in lines:
                  stripped=line.rstrip('\n')
                  mk=re.match(r'^([A-Za-z_][A-Za-z0-9_-]*):\s*$',stripped)
                  if mk:
                      field=mk.group(1); out.append(line); continue
                  if re.match(r'^[A-Za-z_][A-Za-z0-9_-]*:',stripped):
                      field=None; out.append(line); continue
                  mi=re.match(r'^(\s*)-\s*([^#\s]+)(.*)$',stripped)
                  if mi and field in {'depends_on','related'}:
                      token=mi.group(2).strip('"\'')
                      if token in tokens:
                          removed.append((field,token))
                          continue
                  out.append(line)
              assert {tok for _,tok in removed}==tokens, (path,removed,tokens)
              p.write_text('---\n'+''.join(out)+'---\n'+body,encoding='utf-8')
              return removed

          all_removed=[]
          for path,toks in relations.items():
              removed=remove_frontmatter_tokens(path,toks)
              all_removed.extend((path,field,tok) for field,tok in removed)
          dep_count=sum(1 for _,field,_ in all_removed if field=='depends_on')
          rel_count=sum(1 for _,field,_ in all_removed if field=='related')
          assert dep_count==1, dep_count
          assert rel_count==11, rel_count
          print('STRUCTURAL_DEPENDS_ON_REMOVED=1')
          print('STRUCTURAL_RELATED_REMOVED=11')

          link_targets={Path(v).name:k for k,v in deleted.items()}
          link_removed=0
          link_re=re.compile(r'\[([^\]]+)\]\(([^)]+)\)')
          for path in [
              'docs/experience-architecture/uxa-047-098-index.md',
              'docs/experience-architecture/uxa-047-101-index.md',
          ]:
              p=Path(path); old=p.read_text(encoding='utf-8')
              def repl(m):
                  nonlocal_holder=None
                  target=Path(m.group(2).split('#',1)[0].strip()).name
                  if target in link_targets:
                      return m.group(1)
                  return m.group(0)
              for m in link_re.finditer(old):
                  target=Path(m.group(2).split('#',1)[0].strip()).name
                  if target in link_targets: link_removed+=1
              p.write_text(link_re.sub(repl,old),encoding='utf-8')
          assert link_removed==10, link_removed
          print('LIVE_INDEX_LINKS_NEUTRALIZED=10')

          mk=Path('mkdocs.yml'); lines=mk.read_text(encoding='utf-8').splitlines(keepends=True)
          matching=[ln for ln in lines if deleted['UXA-081'].replace('docs/','') in ln]
          assert len(matching)==1, matching
          mk.write_text(''.join(ln for ln in lines if deleted['UXA-081'].replace('docs/','') not in ln),encoding='utf-8')
          print('MKDOCS_UXA081_NAV_REMOVED=1')

          p=Path('docs/index.md'); old=p.read_text(encoding='utf-8')
          needle='A próxima subfrente é exclusivamente documental: classificar produtores de low-fidelity, documentos de validação/programação, ciclo `UXA-081..085`, galerias e demais materializações sem presumir remoção.'
          repl='A próxima subfrente é exclusivamente documental: classificar produtores de low-fidelity, documentos de validação/programação e demais materializações sem presumir remoção.'
          assert old.count(needle)==1
          p.write_text(old.replace(needle,repl),encoding='utf-8')
          print('DOCS_INDEX_NEXT_SUBFRONT_RECONCILED=PASS')

          p=Path('docs/project/gkr-full-corpus-audit.md'); old=p.read_text(encoding='utf-8')
          oldrow='| F-016 | Major | corpus ainda contém documentos de materialização e linguagem de UI que podem competir com Design; camada física SVG e família `screen-gallery*` já foram desmaterializadas após prova de absorção | `REMOVE_AFTER_ABSORPTION + REWRITE` | **OPEN — F-016-A RESOLVED; família `screen-gallery*` removida 8/8 após absorção; demais famílias Markdown continuam em auditoria** |'
          newrow='| F-016 | Major | corpus ainda contém documentos de materialização e linguagem de UI que podem competir com Design; camada física SVG, família `screen-gallery*` e ciclo `UXA-081..085` já foram desmaterializados após prova de absorção | `REMOVE_AFTER_ABSORPTION + REWRITE` | **OPEN — F-016-A RESOLVED; `screen-gallery*` removida 8/8 e `UXA-081..085` removidos 5/5 após absorção; demais famílias Markdown continuam em auditoria** |'
          assert old.count('version: 1.12.0')==1
          assert old.count(oldrow)==1
          p.write_text(old.replace('version: 1.12.0','version: 1.13.0',1).replace(oldrow,newrow,1),encoding='utf-8')
          print('F016_AUDIT_CANDIDATE_RECONCILED=PASS')

          for ident,path in deleted.items():
              p=Path(path); assert p.exists(), (ident,path); p.unlink()
          print('TARGET_DELETIONS=5')

          # Post-candidate structural proof: only frontmatter structural references are forbidden.
          remaining_dep=[]; remaining_rel=[]
          for path in subprocess.check_output(['git','ls-files','docs/*.md','docs/**/*.md']).decode().splitlines():
              p=Path(path)
              if not p.exists(): continue
              text=p.read_text(encoding='utf-8')
              if not text.startswith('---\n'): continue
              fm=text.split('---\n',2)[1].splitlines()
              field=None
              for line in fm:
                  mk=re.match(r'^([A-Za-z_][A-Za-z0-9_-]*):\s*$',line)
                  if mk: field=mk.group(1); continue
                  if re.match(r'^[A-Za-z_][A-Za-z0-9_-]*:',line): field=None; continue
                  mi=re.match(r'^\s*-\s*([^#\s]+)',line)
                  if mi and field in {'depends_on','related'}:
                      tok=mi.group(1).strip('"\'')
                      if tok in targets:
                          (remaining_dep if field=='depends_on' else remaining_rel).append((path,tok))
          assert not remaining_dep, remaining_dep
          assert not remaining_rel, remaining_rel
          print('POST_CANDIDATE_STRUCTURAL_DEPENDS_ON=0')
          print('POST_CANDIDATE_STRUCTURAL_RELATED=0')

          # Exact bounded delta.
          rows=subprocess.check_output(['git','status','--porcelain']).decode().splitlines()
          modified={r[3:] for r in rows if r[:2].strip()=='M'}
          deleted_now={r[3:] for r in rows if r[:2].strip()=='D'}
          other=[r for r in rows if r[:2].strip() not in {'M','D'}]
          assert modified==expected_modified, ('modified mismatch',sorted(modified^expected_modified),sorted(modified))
          assert deleted_now==expected_deleted, ('deleted mismatch',sorted(deleted_now^expected_deleted),sorted(deleted_now))
          assert not other, other
          print('EXACT_MODIFIED_COUNT=15')
          print('EXACT_DELETED_COUNT=5')
          print('EXACT_CHANGED_PATHS=20')
          for r in rows: print('CANDIDATE_STATUS',r,sep='\t')

          state=Path('docs/project/current-state-register.md').read_text(encoding='utf-8')
          for phrase in [
              'F-016\n→ OPEN / REPO-WIDE DOCUMENTATION DEMATERIALIZATION',
              'J / K / L / M / N\n→ NOT RELEASED AUTOMATICALLY',
              'UXA-102 / V5\n→ NOT_STARTED',
              'PRODUCT ENGINEERING\n→ PAUSED BEFORE W0-01',
              'MATERIALIZAÇÃO VISUAL DAS HOMES\n→ NOT AUTHORIZED DURING FULL-CORPUS AUDIT',
          ]:
              assert phrase in state
          print('DOWNSTREAM_GUARDRAILS_PRESERVED=PASS')

          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==HEAD
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip()==TREE
          print('F016_UXA081_085_CANDIDATE_APPLIED_EPHEMERALLY=SUCCESS')
          PY

      - name: Show exact candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --stat
          git diff --name-status

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PyYAML

      - name: Validate semantic state
        run: python scripts/validate_semantic_state.py

      - name: Validate repository structure links and navigation
        run: python scripts/validate_gkr.py

      - name: Validate legacy nomenclature
        run: python scripts/validate_legacy_nomenclature.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Build MkDocs strict
        run: mkdocs build --strict --site-dir /tmp/gkr-site

      - name: Confirm exact immutable canonical objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "78534bf86acdc5da5f76e558b0df2347e6b5a111"
          test "$(git rev-parse HEAD^{tree})" = "6ca8bc3f3691a4ba7ac322d96cf43119e293c3d4"
          test -n "$(git status --porcelain --untracked-files=no)"
          echo F016_UXA081_085_CLEANUP_CANDIDATE_PROOF_V2=SUCCESS
