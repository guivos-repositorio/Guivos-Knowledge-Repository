name: F-016 Gallery Second-Order Reference Proof

on:
  push:
    branches:
      - agent/gkr-f016a-closure-adjudication-stage-v1

permissions:
  contents: read

jobs:
  second-order-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact canonical PR head read-only
        uses: actions/checkout@v4
        with:
          ref: b6dd6c35a3d72049299c4f8f44e7a4ab8cd59938
          fetch-depth: 1

      - name: Verify exact canonical input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b6dd6c35a3d72049299c4f8f44e7a4ab8cd59938"
          test "$(git rev-parse HEAD^{tree})" = "138a24d79e798fc38742a2c2e60a7091abf1d150"
          test -z "$(git status --porcelain)"

      - name: Prove second-order references and R01-R34 usage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          galleries = [
            'docs/journeys/screen-gallery.md',
            'docs/journeys/screen-gallery-traceability-matrix.md',
            'docs/journeys/screen-gallery-person.md',
            'docs/journeys/screen-gallery-opportunities-organization.md',
            'docs/journeys/screen-gallery-collectives.md',
            'docs/journeys/screen-gallery-opportunity-boost-exposure.md',
            'docs/journeys/screen-gallery-opportunity-boost-operations.md',
            'docs/journeys/screen-gallery-plans-billing.md',
          ]
          gset = set(galleries)
          text_exts = {'.md','.yml','.yaml','.py','.sh','.json','.toml','.txt'}
          tracked = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          texts = {}
          for rel in tracked:
            if not rel: continue
            p=Path(rel)
            if p.is_file() and (p.suffix.lower() in text_exts or rel=='mkdocs.yml'):
              try: texts[rel]=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: pass

          def fm(text):
            out={}
            if not text.startswith('---\n'): return out
            end=text.find('\n---\n',4)
            if end<0: return out
            for line in text[4:end].splitlines():
              m=re.match(r'^([A-Za-z0-9_-]+):\s*(.*?)\s*$', line)
              if m and m.group(2): out[m.group(1)]=m.group(2).strip().strip('"\'')
            return out

          metas={rel:fm(txt) for rel,txt in texts.items() if rel.endswith('.md')}
          print('=== GALLERY INBOUND REFERENCES ===')
          for target in galleries:
            tmeta=metas.get(target,{})
            docid=tmeta.get('id')
            base=Path(target).name
            hits=[]
            for src,txt in sorted(texts.items()):
              if src==target: continue
              for i,line in enumerate(txt.splitlines(),1):
                reasons=[]
                if base in line: reasons.append('basename')
                if docid and docid in line: reasons.append('id')
                if reasons:
                  hits.append((src,i,'+'.join(reasons),line.strip()))
            print(f'TARGET\t{target}\tID={docid}\tINBOUND_LINES={len(hits)}')
            for src,i,reasons,line in hits:
              sm=metas.get(src,{})
              print('INBOUND\t{}\t{}:{}\t{}\tsrc_status={}\tsrc_maturity={}\t{}'.format(
                target,src,i,reasons,sm.get('status'),sm.get('maturity'),line[:700]))

          print('=== R01-R34 OUTSIDE TRACEABILITY MATRIX ===')
          matrix='docs/journeys/screen-gallery-traceability-matrix.md'
          for n in range(1,35):
            token=f'R{n:02d}'
            pat=re.compile(r'(?<![A-Za-z0-9_-])'+re.escape(token)+r'(?![A-Za-z0-9_-])')
            occ=[]
            for src,txt in sorted(texts.items()):
              if src==matrix: continue
              for i,line in enumerate(txt.splitlines(),1):
                if pat.search(line): occ.append((src,i,line.strip()))
            print(f'PROFILE\t{token}\tOUTSIDE_MATRIX={len(occ)}')
            for src,i,line in occ:
              sm=metas.get(src,{})
              print(f'PROFILE_REF\t{token}\t{src}:{i}\tsrc_status={sm.get("status")}\t{line[:700]}')

          print('=== CANONICAL REGISTRY DEPENDENCY CHECK ===')
          for reg in ['docs/journeys/surface-registry.md','docs/journeys/transition-registry.md']:
            txt=texts[reg]
            refs=[]
            for g in galleries:
              base=Path(g).name
              docid=metas.get(g,{}).get('id')
              if base in txt or (docid and docid in txt): refs.append(g)
            print(f'REGISTRY\t{reg}\tGALLERY_DEPENDENCIES={len(refs)}\t{refs}')

          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip() == 'b6dd6c35a3d72049299c4f8f44e7a4ab8cd59938'
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip() == '138a24d79e798fc38742a2c2e60a7091abf1d150'
          assert not subprocess.check_output(['git','status','--porcelain']).decode().strip()
          print('F016_GALLERY_SECOND_ORDER_CANONICAL_READ_ONLY=SUCCESS')
          PY
