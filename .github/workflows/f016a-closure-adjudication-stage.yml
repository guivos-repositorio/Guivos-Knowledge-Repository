name: F-016 Markdown Materialization Inventory

on:
  push:
    branches:
      - agent/gkr-f016a-closure-adjudication-stage-v1

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/gkr-f016a-closure-adjudication-stage-v1
          path: stage
          fetch-depth: 0
      - name: Checkout exact canonical PR head
        uses: actions/checkout@v4
        with:
          ref: b6dd6c35a3d72049299c4f8f44e7a4ab8cd59938
          path: canonical
          fetch-depth: 0
      - name: Verify exact canonical input
        working-directory: canonical
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b6dd6c35a3d72049299c4f8f44e7a4ab8cd59938"
          test "$(git rev-parse HEAD^{tree})" = "138a24d79e798fc38742a2c2e60a7091abf1d150"
          test -z "$(git status --porcelain)"
          echo "CANONICAL_HEAD=b6dd6c35a3d72049299c4f8f44e7a4ab8cd59938"
          echo "CANONICAL_TREE=138a24d79e798fc38742a2c2e60a7091abf1d150"
      - name: Build deterministic read-only inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import collections
          import json
          import re

          ROOT = Path('canonical')
          OUT = Path('stage/tmp')
          OUT.mkdir(parents=True, exist_ok=True)
          HEAD = 'b6dd6c35a3d72049299c4f8f44e7a4ab8cd59938'
          TREE = '138a24d79e798fc38742a2c2e60a7091abf1d150'

          md_paths = sorted(p for p in ROOT.rglob('*.md') if '.git' not in p.parts)
          rels = [p.relative_to(ROOT).as_posix() for p in md_paths]
          rel_set = set(rels)

          def read(rel):
              return (ROOT / rel).read_text(encoding='utf-8')

          texts = {rel: read(rel) for rel in rels}

          def frontmatter(text):
              if not text.startswith('---\n'):
                  return {}
              end = text.find('\n---\n', 4)
              if end < 0:
                  return {}
              block = text[4:end]
              out = {}
              for line in block.splitlines():
                  m = re.match(r'^([A-Za-z0-9_-]+):\s*(.*?)\s*$', line)
                  if m:
                      value = m.group(2).strip().strip('"\'')
                      out[m.group(1)] = value
              return out

          def title_from_text(text):
              m = re.search(r'^#\s+(.+?)\s*$', text, re.M)
              return m.group(1).strip() if m else None

          fm = {rel: frontmatter(texts[rel]) for rel in rels}
          ids = {}
          for rel in rels:
              doc_id = fm[rel].get('id') or fm[rel].get('ID')
              if doc_id:
                  ids[rel] = doc_id

          id_to_rel = collections.defaultdict(list)
          for rel, doc_id in ids.items():
              id_to_rel[doc_id].append(rel)

          path_terms = re.compile(r'(wireframe|materialization|materialisation|materializacao|materialização|screen-gallery|gallery)', re.I)
          strict_path = sorted(rel for rel in rels if path_terms.search(rel))

          asset_pat = re.compile(r'(?:docs/)?assets/wireframes/[^\s)\]"\'<>]+\.svg', re.I)
          direct_asset = sorted(rel for rel in rels if asset_pat.search(texts[rel]))

          vocab_pat = re.compile(r'\b(wireframes?|mockups?|prototype|prototypes|protótipo|protótipos|materialization|materialisation|materialização|materializações|svg|gallery|galeria|galerias)\b', re.I)
          broad_vocab = sorted(rel for rel in rels if vocab_pat.search(texts[rel]))

          # Candidate core is path-driven only. This avoids deletion-oriented inference from broad text matches.
          candidates = strict_path

          # Parse explicit Markdown links to .md and resolve relative targets when possible.
          md_link_pat = re.compile(r'!?\[[^\]]*\]\(([^)\n]+?\.md(?:#[^)\n]*)?)\)', re.I)
          outgoing = collections.defaultdict(set)
          inbound = collections.defaultdict(set)
          for rel in rels:
              base = Path(rel).parent
              for raw in md_link_pat.findall(texts[rel]):
                  target = raw.split('#', 1)[0].split('?', 1)[0].strip()
                  if target.startswith(('http://', 'https://')):
                      continue
                  target = target.lstrip('/')
                  resolved = (base / target).as_posix()
                  # Normalize ./ and ../ without touching filesystem.
                  parts = []
                  for part in Path(resolved).parts:
                      if part == '.':
                          continue
                      if part == '..':
                          if parts: parts.pop()
                      else:
                          parts.append(part)
                  resolved = '/'.join(parts)
                  if resolved in rel_set:
                      outgoing[rel].add(resolved)
                      inbound[resolved].add(rel)

          # Strong textual inbound evidence: exact filename and exact frontmatter ID mentions.
          textual_inbound = collections.defaultdict(set)
          for cand in candidates:
              basename = Path(cand).name
              doc_id = ids.get(cand)
              for src in rels:
                  if src == cand:
                      continue
                  text = texts[src]
                  if basename in text or (doc_id and doc_id in text):
                      textual_inbound[cand].add(src)

          def term_count(text, pattern):
              return len(re.findall(pattern, text, re.I))

          family_order = [
              'low_fidelity_wireframe',
              'uxa_014_018',
              'uxa_081_085',
              'screen_gallery',
              'pre_wireframe_audit',
              'other_path_materialization',
          ]

          def family(rel, doc_id):
              low = rel.lower()
              idu = (doc_id or '').upper()
              if 'low-fidelity-wireframe' in low:
                  return 'low_fidelity_wireframe'
              if re.fullmatch(r'UXA-0(14|15|16|17|18)', idu):
                  return 'uxa_014_018'
              if re.fullmatch(r'UXA-0(81|82|83|84|85)', idu):
                  return 'uxa_081_085'
              if 'screen-gallery' in low:
                  return 'screen_gallery'
              if 'pre-wireframe-functional-audit' in low:
                  return 'pre_wireframe_audit'
              return 'other_path_materialization'

          status_markers = {
              'historical': re.compile(r'historical|histórico|histórica|provenance|proveniência', re.I),
              'superseded': re.compile(r'superseded|superado|superada|substitu[ií]do|substitu[ií]da', re.I),
              'deprecated': re.compile(r'deprecated|deprecat', re.I),
              'removed': re.compile(r'removed|removido|removida|deleted|delet', re.I),
              'resolved': re.compile(r'\bresolved\b|\bresolvido\b|\bresolvida\b', re.I),
              'current': re.compile(r'\bcurrent\b|\bcorrente\b|\bvigente\b|\bcan[oô]nic[oa]\b', re.I),
              'not_authorized': re.compile(r'not[_ -]authorized|n[aã]o autorizado|n[aã]o autorizada', re.I),
          }

          records = []
          for rel in candidates:
              text = texts[rel]
              doc_id = ids.get(rel)
              record = {
                  'path': rel,
                  'id': doc_id,
                  'version': fm[rel].get('version'),
                  'status': fm[rel].get('status'),
                  'type': fm[rel].get('type'),
                  'title': title_from_text(text),
                  'family': family(rel, doc_id),
                  'line_count': text.count('\n') + 1,
                  'asset_wireframe_ref_count': len(asset_pat.findall(text)),
                  'vocabulary_counts': {
                      'wireframe': term_count(text, r'\bwireframes?\b'),
                      'mockup': term_count(text, r'\bmockups?\b'),
                      'prototype': term_count(text, r'\b(?:prototype|prototypes|protótipo|protótipos)\b'),
                      'materialization': term_count(text, r'\b(?:materialization|materialisation|materialização|materializações)\b'),
                      'svg': term_count(text, r'\bsvg\b'),
                      'gallery': term_count(text, r'\b(?:gallery|galeria|galerias)\b'),
                  },
                  'markers': {name: bool(pat.search(text)) for name, pat in status_markers.items()},
                  'explicit_md_inbound_count': len(inbound.get(rel, set())),
                  'explicit_md_inbound': sorted(inbound.get(rel, set())),
                  'textual_filename_or_id_inbound_count': len(textual_inbound.get(rel, set())),
                  'textual_filename_or_id_inbound': sorted(textual_inbound.get(rel, set())),
                  'outgoing_md_count': len(outgoing.get(rel, set())),
                  'outgoing_md': sorted(outgoing.get(rel, set())),
              }
              records.append(record)

          family_counts = collections.Counter(r['family'] for r in records)
          summary = {
              'canonical_head': HEAD,
              'canonical_tree': TREE,
              'total_markdown': len(rels),
              'strict_path_candidate_count': len(strict_path),
              'direct_asset_wireframe_reference_doc_count': len(direct_asset),
              'broad_materialization_vocabulary_doc_count': len(broad_vocab),
              'family_counts': {k: family_counts.get(k, 0) for k in family_order},
              'physical_svg_count': len(list((ROOT / 'docs/assets/wireframes').rglob('*.svg'))) if (ROOT / 'docs/assets/wireframes').exists() else 0,
              'classification_policy': 'inventory_evidence_only_no_cleanup_classification',
          }

          payload = {
              'summary': summary,
              'strict_path_candidates': records,
              'direct_asset_wireframe_reference_docs': direct_asset,
              'broad_materialization_vocabulary_docs': broad_vocab,
          }
          json_path = OUT / 'f016-markdown-materialization-inventory-b6dd6c35.json'
          json_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lines = [
              '# F-016 Markdown materialization inventory — read-only evidence',
              '',
              f'- canonical head: `{HEAD}`',
              f'- canonical tree: `{TREE}`',
              f'- total Markdown: **{len(rels)}**',
              f'- strict path candidates: **{len(strict_path)}**',
              f'- docs with direct `assets/wireframes/*.svg` refs: **{len(direct_asset)}**',
              f'- docs with broad materialization vocabulary: **{len(broad_vocab)}**',
              f'- physical SVG count: **{summary["physical_svg_count"]}**',
              '- policy: **inventory evidence only; no cleanup classification inferred by regex**',
              '',
              '## Family counts',
              '',
          ]
          for fam in family_order:
              lines.append(f'- `{fam}`: **{family_counts.get(fam, 0)}**')
          lines += ['', '## Strict path candidates', '']
          for r in records:
              lines.append(
                  f'- `{r["path"]}` — id=`{r["id"]}` — family=`{r["family"]}` — '
                  f'inbound_explicit={r["explicit_md_inbound_count"]} — inbound_textual={r["textual_filename_or_id_inbound_count"]} — '
                  f'asset_refs={r["asset_wireframe_ref_count"]}'
              )
          md_path = OUT / 'f016-markdown-materialization-inventory-b6dd6c35.md'
          md_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print('STRICT_PATH_CANDIDATES')
          for r in records:
              print(f'{r["family"]}\t{r["id"] or "-"}\t{r["path"]}\tin={r["textual_filename_or_id_inbound_count"]}')
          PY
      - name: Prove canonical checkout remained read-only
        working-directory: canonical
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "b6dd6c35a3d72049299c4f8f44e7a4ab8cd59938"
          echo "F016_MARKDOWN_INVENTORY_CANONICAL_READ_ONLY=SUCCESS"
      - name: Commit evidence bundle to temporary staging branch only
        working-directory: stage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Guivos"
          git config user.email "guivosbrasil@gmail.com"
          git add tmp/f016-markdown-materialization-inventory-b6dd6c35.json tmp/f016-markdown-materialization-inventory-b6dd6c35.md
          if git diff --cached --quiet; then
            echo "INVENTORY_UNCHANGED"
            exit 0
          fi
          git commit -m "chore: capture F-016 Markdown inventory [skip ci]"
          git push origin HEAD:agent/gkr-f016a-closure-adjudication-stage-v1
