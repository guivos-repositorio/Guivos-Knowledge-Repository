name: F-016 Screen Gallery Post-Delete Read-Only Proof

on:
  push:
    branches:
      - agent/gkr-f016a-closure-adjudication-stage-v1

permissions:
  contents: read

jobs:
  post-delete-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact canonical head read-only
        uses: actions/checkout@v4
        with:
          ref: 78534bf86acdc5da5f76e558b0df2347e6b5a111
          fetch-depth: 1

      - name: Verify exact immutable input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "78534bf86acdc5da5f76e558b0df2347e6b5a111"
          test "$(git rev-parse HEAD^{tree})" = "6ca8bc3f3691a4ba7ac322d96cf43119e293c3d4"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PyYAML

      - name: Prove screen-gallery post-delete state and guardrails
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          head='78534bf86acdc5da5f76e558b0df2347e6b5a111'
          tree='6ca8bc3f3691a4ba7ac322d96cf43119e293c3d4'
          galleries=[
            'docs/journeys/screen-gallery.md',
            'docs/journeys/screen-gallery-traceability-matrix.md',
            'docs/journeys/screen-gallery-person.md',
            'docs/journeys/screen-gallery-opportunities-organization.md',
            'docs/journeys/screen-gallery-collectives.md',
            'docs/journeys/screen-gallery-opportunity-boost-exposure.md',
            'docs/journeys/screen-gallery-opportunity-boost-operations.md',
            'docs/journeys/screen-gallery-plans-billing.md',
          ]
          basenames={Path(x).name for x in galleries}
          ids={
            'GKR-JOURNEY-SCREEN-GALLERY-001',
            'GKR-JOURNEY-SCREEN-TRACEABILITY-MATRIX-001',
            'GKR-JOURNEY-SCREEN-GALLERY-PERSON-001',
            'GKR-JOURNEY-SCREEN-GALLERY-OPPORTUNITIES-ORGANIZATION-001',
            'GKR-JOURNEY-SCREEN-GALLERY-COLLECTIVES-001',
            'GKR-JOURNEY-SCREEN-GALLERY-OPPORTUNITY-BOOST-EXPOSURE-001',
            'GKR-JOURNEY-SCREEN-GALLERY-OPPORTUNITY-BOOST-OPERATIONS-001',
            'GKR-JOURNEY-SCREEN-GALLERY-PLANS-001',
          }

          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==head
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip()==tree
          assert all(not Path(x).exists() for x in galleries)
          print('GALLERY_FILES_ABSENT=8/8')

          link_re=re.compile(r'!?\[[^\]]*\]\(([^)]+)\)')
          live=[]
          for p in Path('docs').rglob('*.md'):
            txt=p.read_text(encoding='utf-8')
            for i,line in enumerate(txt.splitlines(),1):
              for m in link_re.finditer(line):
                target=m.group(1).split('#',1)[0].strip()
                if Path(target).name in basenames:
                  live.append((str(p),i,line.strip()))
          assert not live, live
          print('LIVE_MARKDOWN_LINKS_TO_DELETED_GALLERY=0')

          mk=Path('mkdocs.yml').read_text(encoding='utf-8')
          assert not any(name in mk for name in basenames)
          print('MKDOCS_NAV_TO_DELETED_GALLERY=0')

          for reg in ['docs/journeys/surface-registry.md','docs/journeys/transition-registry.md']:
            txt=Path(reg).read_text(encoding='utf-8')
            deps=[x for x in basenames if x in txt] + [x for x in ids if x in txt]
            assert not deps, (reg,deps)
            print(f'REGISTRY_GALLERY_DEPENDENCIES\t{reg}\t0')

          svg_root=Path('docs/assets/wireframes')
          svg_count=sum(1 for _ in svg_root.rglob('*.svg')) if svg_root.exists() else 0
          assert svg_count==0, svg_count
          print('PHYSICAL_SVG_COUNT=0')

          audit=Path('docs/project/gkr-full-corpus-audit.md').read_text(encoding='utf-8')
          assert 'version: 1.12.0' in audit
          assert 'família `screen-gallery*` removida 8/8 após absorção' in audit
          assert '**OPEN — F-016-A RESOLVED;' in audit
          print('F016_GLOBAL_STATE=OPEN')
          print('SCREEN_GALLERY_CANONICAL_CLEANUP=8/8')

          state=Path('docs/project/current-state-register.md').read_text(encoding='utf-8')
          required=[
            'F-016\n→ OPEN / REPO-WIDE DOCUMENTATION DEMATERIALIZATION',
            'J / K / L / M / N\n→ NOT RELEASED AUTOMATICALLY',
            'UXA-102 / V5\n→ NOT_STARTED',
            'PRODUCT ENGINEERING\n→ PAUSED BEFORE W0-01',
            'MATERIALIZAÇÃO VISUAL DAS HOMES\n→ NOT AUTHORIZED DURING FULL-CORPUS AUDIT',
          ]
          missing=[x for x in required if x not in state]
          assert not missing, missing
          print('DOWNSTREAM_GUARDRAILS_PRESERVED=PASS')
          PY

      - name: Validate semantic state
        run: python scripts/validate_semantic_state.py

      - name: Validate repository structure links and navigation
        run: python scripts/validate_gkr.py

      - name: Validate legacy nomenclature
        run: python scripts/validate_legacy_nomenclature.py

      - name: Build MkDocs strict
        run: mkdocs build --strict --site-dir /tmp/gkr-site

      - name: Confirm exact head tree and clean tracked checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "78534bf86acdc5da5f76e558b0df2347e6b5a111"
          test "$(git rev-parse HEAD^{tree})" = "6ca8bc3f3691a4ba7ac322d96cf43119e293c3d4"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo F016_SCREEN_GALLERY_POSTDELETE_READ_ONLY=SUCCESS
