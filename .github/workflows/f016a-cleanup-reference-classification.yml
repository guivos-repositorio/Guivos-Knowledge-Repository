name: F-016-A Physical Cleanup Stage

on:
  push:
    branches:
      - agent/gkr-f016a-cleanup-stage-v1

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'stage: F-016-A physical cleanup 119/119') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply atomic F-016-A transformation in working tree
        run: python scripts/tmp_f016a_cleanup_stage.py

      - name: Prove deletion set and bounded reconciliation
        shell: bash
        run: |
          set -euo pipefail
          deleted=$(git diff --name-only --diff-filter=D | wc -l | tr -d ' ')
          deleted_svg=$(git diff --name-only --diff-filter=D | grep -c '^docs/assets/wireframes/.*\.svg$' || true)
          other_deleted=$(git diff --name-only --diff-filter=D | grep -vc '^docs/assets/wireframes/.*\.svg$' || true)
          echo "DELETED_TOTAL=$deleted"
          echo "DELETED_SVG=$deleted_svg"
          echo "OTHER_DELETED=$other_deleted"
          test "$deleted" -eq 119
          test "$deleted_svg" -eq 119
          test "$other_deleted" -eq 0
          test "$(find docs/assets/wireframes -maxdepth 1 -type f -name '*.svg' 2>/dev/null | wc -l | tr -d ' ')" -eq 0
          git diff --check

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PyYAML

      - name: Validate semantic state
        run: python scripts/validate_semantic_state.py

      - name: Validate repository structure
        run: python scripts/validate_gkr.py

      - name: Validate legacy nomenclature
        run: python scripts/validate_legacy_nomenclature.py

      - name: Build MkDocs strict
        run: mkdocs build --strict --site-dir /tmp/gkr-site

      - name: Final post-delete assertions before commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          assets=[p for p in Path('docs/assets/wireframes').glob('*.svg')] if Path('docs/assets/wireframes').exists() else []
          if assets:
              raise SystemExit(f'PHYSICAL_SVGS_REMAIN={len(assets)}')
          live=[]
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw: continue
              rel=raw.decode()
              p=Path(rel)
              if not p.exists(): continue
              try: text=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,IsADirectoryError): continue
              for i,line in enumerate(text.splitlines(),1):
                  if re.search(r'!\[[^\]]*\]\([^\)]*assets/wireframes/[^\)]*\.svg', line, re.I) or re.search(r'(?<!!)\[[^\]]*\]\([^\)]*assets/wireframes/[^\)]*\.svg', line, re.I):
                      live.append((rel,i,line.strip()))
          print(f'LIVE_EMBED_OR_LINK_HITS={len(live)}')
          for x in live[:50]: print(x)
          if live:
              raise SystemExit('LIVE_EMBED_OR_LINK_REMAINS')
          print('F016A_POST_DELETE_ASSERTIONS=PASS')
          PY

      - name: Commit validated cleanup candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Guivos"
          git config user.email "guivosbrasil@gmail.com"
          git add -A
          git commit -m "stage: F-016-A physical cleanup 119/119 [skip ci]"
          git push origin HEAD:agent/gkr-f016a-cleanup-stage-v1
