name: F-010 Final Read-Only Closure Proof

on:
  pull_request:
    branches:
      - agent/gkr-global-audit-block-2-ghi-v1

permissions:
  contents: read

jobs:
  proof:
    if: ${{ github.event.pull_request.number == 364 }}
    name: Verify final F-010 closure head read-only
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/gkr-global-audit-block-2-ghi-v1
      TARGET_SHA: 1f9a9a89e41119d740947a5d0fd7726e125060b9
      TARGET_TREE: ce8c3478f871932c024f360a8d0bcc0863dbcaaf
    steps:
      - name: Checkout governed final closure head
        uses: actions/checkout@v4
        with:
          ref: agent/gkr-global-audit-block-2-ghi-v1
          fetch-depth: 0

      - name: Guard exact final checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse "${TARGET_SHA}^{tree}")" = "${TARGET_TREE}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          echo "REMOTE_HEAD=${remote_head}"
          test "${remote_head}" = "${TARGET_SHA}"

      - name: Verify final deletion set and strong references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          deletions = [
              *(f"docs/project/canonical-consolidation-matrix-cod-{n:03d}-submission-addendum.md" for n in range(3, 18)),
              "docs/research/RP-002/pilot-operator-and-tool-registry.md",
              "docs/research/RP-002/pilot-participant-privacy-notice-and-consent-draft.md",
          ]
          doc_ids = [
              *(f"GKR-CANON-MATRIX-COD-{n:03d}-SUBMISSION" for n in range(3, 18)),
              "RP-002-PILOT-OPS-REG-001",
              "RP-002-PILOT-NOTICE-CONSENT-001",
          ]

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = [p for p in tracked if p]
          tracked_set = set(tracked)
          present = [p for p in deletions if p in tracked_set]
          if present:
              raise SystemExit("DELETION_SET_STILL_PRESENT=" + json.dumps(present, ensure_ascii=False))

          needles = []
          for p, doc_id in zip(deletions, doc_ids):
              path = Path(p)
              needles.extend([
                  ("full_path", p),
                  ("basename", path.name),
                  ("stem", path.stem),
                  ("document_id", doc_id),
              ])

          hits = []
          utf8_files = 0
          non_utf8 = []
          for file_path in tracked:
              raw = Path(file_path).read_bytes()
              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError:
                  non_utf8.append(file_path)
                  continue
              utf8_files += 1
              for kind, needle in needles:
                  if needle in text:
                      for lineno, line in enumerate(text.splitlines(), 1):
                          if needle in line:
                              hits.append({
                                  "file": file_path,
                                  "line": lineno,
                                  "kind": kind,
                                  "needle": needle,
                                  "text": line.strip()[:500],
                              })

          print(f"TRACKED_FILES={len(tracked)}")
          print(f"UTF8_FILES={utf8_files}")
          print(f"NON_UTF8_FILES={len(non_utf8)}")
          for p in non_utf8:
              print(f"NON_UTF8={p}")
          print("DELETION_SET_ABSENT=17/17")
          print(f"STRONG_REFERENCE_HITS={len(hits)}")
          print("HITS_JSON_BEGIN")
          print(json.dumps(hits, ensure_ascii=False, indent=2))
          print("HITS_JSON_END")
          PY

      - name: Re-run final repository validators read-only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -r requirements.txt PyYAML
          python scripts/validate_semantic_state.py
          python scripts/validate_gkr.py
          python scripts/validate_legacy_nomenclature.py
          mkdocs build --strict --site-dir /tmp/f010-final-closure-site
