name: F-010 Authorized Cleanup Apply

on:
  pull_request:
    branches:
      - agent/gkr-global-audit-block-2-ghi-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.number == 364 }}
    name: Apply authorized F-010 cleanup atomically
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/gkr-global-audit-block-2-ghi-v1
      TARGET_SHA: 20ac46358f07513830e72745f998cb46ca7d4509
      TARGET_TREE: 58b30bef8c01126c47a4c5f691bfbcfc7c4b44c3
    steps:
      - name: Checkout governed target branch
        uses: actions/checkout@v4
        with:
          ref: agent/gkr-global-audit-block-2-ghi-v1
          fetch-depth: 0

      - name: Guard exact target checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse "${TARGET_SHA}^{tree}")" = "${TARGET_TREE}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          echo "REMOTE_HEAD=${remote_head}"
          test "${remote_head}" = "${TARGET_SHA}"

      - name: Apply closed 31-file transaction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          TODAY = "2026-09-04"
          deletions = [
              *(f"docs/project/canonical-consolidation-matrix-cod-{n:03d}-submission-addendum.md" for n in range(3, 18)),
              "docs/research/RP-002/pilot-operator-and-tool-registry.md",
              "docs/research/RP-002/pilot-participant-privacy-notice-and-consent-draft.md",
          ]
          rp_versions = {
              "docs/research/RP-002/pilot-documentation-closure-decision.md": ("1.0.0", "1.0.1"),
              "docs/research/RP-002/pilot-final-legal-privacy-review-checklist.md": ("1.0.0", "1.0.1"),
              "docs/research/RP-002/pilot-identity-vault-implementation-decision.md": ("1.0.0", "1.0.1"),
              "docs/research/RP-002/pilot-minimum-stack-options-and-recommendation.md": ("0.1.0", "0.1.1"),
              "docs/research/RP-002/pilot-minimum-stack-target-decision.md": ("1.1.0", "1.1.1"),
              "docs/research/RP-002/pilot-notice-consent-flow-decision.md": ("1.0.0", "1.0.1"),
              "docs/research/RP-002/pilot-openai-api-implementation-decision.md": ("1.0.0", "1.0.1"),
              "docs/research/RP-002/pilot-operator-and-tool-registry-reconciliation.md": ("1.0.0", "1.0.1"),
              "docs/research/RP-002/pilot-participant-privacy-notice-and-consent-v0.2.md": ("0.2.0", "0.2.1"),
              "docs/research/RP-002/pilot-research-base-implementation-decision.md": ("1.0.0", "1.0.1"),
              "docs/research/RP-002/pilot-search-web-implementation-decision.md": ("1.0.0", "1.0.1"),
          }
          ops_replace = {
              "docs/research/RP-002/pilot-documentation-closure-decision.md",
              "docs/research/RP-002/pilot-final-legal-privacy-review-checklist.md",
              "docs/research/RP-002/pilot-identity-vault-implementation-decision.md",
              "docs/research/RP-002/pilot-minimum-stack-options-and-recommendation.md",
              "docs/research/RP-002/pilot-openai-api-implementation-decision.md",
              "docs/research/RP-002/pilot-participant-privacy-notice-and-consent-v0.2.md",
              "docs/research/RP-002/pilot-research-base-implementation-decision.md",
              "docs/research/RP-002/pilot-search-web-implementation-decision.md",
          }
          notice_replace = {
              "docs/research/RP-002/pilot-minimum-stack-options-and-recommendation.md",
              "docs/research/RP-002/pilot-minimum-stack-target-decision.md",
              "docs/research/RP-002/pilot-notice-consent-flow-decision.md",
          }
          global_edits = {
              "docs/project/gkr-full-corpus-audit.md",
              "docs/project/current-state-register.md",
              "docs/roadmap.md",
          }
          expected_changed = set(deletions) | set(rp_versions) | global_edits
          if len(deletions) != 17 or len(expected_changed) != 31:
              raise SystemExit("CLOSED_SET_MISMATCH")

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"EXPECTED_ONE {label} count={count}")
              return text.replace(old, new, 1)

          def frontmatter(text, path):
              if not text.startswith("---\n"):
                  raise SystemExit(f"NO_FRONTMATTER {path}")
              end = text.find("\n---\n", 4)
              if end < 0:
                  raise SystemExit(f"UNCLOSED_FRONTMATTER {path}")
              return text[:end+1], text[end+1:]

          for path, (old_v, new_v) in rp_versions.items():
              text = read(path)
              fm, body = frontmatter(text, path)
              fm = once(fm, f"version: {old_v}", f"version: {new_v}", f"{path}:version")
              fm = once(fm, "last_updated: 2026-08-27", f"last_updated: {TODAY}", f"{path}:date")
              if path in ops_replace:
                  fm = once(fm, "RP-002-PILOT-OPS-REG-001", "RP-002-PILOT-OPS-REG-002", f"{path}:ops")
              if path in notice_replace:
                  fm = once(fm, "RP-002-PILOT-NOTICE-CONSENT-001", "RP-002-PILOT-NOTICE-CONSENT-002", f"{path}:notice")
              if path.endswith("pilot-operator-and-tool-registry-reconciliation.md"):
                  fm = once(fm, "  - RP-002-PILOT-OPS-REG-001\n", "", f"{path}:remove-old-related")
              write(path, fm + body)

          recon = "docs/research/RP-002/pilot-operator-and-tool-registry-reconciliation.md"
          text = read(recon)
          text = once(text, "Este documento reconcilia o `RP-002-PILOT-OPS-REG-001` com as decisões documentais posteriores do stack.", "Este documento reconcilia o registro histórico `RP-002-PILOT-OPS-REG-001`, removido do corpus corrente após absorção e preservado no histórico Git, com as decisões documentais posteriores do stack.", "recon:history")
          text = once(text, "O registro anterior permanece como histórico do momento em que vários componentes estavam `TBD`. Para o estado documental atual, este documento prevalece quando houver divergência de status-alvo.", "O registro anterior permanece recuperável no histórico Git como evidência do momento em que vários componentes estavam `TBD`. No corpus corrente, este documento é a autoridade documental de reconciliação e prevalece quando houver divergência de status-alvo.", "recon:status")
          write(recon, text)

          audit = "docs/project/gkr-full-corpus-audit.md"
          text = read(audit)
          text = once(text, "version: 1.5.0", "version: 1.6.0", "audit:version")
          text = once(text, "last_updated: 2026-08-30", f"last_updated: {TODAY}", "audit:date")
          text = once(text, "| F-010 | Major | checkpoints, snapshots, propagations e reconciliações precisam de teste de função atual | `HOLD_REVIEW` | aberto; overlays pós-313 testados/reconciliados no Bloco H, demais famílias pendentes |", "| F-010 | Major | checkpoints, snapshots, propagations e reconciliações precisam de teste de função atual | `UPDATE + REMOVE_AFTER_ABSORPTION` | **auditoria estrutural concluída; cleanup aplicado no conjunto fechado de 17 artefatos; validação pós-cleanup pendente; não resolvido** |", "audit:f010-row")
          audit_insert = "Esse resultado do Bloco H não encerrava F-010 para as demais famílias.\n\nA adjudicação estrutural posterior concluiu a varredura das famílias residuais. Os snapshots e addenda que preservam função documental, evidência ou proveniência permanecem no corpus; o conjunto físico de remoção foi fechado em **17 artefatos** — quinze addenda intermediários de submissão `COD-003..017` e dois intermediários do `RP-002` já absorvidos por autoridades posteriores.\n\nA prova pré-delete foi executada sobre o checkpoint congelado `20ac46358f07513830e72745f998cb46ca7d4509` / tree `58b30bef8c01126c47a4c5f691bfbcfc7c4b44c3`: 1.390 blobs rastreados, 1.388 UTF-8 pesquisáveis, 443 hits externos classificados e **0 `UNCLASSIFIED`**. Os dois blobs não textuais eram archives ZIP históricos. Referências correntes aos intermediários `RP-002` foram reconciliadas com `RP-002-PILOT-OPS-REG-002` e `RP-002-PILOT-NOTICE-CONSENT-002` na mesma transação.\n\n```text\nF-010\n→ STRUCTURAL AUDIT COMPLETE\n→ CLEANUP APPLIED\n→ POST-CLEANUP VALIDATION PENDING\n→ NOT RESOLVED\n\nF-006\n→ NOT TOUCHED BY THIS TRANSACTION\n```\n\nO fechamento de F-010 somente poderá ser adjudicado após recomputação da árvore, verificação de ausência dos 17 artefatos, Semantic, Mechanical e review repo-wide no novo head."
          text = once(text, "Isso não encerra F-010 para as demais famílias.", audit_insert, "audit:f010-section")
          write(audit, text)

          state = "docs/project/current-state-register.md"
          text = read(state)
          text = once(text, "version: 3.5.0", "version: 3.6.0", "state:version")
          text = once(text, "last_updated: 2026-08-30", f"last_updated: {TODAY}", "state:date")
          state_new = "→ F-007 RESOLVED NO LIMITE SEMÂNTICO/INVENTÁRIO\n\nF-010\n→ STRUCTURAL AUDIT COMPLETE\n→ CLEANUP APPLIED ON CLOSED 17-ARTIFACT SET\n→ POST-CLEANUP VALIDATION PENDING\n→ NOT RESOLVED\n→ DOES NOT AUTHORIZE F-006 OR DOWNSTREAM RELEASE\n\nPRÓXIMO GATE DA AUDITORIA"
          text = once(text, "→ F-007 RESOLVED NO LIMITE SEMÂNTICO/INVENTÁRIO\n\nPRÓXIMO GATE DA AUDITORIA", state_new, "state:f010")
          write(state, text)

          roadmap = "docs/roadmap.md"
          text = read(roadmap)
          text = once(text, "id: ROADMAP-13.5.0", "id: ROADMAP-13.6.0", "roadmap:id")
          text = once(text, "version: 13.5.0", "version: 13.6.0", "roadmap:version")
          text = once(text, "last_updated: 2026-08-30", f"last_updated: {TODAY}", "roadmap:date")
          text = once(text, "Este roadmap traduz `GKR-STATE-001 v3.5.0`", "Este roadmap traduz `GKR-STATE-001 v3.6.0`", "roadmap:state")
          anchor = "O próximo gate é a autorização humana separada e explícita para o cleanup físico de F-006; somente após eventual remoção/reconciliação, recomputação, validações e review no novo head poderá ocorrer a decisão de fechamento de F-006 e de G/H/I."
          text = once(text, anchor, anchor + "\n\nEm trilha independente, `F-010` concluiu a auditoria estrutural e teve cleanup aplicado sobre um conjunto fechado de 17 artefatos. Seu estado é `POST-CLEANUP VALIDATION PENDING / NOT RESOLVED`. Esse ato **não consome nem substitui a autorização separada exigida por F-006**, não libera J/K/L/M/N e não ativa UXA-102, Design/materialização ou Product Engineering.", "roadmap:f010-paragraph")
          text = once(text, "| Bloco I — Registries / Catálogos / SVGs | **AUDITED / UPDATE_APPLIED / F-006 OPEN / F-007 RESOLVED** |", "| Bloco I — Registries / Catálogos / SVGs | **AUDITED / UPDATE_APPLIED / F-006 OPEN / F-007 RESOLVED** |\n| F-010 — cleanup transversal | **CLEANUP APPLIED / POST-CLEANUP VALIDATION PENDING / NOT RESOLVED** |", "roadmap:f010-row")
          write(roadmap, text)

          for path in deletions:
              p = Path(path)
              if not p.is_file():
                  raise SystemExit(f"MISSING_DELETE_CANDIDATE {path}")
              p.unlink()

          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != expected_changed:
              raise SystemExit(f"CHANGED_SET_MISMATCH missing={sorted(expected_changed-changed)} extra={sorted(changed-expected_changed)}")
          forbidden_names = {"uxa-015-organization-overview-desktop.svg", "uxa-016-collective-home-mobile.svg"}
          if any(Path(p).name in forbidden_names or "uxa-015" in Path(p).name or "uxa-016" in Path(p).name or "uxa-017" in Path(p).name or "uxa-018" in Path(p).name for p in changed):
              raise SystemExit("F006_TOUCHED")
          print(f"CLOSED_TRANSACTION_OK deletions=17 edits=14 total={len(changed)}")
          PY

      - name: Validate mutated working tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -r requirements.txt PyYAML
          python scripts/validate_semantic_state.py
          python scripts/validate_gkr.py
          python scripts/validate_legacy_nomenclature.py
          git diff --check

      - name: Commit and verify closed result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "GKR: aplicar cleanup físico F-010 após prova estrutural"
          echo "NEW_SHA=$(git rev-parse HEAD)"
          echo "NEW_TREE=$(git rev-parse HEAD^{tree})"
          test "$(git diff --name-only "${TARGET_SHA}" HEAD | wc -l | tr -d ' ')" = "31"
          python - <<'PY'
          import subprocess
          from pathlib import Path
          deleted = [*(f"docs/project/canonical-consolidation-matrix-cod-{n:03d}-submission-addendum.md" for n in range(3,18)), "docs/research/RP-002/pilot-operator-and-tool-registry.md", "docs/research/RP-002/pilot-participant-privacy-notice-and-consent-draft.md"]
          if any(Path(p).exists() for p in deleted):
              raise SystemExit("DELETION_CANDIDATE_PRESENT")
          for n in range(3,18):
              token = f"GKR-CANON-MATRIX-COD-{n:03d}-SUBMISSION"
              p = subprocess.run(["git","grep","-n","-F",token,"HEAD","--","."], text=True, capture_output=True)
              if p.returncode == 0 and p.stdout.strip():
                  raise SystemExit(f"DANGLING {token}")
              if p.returncode not in (0,1):
                  raise SystemExit(f"GREP_ERROR {token}")
          p = subprocess.run(["git","grep","-n","-F","RP-002-PILOT-NOTICE-CONSENT-001","HEAD","--","."], text=True, capture_output=True)
          if p.returncode == 0 and p.stdout.strip():
              raise SystemExit("DANGLING_NOTICE_001")
          if p.returncode not in (0,1):
              raise SystemExit("GREP_ERROR_NOTICE")
          p = subprocess.run(["git","grep","-n","-F","RP-002-PILOT-OPS-REG-001","HEAD","--","."], text=True, capture_output=True)
          lines = [x for x in p.stdout.splitlines() if x.strip()] if p.returncode == 0 else []
          if p.returncode not in (0,1):
              raise SystemExit("GREP_ERROR_OPS")
          if len(lines) != 1 or "pilot-operator-and-tool-registry-reconciliation.md" not in lines[0] or "histórico Git" not in lines[0]:
              raise SystemExit(f"OPS_001_PROVENANCE_NOT_EXACT {lines}")
          print("POST_COMMIT_STRUCTURE_OK")
          PY

      - name: Reconfirm remote head and push exact commit
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${TARGET_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
