name: F-010 Authorized Cleanup Apply

on:
  pull_request:
    branches:
      - agent/gkr-global-audit-block-2-ghi-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.number == 364 }}
    name: Apply authorized F-010 cleanup atomically
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/gkr-global-audit-block-2-ghi-v1
      AUX_BRANCH: agent/gkr-f010-g3-proof-v1
      TARGET_SHA: 20ac46358f07513830e72745f998cb46ca7d4509
      TARGET_TREE: 58b30bef8c01126c47a4c5f691bfbcfc7c4b44c3
    steps:
      - name: Checkout governed target branch
        uses: actions/checkout@v4
        with:
          ref: agent/gkr-global-audit-block-2-ghi-v1
          fetch-depth: 0

      - name: Guard exact target checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse "${TARGET_SHA}^{tree}")" = "${TARGET_TREE}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          echo "REMOTE_HEAD=${remote_head}"
          test "${remote_head}" = "${TARGET_SHA}"

      - name: Load authorized temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/${AUX_BRANCH}:scripts/f010_cleanup_apply_temp.py" > /tmp/f010_cleanup_apply_temp.py
          python -m py_compile /tmp/f010_cleanup_apply_temp.py

      - name: Apply closed 34-file transaction
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/f010_cleanup_apply_temp.py apply

      - name: Validate mutated working tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -r requirements.txt PyYAML
          python scripts/validate_semantic_state.py
          python scripts/validate_gkr.py
          python scripts/validate_legacy_nomenclature.py
          git diff --check
          mkdocs build --strict --site-dir /tmp/f010-site

      - name: Create one commit and verify closed result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "GKR: aplicar cleanup físico F-010 após prova estrutural"
          python /tmp/f010_cleanup_apply_temp.py verify

      - name: Reconfirm remote head and push exact commit
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          echo "REMOTE_HEAD_BEFORE_PUSH=${remote_head}"
          test "${remote_head}" = "${TARGET_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
