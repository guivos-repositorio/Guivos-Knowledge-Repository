      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PyYAML

      - name: Validate semantic state
        run: python scripts/validate_semantic_state.py

      - name: Validate repository structure
        run: python scripts/validate_gkr.py

      - name: Validate legacy nomenclature
        run: python scripts/validate_legacy_nomenclature.py

      - name: Check diff whitespace
        run: git diff --check HEAD

      - name: Build MkDocs strict
        run: mkdocs build --strict --site-dir /tmp/gkr-site

      - name: Commit validated adjudication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Guivos
          git config user.email guivosbrasil@gmail.com
          git add README.md docs/index.md docs/project/current-state-register.md docs/project/gkr-full-corpus-audit.md docs/roadmap.md docs/experience-architecture/uxa-047-101-index.md docs/experience-architecture/public-specialized-homes-reconciliation.md docs/experience-architecture/organizations-collectives-derived-state-audit.md docs/experience-architecture/index.md docs/journeys/index.md
          git diff --cached --check
          git commit -m "GKR: adjudicar elegibilidade F-016-A e sincronizar estado pós-F-006"
          git push origin HEAD:agent/gkr-f016-eligibility-adjudication-stage-v1
