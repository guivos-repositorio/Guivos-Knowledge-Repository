name: Temporary GKR Lot D Closure Patch

on:
  push:
    branches:
      - agent/gkr-global-audit-lote-d-close-e-next-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gkr-global-audit-lote-d-close-e-next-v1
          fetch-depth: 0
      - name: Apply governed state reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/temp_gkr_lot_d_close.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          printf '%s\n' '--- staged paths ---'
          git diff --cached --name-only | sort
          expected=$'.github/scripts/temp_gkr_lot_d_close.py\n.github/workflows/temp-gkr-lot-d-close.yml\ndocs/project/.audit-lote-d-close-e-next-work.md\ndocs/project/current-state-register.md\ndocs/project/gkr-full-corpus-audit.md'
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git commit -m "docs: fechar Lote D e promover Lote E"
          git push origin HEAD:agent/gkr-global-audit-lote-d-close-e-next-v1
