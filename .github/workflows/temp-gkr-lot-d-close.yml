name: Temporary GKR Lot D Closure Patch

on:
  push:
    branches:
      - agent/gkr-global-audit-lote-d-close-e-next-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gkr-global-audit-lote-d-close-e-next-v1
          fetch-depth: 0
      - name: Apply governed state reconciliation
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/gkr_patch.py
          python /tmp/gkr_patch.py
          rm -f docs/project/.audit-lote-d-close-e-next-work.md
          rm -f .github/workflows/temp-gkr-lot-d-close.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test "$(git diff --cached --name-only | sort)" = $'docs/project/current-state-register.md\ndocs/project/gkr-full-corpus-audit.md'
          git commit -m "docs: fechar Lote D e promover Lote E"
          git push origin HEAD:agent/gkr-global-audit-lote-d-close-e-next-v1
