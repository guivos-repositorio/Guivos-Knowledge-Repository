name: F-010 Cleanup Apply

on:
  pull_request:
    branches:
      - agent/gkr-global-audit-block-2-ghi-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 364
    name: Apply authorized F-010 cleanup atomically
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/gkr-global-audit-block-2-ghi-v1
      TARGET_SHA: 20ac46358f07513830e72745f998cb46ca7d4509
      TARGET_TREE: 58b30bef8c01126c47a4c5f691bfbcfc7c4b44c3
    steps:
      - name: Checkout governed target branch
        uses: actions/checkout@v4
        with:
          ref: agent/gkr-global-audit-block-2-ghi-v1
          fetch-depth: 0

      - name: Guard exact target checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse "${TARGET_SHA}^{tree}")" = "${TARGET_TREE}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          echo "REMOTE_HEAD=${remote_head}"
          test "${remote_head}" = "${TARGET_SHA}"

      - name: Apply closed 31-file transaction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          TODAY = "2026-09-04"

          deletions = [
              *(f"docs/project/canonical-consolidation-matrix-cod-{n:03d}-submission-addendum.md" for n in range(3, 18)),
              "docs/research/RP-002/pilot-operator-and-tool-registry.md",
              "docs/research/RP-002/pilot-participant-privacy-notice-and-consent-draft.md",
          ]

          rp_versions = {
              "docs/research/RP-002/pilot-documentation-closure-decision.md": ("1.0.0", "1.0.1"),
              "docs/research/RP-002/pilot-final-legal-privacy-review-checklist.md": ("1.0.0", "1.0.1"),
              "docs/research/RP-002/pilot-identity-vault-implementation-decision.md": ("1.0.0", "1.0.1"),
              "docs/research/RP-002/pilot-minimum-stack-options-and-recommendation.md": ("0.1.0", "0.1.1"),
              "docs/research/RP-002/pilot-minimum-stack-target-decision.md": ("1.1.0", "1.1.1"),
              "docs/research/RP-002/pilot-notice-consent-flow-decision.md": ("1.0.0", "1.0.1"),
              "docs/research/RP-002/pilot-openai-api-implementation-decision.md": ("1.0.0", "1.0.1"),
              "docs/research/RP-002/pilot-operator-and-tool-registry-reconciliation.md": ("1.0.0", "1.0.1"),
              "docs/research/RP-002/pilot-participant-privacy-notice-and-consent-v0.2.md": ("0.2.0", "0.2.1"),
              "docs/research/RP-002/pilot-research-base-implementation-decision.md": ("1.0.0", "1.0.1"),
              "docs/research/RP-002/pilot-search-web-implementation-decision.md": ("1.0.0", "1.0.1"),
          }

          ops_replace = {
              "docs/research/RP-002/pilot-documentation-closure-decision.md",
              "docs/research/RP-002/pilot-final-legal-privacy-review-checklist.md",
              "docs/research/RP-002/pilot-identity-vault-implementation-decision.md",
              "docs/research/RP-002/pilot-minimum-stack-options-and-recommendation.md",
              "docs/research/RP-002/pilot-openai-api-implementation-decision.md",
              "docs/research/RP-002/pilot-participant-privacy-notice-and-consent-v0.2.md",
              "docs/research/RP-002/pilot-research-base-implementation-decision.md",
              "docs/research/RP-002/pilot-search-web-implementation-decision.md",
          }
          notice_replace = {
              "docs/research/RP-002/pilot-minimum-stack-options-and-recommendation.md",
              "docs/research/RP-002/pilot-minimum-stack-target-decision.md",
              "docs/research/RP-002/pilot-notice-consent-flow-decision.md",
          }

          global_edits = {
              "docs/project/gkr-full-corpus-audit.md",
              "docs/project/current-state-register.md",
              "docs/roadmap.md",
          }

          expected_changed = set(deletions) | set(rp_versions) | global_edits
          if len(deletions) != 17 or len(expected_changed) != 31:
              raise SystemExit(f"CLOSED_SET_MISMATCH deletions={len(deletions)} changed={len(expected_changed)}")

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"EXPECTED_ONE_REPLACEMENT {label} count={count}")
              return text.replace(old, new, 1)

          def split_frontmatter(text, path):
              if not text.startswith("---\n"):
                  raise SystemExit(f"NO_FRONTMATTER {path}")
              end = text.find("\n---\n", 4)
              if end < 0:
                  raise SystemExit(f"UNCLOSED_FRONTMATTER {path}")
              return text[:end+1], text[end+1:]

          def update_frontmatter(path, old_version, new_version, replacements=(), removals=()):
              text = read(path)
              fm, body = split_frontmatter(text, path)
              fm = replace_once(fm, f"version: {old_version}", f"version: {new_version}", f"{path}:version")
              fm = replace_once(fm, "last_updated: 2026-08-27", f"last_updated: {TODAY}", f"{path}:last_updated")
              for old, new in replacements:
                  fm = replace_once(fm, old, new, f"{path}:{old}")
              for old in removals:
                  count = fm.count(old)
                  if count != 1:
                      raise SystemExit(f"EXPECTED_ONE_REMOVAL {path}:{old} count={count}")
                  fm = fm.replace(old, "", 1)
              write(path, fm + body)

          for path, (old_v, new_v) in rp_versions.items():
              reps = []
              rems = []
              if path in ops_replace:
                  reps.append(("RP-002-PILOT-OPS-REG-001", "RP-002-PILOT-OPS-REG-002"))
              if path in notice_replace:
                  reps.append(("RP-002-PILOT-NOTICE-CONSENT-001", "RP-002-PILOT-NOTICE-CONSENT-002"))
              if path.endswith("pilot-operator-and-tool-registry-reconciliation.md"):
                  rems.append("  - RP-002-PILOT-OPS-REG-001\n")
              update_frontmatter(path, old_v, new_v, reps, rems)

          recon = "docs/research/RP-002/pilot-operator-and-tool-registry-reconciliation.md"
          text = read(recon)
          text = replace_once(
              text,
              "Este documento reconcilia o `RP-002-PILOT-OPS-REG-001` com as decisões documentais posteriores do stack.",
              "Este documento reconcilia o registro histórico `RP-002-PILOT-OPS-REG-001`, removido do corpus corrente após absorção e preservado no histórico Git, com as decisões documentais posteriores do stack.",
              "reconciliation:historic-line",
          )
          text = replace_once(
              text,
              "O registro anterior permanece como histórico do momento em que vários componentes estavam `TBD`. Para o estado documental atual, este documento prevalece quando houver divergência de status-alvo.",
              "O registro anterior permanece recuperável no histórico Git como evidência do momento em que vários componentes estavam `TBD`. No corpus corrente, este documento é a autoridade documental de reconciliação e prevalece quando houver divergência de status-alvo.",
              "reconciliation:historic-status",
          )
          write(recon, text)

          audit = "docs/project/gkr-full-corpus-audit.md"
          text = read(audit)
          text = replace_once(text, "version: 1.5.0", "version: 1.6.0", "audit:version")
          text = replace_once(text, "last_updated: 2026-08-30", f"last_updated: {TODAY}", "audit:last_updated")
          text = replace_once(
              text,
              "| F-010 | Major | checkpoints, snapshots, propagations e reconciliações precisam de teste de função atual | `HOLD_REVIEW` | aberto; overlays pós-313 testados/reconciliados no Bloco H, demais famílias pendentes |",
              "| F-010 | Major | checkpoints, snapshots, propagations e reconciliações precisam de teste de função atual | `UPDATE + REMOVE_AFTER_ABSORPTION` | **auditoria estrutural concluída; cleanup aplicado no conjunto fechado de 17 artefatos; validação pós-cleanup pendente; não resolvido** |",
              "audit:f010-row",
          )
          text = replace_once(
              text,
              "Isso não encerra F-010 para as demais famílias.",
              """Esse resultado do Bloco H não encerrava F-010 para as demais famílias.

A adjudicação estrutural posterior concluiu a varredura das famílias residuais. Os snapshots e addenda que preservam função documental, evidência ou proveniência permanecem no corpus; o conjunto físico de remoção foi fechado em **17 artefatos** — quinze addenda intermediários de submissão `COD-003..017` e dois intermediários do `RP-002` já absorvidos por autoridades posteriores.

A prova pré-delete foi executada sobre o checkpoint congelado `20ac46358f07513830e72745f998cb46ca7d4509` / tree `58b30bef8c01126c47a4c5f691bfbcfc7c4b44c3` e percorreu 1.390 blobs rastreados, dos quais 1.388 eram UTF-8 pesquisáveis; os dois blobs não textuais eram archives ZIP históricos. Foram classificados 443 hits externos e **nenhum permaneceu `UNCLASSIFIED`**. Referências correntes aos dois intermediários `RP-002` foram reconciliadas com as autoridades sucessoras `...OPS-REG-002` e `...NOTICE-CONSENT-002` na mesma transação.

```text
F-010
→ STRUCTURAL AUDIT COMPLETE
→ CLEANUP APPLIED
→ POST-CLEANUP VALIDATION PENDING
→ NOT RESOLVED

F-006
→ NOT TOUCHED BY THIS TRANSACTION
```

O fechamento de F-010 somente poderá ser adjudicado após recomputação da árvore, verificação de ausência dos 17 artefatos, Semantic, Mechanical e review repo-wide no novo head.""",
              "audit:f010-section",
          )
          write(audit, text)

          state = "docs/project/current-state-register.md"
          text = read(state)
          text = replace_once(text, "version: 3.5.0", "version: 3.6.0", "state:version")
          text = replace_once(text, "last_updated: 2026-08-30", f"last_updated: {TODAY}", "state:last_updated")
          text = replace_once(
              text,
              "→ F-007 RESOLVED NO LIMITE SEMÂNTICO/INVENTÁRIO\n\nPRÓXIMO GATE DA AUDITORIA",
              """→ F-007 RESOLVED NO LIMITE SEMÂNTICO/INVENTÁRIO

F-010
→ STRUCTURAL AUDIT COMPLETE
→ CLEANUP APPLIED ON CLOSED 17-ARTIFACT SET
→ POST-CLEANUP VALIDATION PENDING
→ NOT RESOLVED
→ DOES NOT AUTHORIZE F-006 OR DOWNSTREAM RELEASE

PRÓXIMO GATE DA AUDITORIA""",
              "state:f010-executive",
          )
          write(state, text)

          roadmap = "docs/roadmap.md"
          text = read(roadmap)
          text = replace_once(text, "id: ROADMAP-13.5.0", "id: ROADMAP-13.6.0", "roadmap:id")
          text = replace_once(text, "version: 13.5.0", "version: 13.6.0", "roadmap:version")
          text = replace_once(text, "last_updated: 2026-08-30", f"last_updated: {TODAY}", "roadmap:last_updated")
          text = replace_once(text, "Este roadmap traduz `GKR-STATE-001 v3.5.0`", "Este roadmap traduz `GKR-STATE-001 v3.6.0`", "roadmap:state-version")
          anchor = "O próximo gate é a autorização humana separada e explícita para o cleanup físico de F-006; somente após eventual remoção/reconciliação, recomputação, validações e review no novo head poderá ocorrer a decisão de fechamento de F-006 e de G/H/I."
          text = replace_once(
              text,
              anchor,
              anchor + "\n\nEm trilha independente, `F-010` concluiu a auditoria estrutural e teve cleanup aplicado sobre um conjunto fechado de 17 artefatos. Seu estado é `POST-CLEANUP VALIDATION PENDING / NOT RESOLVED`. Esse ato **não consome nem substitui a autorização separada exigida por F-006**, não libera J/K/L/M/N e não ativa UXA-102, Design/materialização ou Product Engineering.",
              "roadmap:f010-paragraph",
          )
          text = replace_once(
              text,
              "| Bloco I — Registries / Catálogos / SVGs | **AUDITED / UPDATE_APPLIED / F-006 OPEN / F-007 RESOLVED** |",
              "| Bloco I — Registries / Catálogos / SVGs | **AUDITED / UPDATE_APPLIED / F-006 OPEN / F-007 RESOLVED** |\n| F-010 — cleanup transversal | **CLEANUP APPLIED / POST-CLEANUP VALIDATION PENDING / NOT RESOLVED** |",
              "roadmap:f010-row",
          )
          write(roadmap, text)

          for path in deletions:
              p = Path(path)
              if not p.is_file():
                  raise SystemExit(f"MISSING_DELETE_CANDIDATE {path}")
              p.unlink()

          # Closed-set validation before commit.
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != expected_changed:
              missing = sorted(expected_changed - changed)
              extra = sorted(changed - expected_changed)
              raise SystemExit(f"CHANGED_SET_MISMATCH missing={missing} extra={extra}")

          forbidden = {
              "docs/experience-architecture/uxa-015-organization-overview.md",
              "docs/experience-architecture/uxa-016-collective-home.md",
              "docs/experience-architecture/uxa-017-organization-management.md",
              "docs/experience-architecture/uxa-018-collective-management.md",
              "docs/experience-architecture/wireframes/uxa-015-organization-overview-desktop.svg",
              "docs/experience-architecture/wireframes/uxa-016-collective-home-mobile.svg",
          }
          if changed & forbidden:
              raise SystemExit(f"F006_TOUCHED {sorted(changed & forbidden)}")

          print(f"CLOSED_TRANSACTION_OK deletions={len(deletions)} edits={len(expected_changed)-len(deletions)} total={len(expected_changed)}")
          PY

      - name: Validate mutated working tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet PyYAML
          python scripts/validate_semantic_state.py
          python scripts/validate_gkr.py
          python scripts/validate_legacy_nomenclature.py
          git diff --check

      - name: Create single cleanup commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "GKR: aplicar cleanup físico F-010 após prova estrutural"
          echo "NEW_SHA=$(git rev-parse HEAD)" | tee /tmp/f010-new-head.txt
          echo "NEW_TREE=$(git rev-parse HEAD^{tree})" | tee -a /tmp/f010-new-head.txt

      - name: Verify committed result before push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path

          target = "20ac46358f07513830e72745f998cb46ca7d4509"
          deletions = [
              *(f"docs/project/canonical-consolidation-matrix-cod-{n:03d}-submission-addendum.md" for n in range(3, 18)),
              "docs/research/RP-002/pilot-operator-and-tool-registry.md",
              "docs/research/RP-002/pilot-participant-privacy-notice-and-consent-draft.md",
          ]
          edits = {
              "docs/research/RP-002/pilot-documentation-closure-decision.md",
              "docs/research/RP-002/pilot-final-legal-privacy-review-checklist.md",
              "docs/research/RP-002/pilot-identity-vault-implementation-decision.md",
              "docs/research/RP-002/pilot-minimum-stack-options-and-recommendation.md",
              "docs/research/RP-002/pilot-minimum-stack-target-decision.md",
              "docs/research/RP-002/pilot-notice-consent-flow-decision.md",
              "docs/research/RP-002/pilot-openai-api-implementation-decision.md",
              "docs/research/RP-002/pilot-operator-and-tool-registry-reconciliation.md",
              "docs/research/RP-002/pilot-participant-privacy-notice-and-consent-v0.2.md",
              "docs/research/RP-002/pilot-research-base-implementation-decision.md",
              "docs/research/RP-002/pilot-search-web-implementation-decision.md",
              "docs/project/gkr-full-corpus-audit.md",
              "docs/project/current-state-register.md",
              "docs/roadmap.md",
          }
          expected = set(deletions) | edits
          changed = set(subprocess.check_output(["git", "diff", "--name-only", target, "HEAD"], text=True).splitlines())
          if changed != expected or len(changed) != 31:
              raise SystemExit(f"COMMITTED_SET_MISMATCH count={len(changed)}")

          tree_paths = set(subprocess.check_output(["git", "ls-tree", "-r", "--name-only", "HEAD"], text=True).splitlines())
          present = sorted(set(deletions) & tree_paths)
          if present:
              raise SystemExit(f"DELETION_CANDIDATES_STILL_PRESENT {present}")

          required = {
              "docs/research/RP-002/pilot-operator-and-tool-registry-reconciliation.md",
              "docs/research/RP-002/pilot-participant-privacy-notice-and-consent-v0.2.md",
              "docs/project/gkr-full-corpus-audit.md",
              "docs/project/current-state-register.md",
              "docs/roadmap.md",
          }
          missing = sorted(required - tree_paths)
          if missing:
              raise SystemExit(f"RECEIVER_MISSING {missing}")

          # Full document IDs of deleted COD submission addenda must be absent.
          for n in range(3, 18):
              token = f"GKR-CANON-MATRIX-COD-{n:03d}-SUBMISSION"
              p = subprocess.run(["git", "grep", "-n", "-F", token, "HEAD", "--", ":(exclude).git"], text=True, capture_output=True)
              if p.returncode == 0 and p.stdout.strip():
                  raise SystemExit(f"DANGLING_COD_SUBMISSION_ID {token}: {p.stdout[:500]}")
              if p.returncode not in (0,1):
                  raise SystemExit(f"GREP_ERROR {token}")

          notice_old = "RP-002-PILOT-NOTICE-CONSENT-001"
          p = subprocess.run(["git", "grep", "-n", "-F", notice_old, "HEAD"], text=True, capture_output=True)
          if p.returncode == 0 and p.stdout.strip():
              raise SystemExit(f"DANGLING_NOTICE_001 {p.stdout[:1000]}")
          if p.returncode not in (0,1):
              raise SystemExit("GREP_ERROR_NOTICE")

          ops_old = "RP-002-PILOT-OPS-REG-001"
          p = subprocess.run(["git", "grep", "-n", "-F", ops_old, "HEAD"], text=True, capture_output=True)
          lines = [line for line in p.stdout.splitlines() if line.strip()] if p.returncode == 0 else []
          if p.returncode not in (0,1):
              raise SystemExit("GREP_ERROR_OPS")
          if len(lines) != 1 or "pilot-operator-and-tool-registry-reconciliation.md" not in lines[0] or "histórico Git" not in lines[0]:
              raise SystemExit(f"OPS_001_PROVENANCE_NOT_EXACT {lines}")

          print("POST_COMMIT_STRUCTURE_OK")
          print("NEW_SHA=" + subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip())
          print("NEW_TREE=" + subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip())
          PY

      - name: Reconfirm remote head and push exact commit
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${TARGET_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
