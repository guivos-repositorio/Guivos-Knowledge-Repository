name: F-016-A Post-Delete Read-Only Proof

on:
  push:
    branches:
      - agent/gkr-f016a-postdelete-proof-v1

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b70ec2d5371704d7a2ddd484289c549b4e80b4a9
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Prove F-016-A physical cleanup and reference reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          target='b70ec2d5371704d7a2ddd484289c549b4e80b4a9'
          actual=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          if actual != target:
              raise SystemExit(f'WRONG_HEAD={actual}')

          tracked=[x.decode() for x in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if x]
          physical=[x for x in tracked if x.startswith('docs/assets/wireframes/') and x.endswith('.svg')]
          print(f'EXACT_HEAD={actual}')
          print(f'TRACKED_FILES={len(tracked)}')
          print(f'PHYSICAL_SVG_COUNT={len(physical)}')
          if physical:
              raise SystemExit('PHYSICAL_SVG_REMAINS')

          live=[]
          nominal=[]
          unqualified=[]
          explicit_history=[]
          for rel in tracked:
              p=Path(rel)
              try:
                  text=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,IsADirectoryError):
                  continue
              for i,line in enumerate(text.splitlines(),1):
                  if re.search(r'!\[[^\]]*\]\([^\)]*(?:assets/wireframes/|\.svg)[^\)]*\.svg', line, re.I) or re.search(r'(?<!!)\[[^\]]*\]\([^\)]*(?:assets/wireframes/|\.svg)[^\)]*\.svg', line, re.I):
                      live.append((rel,i,line.strip()))
                  if '.svg' in line.lower() and ('wireframe' in line.lower() or re.search(r'\b(?:d5-c2|uxa-)\d[^\s`|)]*\.svg\b', line, re.I)):
                      nominal.append((rel,i,line.strip()))

              if '.svg' not in text.lower():
                  continue
              is_history=(rel.startswith('docs/project/changelog') or (rel.startswith('docs/project/') and rel.endswith('-pr-checkpoint.md')) or rel.startswith('docs/project/canonical-consolidation-matrix-uxa-'))
              if is_history:
                  explicit_history.append(rel)
              elif rel.startswith('docs/experience-architecture/') or rel.startswith('docs/journeys/'):
                  if '> **F-016-A — desmaterialização física.**' not in text:
                      unqualified.append(rel)

          print(f'LIVE_EMBED_OR_LINK_HITS={len(live)}')
          print(f'NOMINAL_SVG_REFERENCE_LINES={len(nominal)}')
          print(f'EXPLICIT_HISTORY_FILES_WITH_SVG_NAMES={len(set(explicit_history))}')
          print(f'UNQUALIFIED_ACTIVE_FILES_WITH_SVG_NAMES={len(set(unqualified))}')
          for item in live[:20]: print('LIVE',item)
          for rel in sorted(set(unqualified)): print('UNQUALIFIED',rel)
          if live:
              raise SystemExit('LIVE_REFERENCE_REMAINS')
          if unqualified:
              raise SystemExit('UNQUALIFIED_ACTIVE_REFERENCE_REMAINS')

          checks={
            'docs/project/current-state-register.md': ['version: 3.10.0','PHYSICAL CLEANUP APPLIED 119/119','PHYSICAL SVG COUNT = 0','POST-CLEANUP VALIDATION PENDING','FORMAL RESOLUTION NOT YET CLAIMED'],
            'docs/roadmap.md': ['version: 13.10.0','PHYSICAL CLEANUP APPLIED 119/119','PHYSICAL SVG COUNT = 0','POST-CLEANUP VALIDATION PENDING','FORMAL CLOSURE PENDING'],
            'docs/project/gkr-full-corpus-audit.md': ['version: 1.10.0','POST-DELETE PHYSICAL SVGs','→ 0','F-016-A FORMAL RESOLUTION','NOT YET CLAIMED'],
            'docs/experience-architecture/index.md': ['version: 1.6.0','SVGs FÍSICOS EM docs/assets/wireframes/','→ 0'],
            'docs/journeys/index.md': ['version: 0.42.0','0 SVGs físicos após F-016-A'],
          }
          for rel,tokens in checks.items():
              text=Path(rel).read_text(encoding='utf-8')
              for token in tokens:
                  if token not in text:
                      raise SystemExit(f'MISSING_CURRENT_STATE_TOKEN {rel}: {token}')
          print('CURRENT_AUTHORITY_TRANSITION_STATE=PASS')

          guards={
            'docs/project/current-state-register.md':['UXA-102 / V5\n→ NOT_STARTED','PRODUCT ENGINEERING\n→ PAUSED BEFORE W0-01'],
            'docs/roadmap.md':['J/K/L/M/N','UXA-102/V5','Design','Product Engineering','merge da PR #363'],
          }
          for rel,tokens in guards.items():
              text=Path(rel).read_text(encoding='utf-8')
              for token in tokens:
                  if token not in text:
                      raise SystemExit(f'MISSING_GUARD {rel}: {token}')
          print('DOWNSTREAM_GUARDS_PRESERVED=PASS')
          print('F016A_POST_DELETE_READ_ONLY_PROOF=PASS')
          PY

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PyYAML

      - name: Validate semantic state
        run: python scripts/validate_semantic_state.py

      - name: Validate repository structure
        run: python scripts/validate_gkr.py

      - name: Validate legacy nomenclature
        run: python scripts/validate_legacy_nomenclature.py

      - name: Build MkDocs strict
        run: mkdocs build --strict --site-dir /tmp/gkr-site
