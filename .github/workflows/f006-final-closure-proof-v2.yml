name: F-006 Final Read-Only Closure Proof v2

on:
  push:
    branches:
      - agent/gkr-f006-final-closure-proof-v2

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 549fe10bb7d21eb38961fa9b611e68c53b43f1db
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove exact closure state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          target='549fe10bb7d21eb38961fa9b611e68c53b43f1db'
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if actual != target:
              raise SystemExit(f'WRONG_HEAD={actual}')

          deletion_set=[
            'docs/experience-architecture/uxa-015-organization-overview-low-fidelity-wireframe.md',
            'docs/experience-architecture/uxa-016-collective-home-low-fidelity-wireframe.md',
            'docs/experience-architecture/uxa-017-organization-overview-functional-validation-and-reformulation.md',
            'docs/experience-architecture/uxa-018-collective-home-functional-validation-and-reformulation.md',
            'docs/assets/wireframes/uxa-015-organization-overview-desktop.svg',
            'docs/assets/wireframes/uxa-016-collective-home-mobile.svg',
          ]
          for rel in deletion_set:
              if Path(rel).exists():
                  raise SystemExit(f'DELETION_SET_MEMBER_PRESENT={rel}')

          tracked=subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          tracked=[x.decode() for x in tracked if x]
          utf8=[]; non_utf8=[]
          for rel in tracked:
              p=Path(rel)
              try: utf8.append((rel,p.read_text(encoding='utf-8')))
              except (UnicodeDecodeError,IsADirectoryError): non_utf8.append(rel)

          forbidden_names=[Path(x).name for x in deletion_set]
          direct=[]
          for rel,text in utf8:
              for token in forbidden_names:
                  if token in text: direct.append((rel,token))
          if direct:
              print('DIRECT_DELETED_FILENAME_HITS:')
              for hit in direct: print(hit)
              raise SystemExit('DIRECT_DELETED_FILENAME_HITS_NONZERO')

          svg_count=len(list(Path('docs/assets/wireframes').glob('*.svg')))
          if svg_count != 119:
              raise SystemExit(f'WIREFRAME_SVG_COUNT={svg_count}, expected 119')

          checks={
            'README.md':['| GKR-STATE-001 | **3.8.0** |','F-006 RESOLVED','F-016 — DESMATERIALIZAÇÃO DOCUMENTAL REPO-WIDE','Roadmap 13.8.0'],
            'docs/index.md':['`GKR-STATE-001` **3.8.0**','F-006 RESOLVED','F-016 — DESMATERIALIZAÇÃO DOCUMENTAL REPO-WIDE','Roadmap 13.8.0'],
            'docs/experience-architecture/uxa-047-101-index.md':['version: 3.8.0','→ 3.8.0','F-006 RESOLVED','F-016 — DESMATERIALIZAÇÃO DOCUMENTAL REPO-WIDE','DESIGN É A AUTORIDADE EXCLUSIVA DA MATERIALIZAÇÃO VISUAL'],
            'docs/project/current-state-register.md':['version: 3.8.0','F-006\n→ STRUCTURAL AUDIT COMPLETE','→ PHYSICAL CLEANUP APPLIED 6/6','→ RESOLVED','`F-016` abre'],
            'docs/project/gkr-full-corpus-audit.md':['version: 1.8.0','**RESOLVED — absorção, cleanup 6/6','| F-016 | Major |','## F-016 — Desmaterialização documental repo-wide'],
            'docs/roadmap.md':['id: ROADMAP-13.8.0','version: 13.8.0','F-006 CLEANUP 6/6','[APPLIED / VALIDATED / RESOLVED]','F-016 DESMATERIALIZAÇÃO DOCUMENTAL'],
            'docs/experience-architecture/organizations-collectives-ux-state.md':['version: 1.3.0','### 11.4 Fechamento de F-006','→ PHYSICAL_CLEANUP_APPLIED_6_OF_6','→ RESOLVED','Design é a autoridade exclusiva'],
          }
          for rel,tokens in checks.items():
              s=Path(rel).read_text(encoding='utf-8')
              for token in tokens:
                  if token not in s:
                      raise SystemExit(f'AUTHORITY_ASSERTION_FAILED={rel}::{token}')

          # Current status headers only; historical snapshots elsewhere may legitimately retain prior states.
          readme_head='\n'.join(Path('README.md').read_text(encoding='utf-8').splitlines()[:40])
          index_head='\n'.join(Path('docs/index.md').read_text(encoding='utf-8').splitlines()[:40])
          uxa_head='\n'.join(Path('docs/experience-architecture/uxa-047-101-index.md').read_text(encoding='utf-8').splitlines()[:60])
          for label,text in [('README_HEAD',readme_head),('INDEX_HEAD',index_head),('UXA_INDEX_HEAD',uxa_head)]:
              for stale in ['F-006 OPEN','AUTORIZAÇÃO HUMANA PARA CLEANUP FÍSICO DE F-006','GKR-STATE-001\n→ 3.7.0','**3.7.0**']:
                  if stale in text:
                      raise SystemExit(f'STALE_CURRENT_HEADER={label}::{stale}')

          ids=['UXA-015','UXA-016','UXA-017','UXA-018']
          residual=0
          for _,text in utf8:
              for line in text.splitlines():
                  if any(i in line for i in ids): residual += 1

          print(f'EXACT_HEAD={actual}')
          print(f'TRACKED_FILES={len(tracked)}')
          print(f'UTF8_FILES={len(utf8)}')
          print(f'NON_UTF8_FILES={len(non_utf8)}')
          for rel in non_utf8: print(f'NON_UTF8={rel}')
          print('F006_DELETION_SET_ABSENT=6/6')
          print('F006_DIRECT_DELETED_FILENAME_HITS=0')
          print(f'F006_RESIDUAL_ID_LINES={residual}')
          print(f'WIREFRAME_SVG_COUNT={svg_count}')
          print('F006_CURRENT_AUTHORITIES_RESOLVED=PASS')
          print('F016_DESIGN_ONLY_FINDING_OPEN=PASS')
          PY

      - name: Validate semantic state again
        run: python scripts/validate_semantic_state.py

      - name: Confirm strict documentation build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements.txt
          mkdocs build --strict
