name: Temporary Sync GKR State 3.2.0

on:
  push:
    branches:
      - agent/gkr-global-audit-lote-d-close-e-next-v1

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gkr-global-audit-lote-d-close-e-next-v1
          fetch-depth: 0
      - name: Synchronize derived global surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("README.md"); s=p.read_text(encoding="utf-8"); s=s.replace("3.1.0", "3.2.0"); s=s.replace("| Auditoria integral do corpus | **IN_PROGRESS** |", "| Auditoria integral do corpus | **IN_PROGRESS** |\n| Próximo lote da auditoria | **E — HOME ORGANIZAÇÕES E COLETIVOS** |"); s=s.replace("| Home principal/Pessoa | **REBUILD_REQUIRED** |", "| Home principal/Pessoa | **DOCUMENTALLY_RECONCILED_PRE_MATERIALIZATION** |"); p.write_text(s, encoding="utf-8")'
          python -c 'from pathlib import Path; p=Path("docs/index.md"); s=p.read_text(encoding="utf-8"); s=s.replace("3.1.0", "3.2.0"); s=s.replace("| Auditoria integral | **IN_PROGRESS** |", "| Auditoria integral | **IN_PROGRESS** |\n| Próximo lote da auditoria | **E — HOME ORGANIZAÇÕES E COLETIVOS** |"); s=s.replace("| Home principal/Pessoa | **REBUILD_REQUIRED** |", "| Home principal/Pessoa | **DOCUMENTALLY_RECONCILED_PRE_MATERIALIZATION** |"); p.write_text(s, encoding="utf-8")'
          python -c 'from pathlib import Path; p=Path("docs/experience-architecture/uxa-047-101-index.md"); s=p.read_text(encoding="utf-8"); s=s.replace("3.1.0", "3.2.0"); s=s.replace("last_updated: 2026-08-27", "last_updated: 2026-08-29"); s=s.replace("| Auditoria integral | **IN_PROGRESS** |", "| Auditoria integral | **IN_PROGRESS** |\n| Próximo lote da auditoria | **E — HOME ORGANIZAÇÕES E COLETIVOS** |"); s=s.replace("| Home principal/Pessoa | **REBUILD_REQUIRED** |", "| Home principal/Pessoa | **DOCUMENTALLY_RECONCILED_PRE_MATERIALIZATION** |"); p.write_text(s, encoding="utf-8")'
          rm -f .github/workflows/temp-sync-gkr-state-3-2.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          expected=$'.github/workflows/temp-sync-gkr-state-3-2.yml\nREADME.md\ndocs/experience-architecture/uxa-047-101-index.md\ndocs/index.md'
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git commit -m "docs: sincronizar superfícies globais com estado 3.2.0"
          git push origin HEAD:agent/gkr-global-audit-lote-d-close-e-next-v1
