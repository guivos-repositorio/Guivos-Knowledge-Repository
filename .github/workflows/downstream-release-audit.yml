name: Downstream Release Audit

on:
  push:
    branches:
      - agent/gkr-downstream-release-audit-v1

permissions:
  contents: write

jobs:
  reconcile:
    name: Reconcile residual F-016 authority drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@v4
        with:
          ref: 3cdb755e8493f837798062e5bd99c4de55e450f1
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PyYAML

      - name: Assert immutable base
        run: |
          test "$(git rev-parse HEAD)" = "3cdb755e8493f837798062e5bd99c4de55e450f1"

      - name: Apply exact residual reconciliation
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace_exact(
              'README.md',
              '`F-016` global permanece `OPEN`: as famílias Markdown de materialização ainda exigem classificação individual e eventual reescrita/absorção.',
              '`F-016` está `RESOLVED`: a classificação individual foi concluída e o cleanup governado removeu 26/26 produtores visuais legados após absorção, preservando autoridades, validadores, evidências e proveniência necessária.'
          )

          replace_exact(
              'docs/experience-architecture/organizations-collectives-derived-state-audit.md',
              'F-016\n→ OPEN',
              'F-016\n→ RESOLVED\n→ DOCUMENTATION_DEMATERIALIZATION_COMPLETE\n→ LEGACY_VISUAL_PRODUCERS_REMOVED_26_OF_26\n→ POST_DELETE_PROOF_SUCCESS'
          )

          replace_exact(
              'docs/experience-architecture/public-specialized-homes-reconciliation.md',
              'F-016\n→ OPEN\n\nF-016-A',
              'F-016\n→ RESOLVED\n→ LEGACY VISUAL PRODUCERS REMOVED 26/26\n→ POST-DELETE PROOF COMPLETE\n\nF-016-A'
          )

          replace_exact(
              'docs/experience-architecture/uxa-047-101-index.md',
              '| F-016 | **OPEN — REPO-WIDE DOCUMENTATION DEMATERIALIZATION** |',
              '| F-016 | **RESOLVED — AUDIT + ADJUDICATION + CLEANUP 26/26 + POST-DELETE PROOF COMPLETE** |'
          )
          replace_exact(
              'docs/experience-architecture/uxa-047-101-index.md',
              '| Próximo gate físico | **AUTORIZAÇÃO HUMANA SEPARADA PARA F-016-A; se concedida, cleanup + reconciliação atômica + recomputação + validações/review** |',
              '| Próximo gate governado | **DECISÃO SEPARADA DE LIBERAÇÃO DE J/K/L/M/N; nenhum bloco é liberado automaticamente** |'
          )

          replace_exact(
              'docs/project/current-state-register.md',
              'F-016\n→ OPEN\n\nF-016-A',
              'F-016\n→ RESOLVED\n→ DOCUMENTATION DEMATERIALIZATION COMPLETE\n→ LEGACY VISUAL PRODUCERS REMOVED 26/26\n→ POST-DELETE PROOF SUCCESS\n\nF-016-A'
          )
          replace_exact(
              'docs/project/current-state-register.md',
              'F-016 REMAINING MARKDOWN FAMILIES\n→ CLASSIFICATION / REWRITE / ABSORPTION AUDIT PENDING\n\n',
              ''
          )
          replace_exact(
              'docs/project/current-state-register.md',
              'O encerramento de `F-016-A` não libera automaticamente J–N. `F-016` permanece o eixo prioritário de auditoria.',
              'O encerramento de `F-016-A` e `F-016` não libera automaticamente J–N. A próxima frente depende de decisão governada separada.'
          )
          replace_exact(
              'docs/project/current-state-register.md',
              'O eixo corrente permanece `F-016`, com a camada física `F-016-A` já encerrada.',
              'O próximo ato governado é adjudicar separadamente a liberação de J/K/L/M/N, sem iniciar automaticamente qualquer desses blocos.'
          )
          replace_exact(
              'docs/project/current-state-register.md',
              'NEXT\n→ CLASSIFY REMAINING MARKDOWN MATERIALIZATION FAMILIES\n→ PRESERVE FUNCTIONAL CONTENT\n→ REWRITE OR ABSORB BEFORE ANY DOCUMENT DELETION\n→ VALIDATE EACH RESULTING HEAD\n\nJ / K / L / M / N\n→ NOT RELEASED AUTOMATICALLY',
              'F-016\n→ RESOLVED\n→ LEGACY VISUAL PRODUCERS REMOVED 26/26\n→ POST-DELETE PROOF SUCCESS\n\nNEXT\n→ EVALUATE J / K / L / M / N UNDER SEPARATE GOVERNED RELEASE\n→ NO AUTOMATIC RELEASE'
          )
          replace_exact(
              'docs/project/current-state-register.md',
              'Nenhuma autorização de cleanup Markdown é inferida do fechamento de F-016-A.',
              'O fechamento de F-016 não autoriza automaticamente J/K/L/M/N, Design, UXA-102/V5, Product Engineering, PMF ou implementação.'
          )

          replace_exact(
              'docs/project/gkr-full-corpus-audit.md',
              '### Resultado do Bloco 2\n\n```text',
              '### Resultado do Bloco 2 — checkpoint histórico anterior ao fechamento de F-016\n\nO bloco abaixo preserva o estado no fechamento de G/H/I naquele checkpoint; não representa o estado corrente posterior de F-016.\n\n```text'
          )
          replace_exact(
              'docs/project/gkr-full-corpus-audit.md',
              'F-016\n→ OPEN / REPO-WIDE DOCUMENTATION DEMATERIALIZATION\n\nF-016-A',
              'F-016\n→ RESOLVED\n→ AUDIT + ADJUDICATION + CLEANUP 26/26 + POST-DELETE PROOF COMPLETE\n\nF-016-A'
          )
          replace_exact(
              'docs/project/gkr-full-corpus-audit.md',
              'F-016 REMAINING MARKDOWN FAMILIES\n→ CLASSIFICATION / REWRITE / ABSORPTION PENDING\n\nNEXT SPECIALIZED BLOCK J/K/L/M/N\n→ NOT RELEASED YET',
              'NEXT SPECIALIZED BLOCK J/K/L/M/N\n→ NOT RELEASED AUTOMATICALLY\n→ REQUIRE SEPARATE GOVERNED RELEASE DECISION'
          )
          replace_exact(
              'docs/project/gkr-full-corpus-audit.md',
              'CORPUS CLEANUP\n→ NOT YET COMPLETE',
              'F-016 CORPUS CLEANUP\n→ COMPLETE IN ITS GOVERNED SCOPE'
          )

          audit_path = Path('docs/project/gkr-full-corpus-audit.md')
          audit = audit_path.read_text(encoding='utf-8')
          old = '''### Demais famílias F-016\n\nDocumentos `low-fidelity-wireframe`, `materialization`, validações/programas de wireframe, ciclo de galerias e linguagem de UI continuam sujeitos à classificação individual:\n\n- `KEEP_FUNCTIONAL`;\n- `REWRITE_FUNCTIONAL`;\n- `REMOVE_AFTER_ABSORPTION`;\n- `REMOVE`;\n- `HISTORICAL_PROVENANCE_ONLY`.\n\nNenhum Markdown é removido automaticamente pelo fechamento de F-016-A. Critério global: **o GKR não pode competir com Design na definição de interface**.'''
          new = '''### Demais famílias F-016 — RESOLVED\n\nA classificação individual das famílias Markdown foi concluída. Os 26 produtores visuais legados elegíveis foram removidos somente após absorção; autoridades, validadores e evidências correntes foram preservados ou reconciliados, e a prova pós-delete confirmou ausência de referências estruturais ou caminhos físicos vivos para os produtores removidos.\n\n```text\nF-016\n→ CLASSIFICATION COMPLETE\n→ 26/26 LEGACY VISUAL PRODUCERS REMOVED AFTER ABSORPTION\n→ CURRENT AUTHORITIES / VALIDATORS / EVIDENCE PRESERVED\n→ STRUCTURAL REFERENCES RECONCILED\n→ POST-DELETE PROOF SUCCESS\n→ RESOLVED\n```\n\nNão existe família Markdown pendente sob F-016. Qualquer futura remoção documental fora do conjunto adjudicado exige novo fundamento e novo gate; o critério global permanece: **o GKR não pode competir com Design na definição de interface**.'''
          if audit.count(old) != 1:
              raise SystemExit(f'gkr-full-corpus-audit.md: expected exact remaining-family section once, found {audit.count(old)}')
          audit_path.write_text(audit.replace(old, new, 1), encoding='utf-8')

      - name: Assert closed change boundary
        run: |
          expected=$(cat <<'EOF' | sort
          README.md
          docs/experience-architecture/organizations-collectives-derived-state-audit.md
          docs/experience-architecture/public-specialized-homes-reconciliation.md
          docs/experience-architecture/uxa-047-101-index.md
          docs/project/current-state-register.md
          docs/project/gkr-full-corpus-audit.md
          EOF
          )
          actual=$(git diff --name-only | sort)
          printf 'EXPECTED:\n%s\nACTUAL:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Prove residual state before commit
        shell: python
        run: |
          from pathlib import Path
          import re

          current_paths = [
              Path('README.md'),
              Path('docs/experience-architecture/organizations-collectives-derived-state-audit.md'),
              Path('docs/experience-architecture/public-specialized-homes-reconciliation.md'),
              Path('docs/experience-architecture/uxa-047-101-index.md'),
              Path('docs/project/current-state-register.md'),
          ]
          forbidden = [
              'F-016` global permanece `OPEN',
              'F-016 REMAINING MARKDOWN FAMILIES',
              'CLASSIFY REMAINING MARKDOWN MATERIALIZATION FAMILIES',
              'O eixo corrente permanece `F-016`',
              'AUTORIZAÇÃO HUMANA SEPARADA PARA F-016-A',
              '| F-016 | **OPEN',
          ]
          for p in current_paths:
              text = p.read_text(encoding='utf-8')
              for token in forbidden:
                  if token in text:
                      raise SystemExit(f'{p}: forbidden current-state token remains: {token}')

          audit = Path('docs/project/gkr-full-corpus-audit.md').read_text(encoding='utf-8')
          if '### Demais famílias F-016 — RESOLVED' not in audit:
              raise SystemExit('master audit missing resolved remaining-family section')
          if 'Não existe família Markdown pendente sob F-016.' not in audit:
              raise SystemExit('master audit missing no-pending-family assertion')
          if 'F-016 REMAINING MARKDOWN FAMILIES' in audit:
              raise SystemExit('master audit still contains current pending remaining-family block')

          lines = audit.splitlines()
          open_hits = []
          for i, line in enumerate(lines):
              if line.strip() == 'F-016':
                  window = '\n'.join(lines[i:i+4])
                  if 'OPEN / REPO-WIDE DOCUMENTATION DEMATERIALIZATION' in window:
                      open_hits.append(i)
          print(f'HISTORICAL_F016_OPEN_HITS={len(open_hits)}')
          if len(open_hits) != 1:
              raise SystemExit(f'expected exactly one historical F-016 OPEN checkpoint, found {len(open_hits)}')
          idx = open_hits[0]
          prefix = '\n'.join(lines[max(0, idx-35):idx])
          if 'checkpoint histórico anterior ao fechamento de F-016' not in prefix:
              raise SystemExit('remaining F-016 OPEN occurrence is not explicitly historical')

          state = Path('docs/project/current-state-register.md').read_text(encoding='utf-8')
          required_state = [
              'F-016\n→ RESOLVED',
              'EVALUATE J / K / L / M / N UNDER SEPARATE GOVERNED RELEASE',
              'NO AUTOMATIC RELEASE',
          ]
          for token in required_state:
              if token not in state:
                  raise SystemExit(f'current-state missing: {token}')
          print('RESIDUAL_F016_RECONCILIATION_PROOF=SUCCESS')

      - name: Validate prepared tree
        run: |
          python scripts/validate_semantic_state.py
          python scripts/validate_gkr.py
          python scripts/validate_legacy_nomenclature.py
          git diff --check
          mkdocs build --strict --site-dir /tmp/gkr-site

      - name: Create result commit directly from canonical head
        run: |
          git config user.name "gkr-governance-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md \
            docs/experience-architecture/organizations-collectives-derived-state-audit.md \
            docs/experience-architecture/public-specialized-homes-reconciliation.md \
            docs/experience-architecture/uxa-047-101-index.md \
            docs/project/current-state-register.md \
            docs/project/gkr-full-corpus-audit.md
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'GKR: reconcile residual F-016 current-state drift' | git commit-tree "$tree" -p 3cdb755e8493f837798062e5bd99c4de55e450f1)
          echo "RESULT_SHA=$commit" >> "$GITHUB_ENV"
          git push --force origin "$commit:refs/heads/agent/gkr-post-f016-residual-reconciliation-result-v1"
          echo "RESULT_SHA=$commit"
          echo "RESULT_TREE=$tree"

  prove:
    name: Exact-result read-only proof
    needs: reconcile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact result branch
        uses: actions/checkout@v4
        with:
          ref: agent/gkr-post-f016-residual-reconciliation-result-v1
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PyYAML

      - name: Prove direct parent and no executor leakage
        run: |
          test "$(git rev-parse HEAD^)" = "3cdb755e8493f837798062e5bd99c4de55e450f1"
          test ! -e .github/workflows/downstream-release-audit.yml
          changed=$(git diff --name-only HEAD^...HEAD | sort)
          expected=$(cat <<'EOF' | sort
          README.md
          docs/experience-architecture/organizations-collectives-derived-state-audit.md
          docs/experience-architecture/public-specialized-homes-reconciliation.md
          docs/experience-architecture/uxa-047-101-index.md
          docs/project/current-state-register.md
          docs/project/gkr-full-corpus-audit.md
          EOF
          )
          printf 'CHANGED:\n%s\n' "$changed"
          test "$changed" = "$expected"

      - name: Prove exact resulting authority state
        shell: python
        run: |
          from pathlib import Path

          surfaces = [
              Path('README.md'),
              Path('docs/experience-architecture/organizations-collectives-derived-state-audit.md'),
              Path('docs/experience-architecture/public-specialized-homes-reconciliation.md'),
              Path('docs/experience-architecture/uxa-047-101-index.md'),
              Path('docs/project/current-state-register.md'),
          ]
          forbidden = [
              'F-016` global permanece `OPEN',
              'F-016 REMAINING MARKDOWN FAMILIES',
              'CLASSIFY REMAINING MARKDOWN MATERIALIZATION FAMILIES',
              'O eixo corrente permanece `F-016`',
              'AUTORIZAÇÃO HUMANA SEPARADA PARA F-016-A',
              '| F-016 | **OPEN',
          ]
          for p in surfaces:
              text = p.read_text(encoding='utf-8')
              for token in forbidden:
                  if token in text:
                      raise SystemExit(f'{p}: forbidden token: {token}')

          audit_path = Path('docs/project/gkr-full-corpus-audit.md')
          audit = audit_path.read_text(encoding='utf-8')
          lines = audit.splitlines()
          hits = []
          for i, line in enumerate(lines):
              if line.strip() == 'F-016' and 'OPEN / REPO-WIDE DOCUMENTATION DEMATERIALIZATION' in '\n'.join(lines[i:i+4]):
                  hits.append(i)
          if len(hits) != 1:
              raise SystemExit(f'expected one historical F-016 OPEN, found {len(hits)}')
          if 'checkpoint histórico anterior ao fechamento de F-016' not in '\n'.join(lines[max(0,hits[0]-35):hits[0]]):
              raise SystemExit('historical F-016 OPEN lacks explicit qualifier')
          if '### Demais famílias F-016 — RESOLVED' not in audit or 'Não existe família Markdown pendente sob F-016.' not in audit:
              raise SystemExit('master audit F-016 closure not fully reconciled')

          state = Path('docs/project/current-state-register.md').read_text(encoding='utf-8')
          roadmap = Path('docs/roadmap.md').read_text(encoding='utf-8')
          for text, name in [(state,'state'), (roadmap,'roadmap')]:
              if 'J / K / L / M / N' not in text:
                  raise SystemExit(f'{name}: downstream block set missing')
          if 'EVALUATE J / K / L / M / N UNDER SEPARATE GOVERNED RELEASE' not in state:
              raise SystemExit('state: downstream adjudication not published')
          print('EXACT_RESULT_AUTHORITY_PROOF=SUCCESS')

      - name: Re-run canonical validators on exact result
        run: |
          python scripts/validate_semantic_state.py
          python scripts/validate_gkr.py
          python scripts/validate_legacy_nomenclature.py
          git diff --check HEAD^...HEAD
          mkdocs build --strict --site-dir /tmp/gkr-site
          test -z "$(git status --porcelain --untracked-files=no)"
