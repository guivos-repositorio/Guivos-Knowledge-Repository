name: Block J Points Authority Read-Only Scan

on:
  push:
    branches:
      - agent/gkr-j-points-authority-scan-v1

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scanner branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan exact canonical head across full Markdown corpus
        env:
          TARGET_SHA: d35d5628ae9d5323a24b2f9ebabed116b44c2b9a
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_SHA}^{commit}"
          echo "TARGET_SHA=${TARGET_SHA}"
          echo "SCANNER_SHA=${GITHUB_SHA}"
          echo "--- exact-head full-corpus authority evidence ---"
          python - <<'PY'
          import re, subprocess

          target = "d35d5628ae9d5323a24b2f9ebabed116b44c2b9a"
          names = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", target], text=True
          ).splitlines()
          files = [p for p in names if p.lower().endswith((".md", ".mdx", ".txt", ".yml", ".yaml"))]

          strong = [
              re.compile(r"equival[eê]ncia.{0,160}(?:pontos?|cr[eé]ditos?|R\$|reais?)|(?:pontos?|cr[eé]ditos?|R\$|reais?).{0,160}equival[eê]ncia", re.I),
              re.compile(r"(?:pontos?|cr[eé]ditos?).{0,160}(?:R\$|reais?|valor monet[aá]rio|taxa de convers[aã]o|convers[aã]o em dinheiro|cash[_ -]?convertible|monetary[_ -]?value|valor correspondente)", re.I),
              re.compile(r"(?:R\$|reais?|valor monet[aá]rio|taxa de convers[aã]o|convers[aã]o em dinheiro|cash[_ -]?convertible|monetary[_ -]?value|valor correspondente).{0,160}(?:pontos?|cr[eé]ditos?)", re.I),
              re.compile(r"(?:\b\d[\d.,]*\s*(?:pontos?|cr[eé]ditos?)\s*=\s*(?:R\$|\d)|(?:pontos?|cr[eé]ditos?)\s*=\s*(?:R\$|\d[\d.,]*\s*reais?))", re.I),
              re.compile(r"(?:regra validada|regra vigente|funcionando no ecossistema).{0,160}(?:pontos?|cr[eé]ditos?)|(?:pontos?|cr[eé]ditos?).{0,160}(?:regra validada|regra vigente|funcionando no ecossistema)", re.I),
          ]

          matched_files = 0
          matched_blocks = 0
          for path in files:
              try:
                  text = subprocess.check_output(["git", "show", f"{target}:{path}"], text=True, errors="replace")
              except subprocess.CalledProcessError:
                  continue
              lines = text.splitlines()
              hits = [i for i,line in enumerate(lines) if any(p.search(line) for p in strong)]
              if not hits:
                  continue
              matched_files += 1
              print(f"\n### FILE {path}")
              for j, line in enumerate(lines[:35], start=1):
                  if re.match(r"^(id|title|status|version|last_updated|normative|parent|depends_on|related|supersedes|superseded_by):", line.strip(), re.I):
                      print(f"META {j}: {line}")
              emitted=[]
              for i in hits:
                  if any(abs(i-k) <= 3 for k in emitted):
                      continue
                  emitted.append(i)
                  start=max(0,i-3); end=min(len(lines),i+4)
                  print(f"HIT line {i+1}")
                  for j in range(start,end):
                      print(f"{j+1}: {lines[j]}")
                  print("---")
                  matched_blocks += 1

          print(f"\nMATCHED_FILES={matched_files}")
          print(f"MATCHED_BLOCKS={matched_blocks}")
          PY

      - name: Prove scanner did not mutate canonical target
        env:
          TARGET_SHA: d35d5628ae9d5323a24b2f9ebabed116b44c2b9a
        run: |
          set -euo pipefail
          echo "TARGET_TREE=$(git show -s --format=%T ${TARGET_SHA})"
          git cat-file -e "${TARGET_SHA}^{tree}"
          echo "READ_ONLY_SCAN=PASS"
