name: Block J Documentary Audit

on:
  push:
    branches:
      - agent/gkr-block-j-documentary-audit-v1

permissions:
  contents: read

jobs:
  audit:
    name: Read-only Products and Economy corpus audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@v4
        with:
          ref: d35d5628ae9d5323a24b2f9ebabed116b44c2b9a
          fetch-depth: 1

      - name: Assert immutable head
        run: test "$(git rev-parse HEAD)" = "d35d5628ae9d5323a24b2f9ebabed116b44c2b9a"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -r requirements.txt PyYAML >/dev/null

      - name: Inventory J authorities and semantic claims
        shell: python
        run: |
          from pathlib import Path
          import re, yaml, subprocess

          roots = [Path('docs/product-architecture'), Path('docs/economic-model'), Path('docs/experience-architecture'), Path('docs/project'), Path('docs/roadmap.md'), Path('docs/glossary.md')]
          files=[]
          for root in roots:
              if root.is_dir(): files.extend(root.rglob('*.md'))
              elif root.exists(): files.append(root)

          terms = {
            'points_value': [r'equival.ncia econ.mica', r'X pontos = Y reais', r'monetary_value_defined', r'taxa de convers.o', r'valor monet.rio.*pontos', r'Pontos Guivos'],
            'business_plans': [r'Start', r'Growth', r'Scale', r'Enterprise', r'Conecta', r'Eleva', r'Transforma'],
            'offer_plan_service': [r'OFERTA', r'PLANO', r'Self-service', r'Assisted', r'Managed', r'or.amento pr.-pago'],
            'ads_boost': [r'Opportunity Boost', r'Guivos Ads', r'CPM', r'CPC', r'or.amento'],
            'impact': [r'VALOR DE IMPACTO LIBERADO', r'impacto realizado', r'impacto comprovado'],
          }

          def fm(text):
              if not text.startswith('---\n'): return {}
              end=text.find('\n---\n',4)
              if end<0:return {}
              try:return yaml.safe_load(text[4:end]) or {}
              except:return {}

          print('J_AUDIT_HEAD='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          for category, patterns in terms.items():
              hits=[]
              regs=[re.compile(p,re.I) for p in patterns]
              for path in sorted(set(files)):
                  text=path.read_text(encoding='utf-8')
                  lines=text.splitlines()
                  matched=[]
                  for i,line in enumerate(lines,1):
                      if any(r.search(line) for r in regs): matched.append((i,line.strip()))
                  if matched:
                      meta=fm(text)
                      hits.append((path,meta,matched))
              print(f'\n=== {category} FILES={len(hits)} ===')
              for path,meta,matched in hits:
                  print(f'FILE {path} | id={meta.get("id")} | status={meta.get("status")} | version={meta.get("version")} | updated={meta.get("last_updated")} | normative={meta.get("normative")}')
                  for i,line in matched[:12]: print(f'  {i}: {line}')
                  if len(matched)>12: print(f'  ... +{len(matched)-12} matches')

      - name: Detect exact points-value conflict candidates
        shell: python
        run: |
          from pathlib import Path
          import re
          hits=[]
          for path in Path('docs').rglob('*.md'):
              text=path.read_text(encoding='utf-8')
              for i,line in enumerate(text.splitlines(),1):
                  if re.search(r'equival.ncia econ.mica.*pontos.*reais|X pontos = Y reais|monetary_value_defined:\s*false|valor monet.rio.*pontos|taxa de convers.o', line, re.I):
                      hits.append((str(path),i,line.strip()))
          print(f'POINTS_VALUE_EXACT_HITS={len(hits)}')
          for h in hits: print(f'{h[0]}:{h[1]}: {h[2]}')

      - name: Detect Business plan taxonomy conflict candidates
        shell: python
        run: |
          from pathlib import Path
          import re
          patterns=[
            re.compile(r'Organiza..o[^\n]{0,80}(Start|Growth|Scale|Enterprise)',re.I),
            re.compile(r'Business[^\n]{0,80}(Conecta|Eleva|Transforma)',re.I),
          ]
          hits=[]
          for path in Path('docs').rglob('*.md'):
              for i,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if any(p.search(line) for p in patterns): hits.append((str(path),i,line.strip()))
          print(f'PLAN_TAXONOMY_CANDIDATE_HITS={len(hits)}')
          for h in hits: print(f'{h[0]}:{h[1]}: {h[2]}')

      - name: Canonical validators read-only
        run: |
          python scripts/validate_semantic_state.py
          python scripts/validate_gkr.py
          python scripts/validate_legacy_nomenclature.py
          mkdocs build --strict --site-dir /tmp/gkr-site
