name: One-shot GKR invariant preservation

on:
  push:
    branches:
      - agent/gkr-orgcol-authenticated-state-map-v1

permissions:
  contents: write

jobs:
  preserve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PyYAML

      - name: Reconcile global invariant preservation
        shell: bash
        run: |
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          path = Path("docs/project/current-state-register.md")
          current = path.read_text(encoding="utf-8")
          base = subprocess.check_output(
              ["git", "show", "origin/main:docs/project/current-state-register.md"],
              text=True,
              encoding="utf-8",
          )

          bad_token = "ACTIVE FUNCTION DEPENDENCIES_RECONCILED"
          good_token = "ACTIVE FUNCTION DEPENDENCIES RECONCILED"
          if current.count(bad_token) != 1:
              raise SystemExit(f"Expected exactly one bad F-006 token, found {current.count(bad_token)}")
          current = current.replace(bad_token, good_token, 1)

          current_heading = "## 28. Regra de não inferência"
          base_heading = "## 28. Preservações finais"
          next_heading = "\n## 29. Próximo ato governado"

          def extract_section(text: str, heading: str):
              start = text.index(heading)
              end = text.index(next_heading, start)
              section = text[start:end].rstrip()
              match = re.search(r"```text\n(.*?)\n```", section, re.S)
              if not match:
                  raise SystemExit(f"Code block not found under {heading}")
              return start, end, match.group(1)

          current_start, current_end, current_body = extract_section(current, current_heading)
          _, _, legacy_body = extract_section(base, base_heading)

          legacy_old_oc = "O/C SURFACE MAP DOCUMENTARY DEFINED ≠ STATE MAP ≠ FLOW ≠ WIREFRAME ≠ UI ≠ IMPLEMENTATION"
          if legacy_body.count(legacy_old_oc) != 1:
              raise SystemExit("Expected exactly one legacy O/C boundary")
          legacy_prefix = legacy_body.replace(legacy_old_oc, "", 1).rstrip()

          current_oc = """O/C SURFACE MAP DOCUMENTARY DEFINED
          +
          O/C STATE MAP DOCUMENTARY DEFINED
          ≠ PRIORITY FLOWS
          ≠ WIREFRAME
          ≠ UI
          ≠ IMPLEMENTATION"""
          # Dedent only the literal above, preserving repository text elsewhere.
          current_oc = "\n".join(line.strip() for line in current_oc.splitlines())
          if current_body.count(current_oc) != 1:
              raise SystemExit("Expected exactly one current O/C boundary block")
          current_gate_chain = current_body.replace(current_oc, "", 1).rstrip()

          canonical_oc = """O/C SURFACE MAP + STATE MAP DOCUMENTARY DEFINED
          ≠ PRIORITY FLOWS
          ≠ WIREFRAME
          ≠ UI
          ≠ IMPLEMENTATION

          STATE MAP DEFINED
          ≠ GKR-TRN-* PROMOTED
          ≠ GKR-SURF-* PROMOTED BY INFERENCE
          ≠ MATERIALIZED NAVIGATION"""
          canonical_oc = "\n".join(line.strip() for line in canonical_oc.splitlines())

          merged_body = "\n\n".join(
              part for part in (legacy_prefix, current_gate_chain, canonical_oc) if part
          )
          merged_section = (
              "## 28. Preservações finais e regra de não inferência\n\n"
              "```text\n"
              + merged_body
              + "\n```"
          )

          current = current[:current_start] + merged_section + current[current_end:]

          required = [
              "ORGANIZAÇÃO ≠ GUIVOS BUSINESS ≠ GUIVOS ADS",
              "PONTOS ≠ EVOLUÇÃO ≠ RELEVÂNCIA ≠ PRIORIDADE",
              "INTELLIGENCE BUSINESS ≠ INGESTÃO OBRIGATÓRIA DE KPIs INTERNOS",
              "GRAPH / KNOWLEDGE / ANALYTICS / AI ≠ IDENTIDADE DO PRODUTO",
              "NEO4J = REFERENCE_SELECTED ≠ PRODUCTION",
              "GRAPHRAG = CANDIDATO ≠ IMPLEMENTAÇÃO",
              "POWER BI = CONSUMIDOR POSSÍVEL ≠ FONTE DE VERDADE",
              "GUIVOS ≠ FUNDADOR",
              "HOME DOCUMENTADA ≠ HOME IMPLEMENTADA",
              "AUDITORIA DOCUMENTAL ≠ EVIDÊNCIA OPERACIONAL",
              "CONSOLIDAÇÃO ≠ REDUÇÃO DE CONHECIMENTO",
              "Q RELEASE ELIGIBILITY PASS",
              "MATERIALIZATION ELIGIBILITY PASS",
              "GIA-COG-001 ACTIVE / NORMATIVE",
              "O/C SURFACE MAP + STATE MAP DOCUMENTARY DEFINED",
              "STATE MAP DEFINED",
              "≠ GKR-TRN-* PROMOTED",
              "≠ GKR-SURF-* PROMOTED BY INFERENCE",
              "≠ MATERIALIZED NAVIGATION",
              good_token,
          ]
          missing = [item for item in required if item not in current]
          if missing:
              raise SystemExit("Missing required preserved invariants: " + repr(missing))
          if bad_token in current:
              raise SystemExit("Bad F-006 token still present")
          if legacy_old_oc in current:
              raise SystemExit("Outdated pre-State-Map O/C boundary still present")

          path.write_text(current, encoding="utf-8")
          PY

      - name: Validate semantic state synchronization
        run: python scripts/validate_semantic_state.py

      - name: Validate front matter, IDs, links and navigation
        run: python scripts/validate_gkr.py

      - name: Validate legacy nomenclature
        run: python scripts/validate_legacy_nomenclature.py

      - name: Build MkDocs in strict mode
        run: mkdocs build --strict --site-dir /tmp/gkr-site

      - name: Remove one-shot workflow and verify exact scope
        shell: bash
        run: |
          rm .github/workflows/gkr-one-shot-preserve-invariants.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'.github/workflows/gkr-one-shot-preserve-invariants.yml\ndocs/project/current-state-register.md'
          if [[ "$changed" != "$expected" ]]; then
            printf 'Unexpected changed paths:\n%s\n' "$changed"
            exit 1
          fi

      - name: Commit one-file net remediation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current-state-register.md .github/workflows/gkr-one-shot-preserve-invariants.yml
          git commit -m "GKR: preserve global invariants after State Map promotion"
          git push origin HEAD:${GITHUB_REF_NAME}
