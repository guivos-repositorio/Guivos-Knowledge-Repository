      - Pessoa — Free, Plus e Pro: plans/person.md
      - Coletivos — Livre, Mobiliza, Impacta e Rede: plans/collectives.md
      - Organizações — Conecta, Eleva e Transforma: plans/organizations.md
      - Guivos Business — Start, Growth, Scale e Enterprise: plans/business.md

  - Experiência e Journey:
