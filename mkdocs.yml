site_name: Guivos Knowledge Repository
site_description: Base oficial de conhecimento e arquitetura da Guivos
site_author: Guivos
repo_name: guivos-repositorio/Guivos-Knowledge-Repository
repo_url: https://github.com/guivos-repositorio/Guivos-Knowledge-Repository
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  custom_dir: docs/overrides
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: black
      accent: blue

plugins:
  - search
  - mermaid2
  - print-site:
      add_to_navigation: false
      print_page_title: GKR — Versão para Impressão
      add_print_site_banner: false
      enumerate_headings: true
      enumerate_figures: true
      add_cover_page: true
      cover_page_template: docs/assets/templates/cover-page.tpl
      path_to_pdf: exports/gkr.pdf
      include_css: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# O GKR possui um corpus técnico amplo. A navegação pública expõe apenas
# documentos de leitura e impressão por assunto; fontes técnicas permanecem
# acessíveis por busca, links internos e histórico do repositório.
not_in_nav: |
  *

nav:
  - Início: index.md

  - Comece por aqui:
      - Guia Oficial da Guivos: public/guia-oficial-da-guivos.md
      - Estado Atual do Repositório: project/current-state-register.md
      - Roadmap Arquitetural: roadmap.md
      - Glossário: glossary.md

  - Fundamentos da Guivos:
      - Fundamentos da Guivos: geb/fundamentos-da-guivos.md
      - Modelo Fundamental da Evolução: geb/modelo-fundamental-da-evolucao.md

  - Ecossistema e Produtos:
      - Arquitetura do Ecossistema e Produtos: product-architecture/index.md
      - Guivos Journey: product-architecture/journey.md
      - Produtos Especializados:
          - Guivos Travel: product-architecture/travel.md
          - Guivos Mall: product-architecture/mall.md
          - Guivos Media: product-architecture/media.md
          - Guivos Business: product-architecture/business.md
          - Guivos Ads: product-architecture/ads.md
          - Guivos Intelligence: product-architecture/intelligence.md

  - Experiência, Design e Jornadas:
      - Visão Geral das Jornadas: journeys/index.md
      - Home Pública: experience-architecture/home-publica.md
      - Jornada da Pessoa: journeys/person.md
      - Jornada do Coletivo: journeys/collective.md
      - Jornada da Organização: journeys/organization.md
      - Explorar, Mapa e Oportunidades: experience-architecture/uxa-098-publication-discovery-map-list-detail-integrated-validation.md
      - Opportunity Boost:
          - Fundamentos e Funcionamento: experience-architecture/uxa-038-opportunity-boost-functional-experience-contract.md
          - Estado Atual e Validação: experience-architecture/uxa-099-opportunity-boost-residual-states-functional-validation-and-reformulation.md

  - Pesquisa e Validação:
      - Validação de Mercado: research/market-validation/README.md
      - Pesquisa do Ecossistema: research/pesquisa-do-ecossistema.md

  - Estratégia, Mercado e Crescimento:
      - Estratégia de Negócio: business-architecture/index.md
      - Go-to-Market: go-to-market/go-to-market-consolidado.md

  - Economia, Planos e Monetização:
      - Economia, Planos e Monetização: economic-model/economia-planos-monetizacao-atual.md
      - Planejamento Financeiro M0–M6: economic-model/planejamento-financeiro-m0-m6.md

  - Arquitetura, Dados e IA:
      - Arquitetura Corporativa: enterprise-architecture/index.md
      - Inteligência e IA: intelligence-architecture/index.md
      - Grafo e Neo4j: adr/ADR-007-neo4j-primary-graph-reference.md

  - Governança do Repositório:
      - Governança do Repositório: governance-framework/governanca-do-repositorio.md
      - Painel de Conhecimento: project/knowledge-board.md
      - Marcos Arquiteturais: project/architectural-milestones.md
      - Matriz de Consolidação Canônica: project/canonical-consolidation-matrix.md
