site_name: Guivos Knowledge Repository
site_description: Base oficial de conhecimento e arquitetura da Guivos
site_author: Guivos
repo_name: guivos-repositorio/Guivos-Knowledge-Repository
repo_url: https://github.com/guivos-repositorio/Guivos-Knowledge-Repository
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  custom_dir: docs/overrides
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: black
      accent: blue

extra_css:
  - stylesheets/menu-section-headings.css

plugins:
  - search
  - mermaid2
  - print-site:
      add_to_navigation: true
      print_page_title: Visualizar / Imprimir GKR Completo
      add_print_site_banner: false
      enumerate_headings: true
      enumerate_figures: true
      add_cover_page: true
      cover_page_template: docs/assets/templates/cover-page.tpl
      path_to_pdf: exports/gkr.pdf
      include_css: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# O menu principal é uma superfície de descoberta, não um inventário do corpus.
# Autoridades e evidências de detalhe permanecem preservadas e acessíveis por
# hubs, links internos, busca e histórico sem serem duplicadas no menu.
# Documentos históricos, superseded, candidatos, registros de proveniência,
# remediações concluídas, auditorias de processo e gates intermediários não são
# destinos do MENU. Documentos draft/proposed somente aparecem quando uma
# autoridade superior corrente os declara explicitamente fonte operacional.
# Quando a função corrente deixa de existir, o Git preserva a proveniência.
not_in_nav: |
  *

nav:
  - Início: index.md

  - Comece por aqui:
      - Guia Oficial da Guivos: public/guia-oficial-da-guivos.md
      - Estado Atual do Repositório: project/current-state-register.md
