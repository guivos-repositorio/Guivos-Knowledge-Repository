          - Handoff Canônico de Design: experience-architecture/public-homes-design-handoff.md
          - Prontidão de Produção de Design: experience-architecture/public-homes-design-production-readiness-and-figma-contract.md
          - Fluxo Operacional de Uso do Pacote: experience-architecture/public-homes-design-delivery-operational-flow.md
          - Design Production Release: experience-architecture/public-homes-design-production-release.md
          - IA Opcional — Source Lock e Contrato de Consumo: experience-architecture/public-homes-generative-source-lock-and-prompt-template.md

      - Leia Primeiro por Home:
          - Pessoa: experience-architecture/read-first/public-home-person-read-first.md
          - Organizações e Coletivos: experience-architecture/read-first/public-home-organizations-collectives-read-first.md
          - Guivos Mall: experience-architecture/read-first/public-home-mall-read-first.md
          - Guivos Travel: experience-architecture/read-first/public-home-travel-read-first.md
          - Guivos Media: experience-architecture/read-first/public-home-media-read-first.md
