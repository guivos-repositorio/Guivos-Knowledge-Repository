{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <style>
    /*
      A navegação pública do GKR é organizada por grandes assuntos.
      Somente o primeiro nível recebe maior hierarquia tipográfica;
      documentos e subgrupos permanecem visualmente secundários.
    */
    .md-nav--primary > .md-nav__list > .md-nav__item > .md-nav__link,
    .md-nav--primary > .md-nav__list > .md-nav__item--section > .md-nav__link {
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.35;
      margin-top: 0.35rem;
    }

    .md-nav--primary > .md-nav__list > .md-nav__item--section + .md-nav__item--section {
      margin-top: 0.2rem;
    }

    .gkr-page-actions {
      display: flex;
      justify-content: flex-end;
      margin: 0 0 1rem;
    }

    .gkr-page-print {
      cursor: pointer;
    }

    @media print {
      .gkr-page-actions,
      .md-header,
      .md-tabs,
      .md-sidebar,
      .md-footer,
      .md-top,
      .md-dialog,
      .md-content__button {
        display: none !important;
      }

      .md-main__inner,
      .md-content,
      .md-content__inner {
        margin: 0 !important;
        max-width: none !important;
      }
    }
  </style>
{% endblock %}

{% block content %}
  {% if page and page.url != "print_page/" and page.url != "print_page.html" %}
    <div class="gkr-page-actions">
      <button
        type="button"
        class="md-button gkr-page-print"
        onclick="window.print()"
        aria-label="Imprimir somente este assunto"
      >
        Imprimir este assunto
      </button>
    </div>
  {% endif %}
  {{ super() }}
{% endblock %}
