<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Campanha com entrega reduzida do Opportunity Boost em aplicativo móvel reformulada</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade com campanha ativa em ritmo protegido, causa e verificação datadas, orçamento total, limite diário e período preservados.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text>
  <text x="20" y="58" font-family="Arial" font-size="10">OPPORTUNITY BOOST · GESTÃO MÓVEL</text>
  <text x="20" y="88" font-family="Arial" font-size="18" font-weight="700">Entrega reduzida</text>
  <text x="370" y="87" text-anchor="end" font-family="Arial" font-size="8" font-weight="700">ATIVA COM LIMITE</text>

  <rect x="20" y="108" width="350" height="112" rx="8" fill="#f3f3f3" stroke="#555555"/>
  <text x="34" y="133" font-family="Arial" font-size="10" font-weight="700">BST-2026-081 · versão aprovada v1</text>
  <text x="34" y="154" font-family="Arial" font-size="9">Formação de jovens em tecnologia</text>
  <text x="34" y="175" font-family="Arial" font-size="9">Causa atual: capacidade declarada limitada</text>
  <text x="34" y="196" font-family="Arial" font-size="8">Verificada em 07/08/2026 às 10:20</text>
  <text x="34" y="214" font-family="Arial" font-size="8">A campanha continua ativa em ritmo protegido.</text>

  <rect x="20" y="236" width="350" height="86" rx="8" fill="#ffffff" stroke="#555555"/>
  <text x="34" y="260" font-family="Arial" font-size="11" font-weight="700">Consequência operacional</text>
  <text x="34" y="282" font-family="Arial" font-size="9">Novos eventos podem ocorrer com menor volume.</text>
  <text x="34" y="303" font-family="Arial" font-size="9">Não é pausa, suspensão ou encerramento.</text>
  <text x="34" y="317" font-family="Arial" font-size="8">Nenhuma normalização imediata é garantida.</text>

  <text x="20" y="354" font-family="Arial" font-size="12" font-weight="700">Orçamento e período</text>
  <rect x="20" y="368" width="106" height="64" rx="7" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="390" font-family="Arial" font-size="8">Total</text>
  <text x="32" y="416" font-family="Arial" font-size="14" font-weight="700">R$ 300</text>
  <rect x="142" y="368" width="106" height="64" rx="7" fill="#ffffff" stroke="#777777"/>
  <text x="154" y="390" font-family="Arial" font-size="8">Utilizado</text>
  <text x="154" y="416" font-family="Arial" font-size="14" font-weight="700">R$ 112</text>
  <rect x="264" y="368" width="106" height="64" rx="7" fill="#ffffff" stroke="#777777"/>
  <text x="276" y="390" font-family="Arial" font-size="8">Saldo</text>
  <text x="276" y="416" font-family="Arial" font-size="14" font-weight="700">R$ 188</text>
  <rect x="20" y="442" width="350" height="54" rx="7" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="464" font-family="Arial" font-size="9">Limite diário: R$ 30 · período: 05/08 a 14/08</text>
  <text x="34" y="484" font-family="Arial" font-size="8">Término e limite não são ampliados para compensar a restrição.</text>

  <rect x="20" y="512" width="350" height="116" rx="8" fill="#f3f3f3" stroke="#555555"/>
  <text x="34" y="536" font-family="Arial" font-size="11" font-weight="700">Proteções mantidas</text>
  <text x="34" y="560" font-family="Arial" font-size="9">• orçamento não será acelerado</text>
  <text x="34" y="582" font-family="Arial" font-size="9">• saldo não será consumido por compensação</text>
  <text x="34" y="604" font-family="Arial" font-size="9">• período aprovado permanece inalterado</text>
  <text x="34" y="620" font-family="Arial" font-size="8">A condição atual poderá mudar somente após nova verificação.</text>

  <rect x="20" y="646" width="350" height="68" rx="8" fill="#ffffff" stroke="#777777" stroke-dasharray="5 4"/>
  <text x="34" y="670" font-family="Arial" font-size="10" font-weight="700">Próxima ação compatível</text>
  <text x="34" y="692" font-family="Arial" font-size="9">Revisar capacidade e solicitar nova verificação.</text>
  <text x="34" y="708" font-family="Arial" font-size="8">Salvar uma alteração não normaliza a entrega automaticamente.</text>

  <rect x="20" y="730" width="350" height="48" rx="8" fill="#111111"/>
  <text x="195" y="759" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#ffffff">REVISAR CAPACIDADE</text>
  <text x="20" y="804" font-family="Arial" font-size="9" text-decoration="underline">Revisar pausa</text>
  <text x="370" y="804" text-anchor="end" font-family="Arial" font-size="9" text-decoration="underline">Abrir histórico</text>
  <text x="20" y="824" font-family="Arial" font-size="8">Outras causas: frequência, pouca oferta orgânica ou restrição explicável.</text>
  <text x="20" y="840" font-family="Arial" font-size="8">Gestão móvel reformulada pela UXA-054.</text>
</svg>