<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Campanha programada do Opportunity Boost em aplicativo móvel</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade com campanha aprovada e programada, orçamento reservado, entrega ainda não iniciada e gates verificados novamente antes da ativação.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text>
  <text x="20" y="58" font-family="Arial" font-size="10">OPPORTUNITY BOOST · GESTÃO MÓVEL</text>
  <text x="20" y="88" font-family="Arial" font-size="19" font-weight="700">Campanha programada</text>
  <text x="370" y="87" text-anchor="end" font-family="Arial" font-size="9" font-weight="700">PROGRAMADA</text>

  <rect x="20" y="108" width="350" height="82" rx="8" fill="#f3f3f3" stroke="#555555"/>
  <text x="34" y="133" font-family="Arial" font-size="10" font-weight="700">BST-2026-081 · versão aprovada v1</text>
  <text x="34" y="154" font-family="Arial" font-size="9">Formação de jovens em tecnologia</text>
  <text x="34" y="174" font-family="Arial" font-size="9">Início previsto: 05/08/2026 às 09:00</text>

  <rect x="20" y="206" width="350" height="70" rx="8" fill="#ffffff" stroke="#555555"/>
  <text x="34" y="230" font-family="Arial" font-size="11" font-weight="700">Entrega ainda não iniciada</text>
  <text x="34" y="251" font-family="Arial" font-size="9">0 impressões · 0 cliques · 0 eventos operacionais</text>
  <text x="34" y="269" font-family="Arial" font-size="8">Programação não garante ativação ou uso integral do orçamento.</text>

  <text x="20" y="308" font-family="Arial" font-size="12" font-weight="700">Orçamento</text>
  <rect x="20" y="322" width="106" height="66" rx="7" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="345" font-family="Arial" font-size="8">Total</text>
  <text x="32" y="371" font-family="Arial" font-size="14" font-weight="700">R$ 300</text>
  <rect x="142" y="322" width="106" height="66" rx="7" fill="#ffffff" stroke="#777777"/>
  <text x="154" y="345" font-family="Arial" font-size="8">Reservado</text>
  <text x="154" y="371" font-family="Arial" font-size="14" font-weight="700">R$ 300</text>
  <rect x="264" y="322" width="106" height="66" rx="7" fill="#ffffff" stroke="#777777"/>
  <text x="276" y="345" font-family="Arial" font-size="8">Utilizado</text>
  <text x="276" y="371" font-family="Arial" font-size="14" font-weight="700">R$ 0</text>

  <rect x="20" y="406" width="350" height="194" rx="8" fill="#ffffff" stroke="#555555"/>
  <text x="34" y="431" font-family="Arial" font-size="11" font-weight="700">Gates para o início</text>
  <text x="34" y="455" font-family="Arial" font-size="9">ATENDIDO · oportunidade ativa e aprovada</text>
  <text x="34" y="478" font-family="Arial" font-size="9">ATENDIDO COM LIMITE · capacidade declarada</text>
  <text x="34" y="501" font-family="Arial" font-size="9">ATENDIDO · informação material atual</text>
  <text x="34" y="524" font-family="Arial" font-size="9">ATENDIDO · segurança e política</text>
  <line x1="34" y1="540" x2="356" y2="540" stroke="#cccccc"/>
  <text x="34" y="562" font-family="Arial" font-size="9" font-weight="700">Nova verificação ocorrerá antes do início.</text>
  <text x="34" y="583" font-family="Arial" font-size="8">Falha em gate impede ativação automática.</text>

  <rect x="20" y="618" width="350" height="48" rx="8" fill="#111111"/>
  <text x="195" y="647" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#ffffff">ALTERAR PROGRAMAÇÃO</text>
  <rect x="20" y="678" width="350" height="44" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="195" y="705" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700">REVISAR INFORMAÇÃO MATERIAL</text>

  <text x="20" y="754" font-family="Arial" font-size="9" text-decoration="underline">Revisar orçamento e critérios</text>
  <text x="370" y="754" text-anchor="end" font-family="Arial" font-size="9" text-decoration="underline">Cancelar antes do início</text>
  <rect x="20" y="776" width="350" height="46" rx="7" fill="#f3f3f3" stroke="#777777" stroke-dasharray="5 4"/>
  <text x="34" y="795" font-family="Arial" font-size="8">Alterar informação material poderá exigir nova avaliação.</text>
  <text x="34" y="812" font-family="Arial" font-size="8">Cancelar é uma decisão separada e exige confirmação.</text>
  <text x="20" y="838" font-family="Arial" font-size="8">Gestão móvel materializada; validação funcional ainda pendente.</text>
</svg>