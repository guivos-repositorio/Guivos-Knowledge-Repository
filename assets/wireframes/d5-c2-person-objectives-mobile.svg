<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">PER-010 — Meus Objetivos — low-fidelity mobile</title>
  <desc id="desc">Superfície de direção e controle de objetivos da Pessoa. Domínios de Evolução aparecem como área opcional da jornada, sem score de produtividade.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="389" height="843" fill="none" stroke="#222222"/>

  <text x="20" y="34" font-family="Arial, sans-serif" font-size="14" fill="#222222">‹ Hoje</text>
  <text x="20" y="72" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111111">Meus Objetivos</text>
  <text x="20" y="96" font-family="Arial, sans-serif" font-size="12" fill="#555555">Direções que você escolheu acompanhar e revisar.</text>
  <text x="20" y="114" font-family="Arial, sans-serif" font-size="12" fill="#555555">Objetivo não é meta de produtividade nem medida de valor.</text>

  <rect x="20" y="136" width="350" height="44" rx="8" fill="#f5f5f5" stroke="#bdbdbd"/>
  <text x="34" y="163" font-family="Arial, sans-serif" font-size="12" fill="#333333">Ativos  ·  Pausados  ·  Concluídos</text>

  <rect x="20" y="192" width="350" height="42" rx="8" fill="#ffffff" stroke="#bdbdbd"/>
  <text x="34" y="218" font-family="Arial, sans-serif" font-size="12" fill="#333333">Área da jornada: Todas ▾</text>

  <rect x="20" y="250" width="350" height="190" rx="10" fill="#fafafa" stroke="#777777"/>
  <text x="34" y="276" font-family="Arial, sans-serif" font-size="11" fill="#666666">EM ANDAMENTO</text>
  <text x="34" y="304" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111111">Assumir uma posição de liderança</text>
  <text x="34" y="330" font-family="Arial, sans-serif" font-size="11" fill="#555555">Área da jornada</text>
  <text x="34" y="349" font-family="Arial, sans-serif" font-size="12" fill="#222222">Trabalho, Carreira e Estudos</text>
  <text x="34" y="376" font-family="Arial, sans-serif" font-size="11" fill="#555555">Próxima revisão</text>
  <text x="34" y="395" font-family="Arial, sans-serif" font-size="12" fill="#222222">Revisar direção e critérios em 20 ago</text>
  <line x1="34" y1="410" x2="356" y2="410" stroke="#d0d0d0"/>
  <text x="34" y="429" font-family="Arial, sans-serif" font-size="11" fill="#333333">Ver objetivo e critérios  →</text>

  <rect x="20" y="454" width="350" height="174" rx="10" fill="#fafafa" stroke="#777777"/>
  <text x="34" y="480" font-family="Arial, sans-serif" font-size="11" fill="#666666">EM DEFINIÇÃO</text>
  <text x="34" y="508" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111111">Organizar reserva para uma viagem</text>
  <text x="34" y="534" font-family="Arial, sans-serif" font-size="11" fill="#555555">Áreas relacionadas</text>
  <text x="34" y="553" font-family="Arial, sans-serif" font-size="12" fill="#222222">Vida Financeira · Viagens e Experiências</text>
  <text x="34" y="580" font-family="Arial, sans-serif" font-size="11" fill="#555555">Sem percentual de progresso automático</text>
  <text x="34" y="607" font-family="Arial, sans-serif" font-size="11" fill="#333333">Revisar objetivo  →</text>

  <rect x="20" y="650" width="350" height="54" rx="10" fill="#222222"/>
  <text x="195" y="683" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Registrar objetivo</text>

  <rect x="20" y="724" width="350" height="78" rx="10" fill="#f5f5f5" stroke="#d0d0d0"/>
  <text x="34" y="750" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#333333">Controle permanece com você</text>
  <text x="34" y="770" font-family="Arial, sans-serif" font-size="11" fill="#555555">Área, prioridade, estado e critérios podem ser</text>
  <text x="34" y="787" font-family="Arial, sans-serif" font-size="11" fill="#555555">revistos sem julgamento ou perda de valor.</text>
</svg>
