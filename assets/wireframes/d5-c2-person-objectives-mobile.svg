<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">PER-010 — Meus Objetivos — low-fidelity mobile reformulado pela D5-C3</title>
  <desc id="desc">Superfície de direção e controle de objetivos da Pessoa. Explicita estado funcional, prioridade declarada, revisão e área opcional da jornada sem score de produtividade.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="389" height="843" fill="none" stroke="#222222"/>

  <text x="20" y="34" font-family="Arial, sans-serif" font-size="14" fill="#222222">‹ Hoje</text>
  <text x="20" y="72" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111111">Meus Objetivos</text>
  <text x="20" y="96" font-family="Arial, sans-serif" font-size="12" fill="#555555">Direções que você escolheu acompanhar e revisar.</text>
  <text x="20" y="114" font-family="Arial, sans-serif" font-size="12" fill="#555555">Prioridade e progresso não medem seu valor.</text>

  <rect x="20" y="136" width="350" height="44" rx="8" fill="#f5f5f5" stroke="#bdbdbd"/>
  <text x="34" y="163" font-family="Arial, sans-serif" font-size="12" fill="#333333">Ativos  ·  Em exploração  ·  Pausados</text>

  <rect x="20" y="192" width="350" height="42" rx="8" fill="#ffffff" stroke="#bdbdbd"/>
  <text x="34" y="218" font-family="Arial, sans-serif" font-size="12" fill="#333333">Área da jornada: Todas ▾</text>

  <rect x="20" y="250" width="350" height="210" rx="10" fill="#fafafa" stroke="#777777"/>
  <text x="34" y="276" font-family="Arial, sans-serif" font-size="11" fill="#666666">ATIVO</text>
  <text x="34" y="303" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111111">Assumir uma posição de liderança</text>
  <text x="34" y="329" font-family="Arial, sans-serif" font-size="11" fill="#555555">Área da jornada</text>
  <text x="34" y="348" font-family="Arial, sans-serif" font-size="12" fill="#222222">Trabalho, Carreira e Estudos</text>
  <text x="34" y="374" font-family="Arial, sans-serif" font-size="11" fill="#555555">Prioridade declarada · principal neste período</text>
  <text x="34" y="398" font-family="Arial, sans-serif" font-size="11" fill="#555555">Progresso · marco reconhecido, sem percentual automático</text>
  <text x="34" y="422" font-family="Arial, sans-serif" font-size="11" fill="#555555">Próxima revisão · 20 ago</text>
  <line x1="34" y1="438" x2="356" y2="438" stroke="#d0d0d0"/>
  <text x="34" y="454" font-family="Arial, sans-serif" font-size="11" fill="#333333">Ver critérios, evidências e histórico  →</text>

  <rect x="20" y="474" width="350" height="162" rx="10" fill="#fafafa" stroke="#777777"/>
  <text x="34" y="500" font-family="Arial, sans-serif" font-size="11" fill="#666666">EM EXPLORAÇÃO</text>
  <text x="34" y="527" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111111">Organizar reserva para uma viagem</text>
  <text x="34" y="553" font-family="Arial, sans-serif" font-size="11" fill="#555555">Áreas relacionadas</text>
  <text x="34" y="572" font-family="Arial, sans-serif" font-size="12" fill="#222222">Vida Financeira · Viagens e Experiências</text>
  <text x="34" y="597" font-family="Arial, sans-serif" font-size="11" fill="#555555">Critério de sucesso ainda não definido — isso é legítimo.</text>
  <text x="34" y="621" font-family="Arial, sans-serif" font-size="11" fill="#333333">Revisar formulação  →</text>

  <rect x="20" y="654" width="350" height="54" rx="10" fill="#222222"/>
  <text x="195" y="687" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Registrar objetivo</text>

