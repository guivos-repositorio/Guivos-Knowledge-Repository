<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Visão geral móvel validada do relatório agregado do Opportunity Boost</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade com quatro camadas, proveniência, estado provisório, ausência de dados e supressão por agregação.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text>
  <text x="20" y="62" font-family="Arial" font-size="10">OPPORTUNITY BOOST › RELATÓRIO</text>
  <text x="20" y="92" font-family="Arial" font-size="19" font-weight="700">Resumo da campanha</text>
  <rect x="224" y="70" width="146" height="34" rx="7" fill="#f3f3f3" stroke="#444444"/>
  <text x="297" y="91" text-anchor="middle" font-family="Arial" font-size="8" font-weight="700">PROVISÓRIO · NÃO RECONCILIADO</text>
  <text x="20" y="118" font-family="Arial" font-size="9">05/08 a 10/08 · atualizado em 10/08 às 18:30</text>

  <rect x="20" y="136" width="350" height="66" rx="8" fill="#f3f3f3" stroke="#555555"/>
  <text x="34" y="160" font-family="Arial" font-size="11" font-weight="700">Quatro camadas e origens separadas</text>
  <text x="34" y="181" font-family="Arial" font-size="9">Não disponível, não exibido e zero são estados diferentes.</text>

  <rect x="20" y="218" width="350" height="134" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="243" font-family="Arial" font-size="13" font-weight="700">1. Entrega</text>
  <text x="34" y="263" font-family="Arial" font-size="8">INSTRUMENTADO E CALCULADO · PROVISÓRIO</text>
  <text x="34" y="286" font-family="Arial" font-size="10">Orçamento: R$ 300,00 · utilizado: R$ 146,20</text>
  <text x="34" y="308" font-family="Arial" font-size="10">Saldo: R$ 153,80 · impressões válidas: 5.840</text>
  <text x="34" y="330" font-family="Arial" font-size="9">Frequência: 1,7 · tráfego inválido removido: 31</text>
  <text x="34" y="346" font-family="Arial" font-size="8">Impressão não equivale a atenção ou resultado.</text>

  <rect x="20" y="368" width="350" height="128" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="393" font-family="Arial" font-size="13" font-weight="700">2. Interação</text>
  <text x="34" y="413" font-family="Arial" font-size="8">INSTRUMENTADO QUANDO DISPONÍVEL · PROVISÓRIO</text>
  <text x="34" y="436" font-family="Arial" font-size="10">Cliques: 128 · detalhe: 104 · salvamentos: 19</text>
  <text x="34" y="458" font-family="Arial" font-size="10">Inícios de inscrição: 7</text>
  <text x="34" y="480" font-family="Arial" font-size="9">Conclusões: não disponível · integração ausente</text>

  <rect x="20" y="512" width="350" height="116" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="537" font-family="Arial" font-size="13" font-weight="700">3. Atribuição candidata</text>
  <text x="34" y="557" font-family="Arial" font-size="8">CALCULADO · REGRA v0.1 · NÃO CAUSAL</text>
  <text x="34" y="580" font-family="Arial" font-size="10">27 eventos compatíveis · janela de até 7 dias</text>
  <text x="34" y="602" font-family="Arial" font-size="9">Detalhamento por origem somente quando agregação permitir.</text>
  <text x="34" y="620" font-family="Arial" font-size="8">Origem orgânica e indeterminada permanecem preservadas.</text>

  <rect x="20" y="644" width="350" height="112" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="669" font-family="Arial" font-size="13" font-weight="700">4. Autorrelato</text>
  <text x="34" y="689" font-family="Arial" font-size="8">DECLARADO · NÃO VERIFICADO AUTOMATICAMENTE</text>
  <text x="34" y="712" font-family="Arial" font-size="10">Declaração institucional registrada em 10/08</text>
  <text x="34" y="734" font-family="Arial" font-size="9">Quantidade: não exibida por agregação</text>
  <text x="34" y="750" font-family="Arial" font-size="8">Não é somada aos eventos instrumentados.</text>

  <rect x="20" y="772" width="350" height="42" rx="8" fill="#f3f3f3" stroke="#444444"/>
  <text x="195" y="797" text-anchor="middle" font-family="Arial" font-size="9">Ver metodologia, privacidade, regra e histórico</text>
  <text x="20" y="832" font-family="Arial" font-size="8">Sem lista de visualizadores · supressão não significa zero.</text>
</svg>