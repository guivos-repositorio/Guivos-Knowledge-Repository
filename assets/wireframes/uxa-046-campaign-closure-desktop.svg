<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Encerramento e cancelamento da campanha do Opportunity Boost</title>
  <desc id="desc">Wireframe de baixa fidelidade mostrando estados finais, confirmação de cancelamento, entrega encerrada, orçamento utilizado, saldo candidato e histórico preservado.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="1022" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="220" height="1024" fill="#f4f4f4" stroke="#999999"/>
  <text x="32" y="48" font-family="Arial" font-size="22" font-weight="700">GUIVOS</text>
  <text x="32" y="112" font-family="Arial" font-size="14">Oportunidades</text>
  <text x="32" y="154" font-family="Arial" font-size="14" font-weight="700">Opportunity Boost</text>
  <text x="32" y="196" font-family="Arial" font-size="14">Campanhas</text>
  <text x="260" y="48" font-family="Arial" font-size="11">OPPORTUNITY BOOST › CAMPANHA OB-2048</text>
  <text x="260" y="86" font-family="Arial" font-size="28" font-weight="700">Encerrar campanha</text>
  <rect x="1180" y="46" width="220" height="48" rx="8" fill="#f3f3f3" stroke="#222222"/>
  <text x="1290" y="76" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">ATIVA</text>
  <text x="260" y="122" font-family="Arial" font-size="12">Confirmação proporcional à entrega já iniciada</text>

  <rect x="260" y="154" width="1140" height="122" rx="10" fill="#f3f3f3" stroke="#444444" stroke-width="2"/>
  <text x="286" y="188" font-family="Arial" font-size="14" font-weight="700">O que ocorrerá ao cancelar</text>
  <text x="286" y="220" font-family="Arial" font-size="11">A entrega futura será encerrada. Eventos válidos anteriores, orçamento utilizado e histórico permanecerão disponíveis.</text>
  <text x="286" y="248" font-family="Arial" font-size="11">O tratamento do saldo remanescente depende da política comercial, jurídica, fiscal e contábil ainda não definida.</text>

  <rect x="260" y="306" width="350" height="236" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="340" font-family="Arial" font-size="15" font-weight="700">Entrega</text>
  <text x="286" y="378" font-family="Arial" font-size="12">Futura: será encerrada</text>
  <text x="286" y="408" font-family="Arial" font-size="12">Eventos válidos: preservados</text>
  <text x="286" y="438" font-family="Arial" font-size="12">Retomada: não disponível após cancelar</text>
  <text x="286" y="468" font-family="Arial" font-size="12">Relatório posterior: permanecerá acessível</text>
  <text x="286" y="510" font-family="Arial" font-size="10">O relatório agregado será definido em pacote separado.</text>

  <rect x="636" y="306" width="350" height="236" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="662" y="340" font-family="Arial" font-size="15" font-weight="700">Orçamento</text>
  <text x="662" y="378" font-family="Arial" font-size="12">Total: R$ 300,00</text>
  <text x="662" y="408" font-family="Arial" font-size="12">Utilizado: R$ 146,20</text>
  <text x="662" y="438" font-family="Arial" font-size="12">Saldo remanescente: R$ 153,80</text>
  <text x="662" y="468" font-family="Arial" font-size="12">Tratamento: em definição</text>
  <text x="662" y="510" font-family="Arial" font-size="10">Nenhum valor é prometido como devolução automática.</text>

  <rect x="1012" y="306" width="388" height="236" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="1038" y="340" font-family="Arial" font-size="15" font-weight="700">Motivo do encerramento</text>
  <rect x="1038" y="370" width="336" height="44" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="1054" y="397" font-family="Arial" font-size="11">Selecionar motivo</text>
  <text x="1038" y="446" font-family="Arial" font-size="11">Motivo será registrado no histórico.</text>
  <text x="1038" y="476" font-family="Arial" font-size="11">Não será usado para alterar relevância orgânica.</text>
  <text x="1038" y="506" font-family="Arial" font-size="10">Campos finais dependem de política futura.</text>

  <rect x="260" y="574" width="740" height="226" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="608" font-family="Arial" font-size="15" font-weight="700">Estados finais visíveis</text>
  <text x="286" y="646" font-family="Arial" font-size="12">Orçamento esgotado — entrega encerrada por limite financeiro.</text>
  <text x="286" y="676" font-family="Arial" font-size="12">Capacidade esgotada — entrega encerrada para evitar excesso de demanda.</text>
  <text x="286" y="706" font-family="Arial" font-size="12">Oportunidade expirada — data ou validade encerrada.</text>
  <text x="286" y="736" font-family="Arial" font-size="12">Concluída — período finalizado conforme condição válida.</text>
  <text x="286" y="766" font-family="Arial" font-size="12">Cancelada — encerrada pelo anunciante após confirmação.</text>
  <text x="286" y="792" font-family="Arial" font-size="10">Reconciliada será registrada após tratamento dos eventos e saldo.</text>

  <rect x="1026" y="574" width="374" height="226" rx="10" fill="#f3f3f3" stroke="#444444"/>
  <text x="1052" y="608" font-family="Arial" font-size="15" font-weight="700">Confirmação</text>
  <text x="1052" y="646" font-family="Arial" font-size="11">□ Entendo que a entrega futura será encerrada.</text>
  <text x="1052" y="678" font-family="Arial" font-size="11">□ Revisei orçamento utilizado e saldo candidato.</text>
  <text x="1052" y="710" font-family="Arial" font-size="11">□ Entendo que não haverá retomada desta campanha.</text>
  <rect x="1052" y="738" width="322" height="44" rx="8" fill="#111111" stroke="#111111"/>
  <text x="1213" y="765" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffffff">Confirmar cancelamento</text>

  <text x="260" y="850" font-family="Arial" font-size="11">Alternativa: pausar campanha quando a causa permitir retomada.</text>
  <text x="260" y="882" font-family="Arial" font-size="11">Histórico e eventos válidos não serão apagados pelo cancelamento.</text>
  <text x="260" y="954" font-family="Arial" font-size="11">Baixa fidelidade · saldo e reconciliação são candidatos · sem cobrança real ou implementação.</text>
</svg>