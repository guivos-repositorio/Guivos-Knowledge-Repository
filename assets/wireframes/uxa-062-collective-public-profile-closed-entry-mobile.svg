<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel do Perfil Público de Coletivo com entradas temporariamente indisponíveis</title>
  <desc id="desc">Perfil público móvel do Pedal Urbano Aberto, acessado por publicidade identificada, com entradas temporariamente indisponíveis, motivo, revisão prevista, acompanhamento opcional e relação comercial separada da legitimidade do Coletivo.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar aos resultados</text>
  <text x="370" y="57" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Compartilhar</text>
  <rect x="20" y="73" width="350" height="58" rx="9" fill="#f5f5f5" stroke="#111111" stroke-dasharray="5 3"/>
  <text x="32" y="90" font-family="Arial, sans-serif" font-size="7" font-weight="700">ORIGEM: PATROCINADO · PUBLICIDADE</text>
  <text x="32" y="107" font-family="Arial, sans-serif" font-size="8">Anunciante: Associação Movimento Livre · após resultado orgânico</text>
  <text x="32" y="122" font-family="Arial, sans-serif" font-size="7">Publicidade trouxe você até aqui; não altera regras, reputação ou autoridade.</text>
  <text x="20" y="164" font-family="Arial, sans-serif" font-size="22" font-weight="700">Pedal Urbano Aberto</text>
  <text x="20" y="184" font-family="Arial, sans-serif" font-size="8">COLETIVO · ATIVO · PÚBLICO</text>
  <rect x="234" y="150" width="136" height="28" rx="14" fill="#f2f2f2" stroke="#777777"/>
  <text x="302" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700">Entradas indisponíveis</text>
  <text x="20" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="700">Mobilidade ativa e convivência segura na cidade</text>
  <text x="20" y="233" font-family="Arial, sans-serif" font-size="8">Pedais públicos com orientação de segurança e apoio comunitário.</text>
  <rect x="20" y="249" width="350" height="58" rx="9" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="267" font-family="Arial, sans-serif" font-size="7" font-weight="700">FUNCIONAMENTO</text>
  <text x="32" y="284" font-family="Arial, sans-serif" font-size="8">Belo Horizonte · presencial · atividades mensais</text>
  <text x="32" y="299" font-family="Arial, sans-serif" font-size="8">Acessibilidade informada por atividade · lista nominal protegida</text>
  <rect x="20" y="319" width="169" height="42" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="104" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Acompanhar</text>
  <rect x="201" y="319" width="169" height="42" rx="8" fill="#eeeeee" stroke="#999999"/>
  <text x="285" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#555555">Entradas indisponíveis</text>
  <text x="20" y="380" font-family="Arial, sans-serif" font-size="7">Acompanhar é opcional e não cria fila, prioridade ou participação futura.</text>
  <rect x="20" y="395" width="350" height="112" rx="10" fill="#f7f7f7" stroke="#777777" stroke-dasharray="4 3"/>
  <text x="32" y="415" font-family="Arial, sans-serif" font-size="10" font-weight="700">Por que as entradas estão fechadas?</text>
  <text x="32" y="434" font-family="Arial, sans-serif" font-size="8">Revisão temporária das rotas, responsáveis e capacidade de acompanhamento.</text>
  <text x="32" y="453" font-family="Arial, sans-serif" font-size="8">Revisão prevista: 18/08/2026 · data estimada, sem garantia de reabertura.</text>
  <text x="32" y="472" font-family="Arial, sans-serif" font-size="8">Atividades públicas existentes continuam visíveis quando seguras.</text>
  <text x="32" y="493" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver atualização oficial e condições de reabertura</text>
  <rect x="20" y="519" width="350" height="69" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="539" font-family="Arial, sans-serif" font-size="9" font-weight="700">Pessoas e responsabilidade</text>
  <text x="32" y="557" font-family="Arial, sans-serif" font-size="8">Participantes confirmados: contagem aproximada · lista protegida</text>
  <text x="32" y="575" font-family="Arial, sans-serif" font-size="8">Responsável: Associação Movimento Livre · moderação identificada</text>
  <rect x="20" y="600" width="350" height="64" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="620" font-family="Arial, sans-serif" font-size="9" font-weight="700">Relação comercial desta visita</text>
  <text x="32" y="638" font-family="Arial, sans-serif" font-size="8">A distribuição deste perfil foi paga e está identificada.</text>
  <text x="32" y="654" font-family="Arial, sans-serif" font-size="7">Pagamento não comprova qualidade, impacto ou recomendação da Guivos.</text>
  <rect x="20" y="676" width="350" height="59" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="696" font-family="Arial, sans-serif" font-size="9" font-weight="700">Experiência dos participantes</text>
  <text x="32" y="714" font-family="Arial, sans-serif" font-size="8">Resumo contextual disponível por período; fechamento não altera avaliações.</text>
  <text x="32" y="730" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver evidências e limitações</text>
  <text x="20" y="750" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ocultar publicidade</text>
  <text x="195" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Proteção e contato</text>
  <text x="370" y="750" text-anchor="end" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Denunciar perfil</text>
  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
