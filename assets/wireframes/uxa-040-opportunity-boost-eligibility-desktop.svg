<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Elegibilidade reformulada para impulsionamento</title>
  <desc id="desc">Wireframe para computador que distingue condições atendidas, atendidas com limite e bloqueadas antes de liberar a configuração do Opportunity Boost.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="1022" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="220" height="1024" fill="#f4f4f4" stroke="#999999"/>
  <text x="32" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700">GUIVOS</text>
  <text x="32" y="92" font-family="Arial, sans-serif" font-size="12">PAINEL DO ANUNCIANTE</text>
  <text x="32" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="700">Oportunidades</text>
  <text x="32" y="188" font-family="Arial, sans-serif" font-size="14">Campanhas</text>
  <text x="32" y="228" font-family="Arial, sans-serif" font-size="14">Planos e cobrança</text>
  <text x="32" y="268" font-family="Arial, sans-serif" font-size="14">Equipe e permissões</text>
  <text x="32" y="950" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Ajuda e políticas</text>

  <text x="260" y="48" font-family="Arial, sans-serif" font-size="12" fill="#555555">OPORTUNIDADES › GESTÃO › IMPULSIONAMENTO</text>
  <text x="260" y="88" font-family="Arial, sans-serif" font-size="28" font-weight="700">Verificar disponibilidade para impulsionamento</text>
  <text x="260" y="118" font-family="Arial, sans-serif" font-size="13">Plano elegível não substitui aprovação, capacidade, segurança ou responsabilidade institucional.</text>

  <rect x="260" y="150" width="1140" height="116" rx="10" fill="#ffffff" stroke="#888888"/>
  <text x="286" y="182" font-family="Arial, sans-serif" font-size="12" fill="#555555">OPORTUNIDADE SELECIONADA</text>
  <text x="286" y="214" font-family="Arial, sans-serif" font-size="20" font-weight="700">Formação gratuita em gestão comunitária</text>
  <text x="286" y="242" font-family="Arial, sans-serif" font-size="12">Coletivo Horizonte · Online · Inscrições até 30/09/2026 · Gratuita</text>
  <text x="1348" y="214" text-anchor="end" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Abrir oportunidade</text>

  <text x="260" y="306" font-family="Arial, sans-serif" font-size="16" font-weight="700">Condições obrigatórias</text>
  <rect x="260" y="326" width="550" height="448" rx="10" fill="#f8f8f8" stroke="#888888"/>

  <text x="286" y="360" font-family="Arial, sans-serif" font-size="13" font-weight="700">Plano</text>
  <text x="770" y="360" text-anchor="end" font-family="Arial, sans-serif" font-size="12">Atendido · Coletivo Mobiliza</text>
  <line x1="286" y1="380" x2="784" y2="380" stroke="#cccccc"/>
  <text x="286" y="414" font-family="Arial, sans-serif" font-size="13" font-weight="700">Aprovação e atividade</text>
  <text x="770" y="414" text-anchor="end" font-family="Arial, sans-serif" font-size="12">Atendido · aprovada e ativa</text>
  <line x1="286" y1="434" x2="784" y2="434" stroke="#cccccc"/>
  <text x="286" y="468" font-family="Arial, sans-serif" font-size="13" font-weight="700">Informações materiais</text>
  <text x="770" y="468" text-anchor="end" font-family="Arial, sans-serif" font-size="12">Atendido · atualizadas hoje</text>
  <line x1="286" y1="488" x2="784" y2="488" stroke="#cccccc"/>
  <text x="286" y="522" font-family="Arial, sans-serif" font-size="13" font-weight="700">Capacidade de atendimento</text>
  <text x="770" y="522" text-anchor="end" font-family="Arial, sans-serif" font-size="12">Atendido com limite · 18 vagas</text>
  <line x1="286" y1="542" x2="784" y2="542" stroke="#cccccc"/>
  <text x="286" y="576" font-family="Arial, sans-serif" font-size="13" font-weight="700">Segurança e moderação</text>
  <text x="770" y="576" text-anchor="end" font-family="Arial, sans-serif" font-size="12">Atendido · sem pendência crítica</text>
  <line x1="286" y1="596" x2="784" y2="596" stroke="#cccccc"/>
  <text x="286" y="630" font-family="Arial, sans-serif" font-size="13" font-weight="700">Responsável institucional</text>
  <text x="770" y="630" text-anchor="end" font-family="Arial, sans-serif" font-size="12">Bloqueado · responsável ausente</text>
  <rect x="286" y="658" width="498" height="86" rx="8" fill="#ffffff" stroke="#999999" stroke-dasharray="6 4"/>
  <text x="306" y="686" font-family="Arial, sans-serif" font-size="12" font-weight="700">Ação necessária</text>
  <text x="306" y="710" font-family="Arial, sans-serif" font-size="11">Defina uma pessoa responsável e um canal de suporte antes de continuar.</text>
  <text x="306" y="732" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Adicionar responsável institucional</text>

  <rect x="840" y="326" width="560" height="448" rx="10" fill="#ffffff" stroke="#888888"/>
  <text x="868" y="360" font-family="Arial, sans-serif" font-size="16" font-weight="700">Estado atual</text>
  <rect x="868" y="390" width="504" height="104" rx="8" fill="#f3f3f3" stroke="#999999"/>
  <text x="890" y="424" font-family="Arial, sans-serif" font-size="17" font-weight="700">Impulsionamento indisponível</text>
  <text x="890" y="452" font-family="Arial, sans-serif" font-size="12">1 bloqueio crítico impede a continuidade.</text>
  <text x="890" y="476" font-family="Arial, sans-serif" font-size="11">A capacidade limitada não bloqueia, mas restringirá alcance e entrega.</text>
  <text x="868" y="530" font-family="Arial, sans-serif" font-size="13" font-weight="700">Significado dos estados</text>
  <text x="888" y="560" font-family="Arial, sans-serif" font-size="12">• Atendido · permite continuidade</text>
  <text x="888" y="586" font-family="Arial, sans-serif" font-size="12">• Atendido com limite · permite, mas limita a campanha</text>
  <text x="888" y="612" font-family="Arial, sans-serif" font-size="12">• Bloqueado · exige correção antes de avançar</text>
  <text x="888" y="648" font-family="Arial, sans-serif" font-size="11">Comprar ou ampliar um plano não elimina os demais gates.</text>
  <rect x="868" y="674" width="504" height="52" rx="8" fill="#e5e5e5" stroke="#999999" stroke-dasharray="6 4"/>
  <text x="1120" y="706" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700">Configurar impulsionamento · indisponível</text>
  <text x="1120" y="752" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Voltar à gestão da oportunidade</text>

  <rect x="260" y="808" width="1140" height="136" rx="10" fill="#f7f7f7" stroke="#999999"/>
  <text x="286" y="842" font-family="Arial, sans-serif" font-size="14" font-weight="700">Regra de continuidade</text>
  <text x="286" y="872" font-family="Arial, sans-serif" font-size="12">A configuração será liberada somente quando não houver bloqueio crítico.</text>
  <text x="286" y="898" font-family="Arial, sans-serif" font-size="12">Limites operacionais permanecem visíveis e deverão reduzir a entrega antes de ultrapassar a capacidade declarada.</text>
  <text x="286" y="924" font-family="Arial, sans-serif" font-size="11">Pagamento amplia distribuição identificada; não compra relevância orgânica, recomendação, confiança ou resultado.</text>
</svg>