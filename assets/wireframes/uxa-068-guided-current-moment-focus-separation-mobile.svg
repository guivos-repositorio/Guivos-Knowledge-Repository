<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Separação de focos do Momento Atual</title>
  <desc id="desc">Tela móvel que identifica assuntos diferentes sem descartar conteúdo silenciosamente e permite escolher foco, criar segundo assunto, manter junto ou deixar fora.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="28" font-family="Arial, sans-serif" font-size="11">09:41</text>
  <text x="20" y="58" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao rascunho</text>
  <text x="370" y="58" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Manter como está</text>
  <text x="20" y="97" font-family="Arial, sans-serif" font-size="21" font-weight="700">Há mais de um assunto aqui</text>
  <text x="20" y="121" font-family="Arial, sans-serif" font-size="9">Nada será removido ou classificado sem sua escolha.</text>
  <rect x="20" y="143" width="350" height="91" rx="10" fill="#f5f5f5" stroke="#777777"/>
  <text x="32" y="166" font-family="Arial, sans-serif" font-size="10" font-weight="700">Por que isso apareceu</text>
  <text x="32" y="188" font-family="Arial, sans-serif" font-size="8">O relato menciona transição profissional e uma preocupação</text>
  <text x="32" y="207" font-family="Arial, sans-serif" font-size="8">financeira que pode exigir caminhos diferentes.</text>
  <text x="32" y="226" font-family="Arial, sans-serif" font-size="7">A Guivos ainda não sabe se os assuntos devem permanecer juntos.</text>
  <rect x="20" y="250" width="350" height="104" rx="10" fill="#ffffff" stroke="#111111"/>
  <text x="32" y="274" font-family="Arial, sans-serif" font-size="10" font-weight="700">Assunto 1 · transição profissional</text>
  <text x="32" y="296" font-family="Arial, sans-serif" font-size="8">“Não vejo crescimento e tenho dificuldade para demonstrar experiência.”</text>
  <text x="32" y="323" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Usar como foco principal</text>
  <text x="350" y="323" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Editar trecho</text>
  <rect x="20" y="369" width="350" height="104" rx="10" fill="#ffffff" stroke="#111111"/>
  <text x="32" y="393" font-family="Arial, sans-serif" font-size="10" font-weight="700">Assunto 2 · segurança financeira</text>
  <text x="32" y="415" font-family="Arial, sans-serif" font-size="8">“Não posso interromper minha renda durante uma mudança.”</text>
  <text x="32" y="442" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Tratar como condição do assunto 1</text>
  <text x="350" y="442" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Criar assunto separado</text>
  <text x="20" y="510" font-family="Arial, sans-serif" font-size="11" font-weight="700">Como deseja organizar?</text>
  <rect x="20" y="528" width="350" height="43" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="555" font-family="Arial, sans-serif" font-size="9">Manter os dois no mesmo Momento Atual</text>
  <rect x="20" y="583" width="350" height="43" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="610" font-family="Arial, sans-serif" font-size="9">Usar o primeiro como foco e o segundo como condição</text>
  <rect x="20" y="638" width="350" height="43" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="665" font-family="Arial, sans-serif" font-size="9">Separar em dois assuntos revisáveis</text>
  <rect x="20" y="700" width="350" height="43" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="727" font-family="Arial, sans-serif" font-size="9">Deixar um trecho fora desta compreensão</text>
  <text x="195" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Nenhuma opção vem marcada.</text>
  <text x="195" y="802" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Conteúdo fora desta compreensão poderá ser mantido ou excluído separadamente.</text>
</svg>
