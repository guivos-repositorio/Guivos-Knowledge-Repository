<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Erro técnico temporário em conteúdo patrocinado</title><desc id="desc">O conteúdo patrocinado está indisponível, mas o catálogo orgânico permanece acessível.</desc><rect width="390" height="844" fill="#fff"/><rect x="1" y="1" width="388" height="842" fill="none" stroke="#111" stroke-width="2"/><text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text><text x="20" y="60" font-family="Arial" font-size="10">EXPLORAR · OPORTUNIDADES</text><text x="20" y="94" font-family="Arial" font-size="19" font-weight="700">Resultados para tecnologia</text><rect x="20" y="116" width="350" height="72" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="142" font-family="Arial" font-size="11" font-weight="700">8 oportunidades orgânicas</text><text x="34" y="164" font-family="Arial" font-size="9">Região, busca e filtros permanecem aplicados.</text><rect x="20" y="208" width="350" height="138" rx="8" fill="#fff" stroke="#555"/><text x="34" y="236" font-family="Arial" font-size="10" font-weight="700">OPORTUNIDADE ORGÂNICA</text><text x="34" y="264" font-family="Arial" font-size="14" font-weight="700">Formação gratuita em programação</text><text x="34" y="290" font-family="Arial" font-size="9">Instituto Horizonte · Belo Horizonte</text><text x="34" y="314" font-family="Arial" font-size="9">10/08/2026 · presencial · gratuito</text><text x="34" y="334" font-family="Arial" font-size="9" text-decoration="underline">Ver detalhes</text><rect x="20" y="368" width="350" height="246" rx="8" fill="#f3f3f3" stroke="#555" stroke-dasharray="5 4"/><text x="34" y="398" font-family="Arial" font-size="11" font-weight="700">Patrocinados temporariamente indisponíveis</text><text x="34" y="426" font-family="Arial" font-size="9">Não foi possível carregar a unidade paga.</text><text x="34" y="450" font-family="Arial" font-size="9">O catálogo orgânico continua disponível.</text><text x="34" y="474" font-family="Arial" font-size="9">Nenhum filtro ou preferência foi alterado.</text><text x="34" y="506" font-family="Arial" font-size="8">Erro técnico temporário · atualizado às 18:42</text><text x="34" y="530" font-family="Arial" font-size="8">Falha de carregamento não significa zero inventário.</text><rect x="34" y="550" width="322" height="44" rx="7" fill="#111"/><text x="195" y="578" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#fff">TENTAR CARREGAR PATROCINADOS</text><rect x="20" y="638" width="350" height="112" rx="8" fill="#fff" stroke="#555"/><text x="34" y="668" font-family="Arial" font-size="10" font-weight="700">Continuar sem publicidade</text><text x="34" y="694" font-family="Arial" font-size="9">A busca orgânica permanece completa e utilizável.</text><text x="34" y="718" font-family="Arial" font-size="9">O anunciante não recebe informação sobre a pessoa.</text><text x="20" y="814" font-family="Arial" font-size="8">Estado residual materializado; validação funcional pendente.</text></svg>