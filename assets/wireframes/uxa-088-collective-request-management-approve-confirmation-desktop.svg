<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">Gestão de Solicitações — Confirmar Aprovação</title><desc id="desc">Wireframe desktop de baixa fidelidade para revisão consciente antes de aprovar uma solicitação.</desc><rect width="1440" height="1024" fill="#fff"/><g fill="none" stroke="#111" stroke-width="2"><rect x="24" y="24" width="1392" height="72" rx="8"/><rect x="24" y="112" width="248" height="888" rx="8"/><rect x="288" y="112" width="1128" height="124" rx="8"/><rect x="288" y="252" width="1128" height="420" rx="8"/><rect x="288" y="688" width="1128" height="196" rx="8"/><rect x="288" y="900" width="1128" height="100" rx="8"/></g><g font-family="Arial" fill="#111"><text x="48" y="58" font-size="22" font-weight="700">Coletivo Horizonte Aberto</text><text x="48" y="82" font-size="13">Responsável por participação · autoridade válida</text><text x="48" y="148" font-size="15" font-weight="700">SOLICITAÇÕES</text><text x="48" y="190" font-size="14">Fila</text><text x="48" y="226" font-size="14">Detalhe</text><text x="48" y="262" font-size="14" font-weight="700">Confirmar aprovação</text><text x="48" y="310" font-size="13">← Voltar sem decidir</text><text x="316" y="150" font-size="22" font-weight="700">Revisar aprovação · SOL-1842</text><text x="316" y="182" font-size="13">A aprovação formará um vínculo de participante. Revise autoridade, fundamento e consequência.</text><text x="316" y="294" font-size="18" font-weight="700">Fundamento</text><text x="316" y="334" font-size="14">Critérios públicos aplicáveis foram atendidos com os dados autorizados para esta finalidade.</text><text x="316" y="384" font-size="18" font-weight="700">O que a aprovação cria</text><text x="316" y="424" font-size="14">• vínculo de participante confirmado neste Coletivo</text><text x="316" y="456" font-size="14">• resultado visível para a Pessoa</text><text x="316" y="488" font-size="14">• continuidade futura para o ambiente interno quando a superfície existir</text><text x="316" y="538" font-size="18" font-weight="700">O que a aprovação não cria</text><text x="316" y="578" font-size="14">• função, moderação, autoridade ou presença obrigatória</text><text x="316" y="610" font-size="14">• notificação automática, exposição nominal, reputação ou prova de evolução</text><text x="316" y="730" font-size="18" font-weight="700">Confirmação consciente</text><text x="316" y="772" font-size="14">[ ] Confirmo que possuo autoridade e que o fundamento acima é aplicável a esta solicitação.</text><text x="316" y="812" font-size="13">A confirmação começa vazia. A Pessoa continuará podendo exercer controles do vínculo conforme contratos próprios.</text><text x="316" y="936" font-size="14">Confirmar aprovação</text><text x="560" y="936" font-size="14">Voltar ao detalhe</text><text x="760" y="936" font-size="14">Cancelar decisão</text></g></svg>