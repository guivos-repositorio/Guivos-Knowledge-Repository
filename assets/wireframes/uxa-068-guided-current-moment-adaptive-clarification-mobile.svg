<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Pergunta adaptativa sobre o Momento Atual</title>
  <desc id="desc">Tela móvel que apresenta uma pergunta útil baseada em lacuna material, com razão explícita, opções, texto livre, adiamento e recusa.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="28" font-family="Arial, sans-serif" font-size="11">09:41</text>
  <text x="20" y="58" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao rascunho</text>
  <text x="370" y="58" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Pular por enquanto</text>
  <text x="20" y="97" font-family="Arial, sans-serif" font-size="21" font-weight="700">Uma pergunta pode ajudar</text>
  <text x="20" y="121" font-family="Arial, sans-serif" font-size="9">A resposta é opcional e poderá ser corrigida depois.</text>
  <rect x="20" y="143" width="350" height="103" rx="10" fill="#f5f5f5" stroke="#777777"/>
  <text x="32" y="166" font-family="Arial, sans-serif" font-size="10" font-weight="700">Por que estamos perguntando</text>
  <text x="32" y="188" font-family="Arial, sans-serif" font-size="8">Seu relato explica a situação e a dificuldade, mas ainda não</text>
  <text x="32" y="207" font-family="Arial, sans-serif" font-size="8">mostra qual direção faria sentido considerar primeiro.</text>
  <text x="32" y="229" font-family="Arial, sans-serif" font-size="7">Isso reduz uma incerteza; não define uma solução automaticamente.</text>
  <rect x="20" y="262" width="350" height="85" rx="10" fill="#ffffff" stroke="#111111"/>
  <text x="32" y="286" font-family="Arial, sans-serif" font-size="10" font-weight="700">O que você gostaria de alcançar agora?</text>
  <text x="32" y="310" font-family="Arial, sans-serif" font-size="8">Escolha uma opção ou escreva com suas palavras.</text>
  <text x="32" y="332" font-family="Arial, sans-serif" font-size="7">Você poderá selecionar “não sei ainda”.</text>
  <rect x="20" y="365" width="350" height="43" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="392" font-family="Arial, sans-serif" font-size="9">Melhorar a situação no trabalho atual</text>
  <rect x="20" y="420" width="350" height="43" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="447" font-family="Arial, sans-serif" font-size="9">Mudar de função ou de empresa</text>
  <rect x="20" y="475" width="350" height="43" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="502" font-family="Arial, sans-serif" font-size="9">Compreender minhas opções antes de decidir</text>
  <rect x="20" y="530" width="169" height="43" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="104" y="557" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Não sei ainda</text>
  <rect x="201" y="530" width="169" height="43" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="285" y="557" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Prefiro não informar</text>
  <rect x="20" y="592" width="350" height="78" rx="10" fill="#ffffff" stroke="#999999"/>
  <text x="32" y="615" font-family="Arial, sans-serif" font-size="9" fill="#555555">Outra direção</text>
  <text x="32" y="645" font-family="Arial, sans-serif" font-size="8">Escreva uma frase, se desejar.</text>
  <rect x="20" y="691" width="350" height="44" rx="8" fill="#eeeeee" stroke="#999999"/>
  <text x="195" y="718" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#555555" font-weight="700">Adicionar resposta ao rascunho</text>
  <text x="195" y="766" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Disponível após uma escolha; nenhuma opção vem marcada.</text>
  <text x="195" y="799" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Responder não autoriza processamento ou recomendação.</text>
</svg>
