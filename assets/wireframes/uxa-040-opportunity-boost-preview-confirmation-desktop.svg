<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Prévia reformulada com primeiro resultado orgânico preservado</title>
  <desc id="desc">Wireframe para computador que mostra primeiro resultado orgânico antes do espaço patrocinado, resumo da campanha, critérios não utilizados e confirmação afirmativa antes do envio.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="1022" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="220" height="1024" fill="#f4f4f4" stroke="#999999"/>
  <text x="32" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700">GUIVOS</text>
  <text x="32" y="92" font-family="Arial, sans-serif" font-size="12">OPPORTUNITY BOOST</text>
  <text x="32" y="150" font-family="Arial, sans-serif" font-size="13">1 · Elegibilidade</text>
  <text x="32" y="192" font-family="Arial, sans-serif" font-size="13">2 · Objetivo e critérios</text>
  <text x="32" y="234" font-family="Arial, sans-serif" font-size="13">3 · Orçamento e duração</text>
  <text x="32" y="276" font-family="Arial, sans-serif" font-size="13" font-weight="700">4 · Prévia e confirmação</text>
  <text x="32" y="318" font-family="Arial, sans-serif" font-size="13">5 · Envio</text>
  <text x="32" y="950" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Salvar rascunho e sair</text>

  <text x="260" y="48" font-family="Arial, sans-serif" font-size="12" fill="#555555">ETAPA 4 DE 5</text>
  <text x="260" y="88" font-family="Arial, sans-serif" font-size="28" font-weight="700">Revisar prévia e responsabilidades</text>
  <text x="260" y="118" font-family="Arial, sans-serif" font-size="13">A posição publicitária aparece depois do primeiro orgânico e não altera ordenação, confiança ou recomendação.</text>

  <rect x="260" y="152" width="700" height="546" rx="10" fill="#ffffff" stroke="#888888"/>
  <text x="286" y="188" font-family="Arial, sans-serif" font-size="16" font-weight="700">Prévia em Explorar</text>
  <text x="286" y="214" font-family="Arial, sans-serif" font-size="11">Exemplo estrutural · baixa fidelidade</text>

  <text x="286" y="252" font-family="Arial, sans-serif" font-size="12" font-weight="700">Primeiro resultado orgânico preservado</text>
  <rect x="286" y="270" width="648" height="136" rx="10" fill="#ffffff" stroke="#888888"/>
  <text x="308" y="298" font-family="Arial, sans-serif" font-size="11">RESULTADO ORGÂNICO</text>
  <text x="308" y="328" font-family="Arial, sans-serif" font-size="17" font-weight="700">Oficina aberta de planejamento local</text>
  <text x="308" y="354" font-family="Arial, sans-serif" font-size="12">Organização Exemplo · Presencial · Gratuita</text>
  <text x="308" y="382" font-family="Arial, sans-serif" font-size="11">Ordenação objetiva aplicada · sem pagamento</text>

  <text x="286" y="446" font-family="Arial, sans-serif" font-size="12" font-weight="700">Espaço patrocinado depois do primeiro orgânico</text>
  <rect x="286" y="464" width="648" height="168" rx="10" fill="#f5f5f5" stroke="#555555" stroke-width="2"/>
  <text x="308" y="492" font-family="Arial, sans-serif" font-size="11" font-weight="700">IMPULSIONADO</text>
  <text x="308" y="524" font-family="Arial, sans-serif" font-size="18" font-weight="700">Formação gratuita em gestão comunitária</text>
  <text x="308" y="552" font-family="Arial, sans-serif" font-size="12">Coletivo Horizonte · Online · 18 vagas · Gratuita</text>
  <text x="308" y="580" font-family="Arial, sans-serif" font-size="11">Campanha paga identificada · posição publicitária própria</text>
  <text x="308" y="610" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Por que estou vendo isto?</text>
  <text x="910" y="610" text-anchor="end" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Ocultar · Denunciar</text>

  <rect x="286" y="650" width="648" height="30" rx="8" fill="#f7f7f7" stroke="#aaaaaa"/>
  <text x="610" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Anúncio não substitui nem reordena resultados orgânicos</text>

  <rect x="984" y="152" width="416" height="546" rx="10" fill="#f8f8f8" stroke="#888888"/>
