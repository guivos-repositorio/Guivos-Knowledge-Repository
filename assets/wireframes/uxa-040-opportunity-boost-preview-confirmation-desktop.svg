  <text x="1010" y="248" font-family="Arial, sans-serif" font-size="11">Levar pessoas ao detalhe · CPC candidato</text>
  <text x="1010" y="282" font-family="Arial, sans-serif" font-size="12" font-weight="700">Critérios escolhidos</text>
  <text x="1010" y="304" font-family="Arial, sans-serif" font-size="11">Sudeste · Português · Formação · Online</text>
  <text x="1010" y="338" font-family="Arial, sans-serif" font-size="12" font-weight="700">Orçamento e período</text>
  <text x="1010" y="360" font-family="Arial, sans-serif" font-size="11">R$ 100,00 · até R$ 20,00/dia · 01 a 07/09/2026</text>
  <text x="1010" y="394" font-family="Arial, sans-serif" font-size="12" font-weight="700">Capacidade declarada</text>
  <text x="1010" y="416" font-family="Arial, sans-serif" font-size="11">18 vagas · atendido com limite</text>
  <line x1="1010" y1="446" x2="1372" y2="446" stroke="#cccccc"/>
  <text x="1010" y="478" font-family="Arial, sans-serif" font-size="12" font-weight="700">Critérios proibidos e não utilizados</text>
  <text x="1010" y="502" font-family="Arial, sans-serif" font-size="10">Relato protegido · compreensão inicial</text>
  <text x="1010" y="522" font-family="Arial, sans-serif" font-size="10">Momento Atual · Próximo Passo · inferências sensíveis</text>
  <line x1="1010" y1="550" x2="1372" y2="550" stroke="#cccccc"/>
  <text x="1010" y="580" font-family="Arial, sans-serif" font-size="11">Alteração material poderá pausar a campanha</text>
  <text x="1010" y="602" font-family="Arial, sans-serif" font-size="11">e exigir nova avaliação.</text>
  <text x="1010" y="638" font-family="Arial, sans-serif" font-size="11">Renovação automática: desativada</text>
  <text x="1010" y="670" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Abrir resumo completo</text>

  <rect x="260" y="728" width="1140" height="164" rx="10" fill="#ffffff" stroke="#888888"/>
  <text x="286" y="762" font-family="Arial, sans-serif" font-size="15" font-weight="700">Confirmação afirmativa</text>
  <rect x="286" y="788" width="22" height="22" fill="#ffffff" stroke="#555555"/>
  <text x="326" y="804" font-family="Arial, sans-serif" font-size="11">Revisei objetivo, critérios, orçamento, duração, capacidade e apresentação patrocinada.</text>
  <rect x="286" y="826" width="22" height="22" fill="#ffffff" stroke="#555555"/>
  <text x="326" y="842" font-family="Arial, sans-serif" font-size="11">Compreendo que orçamento não garante entrega, conversão, impacto ou recomendação.</text>
  <rect x="286" y="864" width="22" height="22" fill="#ffffff" stroke="#555555"/>
  <text x="326" y="880" font-family="Arial, sans-serif" font-size="11">Confirmo que pagamento não altera ranking orgânico e aceito as responsabilidades apresentadas.</text>

  <text x="260" y="950" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Voltar para orçamento e duração</text>
  <rect x="1110" y="916" width="290" height="52" rx="8" fill="#e5e5e5" stroke="#999999" stroke-dasharray="6 4"/>
  <text x="1255" y="948" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700">Enviar para avaliação · confirme os itens</text>
</svg>