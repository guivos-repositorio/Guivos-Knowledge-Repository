<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Explicação móvel do Boost Social Financiado</title>
  <desc id="desc">Wireframe móvel que explica financiador, Coletivo beneficiário, finalidade, critérios utilizados, dados não compartilhados e controles.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="38" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Voltar</text>
  <text x="20" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="700">Por que estou vendo isto?</text>
  <text x="20" y="104" font-family="Arial, sans-serif" font-size="11">Explicação do impulsionamento social financiado.</text>

  <rect x="20" y="132" width="350" height="172" rx="10" fill="#f4f4f4" stroke="#777777"/>
  <text x="38" y="160" font-family="Arial, sans-serif" font-size="10" font-weight="700">IMPULSIONAMENTO SOCIAL FINANCIADO</text>
  <text x="38" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="700">Mutirão gratuito de capacitação comunitária</text>
  <text x="38" y="218" font-family="Arial, sans-serif" font-size="10">Coletivo beneficiário: Rede Comunitária Livre</text>
  <text x="38" y="242" font-family="Arial, sans-serif" font-size="10">Financiador: Fundação Exemplo</text>
  <text x="38" y="266" font-family="Arial, sans-serif" font-size="10">Finalidade: ampliar acesso gratuito na região.</text>
  <text x="38" y="290" font-family="Arial, sans-serif" font-size="10">A oportunidade permanece gratuita.</text>

  <text x="20" y="346" font-family="Arial, sans-serif" font-size="14" font-weight="700">Critérios gerais utilizados</text>
  <rect x="20" y="364" width="350" height="94" rx="8" fill="#ffffff" stroke="#888888"/>
  <text x="38" y="392" font-family="Arial, sans-serif" font-size="10">Região geral · idioma · categoria · modalidade · data</text>
  <text x="38" y="420" font-family="Arial, sans-serif" font-size="10">Nenhum critério é ampliado silenciosamente.</text>
  <text x="38" y="444" font-family="Arial, sans-serif" font-size="10">A distribuição paga não altera o primeiro resultado orgânico.</text>

  <text x="20" y="500" font-family="Arial, sans-serif" font-size="14" font-weight="700">O financiador não recebe</text>
  <rect x="20" y="518" width="350" height="132" rx="8" fill="#f7f7f7" stroke="#999999"/>
  <text x="38" y="546" font-family="Arial, sans-serif" font-size="10">• relatos ou conteúdos privados;</text>
  <text x="38" y="570" font-family="Arial, sans-serif" font-size="10">• compreensão inicial, Momento Atual ou Próximo Passo;</text>
  <text x="38" y="594" font-family="Arial, sans-serif" font-size="10">• lista de pessoas expostas, interessadas ou inscritas;</text>
  <text x="38" y="618" font-family="Arial, sans-serif" font-size="10">• autoridade para selecionar, ordenar ou recomendar.</text>
  <text x="38" y="640" font-family="Arial, sans-serif" font-size="9">Métricas futuras serão somente agregadas e governadas.</text>

  <text x="20" y="694" font-family="Arial, sans-serif" font-size="14" font-weight="700">Seus controles</text>
  <text x="20" y="728" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Ocultar esta campanha</text>
  <text x="220" y="728" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Revisar preferências</text>
  <text x="20" y="766" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Não mostrar patrocinadas</text>
  <text x="220" y="766" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Denunciar</text>
  <text x="20" y="810" font-family="Arial, sans-serif" font-size="10">Ocultar publicidade não reduz acesso às oportunidades orgânicas.</text>
</svg>