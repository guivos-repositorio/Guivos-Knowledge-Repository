<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Cartão patrocinado para computador do Opportunity Boost</title>
  <desc id="desc">Wireframe para computador com consulta orgânica preservada, primeiro resultado orgânico, espaço patrocinado separado, identificação comercial e controles.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="1022" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="220" height="1024" fill="#f4f4f4" stroke="#999999"/>
  <text x="32" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700">GUIVOS</text>
  <text x="32" y="104" font-family="Arial, sans-serif" font-size="14">Hoje</text>
  <text x="32" y="146" font-family="Arial, sans-serif" font-size="14">Jornada</text>
  <text x="32" y="188" font-family="Arial, sans-serif" font-size="14" font-weight="700">Explorar</text>
  <text x="32" y="230" font-family="Arial, sans-serif" font-size="14">Mapa</text>
  <text x="32" y="272" font-family="Arial, sans-serif" font-size="14">Eu</text>
  <text x="32" y="950" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Publicidade e preferências</text>

