<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Revisão validada da transcrição do Momento Atual</title>
  <desc id="desc">Tela móvel que separa áudio, transcrição automática e versão revisada, com efeitos explícitos para retorno, remoção e descarte.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="28" font-family="Arial, sans-serif" font-size="11">09:41</text>
  <text x="20" y="58" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar sem perder correções</text>
  <text x="370" y="58" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Pausar e ver opções</text>
  <text x="20" y="97" font-family="Arial, sans-serif" font-size="21" font-weight="700">Revise o que foi transcrito</text>
  <text x="20" y="121" font-family="Arial, sans-serif" font-size="9">A transcrição automática ainda não é uma declaração confirmada.</text>
  <rect x="20" y="143" width="350" height="99" rx="10" fill="#f5f5f5" stroke="#777777"/>
  <text x="32" y="166" font-family="Arial, sans-serif" font-size="10" font-weight="700">Áudio original · 00:42 · mantido temporariamente</text>
  <text x="32" y="188" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Ouvir gravação</text>
  <text x="350" y="188" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Remover áudio...</text>
  <text x="32" y="211" font-family="Arial, sans-serif" font-size="7">Remover exigirá confirmação e não apagará a transcrição.</text>
  <text x="32" y="230" font-family="Arial, sans-serif" font-size="7">A opção escolhida antes da gravação continua visível aqui.</text>
  <rect x="20" y="258" width="350" height="225" rx="10" fill="#ffffff" stroke="#111111"/>
  <text x="32" y="282" font-family="Arial, sans-serif" font-size="10" font-weight="700">Transcrição automática · não confirmada</text>
  <text x="32" y="311" font-family="Arial, sans-serif" font-size="9">“Estou pensando em mudar de trabalho porque não vejo</text>
  <text x="32" y="331" font-family="Arial, sans-serif" font-size="9">crescimento. Tenho experiência, mas tenho dificuldade para</text>
  <text x="32" y="351" font-family="Arial, sans-serif" font-size="9">mostrar o que já fiz em processos seletivos.”</text>
  <line x1="32" y1="380" x2="358" y2="380" stroke="#bbbbbb"/>
  <text x="32" y="406" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Corrigir texto</text>
  <text x="358" y="406" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Remover trecho...</text>
  <text x="32" y="436" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Marcar palavra incerta</text>
  <text x="358" y="436" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Regravar esta parte</text>
  <text x="32" y="469" font-family="Arial, sans-serif" font-size="7">Suas correções formarão uma versão revisada separada.</text>
  <rect x="20" y="500" width="350" height="103" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="523" font-family="Arial, sans-serif" font-size="10" font-weight="700">O que acontecerá ao continuar</text>
  <text x="32" y="545" font-family="Arial, sans-serif" font-size="8">A versão revisada será adicionada ao rascunho como origem.</text>
  <text x="32" y="565" font-family="Arial, sans-serif" font-size="8">Áudio e transcrição continuarão com controles próprios.</text>
  <text x="32" y="587" font-family="Arial, sans-serif" font-size="7">Não inicia compreensão, persistência ou personalização.</text>
  <rect x="20" y="622" width="350" height="44" rx="8" fill="#222222"/>
  <text x="195" y="649" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Adicionar versão revisada ao rascunho</text>
  <rect x="20" y="682" width="350" height="42" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="195" y="708" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Descartar áudio e transcrição...</text>
  <text x="195" y="744" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Exigirá confirmação e informará quais correções serão perdidas.</text>
  <text x="195" y="779" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Gravar outra parte</text>
  <text x="195" y="812" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Falhas automáticas não serão elevadas a fatos sobre a Pessoa.</text>
</svg>
