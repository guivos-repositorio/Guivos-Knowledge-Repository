    <rect x="252" y="208" width="118" height="43" rx="9" fill="#ffffff" stroke="#777777"/><text x="311" y="226" text-anchor="middle" font-weight="700">Voluntariado</text><text x="311" y="240" text-anchor="middle">e causas</text>
    <rect x="20" y="260" width="107" height="43" rx="9" fill="#ffffff" stroke="#777777"/><text x="73" y="278" text-anchor="middle" font-weight="700">Aprendizagem</text><text x="73" y="292" text-anchor="middle">e prática</text>
