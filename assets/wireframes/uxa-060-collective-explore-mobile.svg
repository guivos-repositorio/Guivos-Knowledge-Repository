  <text x="32" y="565" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Por que aparece aqui?</text>
  <text x="356" y="565" text-anchor="end" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver perfil público</text>
