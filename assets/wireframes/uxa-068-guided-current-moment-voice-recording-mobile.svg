<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Gravação guiada do Momento Atual</title>
  <desc id="desc">Tela móvel de gravação com estado evidente, orientação não coercitiva, pausa, conclusão, descarte e troca para texto.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="28" font-family="Arial, sans-serif" font-size="11">09:41</text>
  <text x="20" y="58" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar e interromper</text>
  <text x="370" y="58" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Ajuda</text>
  <text x="20" y="98" font-family="Arial, sans-serif" font-size="21" font-weight="700">Gravação em andamento</text>
  <text x="20" y="122" font-family="Arial, sans-serif" font-size="9">00:42 · microfone ativo · áudio mantido até a revisão</text>
  <rect x="20" y="143" width="350" height="106" rx="10" fill="#f5f5f5" stroke="#777777"/>
  <text x="32" y="166" font-family="Arial, sans-serif" font-size="10" font-weight="700">Você pode seguir por este caminho</text>
  <text x="32" y="188" font-family="Arial, sans-serif" font-size="8">O que está acontecendo?</text>
  <text x="32" y="207" font-family="Arial, sans-serif" font-size="8">Como isso está afetando você?</text>
  <text x="32" y="226" font-family="Arial, sans-serif" font-size="8">O que gostaria que fosse diferente?</text>
  <text x="32" y="242" font-family="Arial, sans-serif" font-size="7">Não é necessário responder a tudo.</text>
  <rect x="20" y="268" width="350" height="173" rx="10" fill="#ffffff" stroke="#111111"/>
  <text x="32" y="292" font-family="Arial, sans-serif" font-size="9" fill="#555555">Sinal de áudio</text>
  <path d="M34 358 L48 337 L62 374 L76 323 L90 361 L104 340 L118 378 L132 332 L146 365 L160 345 L174 376 L188 328 L202 364 L216 342 L230 379 L244 333 L258 366 L272 347 L286 372 L300 337 L314 360 L328 344 L344 358" fill="none" stroke="#555555" stroke-width="2"/>
  <text x="195" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">A gravação pode ser pausada ou encerrada a qualquer momento.</text>
  <rect x="20" y="462" width="169" height="47" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="104" y="491" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Pausar gravação</text>
  <rect x="201" y="462" width="169" height="47" rx="8" fill="#222222"/>
  <text x="285" y="491" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Concluir esta parte</text>
  <rect x="20" y="529" width="350" height="96" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="552" font-family="Arial, sans-serif" font-size="10" font-weight="700">Depois de concluir</text>
  <text x="32" y="574" font-family="Arial, sans-serif" font-size="8">Você revisará a transcrição e poderá corrigir ou remover trechos.</text>
  <text x="32" y="594" font-family="Arial, sans-serif" font-size="8">Nada será enviado para compreensão antes da sua revisão.</text>
  <text x="32" y="614" font-family="Arial, sans-serif" font-size="7">Falha de transcrição não será tratada como declaração da pessoa.</text>
  <rect x="20" y="647" width="350" height="42" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="195" y="673" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Descartar esta gravação</text>
  <text x="195" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Continuar por texto sem usar este áudio</text>
  <text x="195" y="779" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Gravar não autoriza processamento ou personalização.</text>
</svg>
