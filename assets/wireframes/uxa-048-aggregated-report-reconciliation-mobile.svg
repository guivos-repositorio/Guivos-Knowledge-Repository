<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Reconciliação validada do Opportunity Boost no aplicativo móvel</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade separando tipos de evento, estados de revisão, orçamento, saldo candidato e ausência de dados.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text>
  <text x="20" y="62" font-family="Arial" font-size="10">RELATÓRIO › RECONCILIAÇÃO</text>
  <text x="20" y="92" font-family="Arial" font-size="19" font-weight="700">Campanha encerrada</text>
  <rect x="210" y="70" width="160" height="34" rx="7" fill="#f3f3f3" stroke="#444444"/>
  <text x="290" y="91" text-anchor="middle" font-family="Arial" font-size="8" font-weight="700">EM REVISÃO · NÃO RECONCILIADA</text>
  <text x="20" y="118" font-family="Arial" font-size="9">Encerrada em 12/08 · revista em 13/08 às 09:20</text>

  <rect x="20" y="136" width="350" height="72" rx="8" fill="#f3f3f3" stroke="#555555"/>
  <text x="34" y="160" font-family="Arial" font-size="11" font-weight="700">Reconciliação não é devolução automática</text>
  <text x="34" y="181" font-family="Arial" font-size="9">Encerramento não torna todos os dados reconciliados.</text>
  <text x="34" y="198" font-family="Arial" font-size="8">Conclusão operacional não define crédito, estorno ou causalidade.</text>

  <rect x="20" y="224" width="350" height="162" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="249" font-family="Arial" font-size="13" font-weight="700">Eventos por tipo e unidade</text>
  <text x="34" y="276" font-family="Arial" font-size="10">Impressões válidas: 5.840</text>
  <text x="34" y="299" font-family="Arial" font-size="10">Impressões invalidadas: 31</text>
  <text x="34" y="322" font-family="Arial" font-size="10">Impressões em revisão: 8</text>
  <text x="34" y="345" font-family="Arial" font-size="10">Cliques válidos: 128 · cliques em revisão: 2</text>
  <text x="34" y="368" font-family="Arial" font-size="8">Impressões e cliques não são somados em um total heterogêneo.</text>

  <rect x="20" y="402" width="350" height="144" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="427" font-family="Arial" font-size="13" font-weight="700">Orçamento e saldo</text>
  <text x="34" y="454" font-family="Arial" font-size="10">Orçamento total: R$ 300,00</text>
  <text x="34" y="478" font-family="Arial" font-size="10">Utilizado sujeito à revisão: R$ 146,20</text>
  <text x="34" y="502" font-family="Arial" font-size="10">Saldo candidato: R$ 153,80</text>
  <text x="34" y="526" font-family="Arial" font-size="9">Crédito, estorno ou devolução: não definidos.</text>

  <rect x="20" y="562" width="350" height="124" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="587" font-family="Arial" font-size="13" font-weight="700">Dados ausentes ou suprimidos</text>
  <text x="34" y="614" font-family="Arial" font-size="10">Conclusões de inscrição: não disponível</text>
  <text x="34" y="637" font-family="Arial" font-size="9">Motivo: integração externa não conectada</text>
  <text x="34" y="660" font-family="Arial" font-size="10">Autorrelato: não exibido por agregação</text>
  <text x="34" y="678" font-family="Arial" font-size="8">Nenhum dos estados significa zero.</text>

  <rect x="20" y="702" width="350" height="78" rx="8" fill="#f3f3f3" stroke="#444444"/>
  <text x="34" y="727" font-family="Arial" font-size="11" font-weight="700">Próximo estado possível</text>
  <text x="34" y="749" font-family="Arial" font-size="9">Parcialmente reconciliada → reconciliada, após revisão definida.</text>
  <text x="34" y="768" font-family="Arial" font-size="8">Reconciliada não comprova impacto nem direito financeiro.</text>

  <rect x="20" y="796" width="350" height="32" rx="8" fill="#ffffff" stroke="#444444"/>
  <text x="195" y="817" text-anchor="middle" font-family="Arial" font-size="9">Ver histórico, regra e decisões de revisão</text>
  <text x="20" y="839" font-family="Arial" font-size="7">Sem lista individual · histórico preservado.</text>
</svg>