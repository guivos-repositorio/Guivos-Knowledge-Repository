<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Escolha de modalidade e compartilhamento mínimo</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade com alternativas de texto, voz, arquivo e perguntas opcionais, reforçando compartilhamento mínimo, finalidade e controle do rascunho.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>

  <text x="20" y="34" font-family="Arial, sans-serif" font-size="16" font-weight="700">GUIVOS</text>
  <text x="370" y="34" text-anchor="end" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Pausar</text>
  <line x1="16" y1="50" x2="374" y2="50" stroke="#cccccc"/>

  <text x="20" y="82" font-family="Arial, sans-serif" font-size="10" fill="#555555">INÍCIO PROTEGIDO · 3 DE 4</text>
  <text x="20" y="116" font-family="Arial, sans-serif" font-size="19" font-weight="700">Como você prefere começar?</text>
  <text x="20" y="141" font-family="Arial, sans-serif" font-size="10">Comece somente com o que fizer sentido agora.</text>
  <text x="20" y="158" font-family="Arial, sans-serif" font-size="10" font-weight="700">Você não precisa contar toda a sua vida.</text>

  <rect x="20" y="182" width="350" height="66" rx="10" fill="#f3f3f3" stroke="#777777"/>
  <text x="36" y="206" font-family="Arial, sans-serif" font-size="10" font-weight="700">Finalidade atual</text>
  <text x="36" y="227" font-family="Arial, sans-serif" font-size="9">Preparar uma compreensão inicial revisável do seu momento.</text>
  <text x="350" y="227" text-anchor="end" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Detalhes</text>

  <g font-family="Arial, sans-serif">
    <rect x="20" y="270" width="168" height="92" rx="10" fill="#ffffff" stroke="#777777"/>
    <text x="36" y="296" font-size="12" font-weight="700">Escrever</text>
    <text x="36" y="317" font-size="9">Texto livre ou uma frase.</text>
    <text x="36" y="340" font-size="9" text-decoration="underline">Escolher texto</text>

    <rect x="202" y="270" width="168" height="92" rx="10" fill="#ffffff" stroke="#777777"/>
    <text x="218" y="296" font-size="12" font-weight="700">Falar</text>
    <text x="218" y="317" font-size="9">Gravação com revisão.</text>
    <text x="218" y="340" font-size="9" text-decoration="underline">Entender e gravar</text>

    <rect x="20" y="376" width="168" height="92" rx="10" fill="#ffffff" stroke="#777777"/>
    <text x="36" y="402" font-size="12" font-weight="700">Enviar arquivo</text>
    <text x="36" y="423" font-size="9">Extrações propostas e revisáveis.</text>
    <text x="36" y="446" font-size="9" text-decoration="underline">Entender e enviar</text>

    <rect x="202" y="376" width="168" height="92" rx="10" fill="#ffffff" stroke="#777777"/>
    <text x="218" y="402" font-size="12" font-weight="700">Perguntas opcionais</text>
    <text x="218" y="423" font-size="9">Adie ou prefira não informar.</text>
    <text x="218" y="446" font-size="9" text-decoration="underline">Ver perguntas</text>
  </g>

  <rect x="20" y="492" width="350" height="116" rx="10" fill="#ffffff" stroke="#999999"/>
  <text x="36" y="518" font-family="Arial, sans-serif" font-size="11" font-weight="700">Antes de compartilhar</text>
  <text x="36" y="542" font-family="Arial, sans-serif" font-size="9">• digitar não autoriza processamento;</text>
  <text x="36" y="562" font-family="Arial, sans-serif" font-size="9">• voz e arquivos exigem explicação anterior;</text>
  <text x="36" y="582" font-family="Arial, sans-serif" font-size="9">• evite dados de terceiros que não sejam necessários;</text>
  <text x="36" y="602" font-family="Arial, sans-serif" font-size="9">• tudo será revisado antes de qualquer uso material.</text>

  <rect x="20" y="628" width="350" height="76" rx="10" fill="#f3f3f3" stroke="#999999"/>
  <text x="36" y="652" font-family="Arial, sans-serif" font-size="10" font-weight="700">Rascunho protegido</text>
  <text x="36" y="674" font-family="Arial, sans-serif" font-size="9">Ainda não processado · nenhuma personalização ativa</text>
  <text x="36" y="694" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Salvar rascunho</text>
  <text x="350" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Excluir rascunho</text>

  <rect x="20" y="730" width="350" height="44" rx="9" fill="#222222"/>
  <text x="195" y="757" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="700">Começar com uma frase</text>

  <text x="195" y="796" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Continuar sem compartilhar agora</text>

  <rect x="20" y="814" width="350" height="12" rx="6" fill="#f3f3f3"/>
  <rect x="20" y="814" width="263" height="12" rx="6" fill="#222222"/>
</svg>
