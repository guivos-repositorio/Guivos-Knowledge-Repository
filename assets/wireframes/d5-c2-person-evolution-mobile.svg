<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">PER-012 — Minha Evolução — low-fidelity mobile reformulado pela D5-C3</title>
  <desc id="desc">Superfície de compreensão e revisão de trajetórias da Pessoa. Explicita período, baseline, direção, natureza da interpretação, confiança e incerteza sem score, ranking, roda da vida ou diagnóstico.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="389" height="843" fill="none" stroke="#222222"/>

  <text x="20" y="34" font-family="Arial, sans-serif" font-size="14" fill="#222222">‹ Hoje</text>
  <text x="20" y="72" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111111">Minha Evolução</text>
  <text x="20" y="96" font-family="Arial, sans-serif" font-size="12" fill="#555555">Compreenda trajetórias, mudanças e continuidades.</text>
  <text x="20" y="114" font-family="Arial, sans-serif" font-size="12" fill="#555555">Sem nota, ranking ou conclusão automática.</text>

  <rect x="20" y="136" width="350" height="42" rx="8" fill="#ffffff" stroke="#bdbdbd"/>
  <text x="34" y="162" font-family="Arial, sans-serif" font-size="12" fill="#333333">Área da jornada: Todas ▾</text>

  <rect x="20" y="194" width="350" height="404" rx="10" fill="#fafafa" stroke="#777777"/>
  <text x="34" y="220" font-family="Arial, sans-serif" font-size="11" fill="#666666">TRAJETÓRIA EM ACOMPANHAMENTO</text>
  <text x="34" y="247" font-family="Arial, sans-serif" font-size="11" fill="#555555">Área da jornada · Trabalho, Carreira e Estudos</text>

  <text x="34" y="276" font-family="Arial, sans-serif" font-size="11" fill="#555555">Trajetória</text>
  <text x="34" y="296" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111111">Transição para posição de liderança</text>

  <text x="34" y="326" font-family="Arial, sans-serif" font-size="11" fill="#555555">Período acompanhado · mai–ago 2026</text>
  <text x="34" y="351" font-family="Arial, sans-serif" font-size="11" fill="#555555">Baseline · responsabilidades técnicas predominantes</text>
  <text x="34" y="376" font-family="Arial, sans-serif" font-size="11" fill="#555555">Direção reconhecida · assumir responsabilidades de gestão</text>

  <text x="34" y="406" font-family="Arial, sans-serif" font-size="11" fill="#555555">Aspectos observados · profissional · cognitivo · comportamental</text>
  <text x="34" y="431" font-family="Arial, sans-serif" font-size="11" fill="#555555">Contexto relacionado · Direção · Capacidades · Restrições</text>

  <rect x="34" y="452" width="322" height="100" rx="8" fill="#ffffff" stroke="#bdbdbd"/>
  <text x="46" y="476" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#333333">INTERPRETAÇÃO PRELIMINAR — INFERIDA</text>
  <text x="46" y="498" font-family="Arial, sans-serif" font-size="11" fill="#555555">Há sinais de ampliação de responsabilidades.</text>
  <text x="46" y="519" font-family="Arial, sans-serif" font-size="11" fill="#555555">Confiança: moderada · baseline parcial</text>
  <text x="46" y="540" font-family="Arial, sans-serif" font-size="11" fill="#555555">Incerteza: mudança ainda não reconhecida como conclusão.</text>

  <text x="34" y="578" font-family="Arial, sans-serif" font-size="11" fill="#333333">Ver evidências · contestar ou revisar leitura  →</text>

  <rect x="20" y="616" width="350" height="92" rx="10" fill="#f5f5f5" stroke="#d0d0d0"/>
  <text x="34" y="641" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#333333">Conceitos separados</text>
  <text x="34" y="662" font-family="Arial, sans-serif" font-size="11" fill="#555555">Área da jornada ≠ dimensão do Contexto Vivo</text>
  <text x="34" y="681" font-family="Arial, sans-serif" font-size="11" fill="#555555">≠ aspecto descritivo da mudança ≠ score humano.</text>
  <text x="34" y="699" font-family="Arial, sans-serif" font-size="11" fill="#555555">Você pode corrigir, pausar ou limitar compartilhamento.</text>

  <rect x="20" y="726" width="350" height="54" rx="10" fill="#222222"/>
  <text x="195" y="759" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Revisar minha trajetória</text>

  <text x="195" y="809" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333333">Pausar acompanhamento · ajustar privacidade</text>
</svg>