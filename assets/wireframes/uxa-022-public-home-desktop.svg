<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2200" viewBox="0 0 1440 2200" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe de baixa fidelidade da Página Inicial pública da Guivos</title>
  <desc id="desc">Estrutura web para computador com cabeçalho público, apresentação concreta da Guivos, ações de iniciar a jornada ou explorar sem personalização, explicação de funcionamento, caminhos pessoal, geral e institucional, ecossistema agrupado por finalidade, possibilidades gerais identificadas, confiança e rodapé.</desc>
  <rect width="1440" height="2200" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="2198" fill="none" stroke="#111111" stroke-width="2"/>

  <!-- Cabeçalho público -->
  <rect x="1" y="1" width="1438" height="88" fill="#ffffff" stroke="#cccccc"/>
  <text x="72" y="55" font-family="Arial, sans-serif" font-size="26" font-weight="700">GUIVOS</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#222222">
    <text x="510" y="54">Como funciona</text>
    <text x="650" y="54">Explorar</text>
    <text x="750" y="54">Ecossistema</text>
    <text x="875" y="54">Organizações e Coletivos</text>
    <text x="1090" y="54">Sobre a Guivos</text>
  </g>
  <text x="1244" y="54" font-family="Arial, sans-serif" font-size="14" text-decoration="underline">Entrar</text>
  <rect x="1302" y="27" width="100" height="36" rx="6" fill="#222222"/>
  <text x="1352" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Iniciar</text>

  <!-- Primeiro campo visual -->
  <rect x="72" y="140" width="1296" height="380" rx="12" fill="#f7f7f7" stroke="#777777"/>
  <text x="116" y="205" font-family="Arial, sans-serif" font-size="13" fill="#555555">PÁGINA INICIAL PÚBLICA · SEM PERSONALIZAÇÃO</text>
  <text x="116" y="270" font-family="Arial, sans-serif" font-size="42" font-weight="700">Toda jornada começa no momento</text>
  <text x="116" y="320" font-family="Arial, sans-serif" font-size="42" font-weight="700">em que você está agora.</text>
  <text x="116" y="370" font-family="Arial, sans-serif" font-size="19">A Guivos é um ecossistema que ajuda pessoas a compreender seu momento,</text>
  <text x="116" y="400" font-family="Arial, sans-serif" font-size="19">organizar objetivos e conhecer possibilidades de produtos, serviços, experiências,</text>
  <text x="116" y="430" font-family="Arial, sans-serif" font-size="19">conteúdos, Organizações e Coletivos, mantendo cada decisão sob seu controle.</text>
  <rect x="116" y="464" width="212" height="44" rx="7" fill="#222222"/>
  <text x="222" y="491" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Iniciar minha jornada</text>
  <rect x="344" y="464" width="222" height="44" rx="7" fill="#ffffff" stroke="#222222"/>
  <text x="455" y="491" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Explorar sem personalização</text>
  <rect x="930" y="188" width="356" height="254" rx="10" fill="#ffffff" stroke="#999999"/>
  <text x="958" y="224" font-family="Arial, sans-serif" font-size="15" font-weight="700">Antes de iniciar</text>
  <text x="958" y="258" font-family="Arial, sans-serif" font-size="13">• Esta página não coleta relatos pessoais.</text>
  <text x="958" y="288" font-family="Arial, sans-serif" font-size="13">• Você poderá conhecer o ecossistema primeiro.</text>
  <text x="958" y="318" font-family="Arial, sans-serif" font-size="13">• O compartilhamento acontecerá em ambiente protegido.</text>
  <text x="958" y="348" font-family="Arial, sans-serif" font-size="13">• Você poderá revisar, corrigir e limitar informações.</text>
  <text x="958" y="378" font-family="Arial, sans-serif" font-size="13">• Possibilidades não são ordens nem garantias.</text>
  <text x="958" y="412" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Entender privacidade e controle</text>

  <!-- Como funciona -->
  <text x="72" y="590" font-family="Arial, sans-serif" font-size="28" font-weight="700">Como a Guivos atua</text>
  <text x="72" y="622" font-family="Arial, sans-serif" font-size="15">Você pode conhecer o ecossistema antes de decidir iniciar uma jornada.</text>
  <g font-family="Arial, sans-serif">
    <circle cx="170" cy="700" r="30" fill="#222222"/><text x="170" y="707" text-anchor="middle" font-size="16" fill="#ffffff">1</text>
    <text x="170" y="752" text-anchor="middle" font-size="14" font-weight="700">Conheça</text><text x="170" y="776" text-anchor="middle" font-size="12">a Guivos</text>
    <line x1="205" y1="700" x2="340" y2="700" stroke="#777777" stroke-width="2"/>
    <circle cx="375" cy="700" r="30" fill="#ffffff" stroke="#222222"/><text x="375" y="707" text-anchor="middle" font-size="16">2</text>
    <text x="375" y="752" text-anchor="middle" font-size="14" font-weight="700">Decida</text><text x="375" y="776" text-anchor="middle" font-size="12">se deseja iniciar</text>
    <line x1="410" y1="700" x2="545" y2="700" stroke="#777777" stroke-width="2"/>
    <circle cx="580" cy="700" r="30" fill="#ffffff" stroke="#222222"/><text x="580" y="707" text-anchor="middle" font-size="16">3</text>
    <text x="580" y="752" text-anchor="middle" font-size="14" font-weight="700">Conte</text><text x="580" y="776" text-anchor="middle" font-size="12">em ambiente protegido</text>
    <line x1="615" y1="700" x2="750" y2="700" stroke="#777777" stroke-width="2"/>
    <circle cx="785" cy="700" r="30" fill="#ffffff" stroke="#222222"/><text x="785" y="707" text-anchor="middle" font-size="16">4</text>
    <text x="785" y="752" text-anchor="middle" font-size="14" font-weight="700">Revise</text><text x="785" y="776" text-anchor="middle" font-size="12">o que foi compreendido</text>
    <line x1="820" y1="700" x2="955" y2="700" stroke="#777777" stroke-width="2"/>
    <circle cx="990" cy="700" r="30" fill="#ffffff" stroke="#222222"/><text x="990" y="707" text-anchor="middle" font-size="16">5</text>
    <text x="990" y="752" text-anchor="middle" font-size="14" font-weight="700">Considere</text><text x="990" y="776" text-anchor="middle" font-size="12">possibilidades explicadas</text>
    <line x1="1025" y1="700" x2="1160" y2="700" stroke="#777777" stroke-width="2"/>
    <circle cx="1195" cy="700" r="30" fill="#ffffff" stroke="#222222"/><text x="1195" y="707" text-anchor="middle" font-size="16">6</text>
    <text x="1195" y="752" text-anchor="middle" font-size="14" font-weight="700">Escolha</text><text x="1195" y="776" text-anchor="middle" font-size="12">seus próximos passos</text>
  </g>

  <!-- Caminhos -->
  <text x="72" y="865" font-family="Arial, sans-serif" font-size="28" font-weight="700">Escolha como deseja conhecer a Guivos</text>
  <rect x="72" y="900" width="402" height="238" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="100" y="940" font-family="Arial, sans-serif" font-size="18" font-weight="700">Caminho pessoal</text>
  <text x="100" y="976" font-family="Arial, sans-serif" font-size="13">Compreenda seu Momento Atual, organize objetivos</text>
  <text x="100" y="999" font-family="Arial, sans-serif" font-size="13">e construa Próximos Passos com revisão e controle.</text>
  <text x="100" y="1041" font-family="Arial, sans-serif" font-size="12">• Iniciar ou continuar uma jornada</text>
  <text x="100" y="1067" font-family="Arial, sans-serif" font-size="12">• Acessar a Tela Hoje quando aplicável</text>
  <rect x="100" y="1085" width="156" height="34" rx="6" fill="#222222"/>
  <text x="178" y="1107" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Iniciar jornada</text>

  <rect x="519" y="900" width="402" height="238" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="547" y="940" font-family="Arial, sans-serif" font-size="18" font-weight="700">Exploração geral</text>
  <text x="547" y="976" font-family="Arial, sans-serif" font-size="13">Conheça produtos, serviços, viagens, conteúdos,</text>
  <text x="547" y="999" font-family="Arial, sans-serif" font-size="13">Organizações, Coletivos e oportunidades gerais.</text>
  <text x="547" y="1041" font-family="Arial, sans-serif" font-size="12">• Pesquisa sem personalização</text>
  <text x="547" y="1067" font-family="Arial, sans-serif" font-size="12">• Origem, preços e condições identificados</text>
  <rect x="547" y="1085" width="166" height="34" rx="6" fill="#ffffff" stroke="#222222"/>
  <text x="630" y="1107" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Explorar agora</text>

  <rect x="966" y="900" width="402" height="238" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="994" y="940" font-family="Arial, sans-serif" font-size="18" font-weight="700">Organizações e Coletivos</text>
  <text x="994" y="976" font-family="Arial, sans-serif" font-size="13">Conheça caminhos para parceiros, patrocinadores,</text>
  <text x="994" y="999" font-family="Arial, sans-serif" font-size="13">anunciantes e representantes autorizados.</text>
  <text x="994" y="1041" font-family="Arial, sans-serif" font-size="12">• Guivos Business e relações responsáveis</text>
  <text x="994" y="1067" font-family="Arial, sans-serif" font-size="12">• Contexto institucional separado do pessoal</text>
  <rect x="994" y="1085" width="180" height="34" rx="6" fill="#ffffff" stroke="#222222"/>
  <text x="1084" y="1107" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Conhecer caminhos</text>

  <!-- Ecossistema por finalidade -->
  <text x="72" y="1215" font-family="Arial, sans-serif" font-size="28" font-weight="700">Ecossistema organizado por finalidade</text>
  <text x="72" y="1247" font-family="Arial, sans-serif" font-size="15">As soluções não aparecem como uma lista de produtos equivalentes.</text>

  <rect x="72" y="1280" width="622" height="260" rx="10" fill="#f7f7f7" stroke="#777777"/>
  <text x="100" y="1320" font-family="Arial, sans-serif" font-size="17" font-weight="700">Jornada e possibilidades para pessoas</text>
  <text x="100" y="1360" font-family="Arial, sans-serif" font-size="14" font-weight="700">Guivos Journey</text>
  <text x="250" y="1360" font-family="Arial, sans-serif" font-size="12">Momento Atual, objetivos, Próximos Passos e evolução.</text>
  <text x="100" y="1402" font-family="Arial, sans-serif" font-size="14" font-weight="700">Guivos Mall</text>
  <text x="250" y="1402" font-family="Arial, sans-serif" font-size="12">Produtos e serviços com origem, preço e condições.</text>
  <text x="100" y="1444" font-family="Arial, sans-serif" font-size="14" font-weight="700">Guivos Travel</text>
  <text x="250" y="1444" font-family="Arial, sans-serif" font-size="12">Viagens, destinos e experiências.</text>
  <text x="100" y="1486" font-family="Arial, sans-serif" font-size="14" font-weight="700">Guivos Media</text>
  <text x="250" y="1486" font-family="Arial, sans-serif" font-size="12">Conteúdos, histórias e conhecimento acessível.</text>

  <rect x="718" y="1280" width="650" height="122" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="746" y="1320" font-family="Arial, sans-serif" font-size="17" font-weight="700">Organizações, programas e Coletivos</text>
  <text x="746" y="1362" font-family="Arial, sans-serif" font-size="14" font-weight="700">Guivos Business</text>
  <text x="890" y="1362" font-family="Arial, sans-serif" font-size="12">Participação institucional e relações responsáveis.</text>

  <rect x="718" y="1418" width="314" height="122" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="746" y="1458" font-family="Arial, sans-serif" font-size="17" font-weight="700">Compreensão</text>
  <text x="746" y="1498" font-family="Arial, sans-serif" font-size="14" font-weight="700">Guivos Intelligence</text>
  <text x="746" y="1520" font-family="Arial, sans-serif" font-size="11">Fontes, contexto, incertezas e explicações.</text>

  <rect x="1054" y="1418" width="314" height="122" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="1082" y="1458" font-family="Arial, sans-serif" font-size="17" font-weight="700">Publicidade identificada</text>
  <text x="1082" y="1498" font-family="Arial, sans-serif" font-size="14" font-weight="700">Guivos Ads</text>
  <text x="1082" y="1520" font-family="Arial, sans-serif" font-size="11">Anúncios e patrocínios institucionais.</text>

  <!-- Possibilidades gerais -->
  <text x="72" y="1620" font-family="Arial, sans-serif" font-size="28" font-weight="700">Possibilidades gerais</text>
  <text x="72" y="1652" font-family="Arial, sans-serif" font-size="15">Exemplos não personalizados. Nenhum item é exibido apenas para preencher espaço.</text>
  <rect x="72" y="1684" width="402" height="168" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="100" y="1718" font-family="Arial, sans-serif" font-size="11" fill="#555555">CONTEÚDO EDITORIAL · NÃO PERSONALIZADO</text>
  <text x="100" y="1754" font-family="Arial, sans-serif" font-size="17" font-weight="700">Guia para organizar objetivos</text>
  <text x="100" y="1784" font-family="Arial, sans-serif" font-size="12">Guivos Media · acesso gratuito</text>
  <text x="100" y="1820" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Conhecer conteúdo</text>

  <rect x="519" y="1684" width="402" height="168" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="547" y="1718" font-family="Arial, sans-serif" font-size="11" fill="#555555">VIAGEM · DISPONIBILIDADE REGIONAL</text>
  <text x="547" y="1754" font-family="Arial, sans-serif" font-size="17" font-weight="700">Experiência em destino nacional</text>
  <text x="547" y="1784" font-family="Arial, sans-serif" font-size="12">Guivos Travel · condições no detalhe</text>
  <text x="547" y="1820" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Ver detalhes gerais</text>

  <rect x="966" y="1684" width="402" height="168" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="994" y="1718" font-family="Arial, sans-serif" font-size="11" fill="#555555">PATROCINADO · PUBLICIDADE IDENTIFICADA</text>
  <text x="994" y="1754" font-family="Arial, sans-serif" font-size="17" font-weight="700">Programa aberto de capacitação</text>
  <text x="994" y="1784" font-family="Arial, sans-serif" font-size="12">Organização responsável · prazo real</text>
  <text x="994" y="1820" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Conhecer programa</text>

  <!-- Confiança -->
  <rect x="72" y="1910" width="1296" height="174" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="100" y="1950" font-family="Arial, sans-serif" font-size="22" font-weight="700">Confiança demonstrada por controle e transparência</text>
  <text x="100" y="1990" font-family="Arial, sans-serif" font-size="13">A Home pública não coleta relatos pessoais. Iniciar é voluntário. Inferências e publicidade serão identificadas.</text>
  <text x="100" y="2020" font-family="Arial, sans-serif" font-size="13">A pessoa poderá revisar, corrigir, limitar ou excluir informações no ambiente protegido, conforme as regras aplicáveis.</text>
  <text x="100" y="2055" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Privacidade</text>
  <text x="190" y="2055" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Segurança</text>
  <text x="278" y="2055" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Acessibilidade</text>
  <text x="382" y="2055" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Termos</text>
  <text x="446" y="2055" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Contato</text>

  <!-- Rodapé -->
  <rect x="1" y="2130" width="1438" height="69" fill="#ffffff" stroke="#cccccc"/>
  <text x="72" y="2172" font-family="Arial, sans-serif" font-size="13" font-weight="700">GUIVOS</text>
  <text x="190" y="2172" font-family="Arial, sans-serif" font-size="11">Propósito</text>
  <text x="270" y="2172" font-family="Arial, sans-serif" font-size="11">Ecossistema</text>
  <text x="370" y="2172" font-family="Arial, sans-serif" font-size="11">Organizações e Coletivos</text>
  <text x="560" y="2172" font-family="Arial, sans-serif" font-size="11">Ajuda</text>
  <text x="620" y="2172" font-family="Arial, sans-serif" font-size="11">Contato</text>
  <text x="1368" y="2172" text-anchor="end" font-family="Arial, sans-serif" font-size="11">Wireframe estrutural · conteúdo ilustrativo</text>
</svg>