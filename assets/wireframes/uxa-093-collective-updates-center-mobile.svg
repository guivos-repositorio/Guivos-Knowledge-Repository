<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel da Central de Atualizações</title>
  <desc id="desc">Superfície pessoal consolidada para identificar o que mudou nos Coletivos, com entrada explícita e opcional para o contexto interno do Coletivo condicionada ao vínculo atual e sem alterar leitura, papel, presença ou autoridade.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Meus Coletivos</text>
  <text x="20" y="94" font-family="Arial, sans-serif" font-size="23" font-weight="700">Central de Atualizações</text>
  <text x="20" y="116" font-family="Arial, sans-serif" font-size="8">O que mudou · de onde veio · se exige ação</text>
  <text x="370" y="116" text-anchor="end" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Preferências</text>

  <g font-family="Arial, sans-serif" font-size="7" text-anchor="middle">
    <rect x="20" y="137" width="83" height="30" rx="15" fill="#222222"/>
    <text x="61" y="156" fill="#ffffff" font-weight="700">Importantes</text>
    <rect x="109" y="137" width="92" height="30" rx="15" fill="#ffffff" stroke="#888888"/>
    <text x="155" y="156">Precisa de ação</text>
    <rect x="207" y="137" width="70" height="30" rx="15" fill="#ffffff" stroke="#888888"/>
    <text x="242" y="156">Atividades</text>
    <rect x="283" y="137" width="87" height="30" rx="15" fill="#ffffff" stroke="#888888"/>
    <text x="326" y="156">Mais categorias</text>
  </g>
  <text x="20" y="179" font-family="Arial, sans-serif" font-size="7">Escopo: vínculos e objetos autorizados · abrir esta tela não marca nada como lido</text>

  <rect x="20" y="191" width="350" height="153" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="32" y="214" font-family="Arial, sans-serif" font-size="8" font-weight="700">SEGURANÇA · alerta oficial</text>
  <text x="32" y="234" font-family="Arial, sans-serif" font-size="11" font-weight="700">Ciclistas da Serra</text>
  <text x="32" y="253" font-family="Arial, sans-serif" font-size="8">Pedal da Serra · mudança de ponto de encontro</text>
  <text x="32" y="272" font-family="Arial, sans-serif" font-size="8">Autoridade: coordenação da atividade · hoje, 08:40</text>
  <text x="32" y="291" font-family="Arial, sans-serif" font-size="8">Fonte: interdição confirmada pela organização · vigente até revisão</text>
  <text x="32" y="310" font-family="Arial, sans-serif" font-size="7">Aviso essencial por segurança · preferência não impede entrega mínima necessária</text>
  <rect x="32" y="316" width="140" height="22" rx="6" fill="#ffffff" stroke="#555555"/>
  <text x="102" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Confirmar somente leitura</text>
  <text x="350" y="214" text-anchor="end" font-family="Arial, sans-serif" font-size="7">importante</text>

  <rect x="20" y="358" width="350" height="151" rx="10" fill="#f5f5f5" stroke="#555555" stroke-width="1.5"/>
  <text x="32" y="381" font-family="Arial, sans-serif" font-size="8" font-weight="700">PRECISA DE AÇÃO · solicitação</text>
  <text x="32" y="401" font-family="Arial, sans-serif" font-size="11" font-weight="700">Corrida para Todos</text>
  <text x="32" y="420" font-family="Arial, sans-serif" font-size="8">Pedido de informação adicional · hoje, 09:12</text>
  <text x="32" y="439" font-family="Arial, sans-serif" font-size="8">Autoridade: responsável pela análise da solicitação</text>
  <text x="32" y="458" font-family="Arial, sans-serif" font-size="8">Prazo legítimo: responder até 11 ago, 18h</text>
  <rect x="32" y="470" width="156" height="24" rx="6" fill="#222222"/>
  <text x="110" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff" font-weight="700">Responder solicitação</text>
  <text x="210" y="486" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ajustar este tipo</text>
  <text x="350" y="381" text-anchor="end" font-family="Arial, sans-serif" font-size="7">não lida</text>

  <rect x="20" y="523" width="350" height="130" rx="10" fill="#ffffff" stroke="#999999"/>
  <text x="32" y="546" font-family="Arial, sans-serif" font-size="8" font-weight="700">INFORMATIVA · vínculo</text>
  <text x="32" y="566" font-family="Arial, sans-serif" font-size="11" font-weight="700">Ciclistas da Serra</text>
  <text x="32" y="585" font-family="Arial, sans-serif" font-size="8">Sua participação foi confirmada · hoje, 08:15</text>
  <text x="32" y="604" font-family="Arial, sans-serif" font-size="8">Vínculo atual: participante confirmado · revalidado ao abrir o Início</text>
  <text x="32" y="623" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Abrir início do Coletivo</text>
  <text x="156" y="623" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver vínculo</text>
  <text x="225" y="623" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ajustar este tipo</text>
  <text x="32" y="642" font-family="Arial, sans-serif" font-size="7">O histórico não preserva acesso se o vínculo atual pausar, encerrar ou perder permissão.</text>
  <text x="350" y="546" text-anchor="end" font-family="Arial, sans-serif" font-size="7">lida</text>

  <rect x="20" y="665" width="350" height="87" rx="10" fill="#f7f7f7" stroke="#888888"/>
  <text x="32" y="687" font-family="Arial, sans-serif" font-size="10" font-weight="700">Leitura não é decisão</text>
  <text x="32" y="706" font-family="Arial, sans-serif" font-size="8">Marcar como lido não confirma presença, concordância nem conclui uma ação.</text>
  <text x="32" y="725" font-family="Arial, sans-serif" font-size="8">Abrir o Coletivo não altera papel, autoridade, presença ou disponibilidade.</text>
  <text x="32" y="744" font-family="Arial, sans-serif" font-size="7">Ações revalidam estado e permissão; repetir abertura ou leitura não duplica efeitos.</text>

  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
