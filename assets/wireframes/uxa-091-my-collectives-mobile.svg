<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel de Meus Coletivos</title>
  <desc id="desc">Superfície central da Pessoa para organizar participações e estados relacionados a Coletivos, com vínculo recém-aprovado visível e sem ranking de dedicação.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar</text>
  <text x="20" y="96" font-family="Arial, sans-serif" font-size="24" font-weight="700">Meus Coletivos</text>
  <text x="20" y="118" font-family="Arial, sans-serif" font-size="8">Participações e estados relacionados · cada estado permanece independente</text>

  <rect x="20" y="137" width="350" height="72" rx="10" fill="#f5f5f5" stroke="#777777"/>
  <text x="32" y="158" font-family="Arial, sans-serif" font-size="10" font-weight="700">Nova participação confirmada</text>
  <text x="32" y="178" font-family="Arial, sans-serif" font-size="9">Ciclistas da Serra · participante confirmado</text>
  <text x="32" y="196" font-family="Arial, sans-serif" font-size="7">Função: nenhuma · notificações: preservadas · sem presença obrigatória</text>

  <g font-family="Arial, sans-serif" font-size="7" text-anchor="middle">
    <rect x="20" y="225" width="72" height="32" rx="16" fill="#222222"/>
    <text x="56" y="245" fill="#ffffff" font-weight="700">Participando 2</text>
    <rect x="98" y="225" width="72" height="32" rx="16" fill="#ffffff" stroke="#888888"/>
    <text x="134" y="245">Acompanhando 1</text>
    <rect x="176" y="225" width="62" height="32" rx="16" fill="#ffffff" stroke="#888888"/>
    <text x="207" y="245">Solicitações 1</text>
    <rect x="244" y="225" width="57" height="32" rx="16" fill="#ffffff" stroke="#888888"/>
    <text x="272" y="245">Convites 1</text>
    <rect x="307" y="225" width="63" height="32" rx="16" fill="#ffffff" stroke="#888888"/>
    <text x="338" y="245">Pausadas 1</text>
  </g>

  <rect x="20" y="273" width="350" height="126" rx="10" fill="#ffffff" stroke="#555555"/>
  <text x="32" y="296" font-family="Arial, sans-serif" font-size="11" font-weight="700">Ciclistas da Serra</text>
  <text x="32" y="316" font-family="Arial, sans-serif" font-size="8">Estado: participando · papel: participante</text>
  <text x="32" y="336" font-family="Arial, sans-serif" font-size="8">Última mudança de vínculo: participação aprovada hoje às 16:30</text>
  <text x="32" y="356" font-family="Arial, sans-serif" font-size="8">Próxima atividade pública: Pedal da Serra · domingo, 07:00</text>
  <text x="32" y="376" font-family="Arial, sans-serif" font-size="7">Nenhuma função, autoridade ou notificação foi ativada pela aprovação.</text>
  <text x="350" y="296" text-anchor="end" font-family="Arial, sans-serif" font-size="7">confirmado</text>

  <rect x="20" y="413" width="350" height="112" rx="10" fill="#ffffff" stroke="#999999"/>
  <text x="32" y="436" font-family="Arial, sans-serif" font-size="11" font-weight="700">Rede de Voluntariado Horizonte</text>
  <text x="32" y="456" font-family="Arial, sans-serif" font-size="8">Estado: participando · papel: participante</text>
  <text x="32" y="476" font-family="Arial, sans-serif" font-size="8">Informação pública disponível no Coletivo · 06/08</text>
  <text x="32" y="496" font-family="Arial, sans-serif" font-size="8">Próxima atividade pública: mutirão comunitário · 15/08</text>
  <text x="32" y="516" font-family="Arial, sans-serif" font-size="7">Esta superfície não cria contagem de não lidos nem substitui a Central de Atualizações.</text>

  <rect x="20" y="541" width="350" height="116" rx="10" fill="#f7f7f7" stroke="#999999"/>
  <text x="32" y="564" font-family="Arial, sans-serif" font-size="10" font-weight="700">Outros estados neste centro</text>
  <text x="32" y="585" font-family="Arial, sans-serif" font-size="8">Acompanhando · Projeto Bairro Verde · conteúdo público disponível</text>
  <text x="32" y="605" font-family="Arial, sans-serif" font-size="8">Solicitação · Corrida para Todos · aguardando decisão</text>
  <text x="32" y="625" font-family="Arial, sans-serif" font-size="8">Convite · Rede de Mentoria Local · ainda não respondido</text>
  <text x="32" y="645" font-family="Arial, sans-serif" font-size="8">Pausada · Clube de Leitura · retomada disponível conforme regras</text>

  <rect x="20" y="673" width="350" height="72" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="696" font-family="Arial, sans-serif" font-size="10" font-weight="700">Sem pressão de participação</text>
  <text x="32" y="716" font-family="Arial, sans-serif" font-size="8">Não há ranking, sequência obrigatória, pontos de dedicação ou comparação.</text>
  <text x="32" y="734" font-family="Arial, sans-serif" font-size="7">Central de Atualizações e Início do Participante permanecem superfícies próprias.</text>

  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817" font-weight="700">Eu</text></g>
  <g fill="none" stroke="#555555"><circle cx="39" cy="796" r="8"/><rect x="109" y="788" width="16" height="16"/><circle cx="195" cy="796" r="8"/><path d="M265 804 L273 788 L281 804 Z"/><circle cx="351" cy="794" r="6" fill="#222222"/><path d="M342 807 Q351 799 360 807"/></g>
</svg>
