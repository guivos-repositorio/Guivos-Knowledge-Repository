<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Revisão da compreensão inicial com confirmação explícita de área candidata</title>
  <desc id="desc">Wireframe móvel que permite revisar afirmações e uma área da jornada candidata sem resposta pré-selecionada, preservando origem, incerteza e autonomia.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial, sans-serif" font-size="16" font-weight="700">GUIVOS</text>
  <text x="370" y="34" text-anchor="end" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Voltar à hipótese</text>
  <line x1="16" y1="50" x2="374" y2="50" stroke="#cccccc"/>

  <text x="20" y="80" font-family="Arial, sans-serif" font-size="10" fill="#555555">COMPREENSÃO INICIAL · REVISÃO SEM PRÉ-SELEÇÃO</text>
  <text x="20" y="108" font-family="Arial, sans-serif" font-size="18" font-weight="700">Revise cada afirmação e área</text>
  <text x="20" y="129" font-family="Arial, sans-serif" font-size="8">Confirmar uma parte não confirma automaticamente as demais.</text>

  <rect x="20" y="146" width="350" height="134" rx="10" fill="#f7f7f7" stroke="#777777"/>
  <text x="36" y="168" font-family="Arial, sans-serif" font-size="10" font-weight="700">A1 · Confirmado por você</text>
  <text x="36" y="188" font-family="Arial, sans-serif" font-size="8">“Você declarou interesse em uma transição profissional.”</text>
  <text x="36" y="205" font-family="Arial, sans-serif" font-size="7">Origem: T1 · o relato original permanece separado.</text>
  <rect x="36" y="218" width="12" height="12" rx="6" fill="#ffffff" stroke="#111111"/>
  <text x="56" y="228" font-family="Arial, sans-serif" font-size="7">Confirmar</text>
  <rect x="120" y="218" width="12" height="12" rx="6" fill="#ffffff" stroke="#111111"/>
  <text x="140" y="228" font-family="Arial, sans-serif" font-size="7">Parcialmente</text>
  <rect x="220" y="218" width="12" height="12" rx="6" fill="#ffffff" stroke="#111111"/>
  <text x="240" y="228" font-family="Arial, sans-serif" font-size="7">Não representa</text>
  <rect x="36" y="242" width="12" height="12" rx="6" fill="#ffffff" stroke="#111111"/>
  <text x="56" y="252" font-family="Arial, sans-serif" font-size="7">Manter em aberto</text>
  <text x="182" y="252" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Editar interpretação</text>
  <text x="286" y="252" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver T1</text>
  <text x="36" y="271" font-family="Arial, sans-serif" font-size="7">Nenhuma resposta está marcada por padrão.</text>

  <rect x="20" y="292" width="350" height="134" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="36" y="314" font-family="Arial, sans-serif" font-size="10" font-weight="700">A2 · Inferido · confiança moderada</text>
  <text x="36" y="334" font-family="Arial, sans-serif" font-size="8">“Pode existir dificuldade para demonstrar sua experiência.”</text>
  <text x="36" y="351" font-family="Arial, sans-serif" font-size="7">Base: T1 · confiança não equivale a certeza.</text>
  <rect x="36" y="364" width="12" height="12" rx="6" fill="#ffffff" stroke="#111111"/>
  <text x="56" y="374" font-family="Arial, sans-serif" font-size="7">Confirmar</text>
  <rect x="120" y="364" width="12" height="12" rx="6" fill="#ffffff" stroke="#111111"/>
  <text x="140" y="374" font-family="Arial, sans-serif" font-size="7">Está incorreta</text>
  <rect x="220" y="364" width="12" height="12" rx="6" fill="#ffffff" stroke="#111111"/>
  <text x="240" y="374" font-family="Arial, sans-serif" font-size="7">Não usar</text>
  <rect x="36" y="388" width="12" height="12" rx="6" fill="#ffffff" stroke="#111111"/>
  <text x="56" y="398" font-family="Arial, sans-serif" font-size="7">Manter em aberto</text>
  <text x="182" y="398" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Remover A2</text>
  <text x="270" y="398" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Ver origem</text>
  <text x="36" y="417" font-family="Arial, sans-serif" font-size="7">A2 não é confirmada só porque A1 foi confirmada.</text>

  <rect x="20" y="438" width="350" height="158" rx="10" fill="#f3f3f3" stroke="#777777"/>
  <text x="36" y="460" font-family="Arial, sans-serif" font-size="10" font-weight="700">Área candidata · aguardando sua decisão</text>
  <text x="36" y="481" font-family="Arial, sans-serif" font-size="12" font-weight="700">Trabalho, carreira e estudos</text>
  <text x="36" y="499" font-family="Arial, sans-serif" font-size="7">Origem: sugestão da Guivos · Base: A1/A2 · estado: candidata</text>
  <rect x="36" y="514" width="12" height="12" rx="6" fill="#ffffff" stroke="#111111"/>
  <text x="56" y="524" font-family="Arial, sans-serif" font-size="7">Confirmar esta área</text>
  <rect x="174" y="514" width="12" height="12" rx="6" fill="#ffffff" stroke="#111111"/>
  <text x="194" y="524" font-family="Arial, sans-serif" font-size="7">Adicionar outra área</text>
  <rect x="36" y="540" width="12" height="12" rx="6" fill="#ffffff" stroke="#111111"/>
  <text x="56" y="550" font-family="Arial, sans-serif" font-size="7">Não representa minha jornada</text>
  <rect x="220" y="540" width="12" height="12" rx="6" fill="#ffffff" stroke="#111111"/>
  <text x="240" y="550" font-family="Arial, sans-serif" font-size="7">Manter em aberto</text>
  <text x="36" y="574" font-family="Arial, sans-serif" font-size="7">Também posso escolher “Ainda estou descobrindo” ou informar “Outra área”.</text>
  <text x="36" y="589" font-family="Arial, sans-serif" font-size="7">Área confirmada organiza contexto; não define identidade, mérito ou evolução.</text>

  <rect x="20" y="608" width="350" height="74" rx="10" fill="#f7f7f7" stroke="#999999"/>
  <text x="36" y="630" font-family="Arial, sans-serif" font-size="10" font-weight="700">Prévia do efeito</text>
  <text x="36" y="650" font-family="Arial, sans-serif" font-size="8">A1: sem decisão · A2: sem decisão · Área: candidata</text>
  <text x="36" y="668" font-family="Arial, sans-serif" font-size="7">Itens abertos ou candidatos não serão tratados como fatos confirmados.</text>

  <rect x="20" y="696" width="350" height="44" rx="9" fill="#222222"/>
  <text x="195" y="723" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Aplicar respostas e recalcular hipótese</text>
  <text x="195" y="764" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Editar o conteúdo que compartilhei</text>
  <text x="195" y="790" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Retirar autorização desta finalidade</text>
  <text x="195" y="816" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Excluir conteúdo de origem e derivados</text>
  <text x="195" y="834" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">O escopo e as consequências serão mostrados antes de aplicar.</text>
</svg>