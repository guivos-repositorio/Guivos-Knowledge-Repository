<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Revisar e desfazer preferências publicitárias</title><desc id="desc">A pessoa visualiza escolhas anteriores com data, superfícies, escopo e ações independentes de reversão.</desc><rect width="390" height="844" fill="#fff"/><rect x="1" y="1" width="388" height="842" fill="none" stroke="#111" stroke-width="2"/><text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text><text x="20" y="60" font-family="Arial" font-size="10">PREFERÊNCIAS PUBLICITÁRIAS</text><text x="20" y="94" font-family="Arial" font-size="19" font-weight="700">Revisar escolhas</text><rect x="20" y="116" width="350" height="82" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="144" font-family="Arial" font-size="10" font-weight="700">Catálogo orgânico: sempre preservado</text><text x="34" y="168" font-family="Arial" font-size="9">As escolhas abaixo afetam somente publicidade.</text><text x="34" y="188" font-family="Arial" font-size="8">Nenhuma preferência é compartilhada com anunciantes.</text><rect x="20" y="220" width="350" height="132" rx="8" fill="#fff" stroke="#555"/><text x="34" y="248" font-family="Arial" font-size="10" font-weight="700">Campanha oculta</text><text x="34" y="272" font-family="Arial" font-size="9">BST-2026-081 · Lista e Mapa</text><text x="34" y="296" font-family="Arial" font-size="8">Aplicada em 03/08/2026 · estado: oculta · reversível</text><text x="34" y="318" font-family="Arial" font-size="8">Escopo: somente esta campanha.</text><text x="338" y="340" text-anchor="end" font-family="Arial" font-size="9" text-decoration="underline">Revisar reversão</text><rect x="20" y="370" width="350" height="132" rx="8" fill="#fff" stroke="#555"/><text x="34" y="398" font-family="Arial" font-size="10" font-weight="700">Mostrar menos deste tipo</text><text x="34" y="422" font-family="Arial" font-size="9">Cursos presenciais de tecnologia</text><text x="34" y="446" font-family="Arial" font-size="8">Aplicada em 03/08/2026 · superfícies suportadas</text><text x="34" y="468" font-family="Arial" font-size="8">Escopo: preferência geral · orgânico preservado</text><text x="338" y="490" text-anchor="end" font-family="Arial" font-size="9" text-decoration="underline">Revisar reversão</text><rect x="20" y="520" width="350" height="132" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="548" font-family="Arial" font-size="10" font-weight="700">Patrocinados desativados</text><text x="34" y="572" font-family="Arial" font-size="9">Explorar, Lista e Mapa</text><text x="34" y="596" font-family="Arial" font-size="8">Aplicada em 03/08/2026 · estado: desativado</text><text x="34" y="618" font-family="Arial" font-size="8">Escopo: inventário patrocinado suportado · reversível</text><text x="338" y="640" text-anchor="end" font-family="Arial" font-size="9" text-decoration="underline">Revisar reativação</text><rect x="20" y="674" width="350" height="104" rx="8" fill="#fff" stroke="#777"/><text x="34" y="702" font-family="Arial" font-size="9">Cada reversão exige revisão e confirmação próprias.</text><text x="34" y="726" font-family="Arial" font-size="9">Reativar não restaura campanhas expiradas ou inelegíveis.</text><text x="34" y="750" font-family="Arial" font-size="8">Denúncias e contestações não aparecem como preferências.</text><text x="20" y="820" font-family="Arial" font-size="8">Reformulado e validado funcionalmente pela UXA-099.</text></svg>