<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Decisões explícitas e compatíveis sobre persistência e personalização</title>
  <desc id="desc">Wireframe móvel reformulado com escolhas únicas independentes, nenhuma opção pré-selecionada, bloqueio de combinações incompatíveis e rotas explícitas para a Tela Hoje com ou sem personalização.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial, sans-serif" font-size="16" font-weight="700">GUIVOS</text>
  <text x="370" y="34" text-anchor="end" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Voltar à revisão</text>
  <line x1="16" y1="50" x2="374" y2="50" stroke="#cccccc"/>

  <text x="20" y="80" font-family="Arial, sans-serif" font-size="10" fill="#555555">COMPREENSÃO INICIAL · DECISÕES INDEPENDENTES</text>
  <text x="20" y="112" font-family="Arial, sans-serif" font-size="19" font-weight="700">Escolha uma opção em cada grupo</text>
  <text x="20" y="136" font-family="Arial, sans-serif" font-size="9">Nenhuma escolha foi feita por padrão.</text>

  <rect x="20" y="156" width="350" height="76" rx="10" fill="#f3f3f3" stroke="#777777"/>
  <text x="36" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="700">Compreensão revisada</text>
  <text x="36" y="202" font-family="Arial, sans-serif" font-size="9">1 confirmada · 1 em aberto · 1 desconhecida</text>
  <text x="36" y="222" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Abrir resumo, origens e afirmações não confirmadas</text>

  <text x="20" y="264" font-family="Arial, sans-serif" font-size="12" font-weight="700">1. Manter para retomar depois?</text>
  <rect x="20" y="278" width="350" height="150" rx="10" fill="#ffffff" stroke="#777777"/>
  <circle cx="43" cy="302" r="7" fill="#ffffff" stroke="#111111"/>
  <text x="62" y="306" font-family="Arial, sans-serif" font-size="10" font-weight="700">Manter compreensão revisada</text>
  <text x="62" y="324" font-family="Arial, sans-serif" font-size="8">Permite retomada; revisão e exclusão permanecem disponíveis.</text>
  <circle cx="43" cy="350" r="7" fill="#ffffff" stroke="#111111"/>
  <text x="62" y="354" font-family="Arial, sans-serif" font-size="10">Usar somente nesta sessão</text>
  <circle cx="43" cy="384" r="7" fill="#ffffff" stroke="#111111"/>
  <text x="62" y="388" font-family="Arial, sans-serif" font-size="10">Excluir esta compreensão</text>
  <text x="36" y="414" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Entender duração, finalidade, derivados e exclusão</text>

  <text x="20" y="462" font-family="Arial, sans-serif" font-size="12" font-weight="700">2. Autorizar personalização?</text>
  <rect x="20" y="476" width="350" height="154" rx="10" fill="#ffffff" stroke="#777777"/>
  <circle cx="43" cy="500" r="7" fill="#ffffff" stroke="#111111"/>
  <text x="62" y="504" font-family="Arial, sans-serif" font-size="10" font-weight="700">Autorizar para esta finalidade</text>
  <text x="62" y="522" font-family="Arial, sans-serif" font-size="8">Usar somente a compreensão revisada na experiência pessoal.</text>
  <circle cx="43" cy="550" r="7" fill="#ffffff" stroke="#111111"/>
  <text x="62" y="554" font-family="Arial, sans-serif" font-size="10">Continuar sem personalização</text>
  <circle cx="43" cy="584" r="7" fill="#ffffff" stroke="#111111"/>
  <text x="62" y="588" font-family="Arial, sans-serif" font-size="10">Decidir depois</text>
  <text x="36" y="614" font-family="Arial, sans-serif" font-size="8">Excluir a compreensão torna personalização indisponível.</text>

  <rect x="20" y="648" width="350" height="64" rx="9" fill="#f3f3f3" stroke="#999999" stroke-dasharray="5 4"/>
  <text x="195" y="674" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555555" font-weight="700">Confirmar escolhas e ir para a Tela Hoje</text>
  <text x="195" y="696" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Indisponível até existir uma escolha válida em cada grupo.</text>

  <rect x="20" y="728" width="350" height="40" rx="9" fill="#ffffff" stroke="#777777"/>
  <text x="195" y="753" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700">Usar nesta sessão e ir para Hoje sem personalização</text>
  <text x="195" y="792" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Revisar conteúdos e autorizações</text>
  <text x="195" y="820" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" text-decoration="underline">Excluir compreensão e continuar explorando</text>
  <text x="195" y="838" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Persistência não autoriza personalização. Personalização não cria outras finalidades.</text>
</svg>