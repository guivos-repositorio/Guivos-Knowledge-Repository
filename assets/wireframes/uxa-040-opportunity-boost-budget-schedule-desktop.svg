<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Orçamento, duração e alcance estimado</title>
  <desc id="desc">Wireframe para computador com orçamento total, limite diário, período, base candidata de cobrança, ausência de renovação automática e alcance agregado sem garantia.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="1022" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="220" height="1024" fill="#f4f4f4" stroke="#999999"/>
  <text x="32" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700">GUIVOS</text>
  <text x="32" y="92" font-family="Arial, sans-serif" font-size="12">OPPORTUNITY BOOST</text>
  <text x="32" y="150" font-family="Arial, sans-serif" font-size="13">1 · Elegibilidade</text>
  <text x="32" y="192" font-family="Arial, sans-serif" font-size="13">2 · Objetivo e público</text>
  <text x="32" y="234" font-family="Arial, sans-serif" font-size="13" font-weight="700">3 · Orçamento e duração</text>
  <text x="32" y="276" font-family="Arial, sans-serif" font-size="13">4 · Prévia e confirmação</text>
  <text x="32" y="318" font-family="Arial, sans-serif" font-size="13">5 · Envio</text>
  <text x="32" y="950" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Salvar rascunho e sair</text>

  <text x="260" y="48" font-family="Arial, sans-serif" font-size="12" fill="#555555">ETAPA 3 DE 5</text>
  <text x="260" y="88" font-family="Arial, sans-serif" font-size="28" font-weight="700">Definir orçamento e duração</text>
  <text x="260" y="118" font-family="Arial, sans-serif" font-size="13">O orçamento é limitado e não garante entrega, clique, inscrição, contratação ou impacto.</text>

  <rect x="260" y="152" width="760" height="570" rx="10" fill="#ffffff" stroke="#888888"/>
  <text x="286" y="188" font-family="Arial, sans-serif" font-size="16" font-weight="700">Configuração financeira candidata</text>

  <text x="286" y="234" font-family="Arial, sans-serif" font-size="12" font-weight="700">Orçamento total</text>
  <rect x="286" y="250" width="326" height="52" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="308" y="282" font-family="Arial, sans-serif" font-size="14">R$ 100,00</text>
  <text x="632" y="282" font-family="Arial, sans-serif" font-size="11">Mínimo candidato regional: R$ 100,00</text>

  <text x="286" y="342" font-family="Arial, sans-serif" font-size="12" font-weight="700">Limite diário</text>
  <rect x="286" y="358" width="326" height="52" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="308" y="390" font-family="Arial, sans-serif" font-size="14">R$ 20,00 por dia</text>
  <text x="632" y="390" font-family="Arial, sans-serif" font-size="11">A entrega pausa ao atingir o limite diário.</text>

  <text x="286" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="700">Período</text>
  <rect x="286" y="466" width="214" height="52" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="306" y="498" font-family="Arial, sans-serif" font-size="13">Início · 01/09/2026</text>
  <rect x="520" y="466" width="214" height="52" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="540" y="498" font-family="Arial, sans-serif" font-size="13">Fim · 07/09/2026</text>
  <text x="754" y="498" font-family="Arial, sans-serif" font-size="11">7 dias</text>

  <text x="286" y="560" font-family="Arial, sans-serif" font-size="12" font-weight="700">Base candidata de cobrança</text>
  <circle cx="304" cy="594" r="10" fill="#222222" stroke="#555555"/>
  <text x="330" y="590" font-family="Arial, sans-serif" font-size="12" font-weight="700">CPM · mil impressões válidas e visíveis</text>
  <text x="330" y="610" font-family="Arial, sans-serif" font-size="10">Faixa candidata: R$ 12,00 a R$ 25,00.</text>
  <circle cx="304" cy="650" r="10" fill="#ffffff" stroke="#555555"/>
  <text x="330" y="646" font-family="Arial, sans-serif" font-size="12" font-weight="700">CPC · clique válido</text>
  <text x="330" y="666" font-family="Arial, sans-serif" font-size="10">Não será cobrado simultaneamente com CPM na mesma campanha.</text>

  <rect x="286" y="686" width="708" height="58" rx="8" fill="#f5f5f5" stroke="#999999"/>
  <text x="306" y="710" font-family="Arial, sans-serif" font-size="11" font-weight="700">Renovação automática desativada</text>
  <text x="306" y="730" font-family="Arial, sans-serif" font-size="10">A campanha encerra ao atingir orçamento ou data final. Nenhum aumento automático será aplicado.</text>

  <rect x="1044" y="152" width="356" height="570" rx="10" fill="#f8f8f8" stroke="#888888"/>
  <text x="1070" y="188" font-family="Arial, sans-serif" font-size="16" font-weight="700">Estimativa agregada</text>
  <text x="1070" y="224" font-family="Arial, sans-serif" font-size="12">Objetivo</text>
  <text x="1070" y="248" font-family="Arial, sans-serif" font-size="14" font-weight="700">Levar pessoas ao detalhe</text>
  <text x="1070" y="292" font-family="Arial, sans-serif" font-size="12">Público potencial</text>
  <text x="1070" y="326" font-family="Arial, sans-serif" font-size="25" font-weight="700">2.400–3.600</text>
  <text x="1070" y="350" font-family="Arial, sans-serif" font-size="10">estimativa agregada de pessoas elegíveis</text>
  <text x="1070" y="394" font-family="Arial, sans-serif" font-size="12">Entrega estimada</text>
  <text x="1070" y="428" font-family="Arial, sans-serif" font-size="25" font-weight="700">4.000–7.000</text>
  <text x="1070" y="452" font-family="Arial, sans-serif" font-size="10">impressões válidas candidatas</text>
  <line x1="1070" y1="486" x2="1374" y2="486" stroke="#cccccc"/>
  <text x="1070" y="520" font-family="Arial, sans-serif" font-size="12" font-weight="700">Esta estimativa não é garantia</text>
  <text x="1070" y="548" font-family="Arial, sans-serif" font-size="11">A entrega dependerá de inventário, filtros,</text>
  <text x="1070" y="568" font-family="Arial, sans-serif" font-size="11">frequência, ocultações, capacidade e política.</text>
  <text x="1070" y="612" font-family="Arial, sans-serif" font-size="11">Não estima impacto humano, confiança ou qualidade.</text>
  <text x="1070" y="658" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Como a estimativa é formada?</text>

  <rect x="260" y="754" width="1140" height="128" rx="10" fill="#f7f7f7" stroke="#999999"/>
  <text x="286" y="788" font-family="Arial, sans-serif" font-size="14" font-weight="700">Resumo antes de continuar</text>
  <text x="286" y="818" font-family="Arial, sans-serif" font-size="12">R$ 100,00 totais · limite diário de R$ 20,00 · 01/09/2026 a 07/09/2026 · CPM candidato.</text>
  <text x="286" y="846" font-family="Arial, sans-serif" font-size="11">Valores são candidatos e ilustrativos. Este wireframe não autoriza cobrança, saldo, reembolso ou campanha real.</text>

  <text x="260" y="934" font-family="Arial, sans-serif" font-size="12" text-decoration="underline">Voltar para objetivo e público</text>
  <rect x="1120" y="904" width="280" height="52" rx="8" fill="#222222"/>
  <text x="1260" y="936" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700">Continuar para prévia</text>
</svg>
