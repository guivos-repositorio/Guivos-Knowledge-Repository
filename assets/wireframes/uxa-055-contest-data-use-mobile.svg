<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Contestar uso indevido de dados</title><desc id="desc">A pessoa abre um fluxo de privacidade e governança separado da denúncia de conteúdo e das preferências publicitárias.</desc><rect width="390" height="844" fill="#fff"/><rect x="1" y="1" width="388" height="842" fill="none" stroke="#111" stroke-width="2"/><text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text><text x="20" y="60" font-family="Arial" font-size="10">PRIVACIDADE E GOVERNANÇA</text><text x="20" y="94" font-family="Arial" font-size="19" font-weight="700">Contestar uso de dados</text><rect x="20" y="116" width="350" height="108" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="144" font-family="Arial" font-size="10" font-weight="700">Distribuição patrocinada em revisão</text><text x="34" y="170" font-family="Arial" font-size="9">Campanha: BST-2026-081</text><text x="34" y="194" font-family="Arial" font-size="9">Este fluxo não é denúncia de conteúdo.</text><text x="34" y="214" font-family="Arial" font-size="8">Também não altera preferências automaticamente.</text><rect x="20" y="246" width="350" height="208" rx="8" fill="#fff" stroke="#555"/><text x="34" y="274" font-family="Arial" font-size="11" font-weight="700">O que deseja contestar?</text><circle cx="41" cy="306" r="7" fill="#fff" stroke="#111"/><text x="60" y="310" font-family="Arial" font-size="9">Critério de distribuição não reconhecido</text><circle cx="41" cy="340" r="7" fill="#fff" stroke="#111"/><text x="60" y="344" font-family="Arial" font-size="9">Possível uso de dado protegido</text><circle cx="41" cy="374" r="7" fill="#fff" stroke="#111"/><text x="60" y="378" font-family="Arial" font-size="9">Preferência anterior não respeitada</text><circle cx="41" cy="408" r="7" fill="#fff" stroke="#111"/><text x="60" y="412" font-family="Arial" font-size="9">Outro problema de privacidade</text><text x="34" y="442" font-family="Arial" font-size="8">Nenhuma opção começa selecionada.</text><rect x="20" y="478" width="350" height="136" rx="8" fill="#f3f3f3" stroke="#555"/><text x="34" y="506" font-family="Arial" font-size="10" font-weight="700">Dados excluídos por contrato</text><text x="34" y="532" font-family="Arial" font-size="9">Relato protegido, compreensão inicial e Momento Atual</text><text x="34" y="556" font-family="Arial" font-size="9">Próximo Passo, mensagens e inferências sensíveis</text><text x="34" y="582" font-family="Arial" font-size="8">O anunciante não recebe a contestação nem identidade da pessoa.</text><rect x="20" y="638" width="350" height="48" rx="8" fill="#ddd" stroke="#777"/><text x="195" y="668" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700">CONTINUAR · INDISPONÍVEL</text><text x="20" y="718" font-family="Arial" font-size="9" text-decoration="underline">Revisar por que estou vendo isto</text><rect x="20" y="746" width="350" height="54" rx="8" fill="#fff" stroke="#777"/><text x="34" y="774" font-family="Arial" font-size="9">Problema de conteúdo usa o fluxo de denúncia.</text><text x="20" y="824" font-family="Arial" font-size="8">Estado residual materializado; validação funcional pendente.</text></svg>