<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Orientação para expressar o Momento Atual</title>
  <desc id="desc">Tela móvel que explica o que a Guivos precisa compreender antes do relato e oferece texto ou voz sem exigir exposição completa.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="28" font-family="Arial, sans-serif" font-size="11">09:41</text>
  <text x="20" y="58" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar à escolha de modalidade</text>
  <text x="370" y="58" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Sair com segurança</text>
  <text x="20" y="98" font-family="Arial, sans-serif" font-size="21" font-weight="700">Vamos compreender seu momento</text>
  <text x="20" y="122" font-family="Arial, sans-serif" font-size="9">Você não precisa contar toda a sua vida.</text>
  <rect x="20" y="143" width="350" height="102" rx="10" fill="#f5f5f5" stroke="#777777"/>
  <text x="32" y="166" font-family="Arial, sans-serif" font-size="10" font-weight="700">O que buscamos entender agora</text>
  <text x="32" y="188" font-family="Arial, sans-serif" font-size="8">• o que está acontecendo e qual assunto importa mais</text>
  <text x="32" y="207" font-family="Arial, sans-serif" font-size="8">• como isso afeta você e o que gostaria que mudasse</text>
  <text x="32" y="226" font-family="Arial, sans-serif" font-size="8">• prazos, limites ou tentativas anteriores relevantes</text>
  <rect x="20" y="260" width="350" height="91" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="283" font-family="Arial, sans-serif" font-size="10" font-weight="700">Você mantém o controle</text>
  <text x="32" y="305" font-family="Arial, sans-serif" font-size="8">Pode pular perguntas, dizer “não sei” ou mudar o foco.</text>
  <text x="32" y="324" font-family="Arial, sans-serif" font-size="8">Nada será processado antes da revisão e autorização.</text>
  <text x="32" y="343" font-family="Arial, sans-serif" font-size="7">Evite dados de terceiros que não sejam necessários.</text>
  <text x="20" y="389" font-family="Arial, sans-serif" font-size="12" font-weight="700">Como prefere começar?</text>
  <rect x="20" y="410" width="350" height="75" rx="10" fill="#ffffff" stroke="#111111"/>
  <text x="36" y="437" font-family="Arial, sans-serif" font-size="12" font-weight="700">Escrever com orientação</text>
  <text x="36" y="458" font-family="Arial, sans-serif" font-size="8">Responda livremente ou por partes, no seu ritmo.</text>
  <text x="350" y="470" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Começar por texto</text>
  <rect x="20" y="500" width="350" height="75" rx="10" fill="#ffffff" stroke="#111111"/>
  <text x="36" y="527" font-family="Arial, sans-serif" font-size="12" font-weight="700">Falar com orientação</text>
  <text x="36" y="548" font-family="Arial, sans-serif" font-size="8">Veja as instruções antes de ativar o microfone.</text>
  <text x="350" y="560" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Preparar gravação</text>
  <rect x="20" y="597" width="350" height="91" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="620" font-family="Arial, sans-serif" font-size="10" font-weight="700">Também é possível</text>
  <text x="32" y="642" font-family="Arial, sans-serif" font-size="8">Começar com uma frase, trocar de modalidade depois ou</text>
  <text x="32" y="661" font-family="Arial, sans-serif" font-size="8">continuar sem compartilhar e sem personalização.</text>
  <text x="32" y="680" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Entender finalidade, privacidade e controles</text>
  <rect x="20" y="716" width="350" height="44" rx="8" fill="#222222"/>
  <text x="195" y="743" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="700">Escolher como começar</text>
  <text x="195" y="789" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Continuar sem compartilhar e sem processamento</text>
</svg>
