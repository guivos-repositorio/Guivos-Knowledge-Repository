<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel da revisão de participação com entrada aberta</title>
  <desc id="desc">Revisão consciente da participação no Pedal Horizonte, com significado do vínculo, dados enviados, visibilidade, permissões, regras e confirmações inicialmente vazias antes da entrada aberta.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao perfil</text>
  <text x="370" y="57" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Cancelar</text>
  <text x="20" y="96" font-family="Arial, sans-serif" font-size="22" font-weight="700">Revisar participação</text>
  <text x="20" y="117" font-family="Arial, sans-serif" font-size="9">Pedal Horizonte · entrada aberta</text>
  <rect x="20" y="137" width="350" height="82" rx="10" fill="#f7f7f7" stroke="#777777"/>
  <text x="32" y="157" font-family="Arial, sans-serif" font-size="10" font-weight="700">O que este vínculo significa</text>
  <text x="32" y="176" font-family="Arial, sans-serif" font-size="8">Você terá acesso ao ambiente interno e será participante confirmado.</text>
  <text x="32" y="193" font-family="Arial, sans-serif" font-size="8">Não recebe função, autoridade, obrigação de presença ou contato privado.</text>
  <text x="32" y="209" font-family="Arial, sans-serif" font-size="7">Você poderá pausar ou sair conforme as regras apresentadas.</text>
  <rect x="20" y="231" width="350" height="105" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="251" font-family="Arial, sans-serif" font-size="10" font-weight="700">Dados enviados ao Coletivo</text>
  <text x="32" y="270" font-family="Arial, sans-serif" font-size="8">• nome de exibição e identificador interno da participação</text>
  <text x="32" y="288" font-family="Arial, sans-serif" font-size="8">• confirmações registradas e data de entrada</text>
  <text x="32" y="306" font-family="Arial, sans-serif" font-size="8">• visibilidade escolhida para a lista de participantes</text>
  <text x="32" y="324" font-family="Arial, sans-serif" font-size="7">Telefone, e-mail, Jornada e outros Coletivos não serão enviados.</text>
  <rect x="20" y="348" width="350" height="95" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="368" font-family="Arial, sans-serif" font-size="10" font-weight="700">Visibilidade e permissões</text>
  <text x="32" y="387" font-family="Arial, sans-serif" font-size="8">Lista nominal: oculta por padrão · poderá ser revisada depois</text>
  <text x="32" y="405" font-family="Arial, sans-serif" font-size="8">Notificações: somente escolhas posteriores; nada ativado agora</text>
  <text x="32" y="423" font-family="Arial, sans-serif" font-size="8">Contato privado e comunicação comercial permanecem bloqueados</text>
  <rect x="20" y="455" width="350" height="165" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="475" font-family="Arial, sans-serif" font-size="10" font-weight="700">Confirmações necessárias</text>
  <rect x="32" y="492" width="14" height="14" fill="#ffffff" stroke="#111111"/>
  <text x="55" y="503" font-family="Arial, sans-serif" font-size="8">Li e compreendi as regras essenciais e de segurança.</text>
  <rect x="32" y="523" width="14" height="14" fill="#ffffff" stroke="#111111"/>
  <text x="55" y="534" font-family="Arial, sans-serif" font-size="8">Entendo que posso pausar ou sair e que nenhum papel é automático.</text>
  <rect x="32" y="554" width="14" height="14" fill="#ffffff" stroke="#111111"/>
  <text x="55" y="565" font-family="Arial, sans-serif" font-size="8">Autorizo somente o envio dos dados descritos acima.</text>
  <text x="32" y="590" font-family="Arial, sans-serif" font-size="7">Nenhuma confirmação começa selecionada. Leitura não equivale a consentimento.</text>
  <text x="32" y="607" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Rever regras completas, acessibilidade e proteção</text>
  <rect x="20" y="636" width="350" height="44" rx="8" fill="#eeeeee" stroke="#999999"/>
  <text x="195" y="663" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#555555" font-weight="700">Confirmar participação</text>
  <text x="195" y="698" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">Disponível somente após todas as confirmações.</text>
  <rect x="20" y="716" width="350" height="39" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="195" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Cancelar sem enviar dados</text>
  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817" font-weight="700">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817">Eu</text></g>
  <g fill="none" stroke="#555555"><circle cx="39" cy="796" r="8"/><rect x="109" y="788" width="16" height="16"/><circle cx="195" cy="796" r="8" fill="#222222"/><path d="M265 804 L273 788 L281 804 Z"/><circle cx="351" cy="794" r="6"/><path d="M342 807 Q351 799 360 807"/></g>
</svg>
