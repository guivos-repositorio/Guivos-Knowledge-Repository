<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Alteração material da campanha do Opportunity Boost reformulada</title>
  <desc id="desc">Wireframe de baixa fidelidade mostrando comparação entre versão aprovada e alterada, impacto da mudança, pausa, nova avaliação e descarte sem retomada automática.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="1022" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="220" height="1024" fill="#f4f4f4" stroke="#999999"/>
  <text x="32" y="48" font-family="Arial" font-size="22" font-weight="700">GUIVOS</text>
  <text x="32" y="112" font-family="Arial" font-size="14">Oportunidades</text>
  <text x="32" y="154" font-family="Arial" font-size="14" font-weight="700">Opportunity Boost</text>
  <text x="32" y="196" font-family="Arial" font-size="14">Campanhas</text>
  <text x="260" y="48" font-family="Arial" font-size="11">OPPORTUNITY BOOST › CAMPANHA OB-2048</text>
  <text x="260" y="86" font-family="Arial" font-size="28" font-weight="700">Revisar alteração material</text>
  <rect x="1090" y="46" width="310" height="48" rx="8" fill="#f3f3f3" stroke="#222222" stroke-width="2"/>
  <text x="1245" y="76" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">NOVA AVALIAÇÃO EXIGIDA</text>
  <text x="260" y="122" font-family="Arial" font-size="12">Campanha pausada · nenhuma entrega com a versão alterada ou desatualizada</text>

  <rect x="260" y="154" width="1140" height="120" rx="10" fill="#f3f3f3" stroke="#444444" stroke-width="2"/>
  <text x="286" y="188" font-family="Arial" font-size="14" font-weight="700">Impacto identificado</text>
  <text x="286" y="220" font-family="Arial" font-size="11">Data, modalidade, local e capacidade foram alterados. Essas mudanças podem modificar elegibilidade, decisão da pessoa e capacidade de atendimento.</text>
  <text x="286" y="248" font-family="Arial" font-size="11">Eventos válidos anteriores permanecem vinculados à versão aprovada. Somente estimativas e entrega futuras poderão ser recalculadas.</text>

  <rect x="260" y="304" width="550" height="326" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="338" font-family="Arial" font-size="15" font-weight="700">Versão aprovada</text>
  <text x="286" y="378" font-family="Arial" font-size="12">Data: 12/08/2026</text>
  <text x="286" y="410" font-family="Arial" font-size="12">Modalidade: presencial</text>
  <text x="286" y="442" font-family="Arial" font-size="12">Local: Centro de Belo Horizonte</text>
  <text x="286" y="474" font-family="Arial" font-size="12">Preço: gratuita</text>
  <text x="286" y="506" font-family="Arial" font-size="12">Capacidade: 18 vagas</text>
  <text x="286" y="538" font-family="Arial" font-size="12">Responsável: Coletivo Horizonte</text>
  <text x="286" y="584" font-family="Arial" font-size="10">Esta versão sustenta os eventos válidos anteriores à pausa.</text>
  <text x="286" y="608" font-family="Arial" font-size="10">Ela também deverá ser verificada antes de qualquer retomada.</text>

  <rect x="850" y="304" width="550" height="326" rx="10" fill="#f8f8f8" stroke="#444444" stroke-width="2"/>
  <text x="876" y="338" font-family="Arial" font-size="15" font-weight="700">Versão alterada</text>
  <text x="876" y="378" font-family="Arial" font-size="12">Data: 19/08/2026 · alterada</text>
  <text x="876" y="410" font-family="Arial" font-size="12">Modalidade: online · alterada</text>
  <text x="876" y="442" font-family="Arial" font-size="12">Local: não aplicável · alterado</text>
  <text x="876" y="474" font-family="Arial" font-size="12">Preço: gratuita · sem alteração</text>
  <text x="876" y="506" font-family="Arial" font-size="12">Capacidade: 30 vagas · alterada</text>
  <text x="876" y="538" font-family="Arial" font-size="12">Responsável: Coletivo Horizonte · sem alteração</text>
  <text x="876" y="584" font-family="Arial" font-size="10">Mudanças identificadas por texto, não somente por cor.</text>
  <text x="876" y="608" font-family="Arial" font-size="10">Nenhuma alteração está aprovada neste estado.</text>

  <rect x="260" y="660" width="740" height="194" rx="10" fill="#ffffff" stroke="#777777"/>
  <text x="286" y="694" font-family="Arial" font-size="15" font-weight="700">Consequências preservadas</text>
  <text x="286" y="732" font-family="Arial" font-size="12">• novos eventos de entrega permanecem interrompidos;</text>
  <text x="286" y="762" font-family="Arial" font-size="12">• orçamento utilizado e eventos válidos anteriores não são recalculados;</text>
  <text x="286" y="792" font-family="Arial" font-size="12">• saldo não utilizado permanece separado;</text>
  <text x="286" y="822" font-family="Arial" font-size="12">• nova avaliação não equivale a aprovação ou retomada.</text>

  <rect x="1026" y="660" width="374" height="194" rx="10" fill="#f3f3f3" stroke="#444444"/>
  <text x="1052" y="694" font-family="Arial" font-size="15" font-weight="700">Decisão</text>
  <rect x="1052" y="720" width="322" height="44" rx="8" fill="#111111" stroke="#111111"/>
  <text x="1213" y="747" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffffff">Enviar para nova avaliação</text>
  <rect x="1052" y="780" width="322" height="44" rx="8" fill="#ffffff" stroke="#444444"/>
  <text x="1213" y="807" text-anchor="middle" font-family="Arial" font-size="11">Descartar alteração e revisar versão aprovada</text>
  <text x="1052" y="846" font-family="Arial" font-size="9">Nenhuma ação inicia entrega imediatamente.</text>

  <text x="260" y="900" font-family="Arial" font-size="11">Histórico: versão aprovada → alteração material → pausa automática → decisão pendente.</text>
  <text x="260" y="926" font-family="Arial" font-size="10">Descartar a alteração preserva o histórico e exige verificação da versão aprovada antes de qualquer retomada.</text>
  <text x="260" y="954" font-family="Arial" font-size="11">Baixa fidelidade · sem aprovação automática, algoritmo, cobrança real ou implementação.</text>
</svg>