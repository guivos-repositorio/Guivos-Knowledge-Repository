  <text x="286" y="188" font-family="Arial, sans-serif" font-size="24" font-weight="700">Preço e condições</text>
  <text x="286" y="214" font-family="Arial, sans-serif" font-size="12" fill="#555555">Informe o custo real da oportunidade. Valores e condições serão exibidos antes da decisão do participante.</text>

  <rect x="286" y="244" width="744" height="654" rx="10" fill="#ffffff" stroke="#aaaaaa"/>
  <text x="316" y="282" font-family="Arial, sans-serif" font-size="14" font-weight="700">Modelo de acesso *</text>
  <g font-family="Arial, sans-serif" font-size="12">
    <rect x="316" y="300" width="138" height="38" rx="6" fill="#222222"/><text x="385" y="324" text-anchor="middle" fill="#ffffff">Paga</text>
    <rect x="466" y="300" width="138" height="38" rx="6" fill="#ffffff" stroke="#777777"/><text x="535" y="324" text-anchor="middle">Gratuita</text>
    <rect x="616" y="300" width="138" height="38" rx="6" fill="#ffffff" stroke="#777777"/><text x="685" y="324" text-anchor="middle">Subsidiada</text>
    <rect x="766" y="300" width="138" height="38" rx="6" fill="#ffffff" stroke="#777777"/><text x="835" y="324" text-anchor="middle">Benefício</text>
