  <rect x="1254" y="950" width="152" height="42" rx="6" fill="#222222"/>
  <text x="1330" y="976" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="700">Continuar</text>
