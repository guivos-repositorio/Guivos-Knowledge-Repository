  <text x="1080" y="526" font-family="Arial, sans-serif" font-size="16" font-weight="700">R$ 79,90 por mês</text>
  <text x="1080" y="550" font-family="Arial, sans-serif" font-size="11">Custo total estimado: R$ 479,40</text>
  <text x="1080" y="574" font-family="Arial, sans-serif" font-size="11">6 parcelas · cancelamento mensal</text>
  <text x="1080" y="598" font-family="Arial, sans-serif" font-size="11">Preço válido até 31/07</text>
  <text x="1080" y="632" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Abrir pré-visualização completa</text>

