    <text x="1080" y="348">✓ Custo total calculado</text>
    <text x="1080" y="378">✓ Condição de cancelamento informada</text>
    <text x="1080" y="408">○ Confirmar taxas adicionais</text>
    <text x="1080" y="438">○ Informar política de reajuste</text>
  </g>
  <line x1="1080" y1="466" x2="1380" y2="466" stroke="#cccccc"/>
