  <text x="330" y="418" font-family="Arial, sans-serif" font-size="13">R$ 79,90</text>
  <text x="604" y="378" font-family="Arial, sans-serif" font-size="12" font-weight="700">Cobrança</text>
  <rect x="604" y="392" width="280" height="42" rx="5" fill="#ffffff" stroke="#777777"/>
  <text x="620" y="418" font-family="Arial, sans-serif" font-size="13">Mensal ▾</text>

  <text x="316" y="472" font-family="Arial, sans-serif" font-size="12" font-weight="700">Número de parcelas ou ciclos</text>
  <rect x="316" y="486" width="260" height="42" rx="5" fill="#ffffff" stroke="#777777"/>
  <text x="330" y="512" font-family="Arial, sans-serif" font-size="13">6</text>
  <text x="604" y="472" font-family="Arial, sans-serif" font-size="12" font-weight="700">Custo total conhecido</text>
  <rect x="604" y="486" width="280" height="42" rx="5" fill="#f7f7f7" stroke="#999999"/>
  <text x="620" y="512" font-family="Arial, sans-serif" font-size="13">R$ 479,40</text>

  <text x="316" y="566" font-family="Arial, sans-serif" font-size="12" font-weight="700">Taxas adicionais</text>
  <rect x="316" y="580" width="568" height="42" rx="5" fill="#ffffff" stroke="#777777"/>
  <text x="330" y="606" font-family="Arial, sans-serif" font-size="12" fill="#777777">Ex.: matrícula, material obrigatório ou taxa de emissão</text>

  <text x="316" y="660" font-family="Arial, sans-serif" font-size="12" font-weight="700">O que está incluído</text>
  <rect x="316" y="674" width="270" height="92" rx="5" fill="#ffffff" stroke="#777777"/>
  <text x="330" y="698" font-family="Arial, sans-serif" font-size="11">Aulas ao vivo</text>
  <text x="330" y="718" font-family="Arial, sans-serif" font-size="11">Material digital</text>
  <text x="330" y="738" font-family="Arial, sans-serif" font-size="11">Avaliação de nivelamento</text>
  <text x="604" y="660" font-family="Arial, sans-serif" font-size="12" font-weight="700">O que não está incluído</text>
  <rect x="604" y="674" width="280" height="92" rx="5" fill="#ffffff" stroke="#777777"/>
  <text x="618" y="698" font-family="Arial, sans-serif" font-size="11">Certificação internacional</text>
  <text x="618" y="718" font-family="Arial, sans-serif" font-size="11">Equipamento e internet</text>

  <text x="316" y="804" font-family="Arial, sans-serif" font-size="12" font-weight="700">Cancelamento, reembolso e validade do preço</text>
  <rect x="316" y="818" width="568" height="54" rx="5" fill="#ffffff" stroke="#777777"/>
  <text x="330" y="842" font-family="Arial, sans-serif" font-size="11">Cancelamento mensal sem multa. Reembolso em até 7 dias.</text>
  <text x="330" y="860" font-family="Arial, sans-serif" font-size="11">Preço válido para inscrições realizadas até 31/07/2026.</text>

  <rect x="1054" y="244" width="352" height="420" rx="10" fill="#f7f7f7" stroke="#aaaaaa"/>
  <text x="1080" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="700">Consistência e transparência</text>
