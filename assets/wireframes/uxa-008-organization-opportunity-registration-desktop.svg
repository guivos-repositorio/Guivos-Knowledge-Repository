<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe de baixa fidelidade do cadastro de oportunidade pela Organização</title>
  <desc id="desc">Estrutura desktop com navegação lateral, progresso em onze etapas, formulário de preço e condições, painel de consistência e ações de salvamento e envio.</desc>
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="0" y="0" width="250" height="1024" fill="#f3f3f3" stroke="#999999"/>
  <text x="28" y="52" font-family="Arial, sans-serif" font-size="22" font-weight="700">Guivos Business</text>
  <text x="28" y="82" font-family="Arial, sans-serif" font-size="12">Instituto Horizonte ▾</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <text x="28" y="138">Visão Geral</text>
    <rect x="16" y="158" width="218" height="42" rx="6" fill="#222222"/>
    <text x="28" y="184" fill="#ffffff" font-weight="700">Oportunidades</text>
    <text x="28" y="230">Programas e Públicos</text>
    <text x="28" y="270">Coletivos e Parcerias</text>
    <text x="28" y="310">Resultados</text>
    <text x="28" y="350">Organização</text>
  </g>
  <text x="28" y="940" font-family="Arial, sans-serif" font-size="11">Central de ajuda</text>
  <text x="28" y="966" font-family="Arial, sans-serif" font-size="11">Permissões e conformidade</text>

  <rect x="250" y="0" width="1190" height="76" fill="#ffffff" stroke="#cccccc"/>
  <text x="286" y="46" font-family="Arial, sans-serif" font-size="22" font-weight="700">Nova oportunidade</text>
  <text x="1170" y="45" font-family="Arial, sans-serif" font-size="12">Rascunho salvo às 09:38</text>
  <rect x="1280" y="22" width="126" height="34" rx="6" fill="#ffffff" stroke="#555555"/>
  <text x="1343" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Pré-visualizar</text>

  <rect x="250" y="76" width="1190" height="70" fill="#fafafa" stroke="#dddddd"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    <circle cx="300" cy="108" r="14" fill="#222222"/><text x="300" y="112" fill="#ffffff">1</text><text x="300" y="135">Tipo</text>
    <line x1="314" y1="108" x2="386" y2="108" stroke="#888888"/>
    <circle cx="400" cy="108" r="14" fill="#222222"/><text x="400" y="112" fill="#ffffff">2</text><text x="400" y="135">Finalidade</text>
    <line x1="414" y1="108" x2="486" y2="108" stroke="#888888"/>
    <circle cx="500" cy="108" r="14" fill="#222222"/><text x="500" y="112" fill="#ffffff">3</text><text x="500" y="135">Responsável</text>
    <line x1="514" y1="108" x2="586" y2="108" stroke="#888888"/>
    <circle cx="600" cy="108" r="14" fill="#222222"/><text x="600" y="112" fill="#ffffff">4</text><text x="600" y="135">Disponibilidade</text>
    <line x1="614" y1="108" x2="686" y2="108" stroke="#888888"/>
    <circle cx="700" cy="108" r="14" fill="#222222"/><text x="700" y="112" fill="#ffffff">5</text><text x="700" y="135">Local</text>
    <line x1="714" y1="108" x2="786" y2="108" stroke="#888888"/>
    <circle cx="800" cy="108" r="15" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="800" y="112" font-weight="700">6</text><text x="800" y="135" font-weight="700">Preço</text>
    <line x1="815" y1="108" x2="886" y2="108" stroke="#cccccc"/>
    <circle cx="900" cy="108" r="14" fill="#ffffff" stroke="#999999"/><text x="900" y="112">7</text><text x="900" y="135">Elegibilidade</text>
    <line x1="914" y1="108" x2="986" y2="108" stroke="#cccccc"/>
    <circle cx="1000" cy="108" r="14" fill="#ffffff" stroke="#999999"/><text x="1000" y="112">8</text><text x="1000" y="135">Proteção</text>
    <line x1="1014" y1="108" x2="1086" y2="108" stroke="#cccccc"/>
    <circle cx="1100" cy="108" r="14" fill="#ffffff" stroke="#999999"/><text x="1100" y="112">9</text><text x="1100" y="135">Comercial</text>
