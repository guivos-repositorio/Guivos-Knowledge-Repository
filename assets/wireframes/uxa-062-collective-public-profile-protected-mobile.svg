<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvel de apresentação protegida de Coletivo</title>
  <desc id="desc">Apresentação móvel mínima e controlada de Coletivo protegido, acessada por convite autorizado com remetente e autoridade identificados, identidade reduzida, território e contagens ocultos, processo especializado e controles de proteção.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" rx="24" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="24" y="27" font-family="Arial, sans-serif" font-size="11" fill="#555555">09:41</text>
  <text x="20" y="57" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">‹ Voltar ao convite</text>
  <text x="370" y="57" text-anchor="end" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Fechar apresentação</text>
  <rect x="20" y="73" width="350" height="61" rx="9" fill="#f5f5f5" stroke="#111111" stroke-dasharray="5 3"/>
  <text x="32" y="91" font-family="Arial, sans-serif" font-size="7" font-weight="700">ORIGEM PROTEGIDA</text>
  <text x="32" y="108" font-family="Arial, sans-serif" font-size="8">Convite de Ana Ribeiro · responsável autorizada · acesso individual</text>
  <text x="32" y="124" font-family="Arial, sans-serif" font-size="7">Motivo: apoio entre pessoas elegíveis · não encaminhe este acesso.</text>
  <text x="20" y="169" font-family="Arial, sans-serif" font-size="22" font-weight="700">Rede de Apoio Reservada</text>
  <text x="20" y="189" font-family="Arial, sans-serif" font-size="8">COLETIVO PROTEGIDO · APRESENTAÇÃO LIMITADA</text>
  <rect x="265" y="155" width="105" height="28" rx="14" fill="#f2f2f2" stroke="#777777"/>
  <text x="317" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700">Acesso protegido</text>
  <rect x="20" y="211" width="350" height="98" rx="10" fill="#f7f7f7" stroke="#777777"/>
  <text x="32" y="232" font-family="Arial, sans-serif" font-size="10" font-weight="700">Por que esta apresentação é limitada?</text>
  <text x="32" y="251" font-family="Arial, sans-serif" font-size="8">O Coletivo atua em contexto sensível e protege identidade, localização,</text>
  <text x="32" y="269" font-family="Arial, sans-serif" font-size="8">contagens, responsáveis e atividades até a revisão do convite.</text>
  <text x="32" y="289" font-family="Arial, sans-serif" font-size="7">Proteção não significa irregularidade, aprovação ou recomendação da Guivos.</text>
  <text x="20" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="700">Propósito público permitido</text>
  <text x="20" y="360" font-family="Arial, sans-serif" font-size="8">Apoio comunitário, escuta e encaminhamento seguro entre pessoas elegíveis.</text>
  <rect x="20" y="378" width="350" height="82" rx="9" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="398" font-family="Arial, sans-serif" font-size="7" font-weight="700">INFORMAÇÕES PROTEGIDAS</text>
  <text x="32" y="417" font-family="Arial, sans-serif" font-size="8">Território exato: oculto · modalidade: informada após revisão</text>
  <text x="32" y="435" font-family="Arial, sans-serif" font-size="8">Participantes e responsáveis: não exibidos publicamente</text>
  <text x="32" y="451" font-family="Arial, sans-serif" font-size="7">Contato privado e compartilhamento externo permanecem bloqueados.</text>
  <rect x="20" y="478" width="350" height="123" rx="10" fill="#f5f5f5" stroke="#999999"/>
  <text x="32" y="498" font-family="Arial, sans-serif" font-size="10" font-weight="700">Revisar o convite antes de continuar</text>
  <text x="32" y="518" font-family="Arial, sans-serif" font-size="8">• identidade, autoridade e relação da pessoa que convidou</text>
  <text x="32" y="537" font-family="Arial, sans-serif" font-size="8">• motivo do convite, validade e dados necessários</text>
  <text x="32" y="556" font-family="Arial, sans-serif" font-size="8">• regras de confidencialidade, segurança e possibilidade de recusa</text>
  <text x="32" y="575" font-family="Arial, sans-serif" font-size="7">Aceitar o convite inicia revisão especializada; não ativa vínculo automaticamente.</text>
  <rect x="32" y="610" width="326" height="42" rx="8" fill="#222222"/>
  <text x="195" y="636" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Revisar convite e condições</text>
  <rect x="20" y="671" width="350" height="64" rx="10" fill="#ffffff" stroke="#777777" stroke-dasharray="4 3"/>
  <text x="32" y="691" font-family="Arial, sans-serif" font-size="9" font-weight="700">Reputação e evidências públicas</text>
  <text x="32" y="709" font-family="Arial, sans-serif" font-size="8">Resumo público não exibido para evitar revelar participação sensível.</text>
  <text x="32" y="725" font-family="Arial, sans-serif" font-size="7">Proteção não será convertida em nota, ausência de qualidade ou popularidade.</text>
  <text x="20" y="750" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Recusar convite</text>
  <text x="195" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Privacidade e segurança</text>
  <text x="370" y="750" text-anchor="end" font-family="Arial, sans-serif" font-size="7" text-decoration="underline">Denunciar convite</text>
  <rect x="1" y="770" width="388" height="73" fill="#ffffff" stroke="#cccccc"/>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="39" y="817">Hoje</text><text x="117" y="817">Jornada</text><text x="195" y="817">Explorar</text><text x="273" y="817">Mapa</text><text x="351" y="817">Eu</text></g>
  <g fill="none" stroke="#555555"><circle cx="39" cy="796" r="8"/><rect x="109" y="788" width="16" height="16"/><circle cx="195" cy="796" r="8"/><path d="M265 804 L273 788 L281 804 Z"/><circle cx="351" cy="794" r="6"/><path d="M342 807 Q351 799 360 807"/></g>
</svg>
