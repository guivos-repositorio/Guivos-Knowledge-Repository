<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Campanha ativa do Opportunity Boost em aplicativo móvel reformulada</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade com campanha ativa sem limitação corrente, orçamento, período, indicadores provisórios, condições vigentes e ações de revisão.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text>
  <text x="20" y="58" font-family="Arial" font-size="10">OPPORTUNITY BOOST · GESTÃO MÓVEL</text>
  <text x="20" y="88" font-family="Arial" font-size="19" font-weight="700">Campanha ativa</text>
  <text x="370" y="87" text-anchor="end" font-family="Arial" font-size="9" font-weight="700">ATIVA</text>

  <rect x="20" y="108" width="350" height="96" rx="8" fill="#f3f3f3" stroke="#555555"/>
  <text x="34" y="133" font-family="Arial" font-size="10" font-weight="700">BST-2026-081 · versão aprovada v1</text>
  <text x="34" y="154" font-family="Arial" font-size="9">Formação de jovens em tecnologia</text>
  <text x="34" y="175" font-family="Arial" font-size="9">Anunciante: Instituto Horizonte</text>
  <text x="34" y="195" font-family="Arial" font-size="9">05/08 a 14/08 · 8 dias restantes</text>

  <text x="20" y="236" font-family="Arial" font-size="12" font-weight="700">Orçamento</text>
  <rect x="20" y="250" width="106" height="66" rx="7" fill="#ffffff" stroke="#777777"/>
  <text x="32" y="273" font-family="Arial" font-size="8">Total</text>
  <text x="32" y="299" font-family="Arial" font-size="14" font-weight="700">R$ 300</text>
  <rect x="142" y="250" width="106" height="66" rx="7" fill="#ffffff" stroke="#777777"/>
  <text x="154" y="273" font-family="Arial" font-size="8">Utilizado</text>
  <text x="154" y="299" font-family="Arial" font-size="14" font-weight="700">R$ 84</text>
  <rect x="264" y="250" width="106" height="66" rx="7" fill="#ffffff" stroke="#777777"/>
  <text x="276" y="273" font-family="Arial" font-size="8">Saldo</text>
  <text x="276" y="299" font-family="Arial" font-size="14" font-weight="700">R$ 216</text>

  <rect x="20" y="334" width="350" height="146" rx="8" fill="#ffffff" stroke="#555555"/>
  <text x="34" y="359" font-family="Arial" font-size="11" font-weight="700">Resumo operacional provisório</text>
  <text x="34" y="379" font-family="Arial" font-size="8">Período: 05/08 09:00 a 06/08 17:40 · atualizado às 17:40</text>
  <text x="34" y="412" font-family="Arial" font-size="15" font-weight="700">3.120</text>
  <text x="102" y="412" font-family="Arial" font-size="9">impressões válidas</text>
  <text x="34" y="440" font-family="Arial" font-size="15" font-weight="700">96</text>
  <text x="76" y="440" font-family="Arial" font-size="9">cliques válidos</text>
  <text x="222" y="440" font-family="Arial" font-size="15" font-weight="700">4</text>
  <text x="244" y="440" font-family="Arial" font-size="9">eventos inválidos</text>
  <text x="34" y="466" font-family="Arial" font-size="8">Não equivale a conversão, atribuição, impacto ou relatório final.</text>

  <rect x="20" y="496" width="350" height="126" rx="8" fill="#f3f3f3" stroke="#555555"/>
  <text x="34" y="520" font-family="Arial" font-size="11" font-weight="700">Condições vigentes</text>
  <text x="34" y="544" font-family="Arial" font-size="9">Frequência: dentro do limite aprovado</text>
  <text x="34" y="566" font-family="Arial" font-size="9">Capacidade: dentro da condição aprovada</text>
  <text x="34" y="588" font-family="Arial" font-size="9">Informação material: atual · política: sem bloqueio</text>
  <text x="34" y="610" font-family="Arial" font-size="8">Se uma condição limitar a entrega, o estado mudará explicitamente.</text>

  <rect x="20" y="640" width="350" height="48" rx="8" fill="#111111"/>
  <text x="195" y="669" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#ffffff">REVISAR PAUSA</text>
  <rect x="20" y="700" width="168" height="44" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="104" y="727" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700">REVISAR CAPACIDADE</text>
  <rect x="202" y="700" width="168" height="44" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="286" y="720" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700">SOLICITAR ALTERAÇÃO</text>
  <text x="286" y="734" text-anchor="middle" font-family="Arial" font-size="8">MATERIAL</text>

  <text x="20" y="776" font-family="Arial" font-size="9" text-decoration="underline">Abrir histórico</text>
  <text x="370" y="776" text-anchor="end" font-family="Arial" font-size="9" text-decoration="underline">Relatório agregado provisório</text>
  <rect x="20" y="794" width="350" height="30" rx="7" fill="#ffffff" stroke="#777777" stroke-dasharray="5 4"/>
  <text x="34" y="813" font-family="Arial" font-size="8">Pausa, alteração e cancelamento exigem revisão antes da execução.</text>
  <text x="20" y="840" font-family="Arial" font-size="8">Gestão móvel reformulada pela UXA-054.</text>
</svg>