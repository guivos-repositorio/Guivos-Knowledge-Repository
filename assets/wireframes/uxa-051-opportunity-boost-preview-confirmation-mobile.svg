<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Prévia e confirmação móveis validadas do Opportunity Boost</title>
  <desc id="desc">Wireframe móvel reformulado com identidade persistente, etapa quatro de cinco, primeiro resultado orgânico, espaço patrocinado, controles demonstrativos da pessoa, condição limitada e confirmações desmarcadas.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="34" font-family="Arial" font-size="18" font-weight="700">GUIVOS</text>
  <text x="20" y="59" font-family="Arial" font-size="10">OPPORTUNITY BOOST · CONFIGURAÇÃO MÓVEL</text>
  <text x="20" y="88" font-family="Arial" font-size="19" font-weight="700">Prévia e confirmação</text>
  <text x="350" y="87" text-anchor="end" font-family="Arial" font-size="10">ETAPA 4 DE 5</text>
  <line x1="20" y1="102" x2="300" y2="102" stroke="#111111" stroke-width="4"/>
  <line x1="304" y1="102" x2="370" y2="102" stroke="#cccccc" stroke-width="4"/>

  <rect x="20" y="118" width="350" height="62" rx="8" fill="#f3f3f3" stroke="#555555"/>
  <text x="34" y="141" font-family="Arial" font-size="10" font-weight="700">BST-2026-081 · rascunho v1 · prévia da Lista</text>
  <text x="34" y="160" font-family="Arial" font-size="8">Posição ilustrativa; condição limitada ativa; rascunho salvo.</text>
  <text x="34" y="175" font-family="Arial" font-size="8">Não representa ranking orgânico comprado nem entrega garantida.</text>

  <text x="20" y="205" font-family="Arial" font-size="11" font-weight="700">1º resultado orgânico</text>
  <rect x="20" y="216" width="350" height="82" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="239" font-family="Arial" font-size="10" font-weight="700">Oficina gratuita de programação</text>
  <text x="34" y="259" font-family="Arial" font-size="9">Coletivo Código Aberto · Belo Horizonte</text>
  <text x="34" y="279" font-family="Arial" font-size="9">Resultado orgânico · critérios da consulta</text>
  <text x="34" y="294" font-family="Arial" font-size="8">Pagamento não altera esta posição.</text>

  <text x="20" y="326" font-family="Arial" font-size="11" font-weight="700">Espaço patrocinado identificado</text>
  <rect x="20" y="338" width="350" height="148" rx="8" fill="#f3f3f3" stroke="#444444" stroke-width="2"/>
  <text x="34" y="361" font-family="Arial" font-size="9" font-weight="700">PATROCINADO</text>
  <text x="34" y="384" font-family="Arial" font-size="11" font-weight="700">Formação de jovens em tecnologia</text>
  <text x="34" y="405" font-family="Arial" font-size="9">Instituto Horizonte · gratuita · presencial</text>
  <text x="34" y="426" font-family="Arial" font-size="9">05/08 a 14/08 · capacidade declarada limitada</text>
  <text x="34" y="447" font-family="Arial" font-size="8" font-weight="700">CONTROLES EXIBIDOS À PESSOA · DEMONSTRAÇÃO</text>
  <text x="34" y="468" font-family="Arial" font-size="9" text-decoration="underline">Por que estou vendo isto?</text>
  <text x="222" y="468" font-family="Arial" font-size="9" text-decoration="underline">Ocultar</text>
  <text x="310" y="468" font-family="Arial" font-size="9" text-decoration="underline">Denunciar</text>
  <text x="34" y="482" font-family="Arial" font-size="8">Estas ações não são controles do anunciante nesta prévia.</text>

  <rect x="20" y="500" width="350" height="84" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="34" y="523" font-family="Arial" font-size="10" font-weight="700">Resumo revisável da campanha</text>
  <text x="34" y="544" font-family="Arial" font-size="9">Clique válido · CPC · R$ 300,00 · 05/08 a 14/08</text>
  <text x="34" y="564" font-family="Arial" font-size="9">Região, categoria e modalidade escolhidas</text>
  <text x="338" y="564" text-anchor="end" font-family="Arial" font-size="9" text-decoration="underline">Abrir e revisar</text>
  <text x="34" y="579" font-family="Arial" font-size="8">Revisar pode recalcular base, estimativa ou condição limitada.</text>

  <rect x="20" y="598" width="350" height="106" rx="8" fill="#ffffff" stroke="#555555"/>
  <text x="34" y="621" font-family="Arial" font-size="10" font-weight="700">Confirmações obrigatórias</text>
  <rect x="34" y="637" width="12" height="12" fill="#ffffff" stroke="#111111"/>
  <text x="56" y="647" font-family="Arial" font-size="9">Orçamento e estimativa não garantem resultado.</text>
  <rect x="34" y="661" width="12" height="12" fill="#ffffff" stroke="#111111"/>
  <text x="56" y="671" font-family="Arial" font-size="9">Pagamento não altera ranking ou relevância orgânica.</text>
  <rect x="34" y="685" width="12" height="12" fill="#ffffff" stroke="#111111"/>
  <text x="56" y="695" font-family="Arial" font-size="9">Informações, capacidade e responsabilidades foram revisadas.</text>

  <rect x="20" y="720" width="350" height="48" rx="8" fill="#dddddd" stroke="#777777"/>
  <text x="195" y="749" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700">ENVIAR PARA AVALIAÇÃO · INDISPONÍVEL</text>
  <text x="20" y="794" font-family="Arial" font-size="9" text-decoration="underline">Voltar ao orçamento</text>
  <text x="370" y="794" text-anchor="end" font-family="Arial" font-size="9">3 confirmações pendentes</text>
  <text x="20" y="820" font-family="Arial" font-size="8">Confirmações começam desmarcadas; voltar não confirma pendências.</text>
  <text x="20" y="834" font-family="Arial" font-size="8">Enviar não inicia aprovação, programação, entrega ou cobrança.</text>
</svg>