<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Cartão móvel de Boost Social Financiado</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade com primeiro resultado orgânico materializado, oportunidade gratuita, Coletivo beneficiário, financiador identificado, ausência de autoridade e controles.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="38" font-family="Arial, sans-serif" font-size="12" fill="#555555">EXPLORAR</text>
  <text x="20" y="68" font-family="Arial, sans-serif" font-size="24" font-weight="700">Oportunidades</text>

  <text x="20" y="98" font-family="Arial, sans-serif" font-size="11" font-weight="700">Primeiro resultado orgânico</text>
  <rect x="20" y="112" width="350" height="92" rx="8" fill="#ffffff" stroke="#777777"/>
  <text x="38" y="140" font-family="Arial, sans-serif" font-size="10">RESULTADO ORGÂNICO · sem pagamento</text>
  <text x="38" y="166" font-family="Arial, sans-serif" font-size="14" font-weight="700">Oficina aberta de planejamento local</text>
  <text x="38" y="190" font-family="Arial, sans-serif" font-size="10">Organização Exemplo · gratuita · 12 vagas</text>

  <rect x="20" y="226" width="350" height="328" rx="10" fill="#f4f4f4" stroke="#444444" stroke-width="2"/>
  <text x="38" y="256" font-family="Arial, sans-serif" font-size="10" font-weight="700">IMPULSIONAMENTO SOCIAL FINANCIADO</text>
  <text x="38" y="282" font-family="Arial, sans-serif" font-size="10">Oportunidade gratuita · distribuição paga identificada</text>
  <text x="38" y="318" font-family="Arial, sans-serif" font-size="18" font-weight="700">Mutirão gratuito de capacitação comunitária</text>
  <text x="38" y="348" font-family="Arial, sans-serif" font-size="11">Coletivo beneficiário: Rede Comunitária Livre</text>
  <text x="38" y="374" font-family="Arial, sans-serif" font-size="11">Financiador: Fundação Exemplo</text>
  <text x="38" y="400" font-family="Arial, sans-serif" font-size="11">Finalidade: ampliar acesso gratuito na região.</text>
  <line x1="38" y1="420" x2="352" y2="420" stroke="#aaaaaa"/>
  <text x="38" y="446" font-family="Arial, sans-serif" font-size="10">O financiador não seleciona pessoas, não define relevância</text>
  <text x="38" y="466" font-family="Arial, sans-serif" font-size="10">e não recebe relatos, jornada ou lista de visualizadores.</text>
  <text x="38" y="504" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Por que estou vendo isto?</text>
  <text x="352" y="504" text-anchor="end" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Abrir oportunidade</text>
  <text x="38" y="536" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Ocultar esta campanha · só este anúncio</text>
  <text x="352" y="536" text-anchor="end" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Controles do anúncio</text>

  <rect x="20" y="580" width="350" height="128" rx="8" fill="#ffffff" stroke="#888888"/>
  <text x="38" y="610" font-family="Arial, sans-serif" font-size="13" font-weight="700">O que este financiamento não faz</text>
  <text x="38" y="640" font-family="Arial, sans-serif" font-size="10">• não recomenda nem altera ranking orgânico;</text>
  <text x="38" y="664" font-family="Arial, sans-serif" font-size="10">• não concede plano pago ao Coletivo Livre;</text>
  <text x="38" y="688" font-family="Arial, sans-serif" font-size="10">• não transfere autoridade ao financiador.</text>

  <rect x="20" y="738" width="350" height="64" rx="8" fill="#f7f7f7" stroke="#999999"/>
  <text x="38" y="764" font-family="Arial, sans-serif" font-size="11" font-weight="700">Controles preservados</text>
  <text x="38" y="786" font-family="Arial, sans-serif" font-size="10">Ocultar, revisar, desativar, denunciar ou contestar.</text>
  <text x="20" y="828" font-family="Arial, sans-serif" font-size="10">Baixa fidelidade · nenhuma campanha real é iniciada.</text>
</svg>