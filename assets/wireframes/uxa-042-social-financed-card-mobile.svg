<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Cartão móvel de Boost Social Financiado</title>
  <desc id="desc">Wireframe móvel de baixa fidelidade com oportunidade gratuita, Coletivo beneficiário, financiador identificado, ausência de autoridade e controles.</desc>
  <rect width="390" height="844" fill="#ffffff"/>
  <rect x="1" y="1" width="388" height="842" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="20" y="38" font-family="Arial, sans-serif" font-size="12" fill="#555555">EXPLORAR</text>
  <text x="20" y="68" font-family="Arial, sans-serif" font-size="24" font-weight="700">Oportunidades</text>
  <text x="20" y="100" font-family="Arial, sans-serif" font-size="11">Primeiro resultado orgânico preservado acima.</text>

  <rect x="20" y="130" width="350" height="344" rx="10" fill="#f4f4f4" stroke="#444444" stroke-width="2"/>
  <text x="38" y="160" font-family="Arial, sans-serif" font-size="10" font-weight="700">IMPULSIONAMENTO SOCIAL FINANCIADO</text>
  <text x="38" y="188" font-family="Arial, sans-serif" font-size="10">Oportunidade gratuita · distribuição paga identificada</text>
  <text x="38" y="228" font-family="Arial, sans-serif" font-size="18" font-weight="700">Mutirão gratuito de capacitação comunitária</text>
  <text x="38" y="260" font-family="Arial, sans-serif" font-size="11">Coletivo beneficiário: Rede Comunitária Livre</text>
  <text x="38" y="286" font-family="Arial, sans-serif" font-size="11">Financiador: Fundação Exemplo</text>
  <text x="38" y="312" font-family="Arial, sans-serif" font-size="11">Finalidade: ampliar acesso gratuito na região.</text>
  <line x1="38" y1="334" x2="352" y2="334" stroke="#aaaaaa"/>
  <text x="38" y="360" font-family="Arial, sans-serif" font-size="10">O financiador não seleciona pessoas, não define relevância</text>
  <text x="38" y="380" font-family="Arial, sans-serif" font-size="10">e não recebe relatos, contexto da jornada ou lista de visualizadores.</text>
  <text x="38" y="414" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Por que estou vendo isto?</text>
  <text x="352" y="414" text-anchor="end" font-family="Arial, sans-serif" font-size="11" text-decoration="underline">Abrir oportunidade</text>
  <text x="38" y="450" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Ocultar campanha</text>
  <text x="352" y="450" text-anchor="end" font-family="Arial, sans-serif" font-size="10" text-decoration="underline">Mais opções</text>

  <rect x="20" y="510" width="350" height="164" rx="8" fill="#ffffff" stroke="#888888"/>
  <text x="38" y="540" font-family="Arial, sans-serif" font-size="13" font-weight="700">O que este financiamento não faz</text>
  <text x="38" y="572" font-family="Arial, sans-serif" font-size="10">• não recomenda a oportunidade;</text>
  <text x="38" y="596" font-family="Arial, sans-serif" font-size="10">• não concede plano pago ao Coletivo Livre;</text>
  <text x="38" y="620" font-family="Arial, sans-serif" font-size="10">• não altera ranking orgânico;</text>
  <text x="38" y="644" font-family="Arial, sans-serif" font-size="10">• não transfere autoridade ao financiador.</text>

  <rect x="20" y="710" width="350" height="74" rx="8" fill="#f7f7f7" stroke="#999999"/>
  <text x="38" y="740" font-family="Arial, sans-serif" font-size="11" font-weight="700">Controles preservados</text>
  <text x="38" y="764" font-family="Arial, sans-serif" font-size="10">Ocultar, revisar preferências ou denunciar permanecem disponíveis.</text>
  <text x="20" y="824" font-family="Arial, sans-serif" font-size="10">Baixa fidelidade · nenhuma campanha real é iniciada.</text>
</svg>